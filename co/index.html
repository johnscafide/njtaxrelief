<!DOCTYPE html>
<html lang="en">
<head>

<link rel="canonical" href="https://www.watchdogindex.com/co">
<meta property="og:title" content="CO Requirements by Town | Watchdog">
<meta property="og:description" content="Type a New Jersey address or town to see its resale CO requirements.">
<meta property="og:url" content="https://www.watchdogindex.com/co">
<meta property="og:type" content="website">
<link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="shortcut icon" href="/favicon.ico">

     (cookie banner, GA only after opt-in); first-party product analytics and AI-referral tracking as on other Watchdog pages. -->
<script src="/property/js/watchdog-consent.js" defer></script>

<style>
  :root {
    --blue: #0d3dbe;
    --ink: #1b2430;
    --muted: #5f6b7a;
    --line: #e3e7ec;
    --soft: #f5f7fa;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { min-height: 100vh; background: #fff; color: var(--ink); font-family: 'Source Sans 3', Arial, sans-serif; font-size: 16px; line-height: 1.5; }
  a { color: var(--blue); }
  .logo { display: inline-flex; align-items: center; min-height: 44px; }
  .logo img { display: block; height: auto; }

  /* Home: the logo and one search box, centered. */
  .home { display: flex; flex-direction: column; align-items: center; padding: 24vh 16px 40px; }
  .home .logo img { width: min(340px, 78vw); }
  .home .logo { margin-bottom: 32px; }

  .search { position: relative; width: 100%; max-width: 584px; }
  .box { display: flex; align-items: center; gap: 4px; min-height: 48px; padding: 0 6px 0 16px; border: 1px solid #dfe1e5; border-radius: 24px; background: #fff; transition: box-shadow .15s; }
  .box:hover, .box:focus-within { box-shadow: 0 1px 6px rgba(32,33,36,.24); border-color: transparent; }
  .search.open .box { border-radius: 24px 24px 0 0; box-shadow: 0 1px 6px rgba(32,33,36,.24); border-color: transparent; }
  .box svg { flex: none; color: #9aa0a6; }
  .box input { flex: 1; min-width: 0; height: 46px; border: 0; outline: 0; background: transparent; font: inherit; color: var(--ink); }
  .clear { display: none; flex: none; width: 44px; height: 44px; border: 0; border-radius: 50%; background: transparent; color: var(--muted); font-size: 24px; line-height: 1; cursor: pointer; }
  .clear:hover { background: var(--soft); }
  .search.has-text .clear { display: block; }
  .suggest { display: none; position: absolute; z-index: 5; left: 0; right: 0; top: 100%; margin: 0; padding: 4px 0 10px; list-style: none; background: #fff; border-radius: 0 0 24px 24px; box-shadow: 0 4px 6px rgba(32,33,36,.24); overflow: hidden; }
  .suggest::before { content: ""; display: block; height: 1px; margin: 0 16px 4px; background: #e8eaed; }
  .search.open .suggest { display: block; }
  .suggest li { display: flex; align-items: baseline; gap: 8px; min-height: 44px; padding: 10px 20px; cursor: pointer; }
  .suggest li[aria-selected="true"], .suggest li:hover { background: #eef0f3; }
  .suggest .s-name { font-weight: 600; }
  .suggest .s-meta { color: var(--muted); font-size: 14px; }
  .buttons { display: flex; justify-content: center; margin-top: 28px; }
  .btn { min-height: 44px; padding: 0 20px; border: 1px solid var(--soft); border-radius: 6px; background: var(--soft); color: #3c4043; font: inherit; font-size: 15px; cursor: pointer; }
  .btn:hover { border-color: #dadce0; }
  .btn:focus-visible, .clear:focus-visible, .choice:focus-visible, .logo:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

  /* Results: logo and box move to a top row, facts below. */
  .top { display: none; align-items: center; gap: 28px; padding: 16px 24px; border-bottom: 1px solid var(--line); }
  .top .logo img { width: 150px; }
  .top .search { max-width: 640px; }
  body.results .home { display: none; }
  body.results .top { display: flex; }
  .out { max-width: 680px; padding: 20px 24px 64px 202px; }
  body:not(.results) .out { display: none; }

  .msg { color: var(--muted); }
  .town { margin: 4px 0 0; font-size: 26px; font-weight: 600; line-height: 1.25; }
  .meta { margin: 2px 0 20px; color: var(--muted); font-size: 15px; }
  .status { display: inline-block; margin: 0 0 6px; font-size: 18px; font-weight: 600; }
  .status.req { color: var(--blue); }
  .status.no { color: #1e7a3c; }
  .status.unsure { color: #9a6700; }
  section.part { margin: 0 0 28px; padding-top: 18px; border-top: 1px solid var(--line); }
  section.part:first-of-type { border-top: 0; padding-top: 0; }
  section.part h2 { margin: 0 0 4px; font-size: 19px; font-weight: 600; }
  .sub { margin: 0 0 8px; color: var(--muted); font-size: 15px; }
  dl.facts { margin: 10px 0 0; }
  dl.facts dt { margin-top: 14px; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
  dl.facts dd { margin: 4px 0 0; }
  ul.items { margin: 0; padding-left: 20px; }
  ul.items li { margin: 3px 0; }
  .fees { width: 100%; border-collapse: collapse; font-size: 15px; }
  .fees td { padding: 6px 0; border-bottom: 1px solid #eef0f3; vertical-align: top; }
  .fees td.amt { width: 1%; padding-left: 16px; font-weight: 600; white-space: nowrap; text-align: right; }
  .links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .links a { display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px; border: 1px solid var(--line); border-radius: 22px; text-decoration: none; font-weight: 600; }
  .links a:hover { background: var(--soft); }
  .authority { margin-top: 16px; }
  .authority h3 { margin: 0; font-size: 16px; font-weight: 600; }
  .fine { margin-top: 8px; color: var(--muted); font-size: 14px; }
  .fine summary { min-height: 44px; display: inline-flex; align-items: center; cursor: pointer; }
  .fine ol { margin: 0; padding-left: 20px; word-break: break-all; }
  .choices { display: grid; gap: 8px; margin-top: 12px; }
  .choice { display: flex; justify-content: space-between; gap: 12px; min-height: 48px; padding: 10px 16px; border: 1px solid var(--line); border-radius: 10px; background: #fff; font: inherit; text-align: left; cursor: pointer; }
  .choice:hover { background: var(--soft); }
  .choice span { color: var(--muted); }
  .add { display: inline-flex; align-items: center; min-height: 44px; margin-top: 10px; padding: 0 18px; border: 0; border-radius: 22px; background: var(--blue); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  .add:hover { background: #0a2f94; }
  .fix { display: inline-flex; align-items: center; min-height: 44px; margin-top: 4px; padding: 0; border: 0; background: none; color: var(--muted); font: inherit; font-size: 14px; text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }
  .fix:hover { color: var(--ink); }
  .add:focus-visible, .fix:focus-visible, dialog button:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  dialog { width: min(520px, calc(100vw - 32px)); max-height: calc(100vh - 32px); padding: 0; border: 0; border-radius: 16px; box-shadow: 0 12px 40px rgba(16,24,40,.25); color: var(--ink); }
  dialog::backdrop { background: rgba(16,24,40,.45); }
  .dlg { padding: 22px 22px 18px; }
  .dlg h2 { margin: 0; font-size: 20px; font-weight: 600; }
  .dlg .sub { margin: 2px 0 14px; }
  .dlg label { display: block; margin: 12px 0 0; font-size: 14px; font-weight: 600; }
  .dlg label small { font-weight: 400; color: var(--muted); }
  .dlg input:not([type=file]), .dlg textarea, .dlg select { display: block; width: 100%; margin-top: 5px; padding: 10px 12px; border: 1px solid #cfd6de; border-radius: 10px; font: inherit; font-weight: 400; color: var(--ink); background: #fff; }
  .dlg input[type=file] { display: block; margin-top: 6px; font: inherit; font-weight: 400; max-width: 100%; }
  .dlg textarea { min-height: 90px; resize: vertical; }
  .dlg [hidden] { display: none; }
  .dlg .two { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
  .dlg .hp { position: absolute; left: -10000px; width: 1px; height: 1px; overflow: hidden; }
  .dlg .formstatus { min-height: 22px; margin: 12px 0 0; font-size: 14px; }
  .dlg .formstatus.error { color: #b42318; }
  .dlg .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 10px; }
  .dlg .actions button { min-height: 44px; padding: 0 18px; border-radius: 22px; font: inherit; font-weight: 600; cursor: pointer; }
  .dlg .send { border: 0; background: var(--blue); color: #fff; }
  .dlg .send:disabled { opacity: .6; cursor: default; }
  .dlg .cancel { border: 1px solid var(--line); background: #fff; color: var(--ink); }
  @media (max-width: 480px) { .dlg .two { grid-template-columns: 1fr; } }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  @media (max-width: 900px) { .out { padding-left: 24px; } }
  @media (max-width: 640px) {
    .home { padding-top: 18vh; }
    .top { flex-direction: column; align-items: center; gap: 10px; padding: 12px 16px; }
    .top .logo img { width: 130px; }
    .out { padding: 16px 16px 48px; }
    .town { font-size: 23px; }
  }
  @media print { .top, .home, .links { display: none !important; } .out { padding: 0; } }
</style>

<body>
<main>
  <header class="top">
    <a class="logo" href="/"><img src="/property/branding/watchdog-logo-horizontal.svg" alt="Watchdog" width="150" height="35"></a>
    <div class="search" data-search></div>
  </header>

  <div class="home">
    <a class="logo" href="/"><img src="/property/branding/watchdog-logo-horizontal.svg" alt="Watchdog" width="340" height="79"></a>
    <form class="search" data-search role="search" id="home-form"></form>
    <div class="buttons"><button class="btn" type="submit" form="home-form">Search</button></div>
  </div>

  <div class="out" id="out" aria-live="polite"></div>
</main>

<dialog id="add-dlg" aria-labelledby="add-title">
  <form class="dlg" id="add-form" method="dialog" novalidate>
    <h2 id="add-title">Add CO Requirements</h2>
    <p class="sub" id="add-town"></p>
    <label data-fix-only hidden>What’s wrong?
      <textarea name="problem" maxlength="2000" placeholder="For example: the fee went up to $150 in 2026."></textarea>
    </label>
    <label><span data-doc-label>Town document</span> <small>(form, fee sheet or letter; PDF or photo, up to 10 MB)</small>
      <input name="file" type="file" accept="application/pdf,image/jpeg,image/png,image/webp,image/heic,image/heif,.pdf,.jpg,.jpeg,.png,.webp,.heic,.heif">
    </label>
    <label>Or link to the town's page
      <input name="source_url" type="url" inputmode="url" placeholder="https://" maxlength="1000">
    </label>
    <label data-add-only>Requirements and fees <small>(optional)</small>
      <textarea name="answer" maxlength="2000"></textarea>
    </label>
    <div class="two">
      <label>Name <small>(optional)</small><input name="name" autocomplete="name" maxlength="120"></label>
      <label>Email <small>(optional)</small><input name="email" type="email" autocomplete="email" maxlength="254"></label>
    </div>
    <label>You are <small>(optional)</small>
      <select name="role">
        <option value="">Choose one</option>
        <option>Real estate agent</option>
        <option>Attorney</option>
        <option>Title or closing company</option>
        <option>Town or fire office staff</option>
        <option>Home inspector</option>
        <option>Homeowner, buyer or seller</option>
        <option>Other</option>
      </select>

    <label class="hp" aria-hidden="true">Website <input name="website" tabindex="-1" autocomplete="off"></label>

    <div class="actions">
      <button class="cancel" type="button" value="cancel">Cancel</button>
      <button class="send" type="submit">Send</button>
    </div>
  </form>
</dialog>

<template id="search-tpl">
  <div class="box">
    <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
    <label class="sr">Address or town</label>
    <input type="text" autocomplete="off" spellcheck="false" placeholder="Address or town for CO requirements" role="combobox" aria-autocomplete="list" aria-expanded="false" enterkeyhint="search">
    <button class="clear" type="button" aria-label="Clear">&times;</button>
  </div>
  <ul class="suggest" role="listbox"></ul>
</template>

<script>
(function () {
  'use strict';

  var NJ_GEOCODE = 'https://geo.nj.gov/arcgis/rest/services/Tasks/NJ_Geocode/GeocodeServer/findAddressCandidates';
  var TYPES = /\s+(township|borough|city|town|village)$/;
  var out = document.getElementById('out');
  var data = null, towns = [], byCode = {}, aliasList = [];
  var dataReady = fetch('/co/towns.json').then(function (r) { return r.json(); }).then(function (d) {
    data = d;
    towns = d.towns.map(function (t) {
      var o = { code: t.c, name: t.n, county: t.k, full: norm(t.n), base: base(t.n) };
      byCode[t.c] = o;
      return o;
    });
    aliasList = Object.keys(d.aliases).map(function (name) { return { name: name, key: norm(name), codes: d.aliases[name] }; });
  });

  // ---------- text helpers ----------
  function norm(s) {
    return String(s || '').toLowerCase()
      .replace(/[.'’]/g, '').replace(/[^a-z0-9]+/g, ' ')
      .replace(/\btwp\b/g, 'township').replace(/\bboro\b/g, 'borough').replace(/\bmt\b/g, 'mount')
      .replace(/\bft\b/g, 'fort').replace(/\bpt\b/g, 'point').replace(/\s+/g, ' ').trim();
  }
  function base(s) {
    var n = norm(s).replace(/^(township|borough|city|town|village) of /, '');
    return n.replace(TYPES, '').trim() || n;
  }
  function stripState(q) { return q.replace(/,?\s*(nj|new jersey)\s*(\d{5}(-\d{4})?)?\s*$/i, function (m, s, zip) { return zip ? ' ' + zip : ''; }).trim(); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function countyLabel(c) { return String(c || '').toLowerCase().replace(/\b[a-z]/g, function (m) { return m.toUpperCase(); }) + ' County'; }
  function fmtDate(iso) {
    var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || '');
    if (!m) return '';
    return new Date(+m[1], +m[2] - 1, +m[3]).toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
  }

  // ---------- matching ----------
  function townsByName(q) {
    var county = null, k = q;
    var parts = q.split(',');
    if (parts.length > 1) {
      var tail = norm(parts.slice(1).join(' ')).replace(/\s*county$/, '');
      if (towns.some(function (t) { return norm(t.county) === tail; })) { county = tail; k = parts[0]; }
    }
    var full = norm(k);
    var b = base(k);
    var pool = county ? towns.filter(function (t) { return norm(t.county) === county; }) : towns;
    var exact = pool.filter(function (t) { return t.full === full; });
    if (exact.length) return exact;
    return pool.filter(function (t) { return t.base === b; });
  }
  function aliasByName(q) {
    var key = norm(q.split(',')[0]);
    return aliasList.filter(function (a) { return a.key === key; });
  }
  function suggestions(q) {
    q = stripState(q);
    var n = norm(q);
    if (!n) return [];
    if (/^\d{3,5}$/.test(n)) {
      return Object.keys(data.zips).filter(function (z) { return z.indexOf(n) === 0; }).slice(0, 6).map(function (z) {
        var list = data.zips[z].map(function (c) { return byCode[c].name; });
        return { kind: 'zip', zip: z, label: z, meta: list.slice(0, 3).join(', ') + (list.length > 3 ? '…' : '') };
      });
    }
    if (/\d/.test(n)) return [];
    var starts = [], contains = [];
    towns.forEach(function (t) {
      if (t.full.indexOf(n) === 0 || t.base.indexOf(n) === 0) starts.push(t);
      else if (n.length > 2 && t.full.indexOf(' ' + n) > -1) contains.push(t);
    });
    var items = starts.concat(contains).slice(0, 7).map(function (t) { return { kind: 'town', code: t.code, label: t.name, meta: countyLabel(t.county) }; });
    aliasList.forEach(function (a) {
      if (a.key.indexOf(n) === 0 && items.length < 8) {
        var names = a.codes.map(function (c) { return byCode[c].name; });
        items.push({ kind: 'alias', alias: a, label: a.name, meta: names.join(', ') });
      }
    });
    return items.slice(0, 8);
  }

  function geocode(address) {
    var p = new URLSearchParams({ SingleLine: address, outFields: 'City,Zone,Subregion', outSR: '4326', maxLocations: '1', f: 'json' });
    var ctrl = window.AbortController ? new AbortController() : null;
    var timer = ctrl ? setTimeout(function () { ctrl.abort(); }, 9000) : null;
    return fetch(NJ_GEOCODE + '?' + p, ctrl ? { signal: ctrl.signal } : undefined)
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (timer) clearTimeout(timer);
        var c = d && d.candidates && d.candidates[0];
        if (!c || Number(c.score) < 80) return null;
        var a = c.attributes || {};
        var county = norm(a.Subregion), zone = norm(a.Zone);
        var pool = towns.filter(function (t) { return norm(t.county) === county; });
        var hit = pool.filter(function (t) { return t.full === zone; });
        if (hit.length !== 1) hit = pool.filter(function (t) { return t.base === base(a.Zone); });
        if (hit.length !== 1) return null;
        return { town: hit[0], city: a.City || '', matched: c.address || '' };
      })
      .catch(function () { if (timer) clearTimeout(timer); return null; });
  }

  // ---------- search boxes (home and top bar share the same text) ----------
  var boxes = [];
  Array.prototype.forEach.call(document.querySelectorAll('[data-search]'), function (el, i) {
    el.appendChild(document.getElementById('search-tpl').content.cloneNode(true));
    var input = el.querySelector('input'), list = el.querySelector('.suggest'), clear = el.querySelector('.clear');
    var id = 'q' + i;
    input.id = id; el.querySelector('label').setAttribute('for', id);
    list.id = 'sug' + i; input.setAttribute('aria-controls', list.id);
    var b = { el: el, input: input, list: list, items: [], active: -1 };
    boxes.push(b);

    function close() { el.classList.remove('open'); input.setAttribute('aria-expanded', 'false'); input.removeAttribute('aria-activedescendant'); b.active = -1; }
    function paint() {
      list.innerHTML = b.items.map(function (it, j) {
        return '<li role="option" id="' + list.id + '-' + j + '" aria-selected="' + (j === b.active) + '" data-j="' + j + '"><span class="s-name">' + esc(it.label) + '</span><span class="s-meta">' + esc(it.meta) + '</span></li>';
      }).join('');
      if (b.active > -1) input.setAttribute('aria-activedescendant', list.id + '-' + b.active); else input.removeAttribute('aria-activedescendant');
    }
    function refresh() {
      el.classList.toggle('has-text', !!input.value);
      if (!data) return;
      b.items = suggestions(input.value);
      b.active = -1;
      if (!b.items.length || document.activeElement !== input) return close();
      paint();
      el.classList.add('open'); input.setAttribute('aria-expanded', 'true');
    }
    b.close = close;
    input.addEventListener('input', function () { boxes.forEach(function (o) { if (o !== b) { o.input.value = input.value; o.el.classList.toggle('has-text', !!input.value); } }); refresh(); });
    input.addEventListener('focus', refresh);
    input.addEventListener('blur', function () { setTimeout(close, 150); });
    input.addEventListener('keydown', function (e) {
      var open = el.classList.contains('open');
      if (e.key === 'ArrowDown' && open) { b.active = (b.active + 1) % b.items.length; paint(); e.preventDefault(); }
      else if (e.key === 'ArrowUp' && open) { b.active = b.active <= 0 ? b.items.length - 1 : b.active - 1; paint(); e.preventDefault(); }
      else if (e.key === 'Escape') { close(); }
      else if (e.key === 'Enter') {
        e.preventDefault();
        if (open && b.active > -1) pick(b.items[b.active]); else run(input.value);
        close();
      }
    });
    list.addEventListener('mousedown', function (e) {
      var li = e.target.closest('li');
      if (!li) return;
      e.preventDefault();
      pick(b.items[+li.getAttribute('data-j')]);
      close();
    });
    clear.addEventListener('click', function () { setText(''); input.focus(); });
    if (el.tagName === 'FORM') el.addEventListener('submit', function (e) { e.preventDefault(); run(input.value); close(); });
  });
  function setText(v) { boxes.forEach(function (b) { b.input.value = v; b.el.classList.toggle('has-text', !!v); }); }

  function pick(it) {
    if (!it) return;
    measure('search', { search_term: String(it.label).slice(0, 100), search_type: it.kind === 'zip' ? 'zip' : 'town', via: 'suggestion' });
    setText(it.label);
    if (it.kind === 'town') return showTown(byCode[it.code]);
    if (it.kind === 'alias') return showChoices(it.alias.codes, aliasIntro(it.alias.name, it.alias.codes));
    if (it.kind === 'zip') return run(it.zip);
  }
  function aliasIntro(name, codes) {
    return codes.length === 1 ? '' : esc(name) + ' is a mailing name. Pick the town:';
  }


  // ---------- measurement ----------
  // What people search for and what they get back. Google Analytics gets the standard `search`
  // event (Reports > Engagement > Events > search > search_term) once a visitor accepts cookies;
  // Clarity gets the same as custom tags; Watchdog's first-party analytics counts lookups by town.
  // House numbers are dropped from address searches so no full street address is sent.
  function searchTerm(q, kind) {
    var t = String(q || '').trim().replace(/\s+/g, ' ');
    if (kind === 'address') t = t.replace(/^\s*\d+[a-z]?(-\d+)?\s+/i, '');
    return t.slice(0, 100);
  }
  function kindOf(q) {
    var s = stripState(String(q || '').trim());
    if (/^\d{5}(-\d{4})?$/.test(s)) return 'zip';
    if (/\d/.test(s) && /[a-z]/i.test(s)) return 'address';
    return 'town';
  }
  function measure(name, params) {
    try { if (typeof window.gtag === 'function') window.gtag('event', name, params); } catch (_) {}
    try {
      if (typeof window.clarity === 'function') {
        window.clarity('event', name);
        Object.keys(params).forEach(function (k) { if (params[k] !== '' && params[k] != null) window.clarity('set', 'co_' + k, String(params[k])); });
      }
    } catch (_) {}
  }
  function trackSearch(q) {
    var kind = kindOf(q);
    measure('search', { search_term: searchTerm(q, kind), search_type: kind });
  }
  function trackTown(t, status) {
    measure('co_town_result', { town: t.name, county: countyLabel(t.county), town_code: t.code, result: status });
    try { if (window.WatchdogAnalytics) window.WatchdogAnalytics.track('tool_open', { tool: 'co_lookup', action: 'town_result', scope: t.code, status: status }); } catch (_) {}
  }
  function trackMiss(q) {
    var kind = kindOf(q);
    measure('co_search_no_result', { search_term: searchTerm(q, kind), search_type: kind });
  }

  // ---------- running a search ----------
  var seq = 0;
  function run(raw) {
    var q = String(raw || '').trim();
    if (!q) return;
    trackSearch(q);
    var mine = ++seq;
    dataReady.then(function () {
      if (mine !== seq) return;
      var s = stripState(q);
      var zipOnly = /^(\d{5})(-\d{4})?$/.exec(s);
      if (zipOnly) return showZip(zipOnly[1]);
      if (/\d/.test(s) && /[a-z]/i.test(s)) return runAddress(q, s, mine);
      var hits = townsByName(s), aliases = aliasByName(s);
      var codes = hits.map(function (t) { return t.code; });
      aliases.forEach(function (a) { a.codes.forEach(function (c) { if (codes.indexOf(c) < 0) codes.push(c); }); });
      if (codes.length === 1) {
        var only = byCode[codes[0]];
        return showTown(only, aliases.length && !hits.length ? { city: aliases[0].name } : null);
      }
      if (codes.length > 1) {
        var intro = aliases.length && !hits.length ? aliasIntro(aliases[0].name, codes)
          : 'Pick a town:';
        return showChoices(codes, intro);
      }
      var sug = suggestions(s).filter(function (x) { return x.kind === 'town'; }).map(function (x) { return x.code; });
      if (sug.length) return showChoices(sug, 'Did you mean:');
      trackMiss(q);
      render('<p class="msg">No New Jersey town found for “' + esc(q) + '”.</p>');
    });
  }
  function runAddress(q, s, mine) {
    render('<p class="msg">Searching…</p>');
    geocode(/\bnj\b|new jersey/i.test(q) ? q : q + ', NJ').then(function (g) {
      if (mine !== seq) return;
      if (g) return showTown(g.town, { city: g.city, address: g.matched });
      var zip = /\b(\d{5})(-\d{4})?\s*$/.exec(s);
      if (zip && data.zips[zip[1]]) return showZip(zip[1], 'Address not found. Towns in ZIP ' + zip[1] + ':');
      var tail = s.split(',').slice(1).join(',').trim();
      if (tail) {
        var hits = townsByName(tail).map(function (t) { return t.code; });
        aliasByName(tail).forEach(function (a) { a.codes.forEach(function (c) { if (hits.indexOf(c) < 0) hits.push(c); }); });
        if (hits.length) return showChoices(hits, 'Address not found. Pick a town:');
      }
      trackMiss(q);
      render('<p class="msg">Address not found. Try adding the town, or type just the town.</p>');
    });
  }
  function showZip(zip, intro) {
    var codes = data.zips[zip];
    if (!codes) return render('<p class="msg">No New Jersey towns found for ZIP ' + esc(zip) + '.</p>');
    if (codes.length === 1) return showTown(byCode[codes[0]], { zip: zip });
    showChoices(codes, intro || 'ZIP ' + esc(zip) + ' covers more than one town. Pick one:');
  }
  function showChoices(codes, intro) {
    var html = '<p>' + intro + '</p><div class="choices">' + codes.map(function (c) {
      var t = byCode[c];
      return '<button class="choice" type="button" data-code="' + c + '"><strong>' + esc(t.name) + '</strong><span>' + esc(countyLabel(t.county)) + '</span></button>';
    }).join('') + '</div>';
    render(html);
    Array.prototype.forEach.call(out.querySelectorAll('.choice'), function (btn) {
      btn.addEventListener('click', function () { var t = byCode[btn.getAttribute('data-code')]; setText(t.name); showTown(t); });
    });
  }

  // ---------- one town ----------
  function showTown(t, ctx) {
    var mine = ++seq;
    addTown = t;
    render('<p class="msg">Loading…</p>');
    setUrl(t.code);
    fetch('/api/co-lookup?code=' + encodeURIComponent(t.code))
      .then(function (r) { return r.json(); })
      .catch(function () { return { status: 'error' }; })
      .then(function (d) {
        if (mine !== seq) return;
        document.title = t.name + ' CO Requirements | Watchdog';
        trackTown(t, d.status === 'ok' ? d.co.status : d.status);
        if (d.status === 'ok') return render(townHtml(t, d, ctx || {}) + '<button class="fix" type="button" data-fix>Report a correction</button>');
        if (d.status === 'not_available') return render(head(t, ctx) +
          '<p>Not available yet.</p>' + addButton());
        render(head(t, ctx) + '<p class="msg">Couldn’t load this town. Try again.</p>');
      });
  }
  function head(t, ctx) {
    var meta = esc(countyLabel(t.county));
    var city = ctx && ctx.city;
    if (city && norm(city) !== t.full && norm(city) !== t.base) meta += ' · Mailing address: ' + esc(city);
    return '<h1 class="town">' + esc(t.name) + '</h1><p class="meta">' + meta + '</p>';
  }
  function feeTable(fees) {
    if (!fees.length) return '';
    return '<table class="fees"><tbody>' + fees.map(function (f) {
      return '<tr><td>' + esc(f.label) + '</td><td class="amt">' + esc(f.amount) + '</td></tr>';
    }).join('') + '</tbody></table>';
  }
  function links(applyUrl, pageUrl) {
    var h = '';
    if (applyUrl) h += '<a class="primary" href="' + esc(applyUrl) + '" target="_blank" rel="noopener">Application</a>';
    if (pageUrl) h += '<a href="' + esc(pageUrl) + '" target="_blank" rel="noopener">Official page</a>';
    return h ? '<div class="links">' + h + '</div>' : '';
  }
  function items(list) { return list.length ? '<ul class="items">' + list.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>' : ''; }
  function timing(lead, valid) {
    var bits = [];
    if (lead) bits.push('<li><strong>Timing:</strong> ' + esc(lead) + '</li>');
    if (valid) bits.push('<li><strong>Good for:</strong> ' + esc(valid) + '</li>');
    return bits.length ? '<ul class="items">' + bits.join('') + '</ul>' : '';
  }

  function fact(label, html) { return html ? '<dt>' + label + '</dt><dd>' + html + '</dd>' : ''; }

  function townHtml(t, d, ctx) {
    var co = d.co, fire = d.fire;
    var st = { required: ['req', 'Required'], not_required: ['no', 'Not required'], not_found: ['unsure', 'Not confirmed'] }[co.status];
    var html = head(t, ctx);

    html += '<section class="part"><h2>Certificate of Occupancy</h2><span class="status ' + st[0] + '">' + st[1] + '</span>' + (co.status === 'not_found' ? '<div>' + addButton() + '</div>' : '') + '<dl class="facts">' +
      fact('Certificate', esc(co.name)) +
      fact('Issued by', esc(co.issued_by)) +
      fact('Requirements', items(co.requirements)) +
      fact('Fees', feeTable(co.fees)) +
      fact('Timing', esc(co.lead_time)) +
      fact('Valid for', esc(co.valid_for)) +
      fact('Phone', esc(co.phone)) +
      '</dl>' + links(co.application_url, co.department_url) + '</section>';

    var fireHtml = '<section class="part"><h2>Smoke and CO alarm certificate</h2><span class="status req">Required</span><dl class="facts">' +
      fact('Requirements', items(fire.requirements)) + '</dl>';
    fire.authorities.forEach(function (a) {
      fireHtml += '<div class="authority"><h3>' + esc(a.name) + '</h3>' +
        (a.area_served && fire.authorities.length > 1 ? '<p class="sub">' + esc(a.area_served) + '</p>' : '') +
        '<dl class="facts">' + fact('Fees', feeTable(a.fees)) + fact('Timing', esc(a.lead_time)) + fact('Phone', esc(a.phone)) + '</dl>' +
        links(a.application_url, a.department_url) + '</div>';
    });
    html += fireHtml + '</section>';

    var when = fmtDate(d.checked_at);
    html += '<div class="fine">' + (when ? 'Last checked ' + esc(when) : '') +
      (d.sources.length ? '<details><summary>Sources</summary><ol>' + d.sources.map(function (u) { return '<li><a href="' + esc(u) + '" target="_blank" rel="noopener">' + esc(u) + '</a></li>'; }).join('') + '</ol></details>' : '') +
      '</div>';
    return html;
  }


  // ---------- Add CO Requirements / Report a correction (both go to the Back Office town-info queue) ----------
  var NEED_KEYS = ['co_required', 'co_fee', 'co_contact', 'fire_fee', 'fire_contact'];
  var EXT_TYPES = { pdf: 'application/pdf', jpg: 'image/jpeg', jpeg: 'image/jpeg', png: 'image/png', webp: 'image/webp', heic: 'image/heic', heif: 'image/heif' };
  var MAX_BYTES = 10 * 1024 * 1024;
  var dlg = document.getElementById('add-dlg'), addForm = document.getElementById('add-form');
  var addTown = null, openedAt = 0, fixing = false;
  function addButton() { return '<button class="add" type="button" data-add>Add CO Requirements</button>'; }
  function fileType(file) {
    var t = String(file.type || '').toLowerCase();
    if (t && Object.keys(EXT_TYPES).some(function (k) { return EXT_TYPES[k] === t; })) return t;
    return EXT_TYPES[String(file.name || '').split('.').pop().toLowerCase()] || '';
  }
  function formStatus(msg, kind) { var el = addForm.querySelector('.formstatus'); el.textContent = msg; el.className = 'formstatus' + (kind ? ' ' + kind : ''); }
  function postNeeds(body) {
    return fetch('/api/watchdog-town-needs', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { if (!r.ok) throw new Error(j.error || 'Something went wrong. Please try again.'); return j; }); });
  }
  function uploadFile(url, file, type) {
    var fd = new FormData();
    fd.append('cacheControl', '3600');
    fd.append('', new Blob([file], { type: type }), file.name || 'document');
    return fetch(url, { method: 'PUT', headers: { 'x-upsert': 'false' }, body: fd }).then(function (r) { if (!r.ok) throw new Error('The upload didn’t finish. Please try again.'); });
  }
  function openAdd(t, fix) {
    addTown = t; openedAt = Date.now(); fixing = !!fix;
    measure(fixing ? 'co_correction_open' : 'co_add_requirements_open', { town: t.name, town_code: t.code });
    addForm.reset(); formStatus('', '');
    document.getElementById('add-title').textContent = fixing ? 'Report a correction' : 'Add CO Requirements';
    addForm.querySelector('[data-doc-label]').textContent = fixing ? 'Town document that shows the right info' : 'Town document';
    Array.prototype.forEach.call(addForm.querySelectorAll('[data-fix-only]'), function (el) { el.hidden = !fixing; });
    Array.prototype.forEach.call(addForm.querySelectorAll('[data-add-only]'), function (el) { el.hidden = fixing; });
    addForm.querySelector('.send').disabled = false;
    document.getElementById('add-town').textContent = t.name + ', ' + countyLabel(t.county);
    if (dlg.showModal) dlg.showModal(); else dlg.setAttribute('open', '');
  }
  function closeAdd() { if (dlg.close) dlg.close(); else dlg.removeAttribute('open'); }
  out.addEventListener('click', function (e) {
    if (!addTown) return;
    if (e.target.closest('[data-add]')) openAdd(addTown, false);
    else if (e.target.closest('[data-fix]')) openAdd(addTown, true);
  });
  addForm.querySelector('.cancel').addEventListener('click', closeAdd);
  addForm.addEventListener('submit', function (e) {
    e.preventDefault();
    var f = addForm.elements, t = addTown;
    var file = f.file.files && f.file.files[0] || null;
    var link = String(f.source_url.value || '').trim();
    var problem = String(f.problem.value || '').trim();
    if (fixing && !problem) return formStatus('Tell us what’s wrong.', 'error');
    if (!file && !link) return formStatus('Add the town’s document or a link to the town’s page.', 'error');
    if (link && !/^https:\/\/[^\s]+\.[^\s]+/i.test(link)) return formStatus('The link must start with https://.', 'error');
    var type = file ? fileType(file) : '';
    if (file && !type) return formStatus('Upload a PDF or a photo (JPG, PNG, WebP or HEIC).', 'error');
    if (file && file.size > MAX_BYTES) return formStatus('The file must be 10 MB or smaller.', 'error');
    var send = addForm.querySelector('.send');
    send.disabled = true;
    formStatus(file ? 'Uploading…' : 'Sending…', '');
    postNeeds({
      action: 'start', code: t.code, needs: fixing ? ['correction'] : NEED_KEYS, answer: fixing ? problem : f.answer.value, source_url: link,
      file: file ? { name: file.name, type: type, size: file.size } : null,
      name: f.name.value, email: f.email.value, role: f.role.value,
      website: f.website.value, elapsed_ms: Date.now() - openedAt
    }).then(function (res) {
      if (!file || !res.upload_url) return res;
      return uploadFile(res.upload_url, file, type).then(function () { return postNeeds({ action: 'finish', id: res.id }); });
    }).then(function () {
      formStatus('Thanks, it’s in. We’ll check it before it goes live.', '');
      measure(fixing ? 'co_correction_submitted' : 'co_requirements_submitted', { town: t.name, town_code: t.code });
      setTimeout(closeAdd, 1800);
    }).catch(function (err) {
      send.disabled = false;
      formStatus(err.message || 'Something went wrong. Please try again.', 'error');
    });
  });

  // ---------- page state ----------
  function render(html) {
    document.body.classList.add('results');
    out.innerHTML = html;
  }
  function setUrl(code) {
    try { history.replaceState(null, '', '/co?town=' + code); } catch (_) {}
  }
  var start = new URLSearchParams(location.search);
  var startCode = start.get('town'), startQ = start.get('q');
  if (startCode && /^\d{4}$/.test(startCode)) {
    dataReady.then(function () { var t = byCode[startCode]; if (t) { setText(t.name); showTown(t); } });
  } else if (startQ) {
    setText(startQ); run(startQ);
  } else if (window.matchMedia('(min-width: 641px)').matches) {
    boxes[1].input.focus();
  }
})();
</script>
</body>
</html>
