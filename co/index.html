<style>
  :root {
    --navy: #1a3a6b;
    --navy-dark: #0e2248;
    --gold: #b8972a;
    --text: #202124;
    --muted: #5f6368;
    --line: #dfe1e5;
    --soft: #f8f9fa;
    --link: #1a3a6b;
    --ok: #1e7a3c;
    --warn: #9a6700;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh; display: flex; flex-direction: column;
    background: #fff; color: var(--text);
    font-family: 'Source Sans 3', Arial, sans-serif; font-size: 16px; line-height: 1.5;
  }
  a { color: var(--link); }
  main { flex: 1; width: 100%; }

  /* Home: a wordmark and one box, centered like a search engine homepage. */
  .home { display: flex; flex-direction: column; align-items: center; padding: 22vh 16px 40px; }
  .wordmark { margin: 0 0 26px; font-family: 'Playfair Display', Georgia, serif; font-weight: 700; font-size: clamp(48px, 11vw, 84px); line-height: 1; letter-spacing: -1px; color: var(--navy); text-decoration: none; white-space: nowrap; }
  .wordmark .nj { color: var(--gold); }
  .tagline { margin: -12px 0 26px; color: var(--muted); font-size: 15px; text-align: center; }

  .search { position: relative; width: 100%; max-width: 584px; }
  .box {
    display: flex; align-items: center; gap: 4px;
    min-height: 48px; padding: 0 6px 0 16px;
    border: 1px solid var(--line); border-radius: 24px; background: #fff;
    transition: box-shadow .15s, border-color .15s;
  }
  .box:hover, .box:focus-within { box-shadow: 0 1px 6px rgba(32,33,36,.28); border-color: rgba(223,225,229,0); }
  .search.open .box { border-radius: 24px 24px 0 0; box-shadow: 0 1px 6px rgba(32,33,36,.28); border-color: transparent; }
  .box svg { flex: none; color: #9aa0a6; }
  .box input {
    flex: 1; min-width: 0; height: 46px; border: 0; outline: 0; background: transparent;
    font: inherit; font-size: 16px; color: var(--text);
  }
  .clear { display: none; flex: none; width: 44px; height: 44px; border: 0; border-radius: 50%; background: transparent; color: var(--muted); font-size: 24px; line-height: 1; cursor: pointer; }
  .clear:hover { background: var(--soft); }
  .search.has-text .clear { display: block; }

  .suggest {
    display: none; position: absolute; z-index: 5; left: 0; right: 0; top: 100%;
    margin: 0; padding: 4px 0 10px; list-style: none; background: #fff;
    border-radius: 0 0 24px 24px; box-shadow: 0 4px 6px rgba(32,33,36,.28); overflow: hidden;
  }
  .suggest::before { content: ""; display: block; height: 1px; margin: 0 16px 4px; background: #e8eaed; }
  .search.open .suggest { display: block; }
  .suggest li { display: flex; align-items: baseline; gap: 8px; min-height: 44px; padding: 10px 20px; cursor: pointer; }
  .suggest li[aria-selected="true"], .suggest li:hover { background: #eef0f3; }
  .suggest .s-name { font-weight: 500; }
  .suggest .s-meta { color: var(--muted); font-size: 14px; }

  .buttons { display: flex; justify-content: center; margin-top: 28px; }
  .btn {
    min-height: 44px; padding: 0 18px; border: 1px solid var(--soft); border-radius: 6px;
    background: var(--soft); color: #3c4043; font: inherit; font-size: 15px; cursor: pointer;
  }
  .btn:hover { border-color: var(--line); box-shadow: 0 1px 1px rgba(0,0,0,.1); }
  .btn:focus-visible, .clear:focus-visible, .choice:focus-visible { outline: 2px solid var(--navy); outline-offset: 2px; }

  /* Results: the box moves to a top bar and the answer shows below it. */
  .top { display: none; align-items: center; gap: 28px; padding: 20px 24px 18px; border-bottom: 1px solid #ebebeb; }
  .top .wordmark { margin: 0; font-size: 30px; letter-spacing: 0; }
  .top .search { max-width: 690px; }
  body.results .home { display: none; }
  body.results .top { display: flex; }
  .out { max-width: 720px; padding: 18px 24px 56px 178px; }
  body:not(.results) .out { display: none; }

  .msg { color: var(--muted); }
  .town { margin: 6px 0 2px; font-size: 28px; font-weight: 600; line-height: 1.25; }
  .county { margin: 0 0 14px; color: var(--muted); }
  .answer { display: flex; gap: 10px; align-items: flex-start; margin: 0 0 18px; padding: 14px 16px; border-radius: 10px; background: var(--soft); font-size: 18px; font-weight: 600; }
  .answer .dot { flex: none; width: 12px; height: 12px; margin-top: 8px; border-radius: 50%; background: var(--navy); }
  .answer.no .dot { background: var(--ok); }
  .answer.unsure .dot { background: var(--warn); }
  .answer small { display: block; margin-top: 2px; font-size: 15px; font-weight: 400; color: var(--muted); }
  .note { margin: 0 0 18px; padding: 10px 14px; border-left: 3px solid var(--gold); background: #fdf9ec; font-size: 15px; }

  section.part { margin: 0 0 26px; }
  section.part h2 { margin: 0 0 4px; font-size: 20px; font-weight: 600; color: var(--navy-dark); }
  .sub { margin: 0 0 10px; color: var(--muted); font-size: 15px; }
  h3 { margin: 16px 0 6px; font-size: 15px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  ul.items { margin: 0; padding-left: 20px; }
  ul.items li { margin: 4px 0; }
  .fees { width: 100%; border-collapse: collapse; font-size: 15px; }
  .fees td { padding: 7px 0; border-bottom: 1px solid #ebebeb; vertical-align: top; }
  .fees td.amt { width: 1%; padding-left: 16px; font-weight: 600; white-space: nowrap; text-align: right; }
  .links { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
  .links a { display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px; border: 1px solid var(--line); border-radius: 22px; text-decoration: none; font-weight: 500; }
  .links a:hover { background: var(--soft); }
  .links a.primary { background: var(--navy); border-color: var(--navy); color: #fff; }
  .links a.primary:hover { background: var(--navy-dark); }
  .office { margin-top: 10px; font-size: 15px; color: var(--muted); }
  .authority { margin-top: 14px; padding-top: 12px; border-top: 1px solid #ebebeb; }
  .authority:first-of-type { border-top: 0; padding-top: 0; }
  .authority h4 { margin: 0 0 4px; font-size: 16px; }
  .fine { margin-top: 30px; padding-top: 14px; border-top: 1px solid #ebebeb; color: var(--muted); font-size: 14px; }
  .fine details { margin-top: 8px; }
  .fine summary { min-height: 44px; display: inline-flex; align-items: center; cursor: pointer; }
  .fine ol { margin: 4px 0 0; padding-left: 20px; word-break: break-all; }

  .choices { display: grid; gap: 8px; margin-top: 12px; }
  .choice { display: flex; justify-content: space-between; gap: 12px; min-height: 48px; padding: 10px 16px; border: 1px solid var(--line); border-radius: 10px; background: #fff; font: inherit; text-align: left; cursor: pointer; }
  .choice:hover { background: var(--soft); }
  .choice span { color: var(--muted); }

  footer { padding: 14px 24px; background: #f2f2f2; color: var(--muted); font-size: 14px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 24px; }
  footer a { color: var(--muted); text-decoration: none; display: inline-flex; align-items: center; min-height: 44px; }
  footer a:hover { text-decoration: underline; }

  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  @media (max-width: 900px) {
    .out { padding-left: 24px; }
  }
  @media (max-width: 640px) {
    .home { padding-top: 16vh; }
    .top { flex-direction: column; align-items: stretch; gap: 12px; padding: 14px 16px; }
    .top .wordmark { font-size: 26px; text-align: center; }
    .out { padding: 14px 16px 48px; }
    .town { font-size: 24px; }
    footer { padding: 6px 16px; }
  }
  @media print {
    .top, .home, footer, .links { display: none !important; }
    .out { padding: 0; }
  }
</style>

<body>
<main>
  <header class="top">
    <a class="wordmark" href="/co/" data-home><span class="nj">NJ</span> CO Lookup</a>
    <div class="search" data-search></div>
  </header>

  <div class="home">
    <a class="wordmark" href="/co/" data-home><span class="nj">NJ</span> CO Lookup</a>
    <p class="tagline">What does a New Jersey town need before you sell a home?</p>
    <form class="search" data-search role="search" id="home-form"></form>
    <div class="buttons"><button class="btn" type="submit" form="home-form">Look it up</button></div>
  </div>

  <div class="out" id="out" aria-live="polite"></div>
</main>

<footer>
  <span>From <a href="/">NJ Property Tax Relief</a></span>
  <span><a href="/#contact">Questions? Send us a message</a></span>
</footer>

<template id="search-tpl">
  <div class="box">
    <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
    <label class="sr">Address or town</label>
    <input type="text" autocomplete="off" spellcheck="false" placeholder="Type an address or town" role="combobox" aria-autocomplete="list" aria-expanded="false" enterkeyhint="search">
    <button class="clear" type="button" aria-label="Clear">&times;</button>
  </div>
  <ul class="suggest" role="listbox"></ul>
</template>

<script>
(function () {
  'use strict';

  var NJ_GEOCODE = 'https://geo.nj.gov/arcgis/rest/services/Tasks/NJ_Geocode/GeocodeServer/findAddressCandidates';
  var TYPES = /\s+(township|borough|city|town|village)$/;
  var out = document.getElementById('out');
  var data = null, towns = [], byCode = {}, aliasList = [];
  var dataReady = fetch('/co/towns.json').then(function (r) { return r.json(); }).then(function (d) {
    data = d;
    towns = d.towns.map(function (t) {
      var o = { code: t.c, name: t.n, county: t.k, full: norm(t.n), base: base(t.n) };
      byCode[t.c] = o;
      return o;
    });
    aliasList = Object.keys(d.aliases).map(function (name) { return { name: name, key: norm(name), codes: d.aliases[name] }; });
  });

  // ---------- text helpers ----------
  function norm(s) {
    return String(s || '').toLowerCase()
      .replace(/[.'’]/g, '').replace(/[^a-z0-9]+/g, ' ')
      .replace(/\btwp\b/g, 'township').replace(/\bboro\b/g, 'borough').replace(/\bmt\b/g, 'mount')
      .replace(/\bft\b/g, 'fort').replace(/\bpt\b/g, 'point').replace(/\s+/g, ' ').trim();
  }
  function base(s) {
    var n = norm(s).replace(/^(township|borough|city|town|village) of /, '');
    return n.replace(TYPES, '').trim() || n;
  }
  function stripState(q) { return q.replace(/,?\s*(nj|new jersey)\s*(\d{5}(-\d{4})?)?\s*$/i, function (m, s, zip) { return zip ? ' ' + zip : ''; }).trim(); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function countyLabel(c) { return String(c || '').toLowerCase().replace(/\b[a-z]/g, function (m) { return m.toUpperCase(); }) + ' County'; }
  function fmtDate(iso) {
    var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || '');
    if (!m) return '';
    return new Date(+m[1], +m[2] - 1, +m[3]).toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
  }

  // ---------- matching ----------
  function townsByName(q) {
    var county = null, k = q;
    var parts = q.split(',');
    if (parts.length > 1) {
      var tail = norm(parts.slice(1).join(' ')).replace(/\s*county$/, '');
      if (towns.some(function (t) { return norm(t.county) === tail; })) { county = tail; k = parts[0]; }
    }
    var full = norm(k);
    var b = base(k);
    var pool = county ? towns.filter(function (t) { return norm(t.county) === county; }) : towns;
    var exact = pool.filter(function (t) { return t.full === full; });
    if (exact.length) return exact;
    return pool.filter(function (t) { return t.base === b; });
  }
  function aliasByName(q) {
    var key = norm(q.split(',')[0]);
    return aliasList.filter(function (a) { return a.key === key; });
  }
  function suggestions(q) {
    q = stripState(q);
    var n = norm(q);
    if (!n) return [];
    if (/^\d{3,5}$/.test(n)) {
      return Object.keys(data.zips).filter(function (z) { return z.indexOf(n) === 0; }).slice(0, 6).map(function (z) {
        var list = data.zips[z].map(function (c) { return byCode[c].name; });
        return { kind: 'zip', zip: z, label: z, meta: list.slice(0, 3).join(', ') + (list.length > 3 ? '…' : '') };
      });
    }
    if (/\d/.test(n)) return [];
    var starts = [], contains = [];
    towns.forEach(function (t) {
      if (t.full.indexOf(n) === 0 || t.base.indexOf(n) === 0) starts.push(t);
      else if (n.length > 2 && t.full.indexOf(' ' + n) > -1) contains.push(t);
    });
    var items = starts.concat(contains).slice(0, 7).map(function (t) { return { kind: 'town', code: t.code, label: t.name, meta: countyLabel(t.county) }; });
    aliasList.forEach(function (a) {
      if (a.key.indexOf(n) === 0 && items.length < 8) {
        var names = a.codes.map(function (c) { return byCode[c].name; });
        items.push({ kind: 'alias', alias: a, label: a.name, meta: 'mailing name for ' + names.join(' or ') });
      }
    });
    return items.slice(0, 8);
  }

  function geocode(address) {
    var p = new URLSearchParams({ SingleLine: address, outFields: 'City,Zone,Subregion', outSR: '4326', maxLocations: '1', f: 'json' });
    var ctrl = window.AbortController ? new AbortController() : null;
    var timer = ctrl ? setTimeout(function () { ctrl.abort(); }, 9000) : null;
    return fetch(NJ_GEOCODE + '?' + p, ctrl ? { signal: ctrl.signal } : undefined)
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (timer) clearTimeout(timer);
        var c = d && d.candidates && d.candidates[0];
        if (!c || Number(c.score) < 80) return null;
        var a = c.attributes || {};
        var county = norm(a.Subregion), zone = norm(a.Zone);
        var pool = towns.filter(function (t) { return norm(t.county) === county; });
        var hit = pool.filter(function (t) { return t.full === zone; });
        if (hit.length !== 1) hit = pool.filter(function (t) { return t.base === base(a.Zone); });
        if (hit.length !== 1) return null;
        return { town: hit[0], city: a.City || '', matched: c.address || '' };
      })
      .catch(function () { if (timer) clearTimeout(timer); return null; });
  }

  // ---------- search boxes (home and top bar share the same text) ----------
  var boxes = [];
  Array.prototype.forEach.call(document.querySelectorAll('[data-search]'), function (el, i) {
    el.appendChild(document.getElementById('search-tpl').content.cloneNode(true));
    var input = el.querySelector('input'), list = el.querySelector('.suggest'), clear = el.querySelector('.clear');
    var id = 'q' + i;
    input.id = id; el.querySelector('label').setAttribute('for', id);
    list.id = 'sug' + i; input.setAttribute('aria-controls', list.id);
    var b = { el: el, input: input, list: list, items: [], active: -1 };
    boxes.push(b);

    function close() { el.classList.remove('open'); input.setAttribute('aria-expanded', 'false'); input.removeAttribute('aria-activedescendant'); b.active = -1; }
    function paint() {
      list.innerHTML = b.items.map(function (it, j) {
        return '<li role="option" id="' + list.id + '-' + j + '" aria-selected="' + (j === b.active) + '" data-j="' + j + '"><span class="s-name">' + esc(it.label) + '</span><span class="s-meta">' + esc(it.meta) + '</span></li>';
      }).join('');
      if (b.active > -1) input.setAttribute('aria-activedescendant', list.id + '-' + b.active); else input.removeAttribute('aria-activedescendant');
    }
    function refresh() {
      el.classList.toggle('has-text', !!input.value);
      if (!data) return;
      b.items = suggestions(input.value);
      b.active = -1;
      if (!b.items.length || document.activeElement !== input) return close();
      paint();
      el.classList.add('open'); input.setAttribute('aria-expanded', 'true');
    }
    b.close = close;
    input.addEventListener('input', function () { boxes.forEach(function (o) { if (o !== b) { o.input.value = input.value; o.el.classList.toggle('has-text', !!input.value); } }); refresh(); });
    input.addEventListener('focus', refresh);
    input.addEventListener('blur', function () { setTimeout(close, 150); });
    input.addEventListener('keydown', function (e) {
      var open = el.classList.contains('open');
      if (e.key === 'ArrowDown' && open) { b.active = (b.active + 1) % b.items.length; paint(); e.preventDefault(); }
      else if (e.key === 'ArrowUp' && open) { b.active = b.active <= 0 ? b.items.length - 1 : b.active - 1; paint(); e.preventDefault(); }
      else if (e.key === 'Escape') { close(); }
      else if (e.key === 'Enter') {
        e.preventDefault();
        if (open && b.active > -1) pick(b.items[b.active]); else run(input.value);
        close();
      }
    });
    list.addEventListener('mousedown', function (e) {
      var li = e.target.closest('li');
      if (!li) return;
      e.preventDefault();
      pick(b.items[+li.getAttribute('data-j')]);
      close();
    });
    clear.addEventListener('click', function () { setText(''); input.focus(); });
    if (el.tagName === 'FORM') el.addEventListener('submit', function (e) { e.preventDefault(); run(input.value); close(); });
  });
  function setText(v) { boxes.forEach(function (b) { b.input.value = v; b.el.classList.toggle('has-text', !!v); }); }

  function pick(it) {
    if (!it) return;
    setText(it.label);
    if (it.kind === 'town') return showTown(byCode[it.code]);
    if (it.kind === 'alias') return showChoices(it.alias.codes, aliasIntro(it.alias.name, it.alias.codes));
    if (it.kind === 'zip') return run(it.zip);
  }
  function aliasIntro(name, codes) {
    if (codes.length === 1) return '';
    return '“' + esc(name) + '” is a mailing name, not a town. Homes with that mailing address can be in any of these towns, and the town is what sets the rules. Pick one, or type the full street address and we’ll find it.';
  }

  // ---------- running a search ----------
  var seq = 0;
  function run(raw) {
    var q = String(raw || '').trim();
    if (!q) return;
    var mine = ++seq;
    dataReady.then(function () {
      if (mine !== seq) return;
      var s = stripState(q);
      var zipOnly = /^(\d{5})(-\d{4})?$/.exec(s);
      if (zipOnly) return showZip(zipOnly[1]);
      if (/\d/.test(s) && /[a-z]/i.test(s)) return runAddress(q, s, mine);
      var hits = townsByName(s), aliases = aliasByName(s);
      var codes = hits.map(function (t) { return t.code; });
      aliases.forEach(function (a) { a.codes.forEach(function (c) { if (codes.indexOf(c) < 0) codes.push(c); }); });
      if (codes.length === 1) {
        var only = byCode[codes[0]];
        return showTown(only, aliases.length && !hits.length ? { city: aliases[0].name } : null);
      }
      if (codes.length > 1) {
        var intro = aliases.length && !hits.length ? aliasIntro(aliases[0].name, codes)
          : 'More than one New Jersey town goes by that name. Which one?';
        return showChoices(codes, intro);
      }
      var sug = suggestions(s).filter(function (x) { return x.kind === 'town'; }).map(function (x) { return x.code; });
      if (sug.length) return showChoices(sug, 'We couldn’t find that exact town. Did you mean one of these?');
      render('<p class="msg">We couldn’t find a New Jersey town called “' + esc(q) + '”. Check the spelling, or type the full street address.</p>');
    });
  }
  function runAddress(q, s, mine) {
    render('<p class="msg">Finding that address…</p>');
    geocode(/\bnj\b|new jersey/i.test(q) ? q : q + ', NJ').then(function (g) {
      if (mine !== seq) return;
      if (g) return showTown(g.town, { city: g.city, address: g.matched });
      var zip = /\b(\d{5})(-\d{4})?\s*$/.exec(s);
      if (zip && data.zips[zip[1]]) return showZip(zip[1], 'We couldn’t pin down that exact address, so here are the towns in that ZIP code.');
      var tail = s.split(',').slice(1).join(',').trim();
      if (tail) {
        var hits = townsByName(tail).map(function (t) { return t.code; });
        aliasByName(tail).forEach(function (a) { a.codes.forEach(function (c) { if (hits.indexOf(c) < 0) hits.push(c); }); });
        if (hits.length) return showChoices(hits, 'We couldn’t pin down that exact address. Which town is the home in?');
      }
      render('<p class="msg">We couldn’t find that address. Try adding the town (like “12 Main St, Haddonfield”) or just type the town name.</p>');
    });
  }
  function showZip(zip, intro) {
    var codes = data.zips[zip];
    if (!codes) return render('<p class="msg">We don’t have ZIP code ' + esc(zip) + ' on file for New Jersey. Try the town name or full address.</p>');
    if (codes.length === 1) return showTown(byCode[codes[0]], { zip: zip });
    showChoices(codes, intro || 'ZIP code ' + esc(zip) + ' covers more than one town, and the town is what sets the rules. Which one is the home in? (Typing the full street address will find it for you.)');
  }
  function showChoices(codes, intro) {
    var html = '<p>' + intro + '</p><div class="choices">' + codes.map(function (c) {
      var t = byCode[c];
      return '<button class="choice" type="button" data-code="' + c + '"><strong>' + esc(t.name) + '</strong><span>' + esc(countyLabel(t.county)) + '</span></button>';
    }).join('') + '</div>';
    render(html);
    Array.prototype.forEach.call(out.querySelectorAll('.choice'), function (btn) {
      btn.addEventListener('click', function () { var t = byCode[btn.getAttribute('data-code')]; setText(t.name); showTown(t); });
    });
  }

  // ---------- one town ----------
  function showTown(t, ctx) {
    var mine = ++seq;
    render('<p class="msg">Loading ' + esc(t.name) + '…</p>');
    setUrl(t.code);
    fetch('/api/co-lookup?code=' + encodeURIComponent(t.code))
      .then(function (r) { return r.json(); })
      .catch(function () { return { status: 'error' }; })
      .then(function (d) {
        if (mine !== seq) return;
        document.title = t.name + ' CO Requirements | NJ CO Lookup';
        if (d.status === 'ok') return render(townHtml(t, d, ctx || {}));
        if (d.status === 'not_available') return render(head(t, ctx) +
          '<div class="answer unsure"><span class="dot"></span><div>We haven’t checked ' + esc(t.name) + ' yet.<small>More towns are being added. If you need this one sooner, <a href="/#contact">send us a message</a>.</small></div></div>');
        render(head(t, ctx) + '<p class="msg">Something went wrong loading this town. Please try again in a minute.</p>');
      });
  }
  function head(t, ctx) {
    var html = '<h1 class="town">' + esc(t.name) + '</h1><p class="county">' + esc(countyLabel(t.county)) + '</p>';
    var city = ctx && ctx.city;
    if (city && norm(city) !== t.full && norm(city) !== t.base) {
      html += '<p class="note">The mailing address says <strong>' + esc(city) + '</strong>, but the home is in <strong>' + esc(t.name) + '</strong>. The town sets the CO rules, so ' + esc(t.name) + '’s rules apply.</p>';
    }
    return html;
  }
  function feeTable(fees) {
    if (!fees.length) return '';
    return '<table class="fees"><tbody>' + fees.map(function (f) {
      return '<tr><td>' + esc(f.label) + '</td><td class="amt">' + esc(f.amount) + '</td></tr>';
    }).join('') + '</tbody></table>';
  }
  function links(applyUrl, pageUrl) {
    var h = '';
    if (applyUrl) h += '<a class="primary" href="' + esc(applyUrl) + '" target="_blank" rel="noopener">Application</a>';
    if (pageUrl) h += '<a href="' + esc(pageUrl) + '" target="_blank" rel="noopener">Official page</a>';
    return h ? '<div class="links">' + h + '</div>' : '';
  }
  function items(list) { return list.length ? '<ul class="items">' + list.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>' : ''; }
  function timing(lead, valid) {
    var bits = [];
    if (lead) bits.push('<li><strong>Timing:</strong> ' + esc(lead) + '</li>');
    if (valid) bits.push('<li><strong>Good for:</strong> ' + esc(valid) + '</li>');
    return bits.length ? '<ul class="items">' + bits.join('') + '</ul>' : '';
  }

  function townHtml(t, d, ctx) {
    var co = d.co, fire = d.fire;
    var answer = {
      required: ['', 'Yes, ' + esc(t.name) + ' requires a resale CO.', esc(co.name || '')],
      not_required: ['no', 'No town CO is needed for a resale in ' + esc(t.name) + '.', 'You still need the smoke and CO alarm certificate below.'],
      not_found: ['unsure', 'We couldn’t confirm whether ' + esc(t.name) + ' requires a resale CO.', 'Here’s what we found. Check with the town before you list.']
    }[co.status];
    var html = head(t, ctx) +
      '<div class="answer ' + answer[0] + '"><span class="dot"></span><div>' + answer[1] + (answer[2] ? '<small>' + answer[2] + '</small>' : '') + '</div></div>';

    var coBody = '';
    if (co.issued_by) coBody += '<p class="sub">Issued by ' + esc(co.issued_by) + '</p>';
    if (co.requirements.length) coBody += '<h3>What you’ll need</h3>' + items(co.requirements);
    if (co.fees.length) coBody += '<h3>Fees</h3>' + feeTable(co.fees);
    if (co.lead_time || co.valid_for) coBody += '<h3>Timing</h3>' + timing(co.lead_time, co.valid_for);
    if (co.how_to_apply) coBody += '<h3>' + (co.status === 'not_required' ? 'What the town says' : 'How to apply') + '</h3><p>' + esc(co.how_to_apply) + '</p>';
    coBody += links(co.application_url, co.department_url);
    if (co.phone) coBody += '<p class="office">Town office: ' + esc(co.phone) + '</p>';
    if (coBody) html += '<section class="part"><h2>Town certificate of occupancy</h2>' + coBody + '</section>';

    var fireBody = '<p class="sub">New Jersey requires this certificate for every one- and two-family home sale.</p>';
    if (fire.requirements.length) fireBody += '<h3>What the inspector checks</h3>' + items(fire.requirements);
    fire.authorities.forEach(function (a) {
      fireBody += '<div class="authority"><h4>' + esc(a.name) + '</h4>' +
        (a.area_served && fire.authorities.length > 1 ? '<p class="sub">Covers: ' + esc(a.area_served) + '</p>' : '') +
        (a.fees.length ? feeTable(a.fees) : '') +
        (a.lead_time ? '<p><strong>Timing:</strong> ' + esc(a.lead_time) + '</p>' : '') +
        (a.how_to_apply ? '<p>' + esc(a.how_to_apply) + '</p>' : '') +
        links(a.application_url, a.department_url) +
        (a.phone ? '<p class="office">Fire official: ' + esc(a.phone) + '</p>' : '') +
        '</div>';
    });
    html += '<section class="part"><h2>Smoke and CO alarm certificate</h2>' + fireBody + '</section>';

    var when = fmtDate(d.checked_at);
    html += '<div class="fine">' + (when ? 'Checked against official town sources on ' + esc(when) + '. ' : '') +
      'Rules and fees change, so confirm with the town before you list or close.' +
      (d.sources.length ? '<details><summary>Sources</summary><ol>' + d.sources.map(function (u) { return '<li><a href="' + esc(u) + '" target="_blank" rel="noopener">' + esc(u) + '</a></li>'; }).join('') + '</ol></details>' : '') +
      '</div>';
    return html;
  }

  // ---------- page state ----------
  function render(html) {
    document.body.classList.add('results');
    out.innerHTML = html;
  }
  function setUrl(code) {
    try { history.replaceState(null, '', '/co/?town=' + code); } catch (_) {}
  }
  Array.prototype.forEach.call(document.querySelectorAll('[data-home]'), function (a) {
    a.addEventListener('click', function (e) {
      e.preventDefault(); seq++;
      document.body.classList.remove('results'); out.innerHTML = ''; setText('');
      document.title = 'NJ CO Lookup | Resale Certificate of Occupancy Rules by Town';
      try { history.replaceState(null, '', '/co/'); } catch (_) {}
      boxes[1].input.focus();
    });
  });

  var start = new URLSearchParams(location.search);
  var startCode = start.get('town'), startQ = start.get('q');
  if (startCode && /^\d{4}$/.test(startCode)) {
    dataReady.then(function () { var t = byCode[startCode]; if (t) { setText(t.name); showTown(t); } });
  } else if (startQ) {
    setText(startQ); run(startQ);
  } else if (window.matchMedia('(min-width: 641px)').matches) {
    boxes[1].input.focus();
  }
})();
</script>
</body>
</html>
