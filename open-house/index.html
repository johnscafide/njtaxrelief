<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="theme-color" content="#ffffff">
<title>Open House Check-In | Watchdog</title><link rel="icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f7;color:#242529;font-family:Inter,system-ui,sans-serif}.oh-top{padding:16px 20px;background:#fff;border-bottom:1px solid #e5e7ea}.oh-top b{font-size:15px}.oh-wrap{max-width:720px;margin:28px auto;padding:0 16px 60px}.oh-card{background:#fff;border:1px solid #e3e6e9;border-radius:12px;overflow:hidden}.oh-head{padding:22px;border-bottom:1px solid #e5e7ea}.oh-kicker{font-size:11px;font-weight:800;letter-spacing:.08em;color:#72777e}.oh-head h1{margin:6px 0 5px;font-size:28px}.oh-head p{margin:0;color:#646971;font-size:14px;line-height:21px}.oh-event{display:grid;grid-template-columns:1fr auto;gap:12px;padding:15px 22px;background:#fafafa;border-bottom:1px solid #e5e7ea}.oh-event b,.oh-event span{display:block}.oh-event span{margin-top:3px;color:#6b7077;font-size:12px}.oh-agent{padding:13px 22px;border-bottom:1px solid #e5e7ea;color:#555d64;font-size:12px}.oh-form{display:grid;grid-template-columns:1fr 1fr;gap:13px;padding:22px}.oh-form .wide{grid-column:1/-1}.oh-form label{display:grid;gap:6px;font-size:12px;font-weight:700}.oh-form input{width:100%;padding:11px;border:1px solid #d5d9de;border-radius:8px;font:inherit}.oh-consent{display:flex!important;gap:9px!important;align-items:flex-start;font-weight:500!important;color:#51565c;line-height:18px}.oh-consent input{width:auto;margin-top:3px}.oh-submit{grid-column:1/-1;padding:12px;border:0;border-radius:8px;background:#29353d;color:#fff;font:700 14px Inter;cursor:pointer}.oh-submit:disabled{opacity:.55}.oh-msg{grid-column:1/-1;min-height:20px;color:#646971;font-size:12px}.oh-hp{position:absolute;left:-9999px}.oh-state{padding:34px 22px;text-align:center;color:#666}.oh-success{padding:34px 22px;text-align:center}.oh-success i{display:grid;place-items:center;width:48px;height:48px;margin:0 auto 12px;border-radius:50%;background:#eef5f0;color:#476954;font-style:normal;font-weight:800}.oh-success h2{margin:0}.oh-success p{color:#646971;line-height:21px}@media(max-width:600px){.oh-wrap{margin-top:16px}.oh-form{grid-template-columns:1fr}.oh-form .wide,.oh-submit,.oh-msg{grid-column:auto}.oh-event{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="oh-top"><b>Watchdog</b> <span style="color:#7a7f86;font-size:12px">· Open House Check-In</span></header>
<main class="oh-wrap">
<section class="oh-card" id="oh-loading"><div class="oh-state">Loading open-house details…</div></section>
<section class="oh-card" id="oh-app" hidden>
<div class="oh-head"><div class="oh-kicker">WELCOME</div><h1 id="oh-title">Open House</h1><p id="oh-address">New Jersey</p></div>
<div class="oh-event"><div><b id="oh-when">Open house</b><span id="oh-place"></span></div><strong id="oh-status">Scheduled</strong></div>
<div class="oh-agent" id="oh-agent" hidden></div>
<form class="oh-form" id="oh-form" novalidate>
<label>Full name<input name="full_name" maxlength="120" autocomplete="name" required></label>
<label>Email<input name="email" maxlength="254" type="email" autocomplete="email"></label>
<label>Phone<input name="phone" maxlength="40" type="tel" autocomplete="tel"></label>
<label class="oh-hp" aria-hidden="true">Website<input name="website" tabindex="-1" autocomplete="off"></label>
<label class="wide oh-consent"><input name="contact_consent" type="checkbox" required><span>I agree that the hosting real estate professional may contact me about this property or my real estate needs. Watchdog does not infer ownership, seller intent or any other relationship from my check-in.</span></label>
<button class="oh-submit" type="submit">Check in</button><div class="oh-msg" id="oh-msg" role="status" aria-live="polite"></div>
</form>
</section>
</main>
<script>
(function(){
const code=(new URLSearchParams(location.search).get('code')||'').toLowerCase(),loading=document.getElementById('oh-loading'),app=document.getElementById('oh-app'),form=document.getElementById('oh-form'),msg=document.getElementById('oh-msg');
function fail(text){loading.innerHTML='<div class="oh-state"><b>Open house unavailable</b><p>'+text+'</p></div>'}
function fmt(v){if(!v)return'';const d=new Date(v);return Number.isFinite(d.getTime())?d.toLocaleString('en-US',{weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}):''}
fetch('/api/open-house?code='+encodeURIComponent(code),{headers:{Accept:'application/json'}}).then(async r=>({ok:r.ok,b:await r.json().catch(()=>({}))})).then(({ok,b})=>{if(!ok||!b.event)return fail(b.error||'This event is not available.');const e=b.event,a=b.agent||{};document.getElementById('oh-title').textContent=e.title||'Open House';document.getElementById('oh-address').textContent=e.address;document.getElementById('oh-when').textContent=fmt(e.event_at)||'Open house';document.getElementById('oh-place').textContent=[e.city||e.municipality,e.postal_code].filter(Boolean).join(' · ');document.getElementById('oh-status').textContent=(e.status||'scheduled').replace(/_/g,' ');if(a.brokerage_name){const n=document.getElementById('oh-agent');n.textContent='Hosted by '+a.brokerage_name;n.hidden=false}loading.hidden=true;app.hidden=false}).catch(()=>fail('Please check the link and try again.'));
form.addEventListener('submit',async ev=>{ev.preventDefault();msg.textContent='';const fd=new FormData(form),email=String(fd.get('email')||'').trim(),phone=String(fd.get('phone')||'').trim();if(!form.reportValidity()||(!email&&!phone)){msg.textContent='Please add an email address or phone number.';return}const btn=form.querySelector('button');btn.disabled=true;try{const r=await fetch('/api/open-house',{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify({code,full_name:fd.get('full_name'),email,phone,website:fd.get('website'),contact_consent:fd.get('contact_consent')==='on'})}),b=await r.json().catch(()=>({}));if(!r.ok)throw new Error(b.error||'Unable to check in.');app.innerHTML='<div class="oh-success"><i>✓</i><h2>You’re checked in.</h2><p>Your information was sent privately to the hosting real estate professional.</p></div>'}catch(e){msg.textContent=e.message||'Unable to check in right now.'}finally{btn.disabled=false}});
})();
</script>
</body></html>
