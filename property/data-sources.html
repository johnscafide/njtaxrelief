<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Watchdog Data Source Status</title><meta name="description" content="Live status and freshness of public data sources used by Watchdog.">
<style>
:root{font-family:Inter,system-ui,sans-serif;color:#14213d;background:#f6f8fb}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1180px;margin:auto;padding:28px 18px 60px}
header{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:22px}h1{margin:0;font-size:clamp(28px,4vw,46px);letter-spacing:-.04em}p{color:#617087}.stamp{font-size:13px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:20px 0}.card,.source{background:white;border:1px solid #e3e8ef;border-radius:16px;padding:16px}.n{font-size:28px;font-weight:800}.label{font-size:12px;color:#718096;text-transform:uppercase;letter-spacing:.08em}
.toolbar{display:flex;gap:10px;margin:16px 0}.toolbar input,.toolbar select{border:1px solid #d7dee8;border-radius:10px;padding:11px 12px;background:white;min-width:0}.toolbar input{flex:1}
.source{display:grid;grid-template-columns:minmax(240px,2fr) 1fr 130px 150px;gap:14px;align-items:center;margin:8px 0}.source b{display:block}.meta,.note{font-size:12px;color:#718096;margin-top:4px}.pill{display:inline-flex;padding:5px 9px;border-radius:999px;background:#eef2f7;font-size:12px;font-weight:700}.pill.passed{background:#e9f8ef;color:#167447}.pill.failed{background:#fff0f0;color:#b42318}.pill.configured{background:#fff7df;color:#8a5b00}a{color:#155eef;text-decoration:none}
@media(max-width:760px){.cards{grid-template-columns:1fr 1fr}.source{grid-template-columns:1fr}.toolbar{flex-wrap:wrap}.toolbar input,.toolbar select{width:100%}header{align-items:start;flex-direction:column}}
</style></head><body><main class="wrap"><header><div><div class="label">Watchdog transparency</div><h1>Data Source Status</h1><p>Every governed public-data source Watchdog monitors, when it was checked, and whether the local artifact is current.</p></div><div class="stamp" id="stamp">Loading…</div></header>
<section class="cards"><div class="card"><div class="n" id="total">–</div><div class="label">Sources</div></div><div class="card"><div class="n" id="healthy">–</div><div class="label">Healthy</div></div><div class="card"><div class="n" id="changed">–</div><div class="label">Changed</div></div><div class="card"><div class="n" id="failed">–</div><div class="label">Needs attention</div></div></section>
<div class="toolbar"><input id="q" placeholder="Search source, agency, dataset…" oninput="draw()"><select id="status" onchange="draw()"><option value="">All statuses</option><option>passed</option><option>configured</option><option>failed</option></select></div><section id="list"></section></main>
<script>
let data={datasets:[]}; const e=id=>document.getElementById(id); const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function draw(){const q=e('q').value.toLowerCase(),st=e('status').value;const rows=data.datasets.filter(x=>(!st||x.status===st)&&(!q||JSON.stringify(x).toLowerCase().includes(q)));e('list').innerHTML=rows.map(x=>'<article class="source"><div><b>'+esc(x.label)+'</b><div class="meta">'+esc(x.agency)+' · '+esc(x.cadence)+'</div>'+(x.note?'<div class="note">'+esc(x.note)+'</div>':'')+'</div><div><span class="pill '+esc(x.status)+'">'+esc(x.status)+'</span>'+(x.changed?' <span class="pill">updated</span>':'')+'</div><div class="meta">'+esc(x.records_or_files==null?'monitor':x.records_or_files+' records/files')+'</div><div><a href="'+esc(x.source_url||'#')+'" target="_blank" rel="noopener">Official source ↗</a></div></article>').join('')||'<div class="card">No matching sources.</div>'}
fetch('/property/data/data-freshness.json?ts='+Date.now()).then(r=>r.json()).then(j=>{data=j;e('stamp').textContent='Last checked '+new Date(j.generated_at).toLocaleString();e('total').textContent=j.datasets.length;e('healthy').textContent=j.datasets.filter(x=>x.status==='passed'||x.status==='configured').length;e('changed').textContent=j.datasets.filter(x=>x.changed).length;e('failed').textContent=j.datasets.filter(x=>x.status==='failed').length;draw()}).catch(()=>e('stamp').textContent='Status report unavailable');
</script></body></html>
