<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">New Jersey property tax relief benefit cap</title><desc id="d">ANCHOR, Senior Freeze and Stay NJ benefits feeding into a New Jersey property tax bill with a cap at taxes paid.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#081d35"/><stop offset="1" stop-color="#0b5670"/></linearGradient><linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#153c5b"/><stop offset="1" stop-color="#0b2943"/></linearGradient></defs><rect width="1600" height="900" fill="url(#bg)"/><circle cx="800" cy="430" r="300" fill="none" stroke="#70d8e8" stroke-opacity=".12" stroke-width="2"/><g font-family="Arial,Helvetica,sans-serif"><text x="800" y="95" text-anchor="middle" fill="#fff" font-size="48" font-weight="700">YOUR RELIEF CAN'T EXCEED YOUR PROPERTY TAXES PAID</text><text x="800" y="145" text-anchor="middle" fill="#b8dde6" font-size="27">New Jersey combines multiple benefits, then applies one final cap</text></g><g stroke="#70d8e8" stroke-width="5" opacity=".7" fill="none"><path d="M345 340C470 340 520 420 650 430"/><path d="M345 570C470 570 520 500 650 460"/><path d="M1255 455C1110 455 1050 450 950 450"/></g><g fill="url(#card)" stroke="#7bd6e6" stroke-opacity=".55"><rect x="120" y="255" width="330" height="170" rx="24"/><rect x="120" y="485" width="330" height="170" rx="24"/><rect x="1150" y="355" width="330" height="200" rx="24"/></g><g fill="#fff" font-family="Arial,Helvetica,sans-serif"><text x="165" y="310" font-size="28" font-weight="700">ANCHOR</text><text x="165" y="365" font-size="39" font-weight="700">$1,500</text><text x="165" y="400" font-size="20" fill="#b8dde6">example homeowner benefit</text><text x="165" y="540" font-size="28" font-weight="700">SENIOR FREEZE</text><text x="165" y="595" font-size="39" font-weight="700">$2,400</text><text x="165" y="630" font-size="20" fill="#b8dde6">example reimbursement</text><text x="1195" y="415" font-size="28" font-weight="700">STAY NJ</text><text x="1195" y="470" font-size="39" font-weight="700">Calculated last</text><text x="1195" y="510" font-size="20" fill="#b8dde6">after other relief is counted</text></g><g transform="translate(590 270)"><rect x="0" y="0" width="420" height="360" rx="28" fill="#f7fbfd"/><rect x="28" y="28" width="364" height="70" rx="14" fill="#0d3152"/><text x="210" y="74" text-anchor="middle" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="700">2025 PROPERTY TAX BILL</text><text x="54" y="165" fill="#12314d" font-family="Arial,Helvetica,sans-serif" font-size="28">Taxes paid</text><text x="365" y="165" text-anchor="end" fill="#12314d" font-family="Arial,Helvetica,sans-serif" font-size="38" font-weight="700">$8,000</text><line x1="54" y1="195" x2="365" y2="195" stroke="#c9dbe4" stroke-width="3"/><text x="54" y="245" fill="#12314d" font-family="Arial,Helvetica,sans-serif" font-size="27">Total relief</text><text x="365" y="245" text-anchor="end" fill="#078486" font-family="Arial,Helvetica,sans-serif" font-size="38" font-weight="700">≤ $8,000</text><rect x="54" y="285" width="311" height="46" rx="23" fill="#e7f4f5"/><rect x="54" y="285" width="285" height="46" rx="23" fill="#078486"/><text x="210" y="318" text-anchor="middle" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700">CAP = TAXES PAID</text></g><text x="800" y="805" text-anchor="middle" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="39" font-weight="700">THE HEADLINE MAXIMUM IS NOT ALWAYS YOUR FINAL PAYMENT</text><text x="800" y="850" text-anchor="middle" fill="#b8dde6" font-family="Arial,Helvetica,sans-serif" font-size="24">Watchdog Property Intelligence</text></svg>