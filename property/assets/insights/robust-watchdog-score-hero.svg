<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">The Watchdog Score powered by the ROBUST Framework</title>
  <desc id="desc">Watchdog editorial graphic showing the six ROBUST dimensions: Recourse, Overassessment Position, Burden, Uniformity, Stability and Trajectory.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081a36"/>
      <stop offset="0.58" stop-color="#102b54"/>
      <stop offset="1" stop-color="#163f72"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e1c46f"/>
      <stop offset="1" stop-color="#b8972a"/>
    </linearGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <circle cx="1450" cy="85" r="320" fill="#ffffff" opacity="0.035"/>
  <circle cx="75" cy="845" r="285" fill="#b8972a" opacity="0.06"/>

  <g transform="translate(115 102)">
    <g aria-label="Watchdog">
      <circle cx="38" cy="38" r="38" fill="url(#gold)"/>
      <path d="M21 35c5-14 29-14 34 0 3 8-1 17-7 22-6 5-14 5-20 0-6-5-10-14-7-22Zm8-9-8-10c-4-5-10 2-7 7l8 12m25-9 8-10c4-5 10 2 7 7l-8 12M31 43h14M35 51h6" fill="none" stroke="#0e2248" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="98" y="32" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800">WATCHDOG</text>
      <text x="99" y="59" fill="#b9c7dc" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="4">PROPERTY INTELLIGENCE</text>
    </g>

    <text x="0" y="175" fill="#e5c968" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="800" letter-spacing="3">INSIDE THE WATCHDOG SCORE</text>
    <text x="0" y="245" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-size="62" font-weight="700">A score should show its work.</text>
    <text x="0" y="301" fill="#c9d5e7" font-family="Arial, Helvetica, sans-serif" font-size="28">The Watchdog Score is the result. ROBUST explains why.</text>

    <g transform="translate(0 380)" filter="url(#shadow)">
      <rect width="1370" height="310" rx="28" fill="#ffffff" fill-opacity="0.97"/>
      <g font-family="Arial, Helvetica, sans-serif">
        <text x="48" y="55" fill="#0e2248" font-size="17" font-weight="800" letter-spacing="2">THE ROBUST FRAMEWORK</text>
        <text x="1320" y="55" text-anchor="end" fill="#607086" font-size="16" font-weight="700">ROBUST-v1</text>

        <g transform="translate(42 92)">
          <g transform="translate(0 0)">
            <rect width="196" height="166" rx="18" fill="#f3f6fa"/>
            <circle cx="38" cy="42" r="25" fill="#0e2248"/><text x="38" y="50" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="800">R</text>
            <text x="20" y="91" fill="#0e2248" font-size="19" font-weight="800">Recourse</text>
            <text x="20" y="121" fill="#607086" font-size="14">Review and appeal</text><text x="20" y="143" fill="#607086" font-size="14">context</text>
          </g>
          <g transform="translate(218 0)">
            <rect width="196" height="166" rx="18" fill="#f3f6fa"/>
            <circle cx="38" cy="42" r="25" fill="#0e2248"/><text x="38" y="50" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="800">O</text>
            <text x="20" y="91" fill="#0e2248" font-size="18" font-weight="800">Overassessment</text>
            <text x="20" y="115" fill="#0e2248" font-size="18" font-weight="800">Position</text>
            <text x="20" y="143" fill="#607086" font-size="14">Assessment vs. evidence</text>
          </g>
          <g transform="translate(436 0)">
            <rect width="196" height="166" rx="18" fill="#f3f6fa"/>
            <circle cx="38" cy="42" r="25" fill="#0e2248"/><text x="38" y="50" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="800">B</text>
            <text x="20" y="91" fill="#0e2248" font-size="19" font-weight="800">Burden</text>
            <text x="20" y="121" fill="#607086" font-size="14">Taxes relative to</text><text x="20" y="143" fill="#607086" font-size="14">supported value</text>
          </g>
          <g transform="translate(654 0)">
            <rect width="196" height="166" rx="18" fill="#f3f6fa"/>
            <circle cx="38" cy="42" r="25" fill="#0e2248"/><text x="38" y="50" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="800">U</text>
            <text x="20" y="91" fill="#0e2248" font-size="19" font-weight="800">Uniformity</text>
            <text x="20" y="121" fill="#607086" font-size="14">Consistency across</text><text x="20" y="143" fill="#607086" font-size="14">the assessment roll</text>
          </g>
          <g transform="translate(872 0)">
            <rect width="196" height="166" rx="18" fill="#f3f6fa"/>
            <circle cx="38" cy="42" r="25" fill="#0e2248"/><text x="38" y="50" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="800">S</text>
            <text x="20" y="91" fill="#0e2248" font-size="19" font-weight="800">Stability</text>
            <text x="20" y="121" fill="#607086" font-size="14">Reset and revaluation</text><text x="20" y="143" fill="#607086" font-size="14">pressure</text>
          </g>
          <g transform="translate(1090 0)">
            <rect width="196" height="166" rx="18" fill="#f3f6fa"/>
            <circle cx="38" cy="42" r="25" fill="#0e2248"/><text x="38" y="50" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="800">T</text>
            <text x="20" y="91" fill="#0e2248" font-size="19" font-weight="800">Trajectory</text>
            <text x="20" y="121" fill="#607086" font-size="14">Direction against</text><text x="20" y="143" fill="#607086" font-size="14">verified market evidence</text>
          </g>
        </g>
      </g>
    </g>
  </g>

  <text x="1485" y="840" text-anchor="end" fill="#b9c7dc" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">One score. Six dimensions. ROBUST.</text>
</svg>