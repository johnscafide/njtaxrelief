<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#10294b">
  <title>Set up Watchdog | Property Intelligence</title>
  <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="/property/css/onboarding.css">
</head>
<body>
  <div class="wd-onboarding-shell">
    <main class="wd-onboarding-main">
      <section class="wd-onboarding-card" aria-live="polite" aria-busy="true">
        <div class="wd-onboarding-progress" aria-hidden="true"><span id="wd-onboarding-progress"></span></div>
        <div id="wd-onboarding-root" class="wd-onboarding-loading">
          <div><div class="wd-onboarding-spinner"></div><b>Preparing your Watchdog…</b></div>
        </div>
        <header class="wd-onboarding-brand" aria-label="Watchdog">
          <a href="/property/" class="wd-onboarding-brand-link" aria-label="Back to Watchdog property search">
            <span class="wd-onboarding-mark" aria-hidden="true"><i class="fas fa-dog"></i></span>
            <span class="wd-onboarding-wordmark">Watchdog</span>
          </a>
        </header>
      </section>
    </main>

    <footer class="wd-onboarding-footer" id="wd-onboarding-footer">Your answers are saved to your Watchdog profile and kept separate from governed property-source facts.</footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="/property/js/supabase-runtime.js"></script>
  <script src="/property/js/onboarding.js"></script>
</body>
</html>
