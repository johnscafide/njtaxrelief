<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#f6f8fc">
  <title>Set up Watchdog | Property Intelligence</title>
  <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/property/css/onboarding.css">
</head>
<body>
  <div class="wd-onboarding-shell">
    <header class="wd-onboarding-brand" aria-label="Watchdog">
      <span class="wd-onboarding-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none"><path d="M5.5 10.2V8.6c0-3.5 2.4-5.9 6.5-5.9s6.5 2.4 6.5 5.9v1.6M4.4 9.9h15.2v8.2c0 1.8-1.5 3.2-3.2 3.2H7.6a3.2 3.2 0 0 1-3.2-3.2V9.9Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M8.4 14.2h.1m7 0h.1M9.4 17.4c1.6 1 3.6 1 5.2 0" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </span>
      Watchdog
    </header>

    <main class="wd-onboarding-main">
      <section class="wd-onboarding-card" aria-live="polite" aria-busy="true">
        <div class="wd-onboarding-progress" aria-hidden="true"><span id="wd-onboarding-progress"></span></div>
        <div id="wd-onboarding-root" class="wd-onboarding-loading">
          <div><div class="wd-onboarding-spinner"></div><b>Preparing your Watchdog…</b></div>
        </div>
      </section>
    </main>

    <footer class="wd-onboarding-footer">Your answers stay attached to your Watchdog account and are not property-source facts.</footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="/property/js/supabase-runtime.js"></script>
  <script src="/property/js/onboarding.js"></script>
</body>
</html>
