<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Watchdog Intelligence Review</title><style>:root{--bg:#f4f7f9;--card:#fff;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--nav:#0b1c31;--teal:#0d7c80;--soft:#eaf7f5;--green:#16794b}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--ink)}.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.side{background:var(--nav);color:#fff;padding:20px 14px;position:sticky;top:0;height:100vh}.brand{font-size:20px;font-weight:800;margin-bottom:22px}.brand small{display:block;color:#9fb0c4;font-size:11px;margin-top:3px}.nav button{width:100%;border:0;background:transparent;color:#acbbca;padding:11px 12px;border-radius:10px;text-align:left;font-weight:700;margin-bottom:5px;cursor:pointer}.nav button.active,.nav button:hover{background:#17304d;color:#fff}.top{height:86px;background:#fff;border-bottom:1px solid var(--line);padding:16px 26px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}.top h1{margin:4px 0 0;font-size:23px}.eyebrow{font-size:10px;font-weight:800;letter-spacing:.12em;color:#77869a}.badge{background:#eef2f6;border-radius:999px;padding:8px 11px;font-size:12px;font-weight:800}.content{padding:22px 26px 50px}.notice{padding:13px 15px;border:1px solid #cfe9e4;background:#edf9f7;border-radius:14px;color:#475569;margin-bottom:16px;line-height:1.45}.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px}.metric span{display:block;color:var(--muted);font-size:12px;font-weight:700}.metric b{display:block;font-size:26px;margin-top:7px}.metric em{display:block;font-style:normal;color:var(--green);font-size:12px;font-weight:700;margin-top:5px}.section{margin:22px 0 10px}.section h2{margin:0;font-size:18px}.section p{margin:4px 0 0;color:var(--muted)}.queue{display:grid;grid-template-columns:50px 1fr auto;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:15px;padding:13px;margin-bottom:10px}.score{width:48px;height:48px;border-radius:13px;background:#ecfdf5;color:#166534;display:grid;place-items:center;font-size:16px;font-weight:800}.score.mid{background:#fff7ed;color:#9a3412}.queue h3{margin:0;font-size:14px}.queue p{margin:4px 0 0;color:var(--muted);font-size:12px}.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.tags span{font-size:11px;background:#f3f6f8;padding:4px 7px;border-radius:999px;color:#526172}.btn{border:0;border-radius:10px;padding:9px 11px;font-weight:800;cursor:pointer}.primary{background:#0f172a;color:#fff}.outline{background:#fff;border:1px solid #d7e0e8}.teal{background:var(--soft);color:#0b6f72}.phase{display:grid;grid-template-columns:160px 1fr 45px;gap:9px;align-items:center;margin:9px 0}.track{height:8px;background:#edf1f5;border-radius:999px;overflow:hidden}.track span{display:block;height:100%;background:#339c96}.phase strong,.phase i{font-size:12px}.phase i{text-align:right;font-style:normal;font-weight:800}.chat{display:grid;grid-template-columns:1fr 260px;gap:14px}.msgs{min-height:380px;display:grid;gap:10px;align-content:start}.msg{max-width:86%;padding:12px 14px;border-radius:14px;border:1px solid var(--line);line-height:1.45}.user{justify-self:end;background:#102a4c;color:#fff;border-color:#102a4c}.bot{background:#fff}.compose{display:flex;gap:8px;margin-top:10px}.compose textarea{flex:1;min-height:68px;padding:10px;border:1px solid #cbd5e1;border-radius:11px}.chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}.chip{border:1px solid #dbe3ec;background:#fff;border-radius:999px;padding:7px 9px;font-size:12px;font-weight:700;cursor:pointer}.event{display:grid;grid-template-columns:1fr auto;gap:12px;padding:13px 0;border-bottom:1px solid #edf1f5}.event:last-child{border:0}.event h3{margin:0;font-size:13px}.event p{margin:3px 0 0;color:var(--muted);font-size:12px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field label{font-size:12px;font-weight:800;color:#526172}.field input{width:100%;margin-top:4px;padding:9px;border:1px solid #cbd5e1;border-radius:9px}.values{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.values article{background:#f7fafb;border:1px solid var(--line);border-radius:12px;padding:12px}.values b{display:block;font-size:23px}.values span{font-size:11px;color:var(--muted)}.drawerbg{position:fixed;inset:0;background:rgba(15,23,42,.42);z-index:20}.drawer{position:fixed;right:0;top:0;width:min(620px,100vw);height:100vh;background:#f8fafc;z-index:21;overflow:auto;box-shadow:-20px 0 50px rgba(15,23,42,.2)}.hidden{display:none}.dh{padding:20px;background:#fff;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.dh h2{margin:5px 0}.db{padding:18px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stats article,.ev{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}.stats b{display:block;font-size:20px}.stats span{font-size:11px;color:var(--muted)}.ev{margin-top:9px}.ev h3{margin:0 0 5px;font-size:13px}.ev p{margin:0;color:#526172;line-height:1.45}.lineage{font-size:11px;color:#748196;margin-top:7px}.close{border:0;background:#eef2f6;width:36px;height:36px;border-radius:10px;cursor:pointer}@media(max-width:900px){.g4,.g3{grid-template-columns:1fr 1fr}.chat{grid-template-columns:1fr}.app{grid-template-columns:78px 1fr}.side{padding:18px 8px}.brand small,.nav button span{display:none}.brand{text-align:center;font-size:14px}.nav button{text-align:center}}@media(max-width:650px){.app{display:block}.side{display:none}.content{padding:15px}.top{padding:12px 15px;height:76px}.top h1{font-size:19px}.g4,.g3,.g2,.fields,.values{grid-template-columns:1fr}.queue{grid-template-columns:48px 1fr}.queue>div:last-child{grid-column:2}.phase{grid-template-columns:1fr}.stats{grid-template-columns:1fr}}</style></head><body><div class="app"><aside class="side"><div class="brand">Watchdog<small>Intelligence Review</small></div><div class="nav"><button class="active" data-v="overview"><span>Overview</span></button><button data-v="workbench"><span>Data Workbench</span></button><button data-v="analyst"><span>Ask Watchdog</span></button><button data-v="daily"><span>Daily Intelligence</span></button><button data-v="value"><span>Opportunity Value</span></button><button data-v="team"><span>Teams</span></button><button data-v="ops"><span>Operations</span></button><button data-v="calibration"><span>Calibration</span></button></div></aside><main><div class="top"><div><div class="eyebrow">WATCHDOG INTELLIGENCE</div><h1 id="title">Intelligence Overview</h1></div><div class="badge">Preview review</div></div><div class="content" id="content"></div></main></div><div class="drawerbg hidden" id="bg"></div><aside class="drawer hidden" id="drawer"></aside><script>const F=[{id:'1',a:'104 Valley Road, Mullica Township',pin:'0117_10102_5',s:81.14,c:79,e:70,county:'Atlantic',why:'Assessment-to-sale relationship is outside the center of its recent-sale peer context.',missing:['Tax peer cohort has fewer than 12 comparable records in this sample.'],signals:[['assessment_to_sale_ratio','0.716','Normalized 81/100'],['source_authority_coverage','83','Confidence 83/100'],['sale_recency','100','Confidence 100/100']]},{id:'2',a:'22 Oak Lane, Washington Township',pin:'1508_00001_1',s:77.6,c:91,e:100,county:'Gloucester',why:'Assessment relationship and tax-rate cohort both rank above the review threshold.',missing:[],signals:[['assessment_to_sale_ratio','0.749','Normalized 72/100'],['tax_to_assessment_rate','3.81%','Percentile 86/100']]},{id:'3',a:'9 Bayberry Court, Ocean County',pin:'1515_00003_2',s:64.33,c:72,e:75,county:'Ocean',why:'Recent public-record change is material and recent, but property-story confidence is missing.',missing:['Property Story Confidence is not available.'],signals:[['event.materiality','high','85/100'],['event.recency','12 days','80/100'],['recent_change_density','2','33/100']]},{id:'4',a:'315 Cooper Street, Camden County',pin:'0408_00210_4',s:52.8,c:68,e:70,county:'Camden',why:'Assessment signal is moderate with a valid recent sale; tax cohort is below the primary alert band.',missing:['Municipality peer cohort is below minimum sample size.'],signals:[['assessment_to_sale_ratio','0.912','Normalized 25/100'],['source_authority_coverage','92','Confidence 92/100']]}],$=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],money=n=>Number(n).toLocaleString('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}),notice=()=>'<div class="notice"><b>Official preview review surface.</b> Representative data comes from staging acceptance evidence. No production writes are made and preview models remain explicitly uncalibrated.</div>',q=f=>`<div class="queue"><div class="score ${f.s<60?'mid':''}">${Math.round(f.s)}</div><div><h3>${f.a}</h3><p>${f.why}</p><div class="tags"><span>${f.county} County</span><span>${f.c}% confidence</span><span>${f.e}% evidence</span></div></div><div><button class="btn teal" onclick="drawer('${f.id}')">Why flagged?</button></div></div>`,phase=(n,p)=>`<div class="phase"><strong>${n}</strong><div class="track"><span style="width:${p}%"></span></div><i>${p}%</i></div>`;const V={overview:()=>notice()+`<div class="grid g4"><div class="card metric"><span>Models</span><b>3</b><em>deterministic runners</em></div><div class="card metric"><span>Calibration queue</span><b>26</b><em>0 human-reviewed</em></div><div class="card metric"><span>Scale acceptance</span><b>520</b><em>resumable run</em></div><div class="card metric"><span>Daily dispatch</span><b>5m</b><em>server-side Cron</em></div></div><div class="grid g2" style="margin-top:14px"><div class="card"><h2>Platform phases</h2>${phase('Foundation',100)}${phase('Deterministic Engine',99)}${phase('Workbench UX',100)}${phase('Watchdog Analyst',100)}${phase('Value + Learning',100)}${phase('Pro+ Scale',100)}</div><div class="card"><h2>Architecture</h2><p><b>Data → governed signals → opportunity models → AI reasoning → action → outcome.</b></p><p>AI never authors source facts or hidden scoring math. Missing evidence stays missing.</p><p>Actions preserve finding lineage into Case, Report, Watchlist and Marketing Studio workflows.</p></div></div><div class="section"><h2>Priority Queue</h2></div>${F.slice(0,3).map(q).join('')}`,workbench:()=>notice()+`<div class="card"><h2>Data Workbench Intelligence</h2><p>Assessment Anomaly (Pro), Closing Review (Pro+), Change Intelligence (Pro+).</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn teal">Assessment Anomaly · v4</button><button class="btn outline">Closing Review · v2</button><button class="btn outline">Change Intelligence · v3</button><button class="btn outline">Current Rows ▾</button><button class="btn primary">Analyze</button></div></div><div class="section"><h2>Priority Queue</h2><p>Score, confidence, evidence, geography, recency and action state.</p></div>${F.map(q).join('')}`,analyst:()=>notice()+`<div class="chat"><div class="card"><div class="chips"><button class="chip" onclick="ask('Which properties deserve assessment review?')">Assessment review</button><button class="chip" onclick="ask('Compare the top three findings.')">Compare top three</button><button class="chip" onclick="ask('Show source lineage for Valley Road.')">Source lineage</button><button class="chip" onclick="ask('What changed recently?')">Recent changes</button></div><div class="msgs" id="msgs"><div class="msg bot"><b>Watchdog Analyst</b><br>I interpret approved Watchdog findings and workflows. I do not invent property facts, run unrestricted SQL, infer seller intent or guarantee outcomes.</div></div><div class="compose"><textarea id="askbox" placeholder="Ask about governed findings…"></textarea><button class="btn primary" onclick="ask($('#askbox').value)">Ask Watchdog</button></div></div><div class="card"><h2>Approved tools</h2><p>Run model<br>Inspect evidence and lineage<br>Compare findings<br>Score history<br>Property changes<br>Create Case / Report<br>Watch property<br>Prepare campaign</p><h2>Fail-soft</h2><p>If the LLM provider is unavailable, deterministic Watchdog results remain available.</p></div></div>`,daily:()=>notice()+`<div class="grid g4"><div class="card metric"><span>New priorities</span><b>4</b><em>since prior run</em></div><div class="card metric"><span>Strengthened</span><b>3</b><em>material change</em></div><div class="card metric"><span>Weakened</span><b>2</b><em>review needed</em></div><div class="card metric"><span>Removed</span><b>1</b><em>conditions changed</em></div></div><div class="grid g2" style="margin-top:14px"><div class="card"><h2>Today’s review queue</h2><div class="event"><div><h3>104 Valley Road strengthened</h3><p>New governed facts hash created a new immutable run.</p></div><b>+18.74</b></div><div class="event"><div><h3>9 Bayberry Court changed</h3><p>High-materiality event inside 30 days.</p></div><b>New</b></div></div><div class="card"><h2>Scheduled scopes</h2><p><b>South Jersey Farm</b><br>Daily Assessment · Pro+</p><p><b>Camden Saved View</b><br>Daily Change Intelligence · Pro+</p><p>Supabase Cron dispatches without browser participation.</p></div></div>`,value:()=>notice()+`<div class="grid g2"><div class="card"><h2>Opportunity Value</h2><p>User-controlled scenario math. It never changes Watchdog facts or scores.</p><div class="fields"><div class="field"><label>Transaction value<input id="tx" value="425000" type="number" oninput="calc()"></label></div><div class="field"><label>Fee / value rate %<input id="rate" value="2.5" type="number" oninput="calc()"></label></div><div class="field"><label>User probability %<input id="prob" value="35" type="number" oninput="calc()"></label></div><div class="field"><label>Cost assumption<input id="cost" value="350" type="number" oninput="calc()"></label></div></div><div class="values"><article><b id="raw">$10,275</b><span>Raw scenario value</span></article><article><b id="expected">$3,596</b><span>Probability-adjusted scenario</span></article></div></div><div class="card"><h2>Personalized attention</h2><p><b>Learning · 5 of 8 distinct examples</b></p><p>Profession-specific defaults remain transparent until enough first-party outcomes exist. Learned multipliers can reorder attention only; historical scores never change.</p><button class="btn outline">Reset learning</button></div></div>`,team:()=>notice()+`<div class="grid g3"><div class="card metric"><span>Shared findings</span><b>8</b><em>organization run</em></div><div class="card metric"><span>Member read</span><b>8</b><em>explicit member</em></div><div class="card metric"><span>Outsider read</span><b>0</b><em>RLS isolation</em></div></div><div class="grid g2" style="margin-top:14px"><div class="card"><h2>Organization workspace</h2><p>Owner · Member · Viewer roles.</p><p>Organization ID is carried into runs, findings and digests.</p></div><div class="card"><h2>Shared actions</h2><p>Case, Report and Watch actions preserve the acting user plus finding lineage.</p><p>Outsiders read zero organization rows without explicit membership.</p></div></div>`,ops:()=>notice()+`<div class="grid g4"><div class="card metric"><span>Queue</span><b>Healthy</b><em>0 stale jobs</em></div><div class="card metric"><span>Scale run</span><b>520</b><em>3 batches</em></div><div class="card metric"><span>Teams cap</span><b>500</b><em>server-enforced</em></div><div class="card metric"><span>Cron</span><b>Green</b><em>Vault-backed</em></div></div><div class="grid g2" style="margin-top:14px"><div class="card"><h2>Population acceptance</h2><p>520 candidates processed as 200 → 400 → 520 under one immutable run with zero retries.</p><p>Unchanged rerun hit cache. Changed fact created a new facts fingerprint and new run.</p></div><div class="card"><h2>Hardening</h2><p>2092 future-sale evidence was quarantined and recomputed from remaining valid evidence.</p><p>Successful terminal states clear stale retry errors.</p><p>Provider outage does not stop deterministic Intelligence.</p></div></div>`,calibration:()=>notice()+`<div class="grid g3"><div class="card"><h2>Assessment v4</h2><p>Preview · Uncalibrated</p><h3>0 / 25 reviewed</h3><p>26 governed cases available.</p></div><div class="card"><h2>Closing v2</h2><p>Preview · Uncalibrated</p><h3>0 / 25 reviewed</h3><p>3 governed provider cases available.</p></div><div class="card"><h2>Change v3</h2><p>Preview · Uncalibrated</p><h3>0 / 25 reviewed</h3><p>Review queue ready.</p></div></div><div class="card" style="margin-top:14px"><h2>Promotion gates</h2><p>Minimum 25 human-reviewed cases · precision ≥70% · recall ≥60% · false-positive rate ≤30%.</p><p>Calibration never auto-promotes a model.</p></div>`};const T={overview:'Intelligence Overview',workbench:'Data Workbench Intelligence',analyst:'Ask Watchdog',daily:'Daily Intelligence',value:'Opportunity Value + Learning',team:'Teams Intelligence',ops:'Intelligence Operations',calibration:'Model Calibration'};function show(v){$$('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.v===v));$('#title').textContent=T[v];$('#content').innerHTML=V[v]();window.scrollTo(0,0)}$$('.nav button').forEach(b=>b.onclick=()=>show(b.dataset.v));function drawer(id){const f=F.find(x=>x.id===id);$('#bg').classList.remove('hidden');$('#drawer').classList.remove('hidden');$('#drawer').innerHTML=`<div class="dh"><div><div class="eyebrow">WHY WATCHDOG FLAGGED THIS</div><h2>${f.a}</h2><div style="color:#64748b">${f.pin} · ${f.county} County</div></div><button class="close" onclick="closed()">✕</button></div><div class="db"><div class="stats"><article><b>${f.s}</b><span>Review score</span></article><article><b>${f.c}%</b><span>Confidence</span></article><article><b>${f.e}%</b><span>Evidence coverage</span></article></div><div class="notice" style="margin-top:12px"><b>Why now:</b> ${f.why}</div><h3>Evidence</h3>${f.signals.map(s=>`<div class="ev"><h3>${s[0]}</h3><p>Source value: <b>${s[1]}</b> · ${s[2]}</p><div class="lineage">Versioned feature normalization · governed source/derived marker</div></div>`).join('')}${f.missing.length?'<h3>Missing evidence</h3>'+f.missing.map(x=>`<div class="ev"><p>${x}</p></div>`).join(''):''}<h3>Lineage</h3><div class="ev"><p><b>Model:</b> Assessment Anomaly v4 · Preview / Uncalibrated</p><p><b>Derived engine:</b> missing-safe v4</p><p><b>Facts hash:</b> governed SHA-256 manifest</p><div class="lineage">Review priority only. Not a valuation, legal conclusion, seller prediction or guaranteed outcome.</div></div><div style="display:flex;gap:7px;flex-wrap:wrap"><button class="btn primary">Create Case</button><button class="btn outline">Watch Property</button><button class="btn outline">Create Report</button><button class="btn outline">Marketing Studio</button></div></div>`}function closed(){$('#bg').classList.add('hidden');$('#drawer').classList.add('hidden')}$('#bg').onclick=closed;function ask(text){if(!text.trim())return;$('#msgs').insertAdjacentHTML('beforeend',`<div class="msg user">${text}</div>`);let r=/compare/i.test(text)?'Valley Road ranks highest by deterministic score, while Oak Lane has stronger evidence completeness.':/source|lineage/i.test(text)?'Valley Road is traceable to Assessment Anomaly v4. Assessment-to-sale ratio is 0.716, source-authority coverage is 83%, and tax cohort evidence is explicitly missing.':/change/i.test(text)?'Bayberry Court has the strongest recent-change example: high materiality, 12 days old, two governed changes in 30 days.':'I would start with Valley Road and Oak Lane. Both are evidence-backed review priorities; neither is a valuation or prediction.';$('#msgs').insertAdjacentHTML('beforeend',`<div class="msg bot"><b>Watchdog Analyst</b><br>${r}<div class="lineage">Deterministic review response · approved evidence only</div></div>`);$('#askbox').value=''}function calc(){const tx=+$('#tx').value||0,rate=+$('#rate').value||0,prob=+$('#prob').value||0,cost=+$('#cost').value||0,raw=Math.max(0,tx*rate/100-cost),exp=raw*prob/100;$('#raw').textContent=money(raw);$('#expected').textContent=money(exp)}show('overview');</script></body></html>
