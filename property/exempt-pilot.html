<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Municipal Exempt & PILOT Context | Watchdog</title><meta name="description" content="Review municipal exempt-property and PILOT context from New Jersey public sources."><link rel="canonical" href="https://njpropertytaxrelief.com/property/exempt-pilot.html"><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/property/css/shared.css"><style>body{font-family:"Source Sans 3",Arial,sans-serif;background:#f5f8fa;color:#10294b;margin:0}.ep-shell{max-width:1180px;margin:0 auto;padding:42px 24px 80px}.ep-head{display:flex;justify-content:space-between;gap:24px;align-items:end;border-bottom:1px solid #dce5ec;padding-bottom:24px}.ep-kicker{font-size:12px;letter-spacing:.14em;font-weight:800;color:#0b8f8f}.ep-head h1{font:800 clamp(34px,5vw,58px)/1.04 "Plus Jakarta Sans",Arial,sans-serif;margin:7px 0 10px}.ep-head p{margin:0;color:#6b7d92;max-width:760px;font-size:18px}.ep-back{display:inline-flex;align-items:center;gap:8px;text-decoration:none;border:1px solid #d6e0e7;border-radius:10px;padding:10px 13px;color:#10294b;background:#fff;font-weight:800}.ep-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:22px 0}.ep-card{background:#fff;border:1px solid #dce5ec;border-radius:16px;padding:18px}.ep-card b{display:block;font:800 28px "Plus Jakarta Sans",Arial,sans-serif}.ep-card span{color:#6d7d90;font-size:13px}.ep-note,.ep-source{background:#fff;border:1px solid #dce5ec;border-radius:16px;padding:20px;margin-top:16px}.ep-note h2,.ep-source h2{font:800 20px "Plus Jakarta Sans",Arial,sans-serif;margin:0 0 8px}.ep-note p,.ep-source p{color:#64768b;line-height:1.65}.ep-bars{display:grid;gap:12px}.ep-bar{display:grid;grid-template-columns:220px 1fr 90px;gap:10px;align-items:center}.ep-bar i{height:8px;background:#e8eef2;border-radius:999px;overflow:hidden}.ep-bar i span{display:block;height:100%;background:#0a8f8e}.ep-error{padding:50px;text-align:center;background:#fff;border:1px solid #e2e8ed;border-radius:18px;margin-top:24px}.ep-error h2{font-family:"Plus Jakarta Sans"}@media(max-width:800px){.ep-head{display:block}.ep-grid{grid-template-columns:1fr 1fr}.ep-bar{grid-template-columns:1fr}.ep-bar i{order:3}.ep-back{margin-top:16px}}</style></head><body><main class="ep-shell"><header class="ep-head"><div><span class="ep-kicker">NEW JERSEY MUNICIPAL CONTEXT</span><h1 id="ep-title">Exempt & PILOT context</h1><p id="ep-sub">Loading municipal public-record context…</p></div><a class="ep-back" href="/property/">Property lookup</a></header><div id="ep-content"></div></main><script>(async()=>{const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=v=>'$'+Math.round(Number(v)||0).toLocaleString(),pct=v=>(Number(v||0)*100).toFixed(1)+'%';const district=new URLSearchParams(location.search).get('district');const host=document.getElementById('ep-content');try{if(!district)throw new Error('Choose this page from a town report so Watchdog knows which municipality to show.');const r=await fetch('/property/data/exempt-pilot.json?v=20260811');if(!r.ok)throw new Error('Municipal context data is temporarily unavailable.');const d=await r.json(),m=d.municipalities&&d.municipalities[district];if(!m)throw new Error('No municipal exempt/PILOT context is available for this district yet.');document.getElementById('ep-title').textContent=m.name;document.getElementById('ep-sub').textContent=m.county+' County · '+(m.community_type||'Municipality')+' · '+d.source_year+' tax-base context';const rows=[['Exempt share',pct(m.exempt_share),m.exempt_percentile],['PILOT value share',pct(m.pilot_value_share),m.pilot_percentile],['PILOT agreements',Number(m.pilot_count||0).toLocaleString(),null],['Municipal subsidy',money(m.municipal_subsidy),m.subsidy_percentile]];host.innerHTML='<section class="ep-grid">'+rows.map(x=>'<article class="ep-card"><b>'+esc(x[1])+'</b><span>'+esc(x[0])+(x[2]!=null?' · '+esc(x[2])+'th percentile statewide':'')+'</span></article>').join('')+'</section><section class="ep-note"><h2>How to read this</h2><p>Exempt property and PILOT activity can change how much of a municipality\'s tax base is carried by conventionally taxable property. These figures provide municipal context; they do not determine an individual property\'s assessment, tax appeal eligibility, or fair market value.</p><div class="ep-bars">'+[['Exempt property share',m.exempt_share],['PILOT value share',m.pilot_value_share],['Municipal subsidy / budget',m.subsidy_budget_share]].map(x=>'<div class="ep-bar"><span>'+esc(x[0])+'</span><i><span style="width:'+Math.min(100,Number(x[1]||0)*100)+'%"></span></i><b>'+pct(x[1])+'</b></div>').join('')+'</div></section><section class="ep-source"><h2>Public-source detail</h2><p><b>Exempt value:</b> '+money(m.exempt_value)+' · <b>Net taxable land & improvements:</b> '+money(m.net_taxable_land_improvements)+' · <b>PILOT assessed value:</b> '+money(m.pilot_assessed_value)+' · <b>PILOT billing:</b> '+money(m.pilot_billing)+'.</p><p>Sources: NJ Division of Taxation Abstract of Ratables and NJ Department of Community Affairs / Division of Local Government Services PILOT database. Watchdog derives the contextual ratios from those public records and preserves zero-versus-missing coverage rules.</p></section>'}catch(e){host.innerHTML='<div class="ep-error"><h2>Municipal context could not open</h2><p>'+esc(e.message)+'</p></div>'}})();</script></body></html>
