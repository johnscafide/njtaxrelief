<!doctype html><html lang="en" class="aw27-page" data-access-require="agent"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Farm | Watchdog</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"><link rel="stylesheet" href="/property/css/shared/00-design-tokens.css"><link rel="stylesheet" href="/property/css/app-shell-2027.css"><link rel="stylesheet" href="/property/css/agent-workspace.css?v=20260926a"><link rel="stylesheet" href="/property/css/watchdog-page-head.css"><link rel="stylesheet" href="/property/css/market-list.css?v=20260927a"></head><body data-sidebar-page="agent-desk" data-plan-auto="true"><nav class="aw27-bar" id="agent-workspace-nav" data-active="market-list" aria-label="Agent Control dashboards"><div class="aw27-actions"><a id="aw-map" class="aw27-secondary" href="/property/farm-map" data-aw27-route="/farm-map"><i class="fas fa-draw-polygon" aria-hidden="true"></i> <span>Edit on map</span></a><a id="aw-report" class="aw27-secondary" href="#"><i class="fas fa-file-lines" aria-hidden="true"></i> <span>Reports</span></a></div></nav><main><div id="ml-app" class="ml-shell"><div class="ml-loading"><i class="fas fa-circle-notch fa-spin"></i> Loading farm database…</div></div></main><template id="ml-page"><header class="ml-hero">
    <div class="ml-hero-copy"><h1 data-f="name"></h1><p data-f="scope"></p></div>
    <div class="ml-hero-actions"><a class="ml-hbtn" data-route="/farm-builder"><i class="fas fa-sliders" aria-hidden="true"></i> Edit farm</a><a class="ml-hbtn" data-route="/farm-map" data-list-param><i class="fas fa-draw-polygon" aria-hidden="true"></i> Map</a><a class="ml-hbtn" data-route="/report-studio" data-list-param><i class="fas fa-file-pdf" aria-hidden="true"></i> Reports</a><a class="ml-hbtn" data-route="/marketing-plan" data-list-param><i class="fas fa-bullhorn" aria-hidden="true"></i> Marketing plan</a><button class="ml-hbtn gold" id="ml-refresh" type="button"><i class="fas fa-rotate" aria-hidden="true"></i> Refresh</button></div>
  </header>
  <section class="ml-stats" aria-label="Farm summary">
    <div class="ml-stat t-sky"><b data-f="total"></b><span>matching homes</span></div>
    <div class="ml-stat t-teal"><b id="ml-loaded"></b><span>loaded now</span></div>
    <div class="ml-stat t-sand"><b data-f="avgAssess"></b><span>avg assessment</span></div>
    <div class="ml-stat t-rose"><b data-f="avgTax"></b><span>avg annual tax</span></div>
  </section>
  <section class="ml-duo">
    <article class="ml-card ml-intel" aria-labelledby="ml-intel-h">
      <div class="ml-card-head"><h2 id="ml-intel-h">Watchdog <span class="wd-intelligence-brand-word">Intelligence</span> for this farm</h2><button class="ml-btn dark" id="ml-ask" type="button"><i class="fas fa-dog" aria-hidden="true"></i> Ask about this farm</button></div>
      <ul class="ml-brief" id="ml-brief"><li><i class="fas fa-circle-notch fa-spin" aria-hidden="true"></i><span>Reading this farm…</span></li></ul>
      <small class="ml-note" data-f="intelNote" data-default="Built from public NJ tax records and your own CRM. Watchdog never guesses who plans to sell."></small>
    </article>
    <article class="ml-card ml-crmcard" aria-labelledby="ml-crm-h">
      <div class="ml-card-head"><h2 id="ml-crm-h"><i class="fas fa-arrows-rotate" aria-hidden="true"></i> Your CRM</h2></div>
      <div id="ml-crm-body"><p class="ml-muted">Checking your connections…</p></div>
      <div class="ml-crm-actions"><a class="ml-btn" data-route="/integrations"><i class="fas fa-plug" aria-hidden="true"></i> <span id="ml-crm-link">Connect CRM</span></a><label class="ml-btn" for="ml-file"><i class="fas fa-file-arrow-up" aria-hidden="true"></i> Match a CSV</label><input type="file" id="ml-file" accept=".csv,text/csv" hidden></div>
      <small class="ml-note">Use a CSV export from any database (Follow Up Boss, Lofty, Excel and so on). Watchdog matches it by street address in your browser and only keeps names and stages, never emails or phone numbers.</small>
    </article>
  </section>
  <section class="ml-card ml-results" aria-labelledby="ml-results-h">
    <div class="ml-toolbar">
      <div class="ml-toolbar-left"><h2 id="ml-results-h">Homes in this farm</h2><span class="ml-count" id="ml-selcount"></span><button type="button" class="ml-link" id="ml-selclear" hidden>Clear selection</button></div>
      <div class="ml-toolbar-right">
        <div class="ml-seg" role="group" aria-label="CRM filter"><button type="button" data-crm-filter="all" aria-pressed="true">All</button><button type="button" data-crm-filter="in" aria-pressed="false">In my CRM</button><button type="button" data-crm-filter="out" aria-pressed="false">Not in CRM</button></div>
        <input id="ml-search" type="search" placeholder="Search address, name, ZIP, block/lot" aria-label="Search this farm">
      </div>
    </div>
    <div class="ml-tools">
      <button class="ml-btn" type="button" data-open="labels" aria-expanded="false"><i class="fas fa-tags" aria-hidden="true"></i> Print labels</button>
      <button class="ml-btn" type="button" data-open="download" aria-expanded="false"><i class="fas fa-download" aria-hidden="true"></i> Download</button>
      <button class="ml-btn" type="button" id="ml-bulk-desk"><i class="fas fa-bullseye" aria-hidden="true"></i> Add <span data-scope-label>shown</span> to Desk</button>
      <small class="ml-muted">Actions use the homes you select, or every home shown if none are selected.</small>
    </div>
    <div class="ml-pop" id="ml-pop-labels" hidden><div class="ml-pop-grid">
      <fieldset><legend>Label sheet</legend><label><input type="radio" name="ml-fmt" value="5160" checked> Avery 5160 · 30 per sheet</label><label><input type="radio" name="ml-fmt" value="5163"> Avery 5163 · 10 per sheet</label></fieldset>
      <fieldset><legend>Addressed to</legend><label><input type="radio" name="ml-to" value="smart" checked> Name from your CRM or file, else "Current Resident"</label><label><input type="radio" name="ml-to" value="resident"> "Current Resident"</label><label><input type="radio" name="ml-to" value="homeowner"> "Homeowner"</label></fieldset>
    </div><div class="ml-pop-actions"><button class="ml-btn dark" type="button" id="ml-print"><i class="fas fa-print" aria-hidden="true"></i> Print <span data-scope-label>shown</span></button><button class="ml-btn" type="button" id="ml-merge"><i class="fas fa-file-csv" aria-hidden="true"></i> Mail-merge file instead</button></div><small class="ml-note">Set the printer to "Actual size" (100%) so labels line up.</small></div>
    <div class="ml-pop" id="ml-pop-download" hidden><div class="ml-dl">
      <button type="button" class="ml-dl-opt" id="ml-export"><i class="fas fa-file-csv" aria-hidden="true"></i><span><b>CRM import (CSV)</b><small>Every column plus your CRM match. Imports into BoldTrail, Follow Up Boss, Excel and more.</small></span></button>
      <button type="button" class="ml-dl-opt" id="ml-export-merge"><i class="fas fa-envelope" aria-hidden="true"></i><span><b>Mail merge (CSV)</b><small>Addressee, address, city, state and ZIP for Word or label software.</small></span></button>
    </div></div>
    <div id="ml-content"></div>
    <button id="ml-more" class="ml-load" type="button"><i class="fas fa-chevron-down" aria-hidden="true"></i> Load more homes</button>
    <p class="ml-source"><i class="fas fa-database" aria-hidden="true"></i> <span><span data-f="source"></span>. New Jersey withholds owner names from its public parcel data, so names here come only from your CRM or file. <span data-f="enrichNote"></span></span></p>
  </section></template><template id="ml-fail"><div class="ml-error"><b>This farm could not load.</b><p data-f="message"></p><button class="ml-btn" type="button" data-reload>Retry</button> <a class="ml-btn" data-route="/agent-desk">Back to Agent Desk</a></div></template><div id="pl-toast" class="pl-toast" role="status" aria-live="polite"></div><div id="ml-print-root" aria-hidden="true"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script src="/property/js/access-guard.js"></script><script src="/property/js/app-shell-2027.js"></script><script src="/property/js/agent-workspace.js?v=20260926a"></script><script src="/property/js/platform-observability.js?v=20260811a"></script><script src="/property/js/agent-ui-safety.js?v=20260811a"></script><script src="/property/js/market-list.js?v=20260927a"></script><script>(function(){var id=new URLSearchParams(location.search).get('id');if(!id)return;var W=window.WatchdogAgentWorkspace,r=W?W.route:function(p){return '/property'+p;};document.getElementById('aw-report').href=r('/report-studio')+'?list='+encodeURIComponent(id);document.getElementById('aw-map').href=r('/farm-map')+'?list='+encodeURIComponent(id);})();</script></body></html>
