<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Properties | NJ Property Tax Relief</title>
<meta name="robots" content="noindex, nofollow">
<link rel="canonical" href="https://njpropertytaxrelief.com/property/dashboard.html">
<link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="shortcut icon" href="/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Source+Sans+3:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="/styles.css">
<script async src="https://www.googletagmanager.com/gtag/js?id=G-ENP9182L0J"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-ENP9182L0J');</script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script><link rel="stylesheet" href="/property/css/shared.css">
<link rel="stylesheet" href="/property/css/dashboard.css">
</head>
<body>
<nav id="main-nav"></nav>
<div class="pl-toast" id="pl-toast"></div>
<div class="plm-note-overlay" id="plm-note-overlay" onclick="if(event.target===this)plCloseNote()"></div>

<div class="db-shell">

  <!-- SIGNED OUT -->
  <section class="section" id="db-gate">
    <div class="section-inner">
      <div class="db-gate">
        <i class="fas fa-house-lock"></i>
        <h1>Your properties</h1>
        <p>Sign in to see the homes you have claimed, your watchlist, and how their assessments and tax bills have moved.</p>
        <button class="plm-rbtn" style="max-width:320px;margin:0 auto;" onclick="plSignInPrompt()">Sign in</button>
        <div class="db-gate-back"><a href="/property/">Back to the property lookup</a></div>
      </div>
    </div>
  </section>

  <!-- SIGNED IN -->
  <section class="section" id="db-main" style="display:none;">
    <div class="section-inner">

      <div class="db-top">
        <div class="db-who">
          <div id="db-avatar"></div>
          <div>
            <div class="db-hi" id="db-hi">Welcome back</div>
            <div class="db-email" id="db-email"></div>
          </div>
        </div>
        <div class="db-top-acts">
          <a class="db-btn ghost" href="/property/"><i class="fas fa-magnifying-glass"></i> Look up an address</a>
          <button class="db-btn ghost" onclick="plSignOut()">Sign out</button>
        </div>
      </div>

      <div id="db-alerts"></div>

      <div class="db-stats" id="db-stats"></div>

      <div class="db-tabs">
        <button class="db-tab active" data-p="homes"   onclick="dbTab('homes')">My homes</button>
        <button class="db-tab"        data-p="watch"   onclick="dbTab('watch')">Watchlist</button>
        <button class="db-tab"        data-p="tools"   onclick="dbTab('tools')">Tools</button>
        <button class="db-tab"        data-p="profile" onclick="dbTab('profile')">My profile</button>
      </div>

      <div class="db-panel active" id="db-homes"></div>
      <div class="db-panel" id="db-watch"></div>
      <div class="db-panel" id="db-tools"></div>
      <div class="db-panel" id="db-profile"></div>

    </div>
  </section>
</div>

<footer id="main-footer"></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="/scripts.js"></script>
<script src="/property/js/dashboard.js"></script>
</body>
</html>
