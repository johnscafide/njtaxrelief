<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Watchdog New Jersey property data</title><desc id="desc">A New Jersey home connected to assessment, tax, sales, parcel and municipal data sources.</desc><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#07182f"/><stop offset="1" stop-color="#0b5c78"/></linearGradient><linearGradient id="card" x1="0" x2="1"><stop stop-color="#ffffff" stop-opacity=".16"/><stop offset="1" stop-color="#ffffff" stop-opacity=".07"/></linearGradient></defs><rect width="1600" height="900" fill="url(#bg)"/><g opacity=".18" stroke="#69d7ff" fill="none"><path d="M0 150h1600M0 300h1600M0 450h1600M0 600h1600M0 750h1600"/><path d="M200 0v900M400 0v900M600 0v900M800 0v900M1000 0v900M1200 0v900M1400 0v900"/></g><g transform="translate(485 250)"><path d="M110 230V95L315 0l205 95v135" fill="#f7fafc" stroke="#dbe7ef" stroke-width="10"/><rect x="155" y="110" width="320" height="220" rx="8" fill="#e8f0f5"/><rect x="288" y="205" width="70" height="125" fill="#183a55"/><rect x="190" y="155" width="70" height="65" fill="#88bdd2"/><rect x="385" y="155" width="55" height="65" fill="#88bdd2"/><path d="M85 345h470" stroke="#fff" stroke-width="16" stroke-linecap="round"/></g><g font-family="Arial,Helvetica,sans-serif" fill="#fff"><text x="80" y="100" font-size="34" font-weight="700">WATCHDOG PROPERTY INTELLIGENCE</text><text x="80" y="150" font-size="22" opacity=".78">One address. Hundreds of New Jersey property data points.</text></g><g font-family="Arial,Helvetica,sans-serif"><g transform="translate(80 240)"><rect width="330" height="135" rx="22" fill="url(#card)" stroke="#69d7ff" stroke-opacity=".7"/><text x="28" y="48" fill="#9adfff" font-size="18" font-weight="700">ASSESSMENT</text><text x="28" y="91" fill="#fff" font-size="30" font-weight="700">MOD-IV records</text></g><g transform="translate(80 410)"><rect width="330" height="135" rx="22" fill="url(#card)" stroke="#69d7ff" stroke-opacity=".7"/><text x="28" y="48" fill="#9adfff" font-size="18" font-weight="700">PROPERTY TAX</text><text x="28" y="91" fill="#fff" font-size="30" font-weight="700">Local tax data</text></g><g transform="translate(80 580)"><rect width="330" height="135" rx="22" fill="url(#card)" stroke="#69d7ff" stroke-opacity=".7"/><text x="28" y="48" fill="#9adfff" font-size="18" font-weight="700">PARCEL</text><text x="28" y="91" fill="#fff" font-size="30" font-weight="700">NJ Office of GIS</text></g><g transform="translate(1190 240)"><rect width="330" height="135" rx="22" fill="url(#card)" stroke="#69d7ff" stroke-opacity=".7"/><text x="28" y="48" fill="#9adfff" font-size="18" font-weight="700">SALES</text><text x="28" y="91" fill="#fff" font-size="30" font-weight="700">Verified records</text></g><g transform="translate(1190 410)"><rect width="330" height="135" rx="22" fill="url(#card)" stroke="#69d7ff" stroke-opacity=".7"/><text x="28" y="48" fill="#9adfff" font-size="18" font-weight="700">RATIOS</text><text x="28" y="91" fill="#fff" font-size="30" font-weight="700">Equalization data</text></g><g transform="translate(1190 580)"><rect width="330" height="135" rx="22" fill="url(#card)" stroke="#69d7ff" stroke-opacity=".7"/><text x="28" y="48" fill="#9adfff" font-size="18" font-weight="700">LOCAL CONTEXT</text><text x="28" y="91" fill="#fff" font-size="30" font-weight="700">Town-level signals</text></g></g><g stroke="#55cfff" stroke-width="4" fill="none" opacity=".8"><path d="M410 308h180M410 478h100M410 648h170M1015 308h175M1090 478h100M1020 648h170"/></g><g fill="#7fe4ff"><circle cx="590" cy="308" r="7"/><circle cx="510" cy="478" r="7"/><circle cx="580" cy="648" r="7"/><circle cx="1015" cy="308" r="7"/><circle cx="1090" cy="478" r="7"/><circle cx="1020" cy="648" r="7"/></g><g font-family="Arial,Helvetica,sans-serif" text-anchor="middle"><text x="800" y="780" fill="#fff" font-size="40" font-weight="700">Official New Jersey data, organized around one property.</text><text x="800" y="832" fill="#a8dff0" font-size="24">Search once. Understand more.</text></g></svg>