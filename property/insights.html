<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NJ Property Tax Insights | njpropertytaxrelief.com</title>
<meta name="description" content="Plain-English explainers on New Jersey property tax assessments, appeal deadlines, senior relief programs, and municipal revaluations.">
<link rel="canonical" href="https://njpropertytaxrelief.com/insights.html">
<link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@600;700;800&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/property/css/lookup.css?v=20260805b">
<style>
  .ih-wrap { max-width: 980px; margin: 0 auto; padding: 50px 24px 90px; }
  .ih-head h1 { font-family: 'Playfair Display', Georgia, serif; font-size: clamp(30px, 4vw, 44px); color: var(--navy-dark); margin: 0 0 10px; }
  .ih-head p { font-size: 16.5px; color: var(--text-muted); max-width: 560px; margin: 0 0 40px; }
  .ih-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 26px; }
  .ih-card { text-decoration: none; display: block; border-radius: 12px; overflow: hidden; border: 1px solid var(--border); transition: box-shadow .15s, transform .15s; }
  .ih-card:hover { box-shadow: 0 14px 34px -18px rgba(16,34,72,0.28); transform: translateY(-2px); }
  .ih-thumb { height: 170px; background-size: cover; background-position: center; }
  .ih-body { padding: 18px 20px 20px; background: #fff; }
  .ih-kicker { display: block; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; color: var(--gold); margin-bottom: 8px; }
  .ih-card h3 { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-size: 17px; line-height: 1.4; color: var(--navy-dark); margin: 0 0 8px; }
  .ih-card p { font-size: 13.5px; line-height: 1.6; color: var(--text-muted); margin: 0; }
  .ih-empty, .ih-loading { text-align: center; padding: 60px 0; color: var(--text-muted); }
  @media (max-width: 640px) { .ih-wrap { padding: 34px 18px 70px; } }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <span><i class="fas fa-landmark" style="margin-right:6px;"></i>New Jersey Property Tax Relief Resource, South Jersey</span>
    <a href="https://www.nj.gov/treasury/taxation/relief.shtml" target="_blank">Official NJ Treasury <i class="fas fa-arrow-up-right-from-square" style="font-size:11px;"></i></a>
  </div>
</div>
<nav id="main-nav"></nav>

<div class="ih-wrap">
  <div class="ih-head">
    <h1>New Jersey property tax insights</h1>
    <p>Plain-English explainers on assessments, appeal deadlines, senior relief, and what a revaluation actually does to your bill.</p>
  </div>
  <div id="ih-loading" class="ih-loading"><i class="fas fa-spinner fa-spin"></i> Loading&hellip;</div>
  <div class="ih-grid" id="ih-grid" style="display:none"></div>
  <div id="ih-empty" class="ih-empty" style="display:none">No insights published yet &mdash; check back soon.</div>
</div>

<footer id="main-footer"></footer>
<script src="scripts.js"></script>
<script>
(function () {
  'use strict';
  var SUPA_URL = 'https://uvkvaxljhhngydvlrzom.supabase.co';
  var SUPA_ANON = 'sb_publishable_MYX59qCbK3d-21zDfJqkNw_fvmfnexa';

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  fetch(SUPA_URL + '/rest/v1/insights_articles?published=eq.true&select=slug,kicker,title,dek,hero_image_url&order=published_at.desc', {
    headers: { apikey: SUPA_ANON, Authorization: 'Bearer ' + SUPA_ANON }
  })
    .then(function (r) { return r.json(); })
    .then(function (rows) {
      document.getElementById('ih-loading').style.display = 'none';
      if (!rows || !rows.length) {
        document.getElementById('ih-empty').style.display = 'block';
        return;
      }
      document.getElementById('ih-grid').style.display = 'grid';
      document.getElementById('ih-grid').innerHTML = rows.map(function (a) {
        return '<a class="ih-card" href="/insights/' + esc(a.slug) + '.html">' +
          (a.hero_image_url ? '<div class="ih-thumb" style="background-image:url(\'' + esc(a.hero_image_url) + '\')"></div>' : '') +
          '<div class="ih-body"><span class="ih-kicker">' + esc(a.kicker) + '</span>' +
          '<h3>' + esc(a.title) + '</h3><p>' + esc(a.dek) + '</p></div></a>';
      }).join('');
    })
    .catch(function () {
      document.getElementById('ih-loading').style.display = 'none';
      document.getElementById('ih-empty').style.display = 'block';
    });
})();
</script>
</body>
</html>
