          <strong>WATCHDOG</strong>
          <span>PROPERTY INTELLIGENCE</span>
        </a>
        <nav class="wdd-sidebar-nav" aria-label="Workspace navigation">
          <a class="is-active" href="/property/dashboard"><i class="fas fa-house" aria-hidden="true"></i><span>Dashboard</span></a>

          <a href="/property/profile"><i class="fas fa-gear" aria-hidden="true"></i><span>Settings</span></a>
        </nav>
        <div class="wdd-sidebar-support">
          <span class="wdd-sidebar-help"><i class="fas fa-question" aria-hidden="true"></i></span>
          <span><b>Need help?</b><small>Support &amp; resources</small></span>
        </div>
      </aside>

      <div class="wdd-workspace">
        <section class="wdd-standing" id="wdd-standing" aria-label="Dashboard header"></section>
        <section class="wdd-signals" id="wdd-signals" aria-label="Portfolio overview"></section>
        <section class="wdd-queue" id="wdd-queue" aria-label="Action queue"></section>
        <div class="wdd-work">
          <section id="wdd-positions" aria-label="Your portfolio"></section>
          <aside class="wdd-rail" id="wdd-rail" aria-label="Portfolio map, recent changes and analysis"></aside>
        </div>
        <div class="wdd-newsslot"><div id="wd4-root"></div></div>
        <footer class="wdd-foot" id="wdd-foot"></footer>
      </div>
    </div>

      <button type="button" data-act="mobile-more"><i class="fas fa-ellipsis" aria-hidden="true"></i><span>More</span></button>
    </nav>
