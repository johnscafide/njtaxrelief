<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Dashboard | Watchdog Property Intelligence</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#f5f7fb">
  <link rel="canonical" href="https://njpropertytaxrelief.com/property/dashboard">
  <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/property/manifest.webmanifest">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="/property/css/dashboard/dashboard-exact.css">
  <link rel="stylesheet" href="/property/css/dashboard/dashboard-exact-enhancements.css">
  <link rel="stylesheet" href="/property/css/dashboard/dashboard-exact-interactions.css">
  <link rel="stylesheet" href="/property/css/dashboard/dashboard-workspace-polish.css">
  <style>
    .wd4-card[data-card-id="property-home-link"]{grid-column:span 5!important;grid-row:span 3!important}
    .wd4-card[data-card-id="town-compare-link"]{grid-column:span 6!important;grid-row:span 3!important}
    .wd4-card[data-card-id="fairness-link"]{grid-column:span 5!important;grid-row:span 3!important}
    .wd4-card[data-card-id="change-link"]{grid-column:span 6!important;grid-row:span 3!important}
    .wd4-card[data-card-id="agent-link"]{grid-column:span 5!important;grid-row:span 3!important}
    .wd4-card[data-card-id="appeal-link"]{grid-column:span 5!important;grid-row:span 3!important}
    .wd4-card[data-card-id="workbench-link"]{grid-column:span 6!important;grid-row:span 3!important}
    .wd4-card[data-card-id="summary-gap"]{grid-column:span 8!important;grid-row:span 2!important}
    @media(max-width:1000px){
      .wd4-card[data-card-id="property-home-link"],.wd4-card[data-card-id="fairness-link"],.wd4-card[data-card-id="agent-link"],.wd4-card[data-card-id="appeal-link"]{grid-column:span 6!important}
    }
    @media(max-width:720px){
      .wd4-card[data-card-id="summary-gap"]{grid-column:1/-1!important;grid-row:auto!important}
    }
  </style>
</head>
<body data-sidebar-page="dashboard">
  <main id="wd4-root" hidden aria-live="polite"></main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script type="module" src="/property/js/dashboard/dashboard-exact.js"></script>
  <script type="module" src="/property/js/dashboard/dashboard-exact-enhancements.js"></script>
  <script type="module" src="/property/js/dashboard/dashboard-exact-interactions.js"></script>
  <script type="module" src="/property/js/dashboard/dashboard-workspace-polish.js"></script>
</body>
</html>
