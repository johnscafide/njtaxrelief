  <!-- ===== TEMPORARY: dashboard UI switch =====================================
       /dashboard          approved V3 layout, unchanged
       /dashboard?ui=spike Spike skin
       The choice sticks for the browser tab. Once a direction is picked, delete
       this comment, the style block, the script, and whichever link lost.
       ========================================================================= -->
  <style>
    .wdd-ui-flag{position:fixed;left:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:9600;
      display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border:0;border-radius:999px;
      background:#0e2248;color:#fff;font:700 11.5px/1 "Plus Jakarta Sans",sans-serif;letter-spacing:.04em;
      box-shadow:0 10px 26px rgba(14,34,72,.32);cursor:pointer}
    .wdd-ui-flag:hover{background:#1456a0}
  </style>
  <script>
  (function(){
    var KEY='wd-ui', choice=null;
    try{ choice=new URLSearchParams(location.search).get('ui'); }catch(e){}
    if(choice){ try{ sessionStorage.setItem(KEY,choice); }catch(e){} }
    else{ try{ choice=sessionStorage.getItem(KEY); }catch(e){} }
    var spike = choice==='spike';
    if(spike){
      var v3=document.getElementById('wd-ui-v3'), sp=document.getElementById('wd-ui-spike');
      if(v3) v3.disabled=true;
      if(sp) sp.disabled=false;
    }
    document.documentElement.setAttribute('data-ui', spike?'spike':'v3');
    document.addEventListener('DOMContentLoaded',function(){
      var b=document.createElement('button');
      b.type='button';
      b.className='wdd-ui-flag';
      b.textContent = spike ? 'UI: Spike \u00b7 switch to V3' : 'UI: V3 \u00b7 switch to Spike';
      b.addEventListener('click',function(){
        var u=new URL(location.href);
        u.searchParams.set('ui', spike?'v3':'spike');
        location.href=u.toString();
      });
      document.body.appendChild(b);
    });
  })();
  </script>

<body data-sidebar-page="dashboard">
  <div class="wdd-boot" id="wdd-boot" aria-live="polite">

        </a>
        <button class="wd-public-trigger wdd-dashboard-menu-trigger" id="wd-menu-trigger" type="button" onclick="WatchdogPublicNav.open('main')" aria-label="Open Watchdog menu">

        </button>

    </header>

    <aside class="wd-public-sheet" id="wd-main-sheet" aria-hidden="true" aria-label="Watchdog navigation"></aside>

    <div class="wdd-shell">

        <section class="wdd-signals" id="wdd-signals" aria-label="Portfolio overview"></section>
        <section class="wdd-queue" id="wdd-queue" aria-label="Action queue"></section>
        <div class="wdd-work">
          <section id="wdd-positions" aria-label="Your portfolio"></section>
          <aside class="wdd-rail" id="wdd-rail" aria-label="Portfolio map, recent changes and analysis"></aside>
        </div>
        <div class="wdd-newsslot"><div id="wd4-root"></div></div>
        <footer class="wdd-foot" id="wdd-foot"></footer>
      </div>
    </div>

  </main>

  <button class="wdd-pull" id="wdd-pull" type="button" hidden><i class="fas fa-comment-dots" aria-hidden="true"></i>Ask Watchdog</button>
  <div class="wdd-drawer" id="wdd-drawer" hidden></div>
