  <script>
    (function () {
      var boot = document.getElementById('wdd-boot');
      var retry = document.getElementById('wdd-boot-retry');
      if (!boot || !retry) return;
      var started = performance.now();
      var pausedDuration = 0;
      var glanceStartedAt = 0;
      var failed = !retry.hidden;
      var motion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)');
      var glanceTimer;
      function setGlance() {
        if (failed || boot.hidden || (motion && motion.matches)) return;
        glanceStartedAt = performance.now();
        boot.classList.add('is-glancing');
        window.setTimeout(function () {
          boot.classList.remove('is-glancing');
          pausedDuration += performance.now() - glanceStartedAt;
          scheduleGlance(false);
        }, 760);
      }
      function scheduleGlance(nextCycle) {
        if (glanceTimer) window.clearTimeout(glanceTimer);
        if (failed || boot.hidden || (motion && motion.matches)) return;
        var wait = 0;
        if (nextCycle) wait = nextCycle;
        else {
          var elapsed = performance.now() - started - pausedDuration;
          var remainder = ((elapsed % 7600) + 7600) % 7600;
          wait = remainder < 3750 ? 3750 - remainder : 7600 - remainder + 3750;
        }
        glanceTimer = window.setTimeout(setGlance, wait);
      }
      function startGlanceCycle() {
        if (glanceTimer) window.clearTimeout(glanceTimer);
        scheduleGlance(false);
      }
      function onMotionChange() {
        if (motion && !motion.matches) {
          started = performance.now();
          pausedDuration = 0;
          boot.classList.remove('is-glancing');
        }
        startGlanceCycle();
      }
      function markFailed() {
        failed = !retry.hidden;
        if (failed) boot.classList.add('is-failed');
        else boot.classList.remove('is-failed');
      }
      if (window.MutationObserver) {
        new MutationObserver(markFailed).observe(retry, { attributes: true, attributeFilter: ['hidden'] });
      }
      if (motion && motion.addEventListener) motion.addEventListener('change', onMotionChange);
      else if (motion && motion.addListener) motion.addListener(onMotionChange);
      startGlanceCycle();
      document.addEventListener('wd:ready', function () {
        var elapsed = performance.now() - started;
        markFailed();
        if (glanceTimer) window.clearTimeout(glanceTimer);
        boot.classList.remove('is-glancing');
        if (!failed && elapsed < 2400 && !(motion && motion.matches)) {
          boot.hidden = false;
          boot.classList.add('is-completing');
          window.setTimeout(function () { boot.hidden = true; boot.classList.remove('is-completing'); }, 260);
        } else {
          boot.hidden = true;
        }
      }, { once: true });
    })();
  </script>
