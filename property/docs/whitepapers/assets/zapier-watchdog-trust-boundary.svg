<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Watchdog asymmetric trust boundary</title>
<desc id="desc">Diagram separating authoritative property facts, external CRM context, and derived Watchdog Intelligence, with explicit gates controlling how information can move between the lanes.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2f6df6"/></marker><filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#183b84" flood-opacity=".08"/></filter></defs>
<rect width="1600" height="900" fill="#f5f7fb"/>
<text x="90" y="90" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="800" letter-spacing="2" fill="#2f6df6">TRUST ARCHITECTURE</text>
<text x="90" y="142" font-family="Inter,Arial,sans-serif" font-size="42" font-weight="800" fill="#111d38">Bidirectional automation. Asymmetric truth.</text>
<text x="90" y="181" font-family="Inter,Arial,sans-serif" font-size="19" fill="#748198">External systems may inform Watchdog. They do not get to redefine authoritative property facts.</text>

<g filter="url(#s)"><rect x="90" y="260" width="430" height="430" rx="18" fill="#fff" stroke="#e2e7ef"/><rect x="585" y="260" width="430" height="430" rx="18" fill="#fff" stroke="#e2e7ef"/><rect x="1080" y="260" width="430" height="430" rx="18" fill="#fff" stroke="#e2e7ef"/></g>

<rect x="120" y="290" width="370" height="54" rx="12" fill="#183b84"/><text x="145" y="324" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="800" fill="#fff">LANE A · PROPERTY TRUTH</text>
<text x="125" y="390" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="800" fill="#111d38">Authoritative evidence</text>
<text x="125" y="433" font-family="Inter,Arial,sans-serif" font-size="16" fill="#31435c">• Government and governed providers</text><text x="125" y="466" font-family="Inter,Arial,sans-serif" font-size="16" fill="#31435c">• Source timestamps and provenance</text><text x="125" y="499" font-family="Inter,Arial,sans-serif" font-size="16" fill="#31435c">• Assessment, tax, deed, permit facts</text><text x="125" y="532" font-family="Inter,Arial,sans-serif" font-size="16" fill="#31435c">• Parcel identity and normalized address</text>
<rect x="125" y="580" width="340" height="70" rx="12" fill="#edf1f6"/><text x="145" y="610" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="800" fill="#111d38">WRITE RULE</text><text x="145" y="636" font-family="Inter,Arial,sans-serif" font-size="14" fill="#31435c">Only governed source pipelines may alter facts.</text>

<rect x="615" y="290" width="370" height="54" rx="12" fill="#e9f0ff"/><text x="640" y="324" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="800" fill="#183b84">LANE B · INTELLIGENCE</text>
<text x="620" y="390" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="800" fill="#111d38">Derived interpretation</text>
<text x="620" y="433" font-family="Inter,Arial,sans-serif" font-size="16" fill="#31435c">• Findings and material changes</text><text x="620" y="466" font-family="Inter,Arial,sans-serif" font-size="16" fill="#31435c">• Confidence, reasons, model version</text><text x="620" y="499" font-family="Inter,Arial,sans-serif" font-size="16" fill="#31435c">• Scenarios, outcomes, calibration</text><text x="620" y="532" font-family="Inter,Arial,sans-serif" font-size="16" fill="#31435c">• User-approved CRM relationship context</text>
<rect x="620" y="580" width="340" height="70" rx="12" fill="#e9f0ff"/><text x="640" y="610" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="800" fill="#183b84">USE RULE</text><text x="640" y="636" font-family="Inter,Arial,sans-serif" font-size="14" fill="#31435c">Every finding remains attributable to evidence.</text>

<rect x="1110" y="290" width="370" height="54" rx="12" fill="#fff" stroke="#2f6df6"/><text x="1135" y="324" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="800" fill="#2f6df6">LANE C · EXTERNAL CONTEXT</text>
<text x="1115" y="390" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="800" fill="#111d38">Workflow evidence</text>
<text x="1115" y="433" font-family="Inter,Arial,sans-serif" font-size="16" fill="#31435c">• CRM stage and relationship context</text><text x="1115" y="466" font-family="Inter,Arial,sans-serif" font-size="16" fill="#31435c">• Tasks, outcomes, campaign events</text><text x="1115" y="499" font-family="Inter,Arial,sans-serif" font-size="16" fill="#31435c">• External lead / property interest</text><text x="1115" y="532" font-family="Inter,Arial,sans-serif" font-size="16" fill="#31435c">• Human confirmations and corrections</text>
<rect x="1115" y="580" width="340" height="70" rx="12" fill="#edf1f6"/><text x="1135" y="610" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="800" fill="#111d38">INGEST RULE</text><text x="1135" y="636" font-family="Inter,Arial,sans-serif" font-size="14" fill="#31435c">Normalize, minimize, verify, then use.</text>

<path d="M520 475H585" stroke="#2f6df6" stroke-width="5" marker-end="url(#a)"/><text x="524" y="450" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="800" fill="#2f6df6">EVIDENCE</text>
<path d="M1015 475H1080" stroke="#2f6df6" stroke-width="5" marker-end="url(#a)"/><text x="1017" y="450" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="800" fill="#2f6df6">ACTION</text>
<path d="M1080 555H1015" stroke="#748198" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#a)"/><text x="1013" y="582" text-anchor="end" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="800" fill="#748198">CONTEXT</text>

<rect x="90" y="755" width="1420" height="80" rx="18" fill="#fff" stroke="#e2e7ef"/>
<circle cx="135" cy="795" r="19" fill="#18a966"/><path d="M126 795l6 6 12-15" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="175" y="789" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="800" fill="#111d38">Design principle: outside context can change what Watchdog investigates, prioritizes, or recommends.</text>
<text x="175" y="816" font-family="Inter,Arial,sans-serif" font-size="15" fill="#748198">It cannot silently change the underlying parcel record, ownership fact, assessment, tax amount, or other governed fact.</text>
</svg>