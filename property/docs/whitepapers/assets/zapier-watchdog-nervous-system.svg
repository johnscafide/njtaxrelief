<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Watchdog automation nervous system</title>
<desc id="desc">Architecture diagram showing governed property facts flowing through Watchdog Intelligence, integration event routing, Zapier, and external business systems with an audited feedback loop.</desc>
<defs>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#183b84" flood-opacity=".10"/></filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2f6df6"/></marker>
  <marker id="arrowNavy" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#183b84"/></marker>
</defs>
<rect width="1600" height="900" fill="#f5f7fb"/>
<text x="90" y="90" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="800" letter-spacing="2" fill="#2f6df6">WATCHDOG AUTOMATION FABRIC</text>
<text x="90" y="142" font-family="Inter,Arial,sans-serif" font-size="42" font-weight="800" fill="#111d38">The property intelligence nervous system</text>
<text x="90" y="181" font-family="Inter,Arial,sans-serif" font-size="19" fill="#748198">Facts become evidence. Evidence becomes intelligence. Intelligence becomes governed work.</text>

<g filter="url(#shadow)">
  <rect x="90" y="275" width="285" height="300" rx="18" fill="#fff" stroke="#e2e7ef"/>
  <rect x="420" y="235" width="330" height="380" rx="18" fill="#fff" stroke="#e2e7ef"/>
  <rect x="800" y="235" width="300" height="380" rx="18" fill="#fff" stroke="#e2e7ef"/>
  <rect x="1150" y="275" width="360" height="300" rx="18" fill="#fff" stroke="#e2e7ef"/>
</g>

<circle cx="145" cy="330" r="28" fill="#e9f0ff"/><path d="M132 330h26M145 317v26" stroke="#2f6df6" stroke-width="4" stroke-linecap="round"/>
<text x="190" y="325" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="800" fill="#2f6df6">AUTHORITATIVE INPUTS</text>
<text x="125" y="382" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="800" fill="#111d38">Governed property facts</text>
<text x="125" y="424" font-family="Inter,Arial,sans-serif" font-size="16" fill="#31435c">Assessments · taxes · deeds</text>
<text x="125" y="453" font-family="Inter,Arial,sans-serif" font-size="16" fill="#31435c">permits · municipal releases</text>
<text x="125" y="482" font-family="Inter,Arial,sans-serif" font-size="16" fill="#31435c">source freshness · provenance</text>
<rect x="125" y="514" width="215" height="34" rx="17" fill="#edf1f6"/><text x="145" y="536" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#31435c">Never overwritten by CRM data</text>

<circle cx="480" cy="300" r="28" fill="#e9f0ff"/><path d="M467 300c12-16 27-16 39 0-12 16-27 16-39 0Z" fill="none" stroke="#2f6df6" stroke-width="3"/><circle cx="486" cy="300" r="5" fill="#2f6df6"/>
<text x="525" y="295" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="800" fill="#2f6df6">WATCHDOG INTELLIGENCE</text>
<text x="455" y="353" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="800" fill="#111d38">Evidence → finding</text>
<text x="455" y="395" font-family="Inter,Arial,sans-serif" font-size="16" fill="#31435c">Change detection</text>
<text x="455" y="426" font-family="Inter,Arial,sans-serif" font-size="16" fill="#31435c">Confidence + reason codes</text>
<text x="455" y="457" font-family="Inter,Arial,sans-serif" font-size="16" fill="#31435c">Model + prompt version lineage</text>
<text x="455" y="488" font-family="Inter,Arial,sans-serif" font-size="16" fill="#31435c">Plan quota + idempotent jobs</text>
<rect x="455" y="530" width="255" height="42" rx="12" fill="#e9f0ff"/><text x="475" y="556" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="800" fill="#183b84">Finding created with evidence trail</text>

<circle cx="860" cy="300" r="28" fill="#e9f0ff"/><path d="M848 289l24 11-24 11v-7h-10v-8h10Z" fill="#2f6df6"/>
<text x="905" y="295" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="800" fill="#2f6df6">INTEGRATION PLANE</text>
<text x="835" y="353" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="800" fill="#111d38">Event → policy → delivery</text>
<text x="835" y="395" font-family="Inter,Arial,sans-serif" font-size="16" fill="#31435c">Scoped API keys</text>
<text x="835" y="426" font-family="Inter,Arial,sans-serif" font-size="16" fill="#31435c">REST Hook subscriptions</text>
<text x="835" y="457" font-family="Inter,Arial,sans-serif" font-size="16" fill="#31435c">Signed delivery + retries</text>
<text x="835" y="488" font-family="Inter,Arial,sans-serif" font-size="16" fill="#31435c">Audit + health + replay lineage</text>
<rect x="835" y="530" width="230" height="42" rx="12" fill="#e9f0ff"/><text x="855" y="556" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="800" fill="#183b84">Zapier API · Integration worker</text>

<circle cx="1210" cy="330" r="28" fill="#e9f0ff"/><path d="M1199 320h22v20h-22zM1204 315h12v5h-12z" fill="none" stroke="#2f6df6" stroke-width="3"/>
<text x="1255" y="325" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="800" fill="#2f6df6">BUSINESS SYSTEMS</text>
<text x="1185" y="382" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="800" fill="#111d38">Work happens anywhere</text>
<text x="1185" y="424" font-family="Inter,Arial,sans-serif" font-size="16" fill="#31435c">CRM · email · Slack · Teams</text>
<text x="1185" y="453" font-family="Inter,Arial,sans-serif" font-size="16" fill="#31435c">SMS · Sheets · Airtable</text>
<text x="1185" y="482" font-family="Inter,Arial,sans-serif" font-size="16" fill="#31435c">tasks · documents · marketing</text>
<rect x="1185" y="514" width="285" height="34" rx="17" fill="#edf1f6"/><text x="1205" y="536" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#31435c">External context returns through a trust gate</text>

<path d="M375 425H420" stroke="#2f6df6" stroke-width="5" marker-end="url(#arrow)"/>
<path d="M750 425H800" stroke="#2f6df6" stroke-width="5" marker-end="url(#arrow)"/>
<path d="M1100 425H1150" stroke="#2f6df6" stroke-width="5" marker-end="url(#arrow)"/>

<path d="M1330 590C1330 730 965 735 965 635" fill="none" stroke="#183b84" stroke-width="3" stroke-dasharray="10 10" marker-end="url(#arrowNavy)"/>
<text x="1040" y="718" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="800" fill="#183b84">OUTCOME / CRM CONTEXT FEEDBACK</text>
<text x="1040" y="744" font-family="Inter,Arial,sans-serif" font-size="14" fill="#748198">Normalized, permissioned, never silently promoted to property truth</text>

<rect x="90" y="785" width="1420" height="58" rx="18" fill="#183b84"/>
<text x="120" y="821" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#fff">Core rule: the automation may move fast, but every important action must still be explainable, permissioned, and tied to evidence.</text>
</svg>