<body>
<div class="pl-toast" id="pl-toast"></div>
<div class="plm-note-overlay" id="plm-note-overlay" onclick="if(event.target===this)plCloseNote()"></div>

<section class="gate" id="hm-gate" style="display:none;">
  <h1>Sign in to see this report</h1>
  <p>Property reports are built from the homes you have saved to your account.</p>
  <button class="db-btn" onclick="plSignInPrompt()">Sign in</button>
  <a class="gate-back" href="/property/">Back to the property lookup</a>
</section>

<main id="hm-main" style="display:none;">

  <header class="hm-top">
    <div class="hm-top-in">
      <a class="hm-back" href="/property/dashboard.html"><i class="fas fa-chevron-left"></i> All properties</a>
      <select id="hm-switch" onchange="hmSwitch(this.value)"></select>
      <div class="hm-top-r">
        <button class="hm-tl" onclick="hmGlossary()"><i class="fas fa-book"></i> Glossary</button>
        <button class="hm-tl" onclick="window.print()"><i class="fas fa-print"></i> Print</button>
      </div>
    </div>
  </header>

  <div id="hm-body"></div>

</main>
