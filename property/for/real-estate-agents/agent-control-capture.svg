ht="28" rx="8" fill="#eef4ff"/><text x="1066" y="39" text-anchor="middle" font-size="9" font-weight="800" fill="#2f6df6">WATCH</text></g><text x="1183" y="414" font-size="9" font-weight="800" fill="#2f6df6" letter-spacing="1.2">TERRITORY INTELLIGENCE</text><text x="1183" y="445" font-size="18" font-weight="800">Where your sphere needs attention</text><line x1="1183" y1="468" x2="1540" y2="468" stroke="#edf1f6"/><text x="1183" y="499" font-size="12" font-weight="700">Cherry Hill Twp</text><text x="1518" y="499" text-anchor="end" font-size="18" font-weight="800">7</text><line x1="1183" y1="520" x2="1540" y2="520" stroke="#edf1f6"/><text x="1183" y="551" font-size="12" font-weight="700">Washington Twp</text><text x="1518" y="551" text-anchor="end" font-size="18" font-weight="800">4</text><line x1="1183" y1="575" x2="1540" y2="575" stroke="#edf1f6"/><text x="1183" y="619" font-size="9" font-weight="800" fill="#2f6df6" letter-spacing="1.2">YOUR WORKLOAD</text><text x="1183" y="647" font-size="18" font-weight="800">Sphere coverage</text><rect x="1183" y="669" width="335" height="8" rx="4" fill="#edf1f6"/><rect x="1183" y="669" width="228" height="8" rx="4" fill="#2f6df6"/><text x="1183" y="704" font-size="11" fill="#68788c">17 of 25 Agent-plan property seats in use.</text><rect x="1183" y="748" width="335" height="92" rx="14" fill="#172f55"/><text x="1203" y="775" font-size="8" font-weight="800" fill="#a9c4ff" letter-spacing="1.1">HOW WATCHDOG WORKS</text><text x="1203" y="801" font-size="15" font-weight="800" fill="#fff">Evidence, not lead scoring</text><text x="1203" y="825" font-size="10" fill="#c8d6e8">Watchdog ranks useful property information.</text></g></svg>