<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">Watchdog Agent Control</title><desc id="d">Representative Watchdog Agent Control interface showing an Opportunity Desk for New Jersey real estate agents.</desc><defs><linearGradient id="hero" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#172f55"/><stop offset=".62" stop-color="#214b88"/><stop offset="1" stop-color="#2f6df6"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#18365c" flood-opacity=".12"/></filter></defs><rect width="1600" height="900" rx="28" fill="#f5f7fb"/><g font-family="Arial,Helvetica,sans-serif" fill="#111d38"><rect x="30" y="26" width="1540" height="68" rx="16" fill="#fff" stroke="#e2e7ef"/><rect x="54" y="44" width="38" height="38" rx="10" fill="#2f6df6"/><text x="73" y="70" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">W</text><text x="108" y="62" font-size="17" font-weight="800">Watchdog</text><text x="108" y="78" font-size="7" font-weight="700" fill="#7b8aa0" letter-spacing="1.4">PROPERTY INTELLIGENCE</text><text x="1325" y="68" font-size="11" fill="#66768c">Properties    Reports    Account</text><rect x="30" y="108" width="1540" height="56" rx="14" fill="#fff" stroke="#e2e7ef"/><rect x="54" y="119" width="150" height="34" rx="9" fill="#eef4ff"/><text x="72" y="141" font-size="11" font-weight="700" fill="#244f9d">Opportunity Desk</text><text x="225" y="141" font-size="11" fill="#617189">Farm Map</text><text x="304" y="141" font-size="11" fill="#617189">Growth</text><text x="365" y="141" font-size="11" fill="#617189">Advanced Farm</text><rect x="1410" y="119" width="132" height="34" rx="9" fill="#172f55"/><text x="1476" y="141" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">Add your sphere</text><rect x="30" y="179" width="1540" height="180" rx="22" fill="url(#hero)" filter="url(#s)"/><text x="64" y="222" font-size="10" font-weight="800" fill="#a9c4ff"