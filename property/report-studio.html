<!doctype html><html lang="en" data-access-require="pro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Report Studio | Watchdog</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Source+Sans+3:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"><link rel="stylesheet" href="/property/css/report-studio.css?v=20260811b"><style>html,body{min-height:100%;margin:0;background:#eef2f5}.rs-appbar{height:58px;box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;padding:0 14px 0 18px;background:#0d2748;color:#fff;font-family:"Source Sans 3",sans-serif;position:sticky;top:0;z-index:100}.rs-brand{display:flex;align-items:center;gap:11px;font-weight:800}.rs-brand i{width:32px;height:32px;border-radius:10px;background:#099393;display:grid;place-items:center}.rs-tabs{display:flex;gap:5px}.rs-tabs a,.rs-window-btn{border:0;border-radius:9px;background:transparent;color:#c8d7e7;text-decoration:none;padding:9px 12px;font:800 13px "Source Sans 3";cursor:pointer}.rs-tabs a.on,.rs-tabs a:hover,.rs-window-btn:hover{background:rgba(255,255,255,.1);color:#fff}.rs-window-actions{display:flex;gap:4px}.rs-shell{padding-top:24px!important}@media print{.rs-appbar{display:none!important}}@media(max-width:800px){.rs-tabs{display:none}.rs-appbar{height:52px}}</style></head><body data-plan-auto="true"><header class="rs-appbar"><div class="rs-brand"><i class="fas fa-file-lines"></i><div>Watchdog Report Studio</div></div><nav class="rs-tabs"><a id="rs-map-tab" href="/property/farm-map.html"><i class="fas fa-map"></i> Map</a><a id="rs-db-tab" href="#"><i class="fas fa-table"></i> Farm database</a><a class="on" href="#"><i class="fas fa-file-lines"></i> Reports</a></nav><div class="rs-window-actions"><button class="rs-window-btn" id="rs-fullscreen" title="Fullscreen"><i class="fas fa-expand"></i></button><button class="rs-window-btn" id="rs-close" title="Close tool"><i class="fas fa-xmark"></i></button></div></header><main><div id="rs-app" class="rs-shell"><div class="rs-loading"><i class="fas fa-circle-notch fa-spin"></i> Preparing report studio…</div></div></main><div id="pl-toast" class="pl-toast"></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script src="/property/js/access-guard.js"></script><script src="/property/js/report-studio.js?v=20260811b"></script><script>document.getElementById('rs-fullscreen').onclick=async()=>{try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()}catch(e){}};document.getElementById('rs-close').onclick=()=>{if(window.opener&&!window.opener.closed)window.close();else history.length>1?history.back():location.href='/property/agent-desk.html'};</script></body></html>
