<!doctype html>
<html lang="en" data-access-require="developer">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="referrer" content="same-origin">
  <title>Quote Image | Watchdog Backoffice</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700;800&family=Inter:wght@400;500;700&family=Caveat:wght@600&display=swap">
  <link rel="stylesheet" href="/property/backoffice/backoffice-board.css?v=20260928a">
  <link rel="stylesheet" href="/property/backoffice/quote-image/quote-image.css?v=20261029a">
</head>
<body class="bo-body" data-bo-page="quote-image">
  <a class="bo-skip" href="#bo-main">Skip to content</a>

  <header class="bo-shell">
    <div class="bo-shell-bar">
      <a class="bo-brand" href="/backoffice"><span class="bo-mark" aria-hidden="true">W</span><span class="bo-brand-text"><b>Watchdog</b><small>Backoffice</small></span></a>
      <nav class="bo-nav" aria-label="Backoffice">
        <a href="/backoffice#leads">Leads</a>
        <a href="/backoffice#leadiq">LeadIQ Tools</a>
        <a href="/backoffice/reviews" data-bo-dev-only hidden>Application Reviews <span class="bo-review-badge" data-bo-badge="reviews" hidden><span data-bo-badge-count>0</span><span class="bo-sr"> waiting</span></span></a>
        <a href="/backoffice/professional-verifications" data-bo-dev-only hidden>Professional Reviews <span class="bo-review-badge" data-bo-badge="professional" hidden><span data-bo-badge-count>0</span><span class="bo-sr"> waiting</span></span></a>
        <a href="/backoffice/town-info" data-bo-dev-only hidden>Town Info <span class="bo-review-badge" data-bo-badge="town" hidden><span data-bo-badge-count>0</span><span class="bo-sr"> waiting</span></span></a>
        <a href="/backoffice/realestate" data-bo-dev-only hidden>Real Estate OS</a>
        <a href="/backoffice/image-cleaner" data-bo-dev-only hidden>Image Cleaner</a>
        <a href="/backoffice/quote-image" aria-current="page" data-bo-dev-only hidden>Quote Image</a>
        <a href="/backoffice/team-listings">Team Listings</a>
      </nav>
      <div class="bo-shell-session">
        <button type="button" class="bo-btn bo-btn-ghost bo-lock" data-bo-lock>Lock Backoffice</button>
      </div>
    </div>
  </header>

  <main class="bo-page qi-main" id="bo-main" tabindex="-1">
    <header class="qi-topbar">
      <h1>Quote Image</h1>
    </header>

    <div class="qi-grid">
      <section class="qi-panel qi-form">
        <fieldset class="qi-styles">
          <legend class="qi-label">Style</legend>
          <label><input type="radio" name="qi-style" value="x" checked> X</label>
          <label><input type="radio" name="qi-style" value="threads"> Threads</label>
          <label><input type="radio" name="qi-style" value="instagram"> Instagram</label>
        </fieldset>
        <fieldset class="qi-colors">
          <legend class="qi-label">Colors</legend>
          <div class="qi-swatches">
            <button type="button" class="qi-swatch" data-qi-bg="#ffffff" data-qi-text="#000000" aria-label="White with black text">Aa</button>
            <button type="button" class="qi-swatch" data-qi-bg="#000000" data-qi-text="#ffffff" aria-label="Black with white text">Aa</button>
            <button type="button" class="qi-swatch" data-qi-bg="#15202b" data-qi-text="#f7f9f9" aria-label="Dark blue with white text">Aa</button>
            <button type="button" class="qi-swatch" data-qi-bg="#f4f1ea" data-qi-text="#000000" aria-label="Cream with black text">Aa</button>
            <button type="button" class="qi-swatch" data-qi-bg="#0e2248" data-qi-text="#ffffff" aria-label="Navy with white text">Aa</button>
            <button type="button" class="qi-swatch" data-qi-bg="#1d9bf0" data-qi-text="#ffffff" aria-label="Blue with white text">Aa</button>
          </div>
          <div class="qi-pickers">
            <label><input type="color" id="qi-bg" value="#ffffff"> Background</label>
            <label><input type="color" id="qi-color" value="#000000"> Text</label>
            <label><input type="color" id="qi-highlight" value="#1d9bf0"> *Highlight*</label>
          </div>
        </fieldset>
        <fieldset class="qi-extras">
          <legend class="qi-label">Extras</legend>
          <div class="qi-extra-row">
            <label class="bo-btn bo-btn-ghost" for="qi-photos">Add photos to post</label>
            <input class="bo-sr" id="qi-photos" type="file" accept="image/*" multiple>
            <button class="qi-link" id="qi-photos-clear" type="button" hidden>Remove photos</button>
          </div>
          <div class="qi-extra-row">
            <label class="bo-btn bo-btn-ghost" for="qi-background">Background photo</label>
            <input class="bo-sr" id="qi-background" type="file" accept="image/*">
            <button class="qi-link" id="qi-background-clear" type="button" hidden>Remove background</button>
          </div>
          <label class="qi-extra-row qi-range" id="qi-dim-row" hidden>Darken photo <input type="range" id="qi-dim" min="0" max="80" step="5" value="35"></label>
          <div class="qi-extra-row qi-checks">
            <label><input type="checkbox" id="qi-liked"> Liked</label>
            <label><input type="checkbox" id="qi-saved"> Saved</label>
          </div>
          <div class="qi-extra-row qi-sign">
            <input type="text" id="qi-signature" maxlength="40" placeholder="Signature" aria-label="Signature">
            <label><input type="checkbox" id="qi-script" checked> Handwritten</label>
          </div>
        </fieldset>
        <label class="qi-label" for="qi-text">Your text</label>
        <textarea id="qi-text" rows="7" maxlength="600">A lot of confidence
is just deciding
not to over-explain
yourself.</textarea>
        <div class="qi-actions">
          <button class="bo-btn bo-btn-primary" id="qi-download" type="button">Download PNG</button>
          <button class="bo-btn bo-btn-ghost" id="qi-copy" type="button" hidden>Copy image</button>
        </div>
      </section>

      <section class="qi-panel qi-preview">
        <canvas id="qi-canvas" width="1122" height="1402" role="img" aria-label="Preview of the post image"></canvas>
      </section>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="/property/js/access-guard.js"></script>
  <script src="/property/backoffice/backoffice-shell.js?v=20260930a" defer></script>
  <script src="/property/backoffice/quote-image/quote-image.js?v=20261029a" defer></script>
</body>
</html>
