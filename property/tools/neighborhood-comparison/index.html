<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Neighborhood Comparison</title><link rel="stylesheet" href="../market-value/market-value.css"></head><body><main class="shell"><nav><a href="../../dashboard.html">← Dashboard</a></nav><header class="hero"><p class="eyebrow">EQUITY SCREENING</p><h1>Neighborhood Comparison</h1><p>Compare the subject property with nearby homes using the same simple metrics.</p></header><section class="panel form-grid"><label>Subject assessed value<input id="subjectAssessment"></label><label>Subject estimated value<input id="subjectValue"></label><label>Subject living area<input id="subjectSqft"></label><span></span><div id="neighbors" style="grid-column:1/-1"></div><button id="add">Add nearby property</button><button id="analyze">Analyze neighborhood</button><p id="message"></p></section><template id="tpl"><div class="form-grid panel neighbor"><label>Address<input data-f="address"></label><label>Assessment<input data-f="assessment"></label><label>Estimated value or sale price<input data-f="value"></label><label>Living area<input data-f="sqft"></label><button type="button" class="remove">Remove</button></div></template><section class="panel" id="results" hidden><div class="metric-grid"><article><span>Subject ratio</span><strong id="subjectRatio">—</strong></article><article><span>Neighborhood median ratio</span><strong id="medianRatio">—</strong></article><article><span>Ratio difference</span><strong id="gap">—</strong></article><article><span>Assessment per sq. ft.</span><strong id="assessmentPsf">—</strong></article></div><p id="explanation"></p></section></main><script src="../../js/property-data-model.js"></script><script src="neighborhood-comparison.js"></script></body></html>
