<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Shared Watchdog Report</title><link rel="stylesheet" href="/property/css/report-builder.css?v=20260826b"><style>.sr-wrap{max-width:960px;margin:32px auto;padding:0 20px}.sr-actions{display:flex;justify-content:flex-end;margin-bottom:14px}.sr-actions button{border:0;border-radius:12px;background:#102a4c;color:#fff;padding:11px 16px;font-weight:800;cursor:pointer}.sr-summary{font-size:16px;line-height:1.6;color:#334a63}.sr-net{margin-top:18px;border-top:1px solid #dbe5ed;padding-top:18px}.sr-net-row{display:flex;justify-content:space-between;gap:20px;padding:9px 0;border-bottom:1px solid #edf2f6}.sr-net-row.total{font-size:18px;font-weight:800}.sr-note{margin-top:16px;padding:14px;border-radius:12px;background:#f4f8fa;color:#607085;font-size:13px;line-height:1.5}.sr-sources{margin-top:22px}.sr-source{padding:8px 0;border-top:1px solid #edf2f6;font-size:13px;color:#607085}@media print{.sr-actions{display:none}.sr-wrap{margin:0;max-width:none}}</style></head><body><main class="sr-wrap"><div class="sr-actions"><button type="button" onclick="window.print()">Print shared snapshot</button></div><section id="shared-report" class="rb-card"><div class="rb-empty"><h2>Opening secure report…</h2></div></section></main><script>!function(){var t=new URLSearchParams(location.search).get('token'),r=document.getElementById('shared-report');function e(v){return String(v==null?'':v).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}function m(v){var n=Number(v);return Number.isFinite(n)?new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:2}).format(n):'Not available'}function brand(b){b=b||{};var bits=[];if(b.brokerage_name)bits.push(e(b.brokerage_name));if(b.license_number)bits.push('NJ license '+e(b.license_number));if(b.business_phone)bits.push(e(b.business_phone));if(b.business_email)bits.push(e(b.business_email));return'<section class="rb-brand"><div class="rb-brand-primary">'+(b.headshot_url?'<img class="rb-brand-headshot" src="'+e(b.headshot_url)+'" alt="">':'')+'<div><span>PREPARED BY</span><h3>'+e(b.agent_name||'Watchdog professional')+'</h3><p>'+bits.join(' · ')+'</p></div></div><div class="rb-brand-data">'+(b.brokerage_logo_url?'<img src="'+e(b.brokerage_logo_url)+'" alt="Brokerage logo">':'')+'<b>Data by Watchdog</b><small>Governed New Jersey property intelligence</small></div></section>'+(b.disclosure?'<p class="rb-brand-disclosure">'+e(b.disclosure)+'</p>':'')}function net(n,p){if(!n)return'';return'<section class="sr-net"><h2>Seller net sheet estimate</h2><div class="sr-net-row"><span>Sale price</span><b>'+m(n.sale_price)+'</b></div><div class="sr-net-row"><span>Commission ('+e(Number(n.commission_rate||0).toFixed(2))+'%)</span><b>'+m(n.commission_amount)+'</b></div><div class="sr-net-row"><span>NJ Realty Transfer Fee</span><b>'+m(n.realty_transfer_fee)+'</b></div><div class="sr-net-row"><span>Graduated Percent Fee</span><b>'+m(n.graduated_percent_fee)+'</b></div><div class="sr-net-row"><span>Mortgage / lien payoff</span><b>'+m(n.mortgage_payoff)+'</b></div><div class="sr-net-row"><span>Other seller costs entered</span><b>'+m(n.other_seller_costs)+'</b></div><div class="sr-net-row total"><span>Estimated seller net</span><b>'+m(n.estimated_net)+'</b></div><div class="sr-note">Current recorded annual property tax context: <b>'+m(p.last_year_tax)+'</b>. Buyer tax obligations can change after sale, reassessment, exemption changes or municipal updates and are not predicted here. '+e(n.disclaimer||'Estimate only; confirm closing figures with the applicable professionals and county recording office.')+'</div></section>'}if(!t){r.innerHTML='<h1>Link unavailable</h1>';return}fetch('https://uvkvaxljhhngydvlrzom.supabase.co/functions/v1/report-share?token='+encodeURIComponent(t)).then(function(x){return x.json().then(function(j){if(!x.ok)throw Error(j.error);return j})}).then(function(j){var c=j.content||{},p=c.evidence_snapshot||{},sources=j.source_manifest||[];document.title=e(c.title||'Professional report')+' | Watchdog';r.innerHTML=brand(c.agent_branding)+'<span class="rb-kicker">READ-ONLY PROFESSIONAL REPORT</span><h1>'+e(c.title||'Professional report')+'</h1><p class="sr-summary">'+e(c.summary||'No narrative was saved.')+'</p><h2>Evidence snapshot</h2><div class="rb-evidence"><article><span>ASSESSED</span><b>'+m(p.assessed)+'</b></article><article><span>ANNUAL TAX</span><b>'+m(p.last_year_tax)+'</b></article><article><span>MARKET VALUE</span><b>'+m(p.watchdog_value)+'</b></article></div>'+net(c.seller_net_sheet,p)+'<section class="sr-sources"><h2>Source manifest</h2>'+sources.map(function(s){return'<div class="sr-source"><b>'+e(s.marker_id)+'</b> — '+e(s.source)+(s.source_url?' · '+e(s.source_url):'')+'</div>'}).join('')+'</section><p class="sr-note">Shared report version '+e(j.version_no||j.version_number||'—')+' · expires '+e(new Date(j.expires_at).toLocaleString())+'. This is a point-in-time informational snapshot; public records and derived analytics can change after publication.</p>'}).catch(function(x){r.innerHTML='<h1>Report unavailable</h1><p>'+e(x.message||'This link expired or was revoked.')+'</p>'})}();</script></body></html>
