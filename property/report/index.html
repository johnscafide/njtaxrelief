<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Shared Watchdog Report</title><link rel="stylesheet" href="/property/css/report-builder.css?v=20260827a"><style>.sr-wrap{max-width:960px;margin:32px auto;padding:0 20px}.sr-actions{display:flex;justify-content:flex-end;margin-bottom:14px}.sr-actions button{border:0;border-radius:12px;background:#102a4c;color:#fff;padding:11px 16px;font-weight:800;cursor:pointer}.sr-summary{font-size:16px;line-height:1.6;color:#334a63}.sr-section{margin-top:18px;border-top:1px solid #dbe5ed;padding-top:18px}.sr-row{display:flex;justify-content:space-between;gap:20px;padding:9px 0;border-bottom:1px solid #edf2f6}.sr-row.total{font-size:18px;font-weight:800}.sr-note{margin-top:16px;padding:14px;border-radius:12px;background:#f4f8fa;color:#607085;font-size:13px;line-height:1.5}.sr-sources{margin-top:22px}.sr-source{padding:8px 0;border-top:1px solid #edf2f6;font-size:13px;color:#607085}@media(max-width:640px){.sr-row{align-items:flex-start;flex-direction:column;gap:4px}.sr-actions{justify-content:stretch}.sr-actions button{width:100%}}@media print{.sr-actions{display:none}.sr-wrap{margin:0;max-width:none}}</style></head><body><main class="sr-wrap"><div class="sr-actions"><button type="button" onclick="window.print()">Print shared snapshot</button></div><section id="shared-report" class="rb-card"><div class="rb-empty"><h2>Opening secure report…</h2></div></section></main><script>!function(){var t=new URLSearchParams(location.search).get('token'),r=document.getElementById('shared-report');function e(v){return String(v==null?'':v).replace(/[&<>\"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]})}function f(v){if(v===null||v===undefined||v==='')return null;var n=Number(v);return Number.isFinite(n)?n:null}function m(v){var n=f(v);return n==null?'Not available':new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:2}).format(n)}function pct(v){var n=f(v);return n==null?'Not available':(n*100).toFixed(1)+'%'}function brand(b){b=b||{};var bits=[];if(b.brokerage_name)bits.push(e(b.brokerage_name));if(b.license_number)bits.push('NJ license '+e(b.license_number));if(b.business_phone)bits.push(e(b.business_phone));if(b.business_email)bits.push(e(b.business_email));return'<section class="rb-brand"><div class="rb-brand-primary">'+(b.headshot_url?'<img class="rb-brand-headshot" src="'+e(b.headshot_url)+'" alt="">':'')+'<div><span>PREPARED BY</span><h3>'+e(b.agent_name||'Watchdog professional')+'</h3><p>'+bits.join(' · ')+'</p></div></div><div class="rb-brand-data">'+(b.brokerage_logo_url?'<img src="'+e(b.brokerage_logo_url)+'" alt="Brokerage logo">':'')+'<b>Data by Watchdog</b><small>Governed New Jersey property intelligence</small></div></section>'+(b.disclosure?'<p class="rb-brand-disclosure">'+e(b.disclosure)+'</p>':'')}function homeowner(h){if(!h)return'';var q=h.chapter123||{},a=h.appeal_economics||{},score=f(h.watchdog_score);return'<section class="sr-section"><h2>Homeowner tax position</h2><div class="sr-row"><span>Watchdog Score</span><b>'+(score==null?'Not available':e(Math.round(score))+' / 100')+'</b></div><div class="sr-row"><span>Official 2026 Chapter 123 ratio</span><b>'+(f(q.official_ratio_pct)==null?'Not available':e(Number(q.official_ratio_pct).toFixed(2))+'%')+'</b></div><div class="sr-row"><span>Official 2026 upper ratio</span><b>'+(f(q.official_upper_pct)==null?'Not available':e(Number(q.official_upper_pct).toFixed(2))+'%')+'</b></div><div class="sr-row"><span>Independent governed value anchor</span><b>'+m(q.independent_value_anchor)+'</b></div><div class="sr-row"><span>Chapter 123 upper-bound assessment</span><b>'+m(q.upper_supported_assessment)+'</b></div><div class="sr-row"><span>Assessment above upper bound</span><b>'+m(q.gap_amount)+'</b></div><div class="sr-row"><span>Assessment gap</span><b>'+pct(q.gap_fraction)+'</b></div><div class="sr-row total"><span>Annual dollars at stake</span><b>'+m(a.annual_dollars_at_stake)+'</b></div><div class="sr-note">'+e(h.disclaimer||'Screening estimate only. Watchdog does not determine appeal eligibility, legal outcome, exemption status or guaranteed savings.')+'</div></section>'}function net(n,p){if(!n)return'';return'<section class="sr-section"><h2>Seller net sheet estimate</h2><div class="sr-row"><span>Sale price</span><b>'+m(n.sale_price)+'</b></div><div class="sr-row"><span>Commission ('+e(Number(n.commission_rate||0).toFixed(2))+'%)</span><b>'+m(n.commission_amount)+'</b></div><div class="sr-row"><span>NJ Realty Transfer Fee</span><b>'+m(n.realty_transfer_fee)+'</b></div><div class="sr-row"><span>Graduated Percent Fee</span><b>'+m(n.graduated_percent_fee)+'</b></div><div class="sr-row"><span>Mortgage / lien payoff</span><b>'+m(n.mortgage_payoff)+'</b></div><div class="sr-row"><span>Other seller costs entered</span><b>'+m(n.other_seller_costs)+'</b></div><div class="sr-row total"><span>Estimated seller net</span><b>'+m(n.estimated_net)+'</b></div><div class="sr-note">Current recorded annual property tax context: <b>'+m(p.last_year_tax)+'</b>. Buyer tax obligations can change after sale, reassessment, exemption changes or municipal updates and are not predicted here. '+e(n.disclaimer||'Estimate only; confirm closing figures with the applicable professionals and county recording office.')+'</div></section>'}function municipal(x){if(!x)return'';if(x.status!=='available')return'<section class="sr-section"><h2>Municipality tax context</h2><div class="sr-note">'+e(x.disclaimer||'No governed municipal median annual-tax value was available. Watchdog did not substitute a proxy.')+'</div></section>';return'<section class="sr-section"><h2>Municipality tax context</h2><div class="sr-row"><span>Recorded annual property tax</span><b>'+m(x.property_annual_tax)+'</b></div><div class="sr-row"><span>2026 municipal median annual tax</span><b>'+m(x.median_annual_tax)+'</b></div><div class="sr-row total"><span>Difference vs municipal median</span><b>'+m(x.delta_amount)+'</b></div><div class="sr-note">'+e(x.disclaimer||'Descriptive municipality context only. This is not a forecast of a future buyer tax bill.')+'</div></section>'}if(!t){r.innerHTML='<h1>Link unavailable</h1>';return}fetch('https://uvkvaxljhhngydvlrzom.supabase.co/functions/v1/report-share?token='+encodeURIComponent(t)).then(function(x){return x.json().then(function(j){if(!x.ok)throw Error(j.error);return j})}).then(function(j){var c=j.content||{},p=c.evidence_snapshot||{},sources=j.source_manifest||[];document.title=e(c.title||'Professional report')+' | Watchdog';r.innerHTML=brand(c.agent_branding)+'<span class="rb-kicker">READ-ONLY PROFESSIONAL REPORT</span><h1>'+e(c.title||'Professional report')+'</h1><p class="sr-summary">'+e(c.summary||'No narrative was saved.')+'</p><h2>Evidence snapshot</h2><div class="rb-evidence"><article><span>ASSESSED</span><b>'+m(p.assessed)+'</b></article><article><span>ANNUAL TAX</span><b>'+m(p.last_year_tax)+'</b></article><article><span>MARKET VALUE</span><b>'+m(p.watchdog_value)+'</b></article></div>'+homeowner(c.homeowner_one_pager)+net(c.seller_net_sheet,p)+municipal(c.municipality_tax_context)+'<section class="sr-sources"><h2>Source manifest</h2>'+sources.map(function(s){return'<div class="sr-source"><b>'+e(s.marker_id)+'</b> — '+e(s.source)+(s.source_url?' · '+e(s.source_url):'')+'</div>'}).join('')+'</section><p class="sr-note">Shared report version '+e(j.version_no||j.version_number||'—')+' · expires '+e(new Date(j.expires_at).toLocaleString())+'. This is a point-in-time informational snapshot; public records and derived analytics can change after publication. Homeowner tax-position figures are screening estimates and seller-net figures are estimates from stated inputs, not legal, tax, lending, title or closing advice.</p>'}).catch(function(x){r.innerHTML='<h1>Report unavailable</h1><p>'+e(x.message||'This link expired or was revoked.')+'</p>'})}();</script></body></html>
