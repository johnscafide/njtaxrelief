<!-- ============================================================
     WATCHDOG PROPERTY NAVIGATION
     Self-contained HTML, CSS, and JavaScript
     ============================================================ -->

<style>
    #wd-property-nav {
        --wdn-teal: #078486;
        --wdn-teal-dark: #056b6d;
        --wdn-navy: #10294b;
        --wdn-gold: #b89518;
        --wdn-text: #152d52;
        --wdn-muted: #697381;
        --wdn-border: #dce3ea;
        --wdn-soft: #f5f7fa;
        --wdn-white: #fff;

        background: #fff;
        border: 0;
        border-bottom: 1px solid #e4e8ec;
        border-radius: 0;
        box-shadow: 0 2px 12px rgba(16, 41, 75, 0.06);
        color: var(--wdn-text);
        display: block;
        font-family: "Source Sans 3", Arial, sans-serif;
        font-size: 16px;
        font-style: normal;
        font-weight: 400;
        left: 0;
        letter-spacing: normal;
        line-height: 1.4;
        margin: 0;
        max-width: none;
        min-height: 0;
        padding: 0;
        position: sticky;
        right: 0;
        text-align: left;
        text-transform: none;
        top: 0;
        width: 100%;
        z-index: 5000;
    }

    #wd-property-nav,
    #wd-property-nav * {
        box-sizing: border-box;
    }

    #wd-property-nav .wdn-inner {
        align-items: center;
        background: #fff;
        border: 0;
        box-shadow: none;
        display: grid;
        gap: 22px;
        grid-template-columns: auto minmax(320px, 1fr) auto;
        margin: 0 auto;
        max-width: 1540px;
        min-height: 76px;
        padding: 10px 28px;
        width: 100%;
    }

    /* ==========================================================
       BRAND
       ========================================================== */

    #wd-property-nav .wdn-brand {
        align-items: center;
        background: transparent;
        border: 0;
        box-shadow: none;
        color: var(--wdn-navy);
        display: inline-flex;
        flex-shrink: 0;
        gap: 10px;
        margin: 0;
        padding: 6px 0;
        text-decoration: none;
        transform: none;
        white-space: nowrap;
    }

    #wd-property-nav .wdn-brand:hover,
    #wd-property-nav .wdn-brand:focus-visible {
        background: transparent;
        color: var(--wdn-teal);
        text-decoration: none;
        transform: none;
    }

    #wd-property-nav .wdn-brand-icon {
        align-items: center;
        background: var(--wdn-teal);
        border-radius: 50%;
        color: #fff;
        display: inline-flex;
        flex: 0 0 37px;
        height: 37px;
        justify-content: center;
        width: 37px;
    }

    #wd-property-nav .wdn-brand-icon i {
        color: #fff;
        font-size: 17px;
        margin: 0;
    }

    #wd-property-nav .wdn-brand-name {
        color: inherit;
        font-family: "Plus Jakarta Sans", Arial, sans-serif;
        font-size: 19px;
        font-weight: 800;
        letter-spacing: -0.5px;
        line-height: 1;
        text-transform: none;
    }

    /* ==========================================================
       ADDRESS SEARCH
       ========================================================== */

    #wd-property-nav .wdn-search {
        align-items: center;
        background: var(--wdn-soft);
        border: 1px solid var(--wdn-border);
        border-radius: 999px;
        box-shadow: none;
        display: flex;
        height: 52px;
        margin: 0;
        max-width: 760px;
        min-width: 0;
        overflow: hidden;
        padding: 0 6px 0 7px;
        transition:
            border-color 0.18s ease,
            box-shadow 0.18s ease;
        width: 100%;
    }

    #wd-property-nav .wdn-search:focus-within {
        border-color: var(--wdn-teal);
        box-shadow: 0 0 0 3px rgba(7, 132, 134, 0.12);
    }

    #wd-property-nav .wdn-location {
        align-items: center;
        background: transparent;
        border: 0;
        border-radius: 50%;
        box-shadow: none;
        color: var(--wdn-muted);
        cursor: pointer;
        display: inline-flex;
        flex: 0 0 40px;
        height: 40px;
        justify-content: center;
        margin: 0;
        padding: 0;
        transform: none;
        width: 40px;
    }

    #wd-property-nav .wdn-location:hover,
    #wd-property-nav .wdn-location:focus-visible {
        background: #e9eef3;
        color: var(--wdn-teal);
        transform: none;
    }

    #wd-property-nav .wdn-location i {
        color: inherit;
        font-size: 17px;
        margin: 0;
    }

    #wd-property-nav .wdn-address {
        appearance: none;
        background: transparent;
        border: 0;
        border-radius: 0;
        box-shadow: none;
        color: var(--wdn-navy);
        flex: 1 1 auto;
        font-family: "Source Sans 3", Arial, sans-serif;
        font-size: 16px;
        font-weight: 500;
        height: 46px;
        line-height: normal;
        margin: 0;
        min-width: 0;
        outline: none;
        padding: 0 12px;
        width: 100%;
    }

    #wd-property-nav .wdn-address::placeholder {
        color: #747c87;
        opacity: 1;
    }

    #wd-property-nav .wdn-search-button {
        align-items: center;
        background: var(--wdn-navy);
        border: 0;
        border-radius: 50%;
        box-shadow: none;
        color: #fff;
        cursor: pointer;
        display: inline-flex;
        flex: 0 0 42px;
        height: 42px;
        justify-content: center;
        margin: 0;
        padding: 0;
        transform: none;
        transition:
            background-color 0.18s ease,
            transform 0.18s ease;
        width: 42px;
    }

    #wd-property-nav .wdn-search-button:hover,
    #wd-property-nav .wdn-search-button:focus-visible {
        background: var(--wdn-teal);
        transform: scale(1.03);
    }

    #wd-property-nav .wdn-search-button i {
        color: #fff;
        font-size: 17px;
        margin: 0;
    }

    /* ==========================================================
       MOBILE BUTTON
       ========================================================== */

    #wd-property-nav .wdn-mobile-button {
        align-items: center;
        background: transparent;
        border: 1px solid var(--wdn-border);
        border-radius: 7px;
        box-shadow: none;
        color: var(--wdn-navy);
        cursor: pointer;
        display: none;
        flex: 0 0 42px;
        height: 42px;
        justify-content: center;
        margin: 0;
        padding: 0;
        transform: none;
        width: 42px;
    }

    #wd-property-nav .wdn-mobile-button:hover,
    #wd-property-nav .wdn-mobile-button:focus-visible {
        background: #f0f5f5;
        color: var(--wdn-teal);
        transform: none;
    }

    #wd-property-nav .wdn-mobile-button i {
        color: inherit;
        font-size: 18px;
        margin: 0;
    }

    #wd-property-nav .wdn-menu-button {
        display: inline-flex;
        flex: 0 0 auto;
        gap: 8px;
        min-height: 44px;
        height: 44px;
        padding: 0 14px;
        width: auto;
        font: 700 14px/1 "Source Sans 3", Arial, sans-serif;
    }

    #wd-property-nav .wdn-menu-label {
        color: inherit;
    }

    /* ==========================================================
       RESPONSIVE
       ========================================================== */

    @media (max-width: 1260px) {
        #wd-property-nav .wdn-inner {
            grid-template-columns: auto minmax(280px, 1fr) auto;
            gap: 16px;
            padding-left: 20px;
            padding-right: 20px;
        }

    }

    @media (max-width: 980px) {
        #wd-property-nav .wdn-inner {
            grid-template-columns: auto minmax(180px, 1fr) auto;
        }

        #wd-property-nav .wdn-menu-label {
            display: none;
        }

        #wd-property-nav .wdn-menu-button {
            padding: 0;
            width: 44px;
        }
    }

    @media (max-width: 620px) {
        #wd-property-nav .wdn-inner {
            gap: 10px;
            grid-template-columns: auto 1fr auto;
            min-height: 68px;
            padding: 8px 14px;
        }

        #wd-property-nav .wdn-brand-name {
            display: none;
        }

        #wd-property-nav .wdn-brand-icon {
            flex-basis: 38px;
            height: 38px;
            width: 38px;
        }

        #wd-property-nav .wdn-search {
            height: 46px;
        }

        #wd-property-nav .wdn-location {
            display: none;
        }

        #wd-property-nav .wdn-address {
            font-size: 14px;
            height: 42px;
            padding-left: 15px;
            padding-right: 8px;
        }

        #wd-property-nav .wdn-search-button {
            flex-basis: 36px;
            height: 36px;
            width: 36px;
        }

        #wd-property-nav .wdn-mobile-button {
            flex-basis: 44px;
            height: 44px;
            width: 44px;
        }
    }

    @media (max-width: 400px) {
        #wd-property-nav .wdn-inner {
            grid-template-columns: 38px minmax(0, 1fr) 44px;
        }

        #wd-property-nav .wdn-address::placeholder {
            color: transparent;
        }

        #wd-property-nav .wdn-address::before {
            content: "Search address";
        }
    }
</style>

<div
    id="wd-property-nav"
    role="navigation"
    aria-label="Main website navigation"
>
    <div class="wdn-inner">

        <!-- WATCHDOG BRAND -->
        <a href="/property/" class="wdn-brand" aria-label="Watchdog home">
            <span class="wdn-brand-icon" aria-hidden="true">
                <i class="fas fa-dog"></i>
            </span>

            <span class="wdn-brand-name">Watchdog</span>
        </a>

        <!-- PROPERTY SEARCH -->
        <div class="wdn-search" role="search">
            <button
                type="button"
                class="wdn-location"
                onclick="wdnUseLocation()"
                aria-label="Use my current location"
                title="Use my current location"
            >
                <i class="fas fa-location-arrow" aria-hidden="true"></i>
            </button>

            <input
                type="text"
                id="wdn-address"
                class="wdn-address"
                autocomplete="street-address"
                placeholder="Enter a New Jersey address"
                aria-label="Enter a New Jersey property address"
                onkeydown="if(event.key === 'Enter') wdnSearchProperty()"
            >

            <button
                type="button"
                class="wdn-search-button"
                onclick="wdnSearchProperty()"
                aria-label="Search property"
                title="Search property"
            >
                <i class="fas fa-magnifying-glass" aria-hidden="true"></i>
            </button>
        </div>

        <!-- MENU: opens the one shared Watchdog drawer (watchdog-universal-menu.js),
             the same menu used on the property index, Dashboard and Property Home. -->
        <button
            type="button"
            class="wdn-mobile-button wdn-menu-button"
            id="wdn-mobile-button"
            data-wd-universal="open-menu"
            aria-label="Open Watchdog menu"
        >
            <i class="fas fa-bars" aria-hidden="true"></i>
            <span class="wdn-menu-label">Menu</span>
        </button>
    </div>
</div>

<script>
    /*
     * Submit the address through the property lookup already used
     * by /property/index.html.
     */
    function wdnSearchProperty() {
        var navInput = document.getElementById("wdn-address");
        var address = navInput ? navInput.value.trim() : "";

        if (!address) {
            if (navInput) {
                navInput.focus();
            }

            return;
        }

        /*
         * On the property lookup page, copy the address into the
         * primary lookup input and use the existing plLookup().
         */
        var propertyInput = document.getElementById("pl-addr");

        if (
            propertyInput &&
            typeof window.plLookup === "function"
        ) {
            propertyInput.value = address;
            window.plLookup();
            return;
        }

        /*
         * Fallback for navigation used on another page.
         */
        window.location.href =
            "/property/?address=" + encodeURIComponent(address);
    }

    /*
     * Connect the location button to the existing lookup function.
     */
    function wdnUseLocation() {
        if (typeof window.plLocate === "function") {
            window.plLocate();
            return;
        }

        window.location.href = "/property/";
    }

    /*
     * The menu button opens the shared Watchdog drawer. Load its runtime once
     * (it also works when this fragment is inserted without running scripts,
     * as long as the host page loads watchdog-universal-menu.js itself).
     */
    (function () {
        var src = "/property/js/watchdog-universal-menu.js";
        if (window.WatchdogUniversalMenu || document.querySelector('script[src^="' + src + '"]')) {
            return;
        }
        var script = document.createElement("script");
        script.src = src;
        script.defer = true;
        document.head.appendChild(script);
    })();
</script>
