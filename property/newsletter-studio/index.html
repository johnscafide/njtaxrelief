<!doctype html><html lang="en" class="aw27-page" data-access-require="agent"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Email updates | Watchdog</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"><link rel="stylesheet" href="/property/css/shared/00-design-tokens.css"><link rel="stylesheet" href="/property/css/app-shell-2027.css"><link rel="stylesheet" href="/property/css/agent-workspace.css?v=20260926a"><link rel="stylesheet" href="/property/css/watchdog-page-head.css"><link rel="stylesheet" href="/property/css/email-updates.css?v=20260928a"></head><body data-sidebar-page="email-updates" data-plan-auto="true"><main><nav class="wd-crumbs wd-crumbs-row" aria-label="Breadcrumb"><a class="wd-crumbs-desk" href="/agent-desk" data-wd-route><i class="fas fa-arrow-left" aria-hidden="true"></i><span>Agent Desk</span></a><span class="wd-crumbs-sep" aria-hidden="true">/</span><a href="/agent-desk#marketing" data-wd-route>Marketing</a><span class="wd-crumbs-sep" aria-hidden="true">/</span><span class="wd-crumbs-here" aria-current="page">Email Updates</span></nav><div id="eu-app" class="eu-shell"><div class="eu-loading"><i class="fas fa-circle-notch fa-spin" aria-hidden="true"></i> Opening Email updates…</div></div></main>

<template id="eu-page">
  <header class="eu-hero">
    <div class="eu-hero-copy">
      <span class="eu-eyebrow"><i class="fas fa-paper-plane" aria-hidden="true"></i> Email updates</span>
      <h1>Write it once. Send it to your whole list.</h1>
      <p>Market updates, listing news and monthly newsletters, sent from your own Kit account. Your name, brokerage and disclosure are added to every email for you.</p>
    </div>
    <div class="eu-hero-side">
      <span class="eu-partner"><span class="eu-partner-label">In partnership with</span> <span class="eu-kit-word">Kit</span></span>
      <span class="eu-conn" data-f="connLabel"></span>
    </div>
  </header>

  <ol class="eu-steps">
    <li class="eu-step" data-step="connect">
      <div class="eu-step-head"><span class="eu-num">1</span><div><h2>Connect Kit</h2><p>Kit sends your email, handles unsubscribes and adds the legal footer. Connect it once.</p></div><span class="eu-state" data-state></span></div>
      <div class="eu-step-body">
        <div id="eu-connected" hidden>
          <p class="eu-facts"><i class="fas fa-circle-check eu-ok-ic" aria-hidden="true"></i> Connected to <b data-f="kitAccount"></b></p>
          <p class="eu-facts">Sending as <b data-f="senderLine"></b></p>
          <div class="eu-actions">
            <button type="button" class="eu-btn" id="eu-sender-edit"><i class="fas fa-user-pen" aria-hidden="true"></i> Change sender</button>
            <a class="eu-btn ghost" href="https://app.kit.com/broadcasts" target="_blank" rel="noopener"><i class="fas fa-arrow-up-right-from-square" aria-hidden="true"></i> Open Kit</a>
            <button type="button" class="eu-btn ghost danger" id="eu-disconnect"><i class="fas fa-link-slash" aria-hidden="true"></i> Disconnect</button>
          </div>
          <form class="eu-form" id="eu-sender-form" hidden novalidate>
            <label class="eu-field"><span>Name people see</span><input name="display_name" maxlength="120" autocomplete="name"></label>
            <label class="eu-field"><span>Send from this email</span><input name="email_address" type="email" maxlength="200" autocomplete="email" required></label>
            <small class="eu-note wide">Use an email address you have confirmed in Kit (Kit → Settings → Email addresses). Kit won't send from an address it hasn't confirmed.</small>
            <div class="eu-actions wide"><button type="submit" class="eu-btn dark"><i class="fas fa-floppy-disk" aria-hidden="true"></i> Save sender</button><button type="button" class="eu-btn ghost" id="eu-sender-cancel">Cancel</button></div>
          </form>
        </div>
        <div id="eu-connect" hidden>
          <ol class="eu-howto">
            <li>Open <a href="https://app.kit.com/account_settings/developer_settings" target="_blank" rel="noopener">Kit's Developer settings</a>.</li>
            <li>Under <b>V4 Keys</b>, choose <b>Add a new key</b> and copy it. It starts with <code>kit_</code>.</li>
            <li>Paste it below. Watchdog stores it server-side only and never shows it again.</li>
          </ol>
          <form class="eu-form" id="eu-connect-form" novalidate>
            <label class="eu-field wide"><span>Kit V4 API key</span><input name="api_key" type="password" autocomplete="off" spellcheck="false" maxlength="5000" required></label>
            <label class="eu-field"><span>Name people see <em>(optional)</em></span><input name="sender_name" maxlength="120" autocomplete="name"></label>
            <label class="eu-field"><span>Send from this email <em>(optional)</em></span><input name="sender_email" type="email" maxlength="200" autocomplete="email"></label>
            <div class="eu-actions wide"><button type="submit" class="eu-btn dark" id="eu-connect-btn"><i class="fas fa-plug" aria-hidden="true"></i> Connect Kit</button></div>
          </form>
          <small class="eu-note">No Kit account yet? <a href="https://kit.com" target="_blank" rel="noopener">Kit</a> has a free plan. Sign up, import your contacts, then come back here.</small>
        </div>
      </div>
    </li>

    <li class="eu-step" data-step="audience">
      <div class="eu-step-head"><span class="eu-num">2</span><div><h2>Who gets it</h2><p>Only people subscribed in your Kit account get email. Anyone who unsubscribed is skipped automatically.</p></div><span class="eu-state" data-state></span></div>
      <div class="eu-step-body">
        <fieldset class="eu-choices" id="eu-audience">
          <legend class="sr-only">Audience</legend>
          <label class="eu-choice"><input type="radio" name="audience" value="all" checked><span><b>Everyone subscribed</b><small data-f="allCount">All active subscribers in Kit</small></span></label>
          <label class="eu-choice"><input type="radio" name="audience" value="tag"><span><b>People with a tag</b><small>For example "Past clients" or "Buyers"</small></span></label>
          <label class="eu-choice"><input type="radio" name="audience" value="segment"><span><b>A segment</b><small>Saved filters from Kit</small></span></label>
        </fieldset>
        <label class="eu-field eu-pick" id="eu-tag-field" hidden><span>Tag</span><select id="eu-tag"></select></label>
        <label class="eu-field eu-pick" id="eu-segment-field" hidden><span>Segment</span><select id="eu-segment"></select></label>
        <p class="eu-count" id="eu-count" aria-live="polite"></p>
        <p class="eu-empty" id="eu-no-tags" hidden>No tags in Kit yet. Tag people in Kit (for example "Past clients") to send to a group.</p>
        <p class="eu-empty" id="eu-no-segments" hidden>No segments in Kit yet.</p>
        <details class="eu-tips" id="eu-crm-box" hidden>
          <summary>Your CRM contacts and Kit</summary>
          <p class="eu-facts">Of your CRM contacts, <b data-f="crmEligible">0</b> are subscribed in Kit, <b data-f="crmBounced">0</b> bounced and <b data-f="crmUnsub">0</b> unsubscribed.</p>
          <p class="eu-note">Watchdog never adds anyone to Kit. Import people into Kit yourself, with their permission, then re-check the match.</p>
          <div class="eu-actions"><button type="button" class="eu-btn" id="eu-reconcile"><i class="fas fa-arrows-rotate" aria-hidden="true"></i> Re-check the match</button></div>
        </details>
      </div>
    </li>

    <li class="eu-step" data-step="write">
      <div class="eu-step-head"><span class="eu-num">3</span><div><h2>Write it</h2><p>Start from a ready-made email or a blank page. The preview updates as you type.</p></div><span class="eu-state" data-state></span></div>
      <div class="eu-step-body">
        <div class="eu-starters" role="group" aria-label="Start from">
          <button type="button" class="eu-starter" data-starter="market"><i class="fas fa-chart-line" aria-hidden="true"></i> Market update</button>
          <button type="button" class="eu-starter" data-starter="listed"><i class="fas fa-house-circle-check" aria-hidden="true"></i> Just listed</button>
          <button type="button" class="eu-starter" data-starter="sold"><i class="fas fa-handshake" aria-hidden="true"></i> Just sold</button>
          <button type="button" class="eu-starter" data-starter="newsletter"><i class="fas fa-newspaper" aria-hidden="true"></i> Monthly newsletter</button>
          <button type="button" class="eu-starter" data-starter="taxes"><i class="fas fa-landmark" aria-hidden="true"></i> Property tax tip</button>
          <button type="button" class="eu-starter" data-starter="note"><i class="fas fa-pen-nib" aria-hidden="true"></i> Personal note</button>
          <button type="button" class="eu-starter" data-starter="blank"><i class="fas fa-file" aria-hidden="true"></i> Blank</button>
        </div>
        <p class="eu-restored" id="eu-restored" hidden><i class="fas fa-clock-rotate-left" aria-hidden="true"></i> We kept your unsent draft. <button type="button" class="eu-link" id="eu-start-over">Start over</button></p>
        <div class="eu-compose">
          <form class="eu-write" id="eu-write" novalidate>
            <label class="eu-field"><span>Subject line</span><input name="subject" maxlength="150" required><small class="eu-hint"><span data-f="subjectCount">0</span>/150 · Short and specific gets opened.</small></label>
            <label class="eu-field"><span>Preview text <em>(shows next to the subject in the inbox)</em></span><input name="preview_text" maxlength="140"></label>
            <label class="eu-field"><span>Headline <em>(optional)</em></span><input name="headline" maxlength="120"></label>
            <label class="eu-check"><input type="checkbox" name="greeting" checked> Start with the reader's first name ("Hi Alex,")</label>
            <label class="eu-field"><span>Message</span><textarea name="body" rows="9" maxlength="6000" required></textarea><small class="eu-hint">Leave a blank line between paragraphs.</small></label>
            <details class="eu-more">
              <summary><i class="fas fa-image" aria-hidden="true"></i> Photo</summary>
              <label class="eu-field"><span>Photo link <em>(https://…, optional)</em></span><input name="image_url" type="url" maxlength="500" inputmode="url"></label>
              <label class="eu-field"><span>Describe the photo <em>(for people who can't see images)</em></span><input name="image_alt" maxlength="160"></label>
            </details>
            <details class="eu-more">
              <summary><i class="fas fa-hand-pointer" aria-hidden="true"></i> Button</summary>
              <label class="eu-field"><span>Button text</span><input name="cta_label" maxlength="40"></label>
              <label class="eu-field"><span>Button link <em>(https://…)</em></span><input name="cta_url" type="url" maxlength="500" inputmode="url"></label>
              <small class="eu-hint" id="eu-cta-default" hidden>Leave the link empty to send people to your agent page.</small>
            </details>
            <details class="eu-more" id="eu-snapshot">
              <summary><i class="fas fa-landmark" aria-hidden="true"></i> Town tax snapshot <span class="eu-new">Watchdog data</span></summary>
              <p class="eu-note">Adds a small box with the town's latest general tax rate, how it changed from last year, and how close assessments are to market value. Numbers come from the NJ Division of Taxation.</p>
              <label class="eu-field"><span>Town</span><input name="snapshot_town" list="eu-towns" maxlength="80" autocomplete="off" placeholder="Start typing a town"></label>
              <datalist id="eu-towns"></datalist>
              <p class="eu-empty" id="eu-snapshot-miss" hidden>We couldn't find that town. Pick one from the list.</p>
            </details>
            <div class="eu-sig">
              <div class="eu-sig-head"><b>Signature</b><a class="eu-link" data-route="/account/professional-profile">Edit</a></div>
              <p class="eu-sig-line" data-f="sigLine"></p>
              <p class="eu-empty" id="eu-sig-missing" hidden>Add your brokerage and phone in your professional profile so they show up here.</p>
            </div>
          </form>
          <aside class="eu-preview" aria-label="Email preview">
            <div class="eu-preview-bar">
              <b>Preview</b>
              <div class="eu-seg" role="group" aria-label="Preview size"><button type="button" class="on" data-size="desktop" aria-pressed="true"><i class="fas fa-desktop" aria-hidden="true"></i><span class="sr-only">Computer</span></button><button type="button" data-size="phone" aria-pressed="false"><i class="fas fa-mobile-screen" aria-hidden="true"></i><span class="sr-only">Phone</span></button></div>
            </div>
            <div class="eu-inbox">
              <p class="eu-inbox-from" data-f="pvFrom"></p>
              <p class="eu-inbox-subject" data-f="pvSubject"></p>
              <p class="eu-inbox-preview" data-f="pvPreview"></p>
            </div>
            <div class="eu-frame-wrap"><iframe id="eu-frame" title="Email preview" sandbox="allow-popups allow-popups-to-escape-sandbox" referrerpolicy="no-referrer"></iframe></div>
            <small class="eu-note">Kit adds your unsubscribe link and mailing address at the bottom. "Alex" stands in for each reader's first name.</small>
          </aside>
        </div>
      </div>
    </li>

    <li class="eu-step" data-step="send">
      <div class="eu-step-head"><span class="eu-num">4</span><div><h2>Send it</h2><p>Send now, pick a time, or save it as a draft in Kit to send yourself a test first.</p></div><span class="eu-state" data-state></span></div>
      <div class="eu-step-body">
        <dl class="eu-summary">
          <div><dt>To</dt><dd data-f="sumTo"></dd></div>
          <div><dt>From</dt><dd data-f="sumFrom"></dd></div>
          <div><dt>Subject</dt><dd data-f="sumSubject"></dd></div>
        </dl>
        <fieldset class="eu-choices eu-when" id="eu-when">
          <legend class="sr-only">When</legend>
          <label class="eu-choice"><input type="radio" name="when" value="now" checked><span><b>Send now</b><small>Goes out in about 3 minutes. You can still cancel until then.</small></span></label>
          <label class="eu-choice"><input type="radio" name="when" value="later"><span><b>Schedule</b><small>Pick a day and time</small></span></label>
          <label class="eu-choice"><input type="radio" name="when" value="draft"><span><b>Save as a draft in Kit</b><small>Send yourself a test from Kit, then send it there</small></span></label>
        </fieldset>
        <label class="eu-field eu-pick" id="eu-when-field" hidden><span>Send on</span><input type="datetime-local" id="eu-send-at"></label>
        <label class="eu-check" id="eu-consent-row"><input type="checkbox" id="eu-consent"> Everyone in this audience agreed to get email from me.</label>
        <div class="eu-actions"><button type="button" class="eu-btn dark big" id="eu-send"><i class="fas fa-paper-plane" aria-hidden="true"></i> <span data-f="sendLabel">Send now</span></button></div>
        <p class="eu-empty" id="eu-send-blocked" hidden></p>
        <template id="eu-blockers">
          <span data-why="connect">Connect Kit first (step 1).</span>
          <span data-why="audience">Pick who gets it (step 2).</span>
          <span data-why="subject">Add a subject line (step 3).</span>
          <span data-why="body">Write a message (step 3).</span>
          <span data-why="consent">Check the box to confirm people agreed to get email from you.</span>
          <span data-why="time">Pick a send time at least 10 minutes from now.</span>
        </template>
      </div>
    </li>

    <li class="eu-step" data-step="track">
      <div class="eu-step-head"><span class="eu-num">5</span><div><h2>Sent and scheduled</h2><p>Opens and clicks come from Kit. Refresh any time.</p></div><span class="eu-state" data-state></span></div>
      <div class="eu-step-body">
        <div class="eu-actions"><button type="button" class="eu-btn" id="eu-refresh"><i class="fas fa-arrows-rotate" aria-hidden="true"></i> Refresh stats</button><a class="eu-btn ghost" href="https://app.kit.com/broadcasts" target="_blank" rel="noopener"><i class="fas fa-arrow-up-right-from-square" aria-hidden="true"></i> All broadcasts in Kit</a></div>
        <ul class="eu-sent" id="eu-sent"></ul>
        <p class="eu-empty" id="eu-sent-empty" hidden>Nothing sent yet. Your emails show up here with opens and clicks.</p>
      </div>
    </li>
  </ol>
</template>

<template id="eu-row">
  <li class="eu-row">
    <div class="eu-row-main"><b class="eu-row-subject" data-r="subject"></b><span class="eu-pill" data-r="status"></span><small class="eu-row-meta" data-r="meta"></small></div>
    <dl class="eu-stats" data-r="stats" hidden>
      <div><dt>Sent to</dt><dd data-r="recipients"></dd></div>
      <div><dt>Opened</dt><dd data-r="opens"></dd></div>
      <div><dt>Clicked</dt><dd data-r="clicks"></dd></div>
      <div><dt>Unsubscribed</dt><dd data-r="unsubs"></dd></div>
    </dl>
    <div class="eu-row-actions"><button type="button" class="eu-btn ghost danger small" data-r="cancel" hidden><i class="fas fa-ban" aria-hidden="true"></i> <span data-r="cancelLabel">Cancel send</span></button></div>
  </li>
</template>

<!-- Starter emails. Plain text; the page turns them into the email. -->
<template id="eu-starter-copy">
  <div data-starter="market" data-subject="What's happening with home prices in [Town]" data-preview="A quick look at the local market this month" data-headline="Your [Month] market update" data-cta="See what your home is worth">Here's a quick look at what homes in [Town] did this month.

Homes are selling in about [X] days, and most are going for close to the asking price. Buyers are still out there, especially for homes that are priced right and show well.

Thinking about a move this year, or just curious what your home would sell for today? Reply to this email and I'll put together a free price estimate for you.</div>
  <div data-starter="listed" data-subject="Just listed: [Address]" data-preview="[Beds] beds, [Baths] baths in [Town]" data-headline="Just listed in [Town]" data-cta="See the photos">I just listed a home I think you'll love at [Address].

It has [Beds] bedrooms, [Baths] bathrooms and [one feature buyers will love]. It's listed at [Price].

Know someone who's been looking in [Town]? Forward this along, or reply and I'll set up a private showing.</div>
  <div data-starter="sold" data-subject="Just sold in [Town]" data-preview="Another happy homeowner in your neighborhood" data-headline="Just sold: [Address]" data-cta="What's my home worth?">Great news: [Address] just sold for [Price] in [X] days.

Sales like this one set the value for homes nearby, including yours. If you've wondered what your home could sell for, now is a good time to ask.

Reply to this email and I'll send you a free, no-pressure estimate.</div>
  <div data-starter="newsletter" data-subject="Your [Month] home and neighborhood update" data-preview="Local news, market numbers and one tip for homeowners" data-headline="[Month] in [Town]" data-cta="Say hello">Here's what's new around [Town] this month.

Around town: [a local event, opening or project].

The market: [one or two sentences on prices, inventory or rates].

Homeowner tip: [a seasonal tip, like checking your property tax assessment or servicing your heating system].

As always, if you have a question about your home or the market, just reply. I read every email.</div>
  <div data-starter="taxes" data-subject="Is your property tax assessment right?" data-preview="How to check it in five minutes" data-headline="Check your property tax assessment" data-cta="Check my property">Most people never check their property tax assessment, but mistakes happen, and they can cost you every year.

Here's a quick way to check: look up your home, compare its assessed value to what similar homes nearby sold for, and see whether your town's assessments are running high.

If yours looks off, you may be able to appeal. The deadline in most New Jersey towns is April 1. Reply to this email and I'm happy to take a look with you.</div>
  <div data-starter="note" data-subject="Quick hello from [Your first name]" data-preview="Just checking in" data-headline="" data-cta="">I just wanted to say hello and see how things are going.

If there's anything I can help with, whether it's a question about your home, a contractor recommendation or what homes nearby are selling for, just reply to this email.

Hope you have a great month.</div>
  <div data-starter="blank" data-subject="" data-preview="" data-headline="" data-cta=""></div>
</template>
