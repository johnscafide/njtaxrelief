<!doctype html><html lang="en" class="aw27-page" data-access-require="agent"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Postcard Studio | Watchdog</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"><link rel="stylesheet" href="/property/css/shared/00-design-tokens.css"><link rel="stylesheet" href="/property/css/app-shell-2027.css"><link rel="stylesheet" href="/property/css/agent-workspace.css?v=20260926a"><link rel="stylesheet" href="/property/css/postcard-studio.css?v=20260928a"></head><body data-sidebar-page="postcard-studio" data-plan-auto="true"><main><div id="ps-app" class="ps-shell"><div class="ps-loading"><i class="fas fa-circle-notch fa-spin" aria-hidden="true"></i> Opening Postcard Studio…</div></div></main>
<template id="ps-page"><header class="ps-hero">
    <div class="ps-hero-copy"><span class="ps-eyebrow"><i class="fas fa-envelope-open-text" aria-hidden="true"></i> Postcard Studio</span><h1>Design it, proof it, mail it.</h1><p>6 x 8.5 postcards, printed and mailed First Class by Watchdog Designs. You only pay for cards that can actually be mailed.</p></div>
    <div class="ps-hero-side"><span class="ps-env" data-f="env"></span><span class="ps-credit" data-f="credit" hidden></span></div>
  </header>

  <ol class="ps-steps">
    <li class="ps-step" data-step="audience">
      <div class="ps-step-head"><span class="ps-num">1</span><div><h2>Who gets it</h2><p>Pick a saved audience. Watchdog turns it into a clean mailing list.</p></div><span class="ps-state" data-state></span></div>
      <div class="ps-step-body">
        <label class="ps-field"><span>Audience</span><select id="ps-campaign"></select></label>
        <p class="ps-facts"><b data-f="valid">0</b> mailable addresses <span class="ps-dim">of <span data-f="total">0</span> in the list</span></p>
        <div class="ps-actions"><button type="button" class="ps-btn" id="ps-prepare"><i class="fas fa-list-check" aria-hidden="true"></i> Prepare mailing list</button><a class="ps-btn ghost" data-route="/marketing-studio/audience"><i class="fas fa-plus" aria-hidden="true"></i> Build a new audience</a></div>
        <small class="ps-note">You need at least 50 mailable addresses. Owner names are not public in New Jersey, so cards are addressed to "Current Resident".</small>
        <p class="ps-empty" id="ps-no-campaigns" hidden>You have no saved audiences yet. Build one from a farm, a town or your own list first.</p>
      </div>
    </li>

    <li class="ps-step" data-step="design">
      <div class="ps-step-head"><span class="ps-num">2</span><div><h2>Design your postcard</h2><p>Full editor: your photos, logo, colors, text, QR codes. Start blank or from a template.</p></div><span class="ps-state" data-state></span></div>
      <div class="ps-step-body">
        <p class="ps-facts" id="ps-design-line" hidden>Saved design <b data-f="designId"></b></p>
        <div class="ps-actions"><button type="button" class="ps-btn dark" id="ps-open-editor"><i class="fas fa-pen-ruler" aria-hidden="true"></i> <span data-f="editorLabel">Open postcard editor</span></button></div>
        <details class="ps-tips"><summary>Design tips that get more calls</summary><ul>
          <li>One clear message and one clear call to action.</li>
          <li>Keep text and logos at least 1/4 inch from the edges. Anything past the dotted line gets trimmed.</li>
          <li>Leave the address block on the back clear. Watchdog Designs prints the address and postage there.</li>
          <li>Include your name, brokerage and the disclosure your broker requires.</li>
          <li>Use a QR code or short link so you can see who responds.</li>
        </ul></details>
      </div>
    </li>

    <li class="ps-step" data-step="return">
      <div class="ps-step-head"><span class="ps-num">3</span><div><h2>Return address</h2><p>Your brokerage office. Returned mail goes here.</p></div><span class="ps-state" data-state></span></div>
      <div class="ps-step-body">
        <form class="ps-form" id="ps-ra-form" novalidate>
          <label class="ps-field wide"><span>Brokerage name</span><input name="company" autocomplete="organization" maxlength="100" required></label>
          <label class="ps-field wide"><span>Street address</span><input name="address" autocomplete="address-line1" maxlength="140" required></label>
          <label class="ps-field wide"><span>Suite or unit <em>(optional)</em></span><input name="address2" autocomplete="address-line2" maxlength="80"></label>
          <label class="ps-field"><span>City</span><input name="city" autocomplete="address-level2" maxlength="80" required></label>
          <label class="ps-field sm"><span>State</span><input name="state" autocomplete="address-level1" maxlength="2" value="NJ" required></label>
          <label class="ps-field sm"><span>ZIP</span><input name="zipCode" autocomplete="postal-code" inputmode="numeric" maxlength="10" required></label>
          <div class="ps-actions wide"><button type="submit" class="ps-btn" id="ps-ra-save"><i class="fas fa-floppy-disk" aria-hidden="true"></i> Save return address</button></div>
        </form>
      </div>
    </li>

    <li class="ps-step" data-step="proof">
      <div class="ps-step-head"><span class="ps-num">4</span><div><h2>Check the proof</h2><p>This is exactly what gets printed, with a real address from your list.</p></div><span class="ps-state" data-state></span></div>
      <div class="ps-step-body">
        <div class="ps-actions"><button type="button" class="ps-btn" id="ps-proof-make"><i class="fas fa-file-pdf" aria-hidden="true"></i> <span data-f="proofLabel">Make a proof</span></button><a class="ps-btn ghost" id="ps-proof-front" target="_blank" rel="noopener" hidden><i class="fas fa-up-right-from-square" aria-hidden="true"></i> Front</a><a class="ps-btn ghost" id="ps-proof-back" target="_blank" rel="noopener" hidden><i class="fas fa-up-right-from-square" aria-hidden="true"></i> Back</a></div>
        <label class="ps-check" id="ps-proof-check" hidden><input type="checkbox" id="ps-proof-ok"> I checked spelling, phone number, license and disclosure, and nothing important is cut off.</label>
        <div class="ps-actions"><button type="button" class="ps-btn dark" id="ps-proof-approve" hidden><i class="fas fa-circle-check" aria-hidden="true"></i> Approve this proof</button></div>
        <p class="ps-ok" id="ps-proof-approved" hidden><i class="fas fa-circle-check" aria-hidden="true"></i> Proof approved. Changing the design will need a new proof.</p>
      </div>
    </li>

    <li class="ps-step" data-step="pay">
      <div class="ps-step-head"><span class="ps-num">5</span><div><h2>Price and pay</h2><p>One price per card. Printing and First Class postage included.</p></div><span class="ps-state" data-state></span></div>
      <div class="ps-step-body">
        <div class="ps-actions"><button type="button" class="ps-btn" id="ps-quote"><i class="fas fa-calculator" aria-hidden="true"></i> Get my price</button></div>
        <dl class="ps-quote" id="ps-quote-box" hidden>
          <div><dt>Postcards</dt><dd data-f="qty"></dd></div>
          <div><dt>Per card</dt><dd data-f="unit"></dd></div>
          <div id="ps-quote-credit" hidden><dt>Mail credit</dt><dd data-f="qcredit"></dd></div>
          <div class="total"><dt>Total today</dt><dd data-f="qtotal"></dd></div>
        </dl>
        <div class="ps-actions"><button type="button" class="ps-btn dark" id="ps-pay" hidden><i class="fas fa-lock" aria-hidden="true"></i> Pay and send to print</button></div>
        <small class="ps-note">Prints in 1 to 3 business days and arrives 2 to 5 business days after that. You can cancel until 11:30 PM Eastern on the day you order. If an address can't be mailed, you get that card back as mail credit.</small>
      </div>
    </li>

    <li class="ps-step" data-step="track">
      <div class="ps-step-head"><span class="ps-num">6</span><div><h2>Track it</h2><p>Updates arrive automatically as your cards print and mail.</p></div><span class="ps-state" data-state></span></div>
      <div class="ps-step-body">
        <p class="ps-facts">Status: <b data-f="orderStatus">Not ordered yet</b></p>
        <p class="ps-facts" id="ps-order-line" hidden>Order <b data-f="orderId"></b> · <span data-f="orderCount"></span> postcards</p>
        <p class="ps-facts" id="ps-undeliverable" hidden><span data-f="undeliverable"></span></p>
        <div class="ps-actions"><button type="button" class="ps-btn danger" id="ps-cancel" hidden><i class="fas fa-ban" aria-hidden="true"></i> Cancel order</button></div>
        <small class="ps-note" id="ps-cancel-note" hidden>You can cancel until <b data-f="deadline"></b>. The full amount comes back as mail credit for your next postcard.</small>
      </div>
    </li>
  </ol>

  <dialog class="ps-editor" id="ps-editor" aria-labelledby="ps-editor-h">
    <div class="ps-editor-bar"><h2 id="ps-editor-h">Postcard editor <span class="ps-dim">6 x 8.5</span></h2><div class="ps-actions"><button type="button" class="ps-btn ghost" id="ps-editor-close">Close</button><button type="button" class="ps-btn dark" id="ps-editor-save"><i class="fas fa-check" aria-hidden="true"></i> I'm done, use this design</button></div></div>
    <iframe id="ps-frame" title="Watchdog Designs postcard editor" allow="clipboard-read; clipboard-write" referrerpolicy="strict-origin-when-cross-origin"></iframe>
    <p class="ps-note ps-editor-note">Save inside the editor first, then press "I'm done".</p>
  </dialog>
</template>
<template id="ps-fail"><div class="ps-error"><b>Postcard Studio could not open.</b><p data-f="message"></p><button class="ps-btn" type="button" data-reload>Retry</button></div></template>
<div id="pl-toast" class="pl-toast" role="status" aria-live="polite"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script><script src="/property/js/access-guard.js"></script><script src="/property/js/app-shell-2027.js"></script><script src="/property/js/agent-workspace.js?v=20260926a"></script><script src="/property/js/platform-observability.js?v=20260811a"></script><script src="/property/js/agent-ui-safety.js?v=20260811a"></script><script src="/property/js/postcard-studio.js?v=20260928b"></script><script src="/property/js/watchdog-designs-white-label.js?v=20260928a"></script></body></html>
