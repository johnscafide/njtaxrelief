name: Probe DCA affordable dashboard

on:
  push:
    branches:
      - data-center-affordable-dashboard-discovery-20260822
    paths:
      - 'property/scripts/probe_dca_affordable_powerbi.py'
      - '.github/workflows/probe-dca-affordable-powerbi.yml'
  pull_request:
    branches: [main]
    paths:
      - 'property/scripts/probe_dca_affordable_powerbi.py'
      - '.github/workflows/probe-dca-affordable-powerbi.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests
      - name: Probe public NJ DCA Power BI semantic queries
        run: python property/scripts/probe_dca_affordable_powerbi.py
