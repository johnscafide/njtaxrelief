name: Refresh statewide Chapter 123

on:
  push:
    branches: [main]
    paths:
      - 'property/scripts/parse-chapter123-pdf.js'
      - '.github/workflows/chapter123-statewide.yml'
  schedule:
    - cron: '23 11 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install PDF extraction dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Download official 2026 Chapter 123 certification
        run: |
          curl --fail --location --retry 3 --retry-delay 2 \
            'https://www.nj.gov/treasury/taxation/pdf/lpt/chap123/2026CH123.pdf' \
            --output /tmp/2026CH123.pdf
          test -s /tmp/2026CH123.pdf

      - name: Build statewide Chapter 123 dataset
        run: node property/scripts/parse-chapter123-pdf.js /tmp/2026CH123.pdf

      - name: Verify statewide contract
        run: |
          node - <<'NODE'
          const data=require('./property/data/chapter123-2026.json');
          if(data.source_id!=='nj-chapter123-2026') throw new Error('Unexpected source id');
          if(data.tax_year!==2026) throw new Error('Unexpected tax year');
          if(data.district_count!==564 || Object.keys(data.districts||{}).length!==564) {
            throw new Error('Chapter 123 dataset must contain exactly 564 municipalities');
          }
          if(data.county_count!==21) throw new Error('Chapter 123 dataset must contain all 21 counties');
          const sample=data.districts['0415'];
          if(!sample || sample.ratio!==56.95 || sample.lower!==48.41 || sample.upper!==65.49) {
            throw new Error('Gloucester Township control row does not match the official 2026 certification');
          }
          console.log({districts:data.district_count,counties:data.county_count,control:sample});
          NODE

      - name: Commit refreshed dataset when changed
        run: |
          if git diff --quiet -- property/data/chapter123-2026.json; then
            echo 'Chapter 123 dataset is already current.'
            exit 0
          fi
          git config user.name 'Watchdog Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add property/data/chapter123-2026.json
          git commit -m '[chapter123-refresh] Refresh statewide 2026 Chapter 123 ratios'
          git push
