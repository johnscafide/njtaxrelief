name: NJW-258 parcel alias production release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release-once:
    if: github.event.head_commit.message == 'NJW-258 stage parcel alias production release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Sync current main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Enable exactly one Git production deployment
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('vercel.json')
          s=p.read_text()
          old='"deploymentEnabled": false'
          if old not in s: raise SystemExit('deployment guard was not paused')
          p.write_text(s.replace(old,'"deploymentEnabled": true',1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vercel.json
          git commit -m 'Temporarily enable one Git deployment for NJW-258 alias fix'
          git push origin HEAD:main
      - name: Restore paused Git deployments and remove release pulse
        run: |
          sleep 3
          git fetch origin main
          git reset --hard origin/main
          python - <<'PY'
          from pathlib import Path
          p=Path('vercel.json')
          s=p.read_text()
          old='"deploymentEnabled": true'
          if old not in s: raise SystemExit('one-shot deployment enable was not present')
          p.write_text(s.replace(old,'"deploymentEnabled": false',1))
          wf=Path('.github/workflows/njw258-production-release-alias.yml')
          if wf.exists(): wf.unlink()
          PY
          git add -A
          git commit -m 'Restore paused Git deployments after NJW-258 alias release'
          git push origin HEAD:main
