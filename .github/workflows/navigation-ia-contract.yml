name: Navigation IA contract

# One menu structure, the same labels on every navigation surface, and a way back
# to the Agent Desk from every agent tool (property/docs/watchdog-information-architecture.md).
on:
  push:
    branches: [main]
    paths:
      - 'property/js/watchdog-universal-menu.js'
      - 'property/css/watchdog-universal-menu.css'
      - 'property/js/app-shell-2027.js'
      - 'property/js/agent-hub.js'
      - 'property/js/agent-workspace.js'
      - 'property/css/agent-hub.css'
      - 'property/css/watchdog-page-head.css'
      - 'property/css/app-shell-2027.css'
      - 'property/css/agent-workspace.css'
      - 'property/css/watchdog-consent.css'
      - 'property/agent-desk/index.html'
      - 'property/docs/watchdog-information-architecture.md'
      - 'property/tests/navigation-ia-contract.mjs'
      - 'property/tests/universal-menu-contract.mjs'
      - 'property/tests/agent-hub-contract.mjs'
      - '.github/workflows/navigation-ia-contract.yml'
  pull_request:
    paths:
      - 'property/js/watchdog-universal-menu.js'
      - 'property/css/watchdog-universal-menu.css'
      - 'property/js/app-shell-2027.js'
      - 'property/js/agent-hub.js'
      - 'property/js/agent-workspace.js'
      - 'property/css/agent-hub.css'
      - 'property/css/watchdog-page-head.css'
      - 'property/css/app-shell-2027.css'
      - 'property/css/agent-workspace.css'
      - 'property/css/watchdog-consent.css'
      - 'property/agent-desk/index.html'
      - 'property/docs/watchdog-information-architecture.md'
      - 'property/tests/navigation-ia-contract.mjs'
      - 'property/tests/universal-menu-contract.mjs'
      - 'property/tests/agent-hub-contract.mjs'
      - '.github/workflows/navigation-ia-contract.yml'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify navigation information architecture
        run: node property/tests/navigation-ia-contract.mjs
      - name: Verify universal menu contract
        run: node property/tests/universal-menu-contract.mjs
      - name: Verify Agent Desk hub contract
        run: node property/tests/agent-hub-contract.mjs
