name: Watchdog Android build

# Compiles the Android app (debug APK), runs unit tests and lint, then compiles the desktop preview
# against the same shared sources and renders every screen to PNG. Screens and the APK are uploaded
# as workflow artifacts. Nothing here deploys or touches Supabase.

on:
  push:
    paths:
      - 'watchdogandroid/**'
      - '.github/workflows/watchdog-android-build.yml'
  pull_request:
    paths:
      - 'watchdogandroid/**'
      - '.github/workflows/watchdog-android-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: watchdog-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    name: Assemble, test and lint (Android)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: watchdogandroid
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          accept-android-sdk-licenses: true
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Assemble debug APK
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug
      - name: Unit tests
        run: ./gradlew --no-daemon --stacktrace :shared:testDebugUnitTest :app:testDebugUnitTest
      - name: Lint
        run: ./gradlew --no-daemon --stacktrace :app:lintDebug
      - name: Release build (unsigned)
        run: ./gradlew --no-daemon --stacktrace :app:assembleRelease
      - name: Upload APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: watchdog-android-apks
          path: |
            watchdogandroid/app/build/outputs/apk/debug/*.apk
            watchdogandroid/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: watchdog-android-reports
          path: |
            watchdogandroid/app/build/reports/**
            watchdogandroid/shared/build/reports/**
            watchdogandroid/**/build/test-results/**
          if-no-files-found: ignore

  preview:
    name: Desktop preview, tests and screen renders
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: watchdogandroid/preview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Compile shared sources for the desktop and run unit tests
        run: ./gradlew --no-daemon --stacktrace test
      - name: Render every screen (light and dark) and compare with the approved mockups
        # Prints one similarity line per screen and theme, plus a coarse text heat map of where a render
        # differs from the mockup reference, so the numbers are readable straight from the job log.
        run: ./gradlew --no-daemon --stacktrace compareScreens -Pref=reference
      - name: Upload screen renders and comparisons
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: watchdog-screen-renders
          path: |
            watchdogandroid/preview/build/screens/**
            watchdogandroid/preview/build/compare/**
          if-no-files-found: warn
