name: NJ authoritative source monitor

on:
  workflow_dispatch:
  schedule:
    # Once each morning: source changes are confirmed on a second daily read,
    # rather than emitting false alerts from dynamic government landing pages.
    - cron: "17 10 * * *"

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Check authoritative NJ source releases
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_SOURCE_MONITOR_URL: ${{ secrets.SUPABASE_SOURCE_MONITOR_URL }}
        run: >-
          python3 property/scripts/monitor_nj_sources.py
          --emit-url "$SUPABASE_SOURCE_MONITOR_URL"
          --history-retention-days 730
      - name: Preserve source-health history
        uses: actions/upload-artifact@v4
        with:
          name: nj-authoritative-source-monitor
          retention-days: 90
          path: |
            property/data/source-monitor-report.json
            property/data/source-watch-history.json
      - name: Summarize result
        run: |
          python3 - <<'PY'
          import json
          report = json.load(open('property/data/source-monitor-report.json'))
          print('checked:', report['checked'])
          print('confirmed publisher updates:', len(report['changed']))
          print('pending confirmation:', len(report.get('suspected', [])))
          print('unavailable endpoints:', len(report['errors']))
          PY
