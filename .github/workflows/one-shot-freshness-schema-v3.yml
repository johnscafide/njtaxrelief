name: One-shot freshness evidence schema v3 regeneration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-freshness-schema-v3.yml'

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Regenerate factual freshness report on latest main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          set +e
          python3 property/scripts/refresh_state_data.py
          report_code=$?
          set -e
          python3 - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('property/data/data-freshness.json').read_text())
          if report.get('schema_version') != 3:
              raise SystemExit('Expected freshness schema_version 3')
          Path('.github/workflows/one-shot-freshness-schema-v3.yml').unlink()
          PY
          git config user.name 'Watchdog Trust Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add property/data/data-freshness.json .github/workflows/one-shot-freshness-schema-v3.yml
          git commit -m 'Regenerate source freshness evidence with explicit validation kinds'
          git pull --rebase origin main
          git push origin main
          echo "Freshness report exit code: $report_code (degraded sources are committed intentionally)"
