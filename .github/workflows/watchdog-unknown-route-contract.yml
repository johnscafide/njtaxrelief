name: Watchdog unknown-route contract

on:
  push:
    branches: [main]
    paths:
      - 'api/watchdog-index-page.js'
      - 'api/watchdog-index-page-contact-safe.js'
      - 'property/tests/watchdog-index-unknown-route-contract.mjs'
      - '.github/workflows/watchdog-unknown-route-contract.yml'
  pull_request:
    paths:
      - 'api/watchdog-index-page.js'
      - 'api/watchdog-index-page-contact-safe.js'
      - 'property/tests/watchdog-index-unknown-route-contract.mjs'
      - '.github/workflows/watchdog-unknown-route-contract.yml'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unknown Watchdog URLs return the branded 404
        run: node property/tests/watchdog-index-unknown-route-contract.mjs
