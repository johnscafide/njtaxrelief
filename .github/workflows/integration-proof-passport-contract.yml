name: Integration Proof + Property Passport Contract

on:
  push:
    paths:
      - 'supabase/migrations/20260820130218_integration_proof_reference_contract.sql'
      - 'supabase/migrations/20260820133715_integration_proof_reference_pgcrypto_schema_fix.sql'
      - 'supabase/migrations/20260820134053_integration_property_passport_prototype.sql'
      - 'property/docs/integrations/PROPERTY-PASSPORT-RD.md'
      - 'property/tests/integration-proof-passport-contract.mjs'
      - '.github/workflows/integration-proof-passport-contract.yml'
  pull_request:
    paths:
      - 'supabase/migrations/20260820130218_integration_proof_reference_contract.sql'
      - 'supabase/migrations/20260820133715_integration_proof_reference_pgcrypto_schema_fix.sql'
      - 'supabase/migrations/20260820134053_integration_property_passport_prototype.sql'
      - 'property/docs/integrations/PROPERTY-PASSPORT-RD.md'
      - 'property/tests/integration-proof-passport-contract.mjs'
      - '.github/workflows/integration-proof-passport-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check proof + Property Passport contract
        run: node property/tests/integration-proof-passport-contract.mjs
