name: Integration Proof + Property Passport Contract

on:
  push:
    paths:
      - 'supabase/migrations/20260820130218_integration_proof_reference_contract.sql'
      - 'supabase/migrations/20260820134300_integration_proof_reference_proof_id_index.sql'
      - 'supabase/migrations/20260820135500_integration_proof_reference_passport_repairs.sql'
      - 'property/docs/automation/AUTOMATION-PROOF-CONTRACT.md'
      - 'property/tests/integration-proof-passport-contract.mjs'
      - '.github/workflows/integration-proof-passport-contract.yml'
  pull_request:
    paths:
      - 'supabase/migrations/20260820130218_integration_proof_reference_contract.sql'
      - 'supabase/migrations/20260820134300_integration_proof_reference_proof_id_index.sql'
      - 'supabase/migrations/20260820135500_integration_proof_reference_passport_repairs.sql'
      - 'property/docs/automation/AUTOMATION-PROOF-CONTRACT.md'
      - 'property/tests/integration-proof-passport-contract.mjs'
      - '.github/workflows/integration-proof-passport-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check proof + Property Passport contract
        run: node property/tests/integration-proof-passport-contract.mjs
