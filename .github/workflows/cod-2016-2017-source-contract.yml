name: COD 2016-2017 source contract

on:
  push:
    branches:
      - data-center-cod-2016-2017-close-20260821
    paths:
      - property/scripts/build_historical_cod_2016_2017.py
      - property/data/cod/january-2022-district-identity.zlib.b64
      - .github/workflows/cod-2016-2017-source-contract.yml
  pull_request:
    paths:
      - property/scripts/build_historical_cod_2016_2017.py
      - property/data/cod/january-2022-district-identity.zlib.b64
      - .github/workflows/cod-2016-2017-source-contract.yml
      - property/data/cod/historical-cod-2016-2017.json
      - property/data/cod/historical-cod-2016-2017-diagnostic.json

permissions:
  contents: write

concurrency:
  group: cod-2016-2017-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF source reader
        run: python -m pip install --disable-pip-version-check requests pdfplumber
      - name: Rebuild official 564-district identity bridge
        run: |
          python - <<'PY'
          import base64, hashlib, json, zlib
          from pathlib import Path
          p=Path('property/data/cod/january-2022-district-identity.zlib.b64')
          encoded=p.read_text(encoding='utf-8').strip()
          assert hashlib.sha256(encoded.encode()).hexdigest()=='aa66e22b320819eb1a9d0a201166b4ece1bd24db7cf159593e2dc37e26cbc1ea'
          plain=zlib.decompress(base64.b64decode(encoded)).decode('utf-8')
          rows={}
          for line in plain.splitlines():
            code,county,name=line.split('|',2)
            assert len(code)==4 and code.isdigit() and code not in rows
            rows[code]={'county':county,'name':name}
          assert len(rows)==564
          # The carried-forward parser normalizes the legacy E RUTHERFORD label
          # to EAST RUTHERFORD. Keep that deterministic alias while using the
          # January 2022 official C/D identity bridge for every district.
          assert rows['0212']['name']=='E RUTHERFORD BORO'
          rows['0212']['name']='EAST RUTHERFORD BORO'
          out=Path('.tmp/january-2022-cod-identity.json')
          out.parent.mkdir(exist_ok=True)
          out.write_text(json.dumps({'districts':rows},sort_keys=True),encoding='utf-8')
          print({'districts':len(rows),'absecon':rows['0101'],'east_rutherford':rows['0212']})
          PY
      - name: Parse 21 official legacy county PDFs
        run: >-
          python property/scripts/build_historical_cod_2016_2017.py
          --uniformity .tmp/january-2022-cod-identity.json
          --output property/data/cod/historical-cod-2016-2017.json
          --diagnostic property/data/cod/historical-cod-2016-2017-diagnostic.json
      - name: Verify exact statewide contract
        run: |
          python - <<'PY'
          import json
          data=json.load(open('property/data/cod/historical-cod-2016-2017.json'))
          diag=json.load(open('property/data/cod/historical-cod-2016-2017-diagnostic.json'))
          assert data['metric']=='segmented_class_2_cod'
          assert data['years']==[2016,2017]
          assert data['district_count']==564
          assert len(data['districts'])==564
          assert diag['status']=='pass', diag
          assert diag['expected_district_years']==1128
          assert diag['matched_district_years']==1128
          assert not diag['unmatched']
          assert not diag['duplicates']
          assert not diag['missing_current_district_years']
          assert {x['municipality'] for x in diag['legacy_only']}=={'PINE VALLEY BORO'}
          a=data['districts']['0101']['series']
          assert a['2016']==14.02, a
          assert a['2017']==14.45, a
          print({'status':'pass','districts':len(data['districts']),'district_years':diag['matched_district_years'],'absecon':a,'legacy_only':len(diag['legacy_only'])})
          PY
      - name: Commit governed source artifact
        if: github.event_name == 'push'
        run: |
          git config user.name "Watchdog Source Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -- property/data/cod/historical-cod-2016-2017.json property/data/cod/historical-cod-2016-2017-diagnostic.json
          if git diff --cached --quiet; then
            echo "No historical COD source artifact changes"
          else
            git commit -m "[source-build] Certify 2016-2017 segmented Class 2 COD"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
