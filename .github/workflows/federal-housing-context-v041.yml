name: Build governed federal housing context

on:
  push:
    branches:
      - agent/federal-housing-context-20260913
    paths:
      - "property/scripts/build_federal_housing_context_v041.py.gz"
      - "property/data/source-snapshots/hud-chas-2018-2022/**"
      - "towns/town-manifest.json"
      - ".github/workflows/federal-housing-context-v041.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install source-build dependencies
        run: python -m pip install --disable-pip-version-check pandas openpyxl requests shapely
      - name: Build and certify municipal source artifact
        run: |
          gzip -dc property/scripts/build_federal_housing_context_v041.py.gz > property/scripts/.build_federal_housing_context_v041.py
          echo "--- builder manifest normalization excerpt ---"
          sed -n '70,125p' property/scripts/.build_federal_housing_context_v041.py
          python property/scripts/.build_federal_housing_context_v041.py
          rm property/scripts/.build_federal_housing_context_v041.py
      - name: Commit governed artifact
        run: |
          if git diff --quiet -- property/data/federal-housing-context-v041.json property/data/federal-housing-context-v041-audit.json; then
            echo "No artifact changes."
            exit 0
          fi
          git config user.name "watchdog-source-bot"
          git config user.email "watchdog-source-bot@users.noreply.github.com"
          git add property/data/federal-housing-context-v041.json property/data/federal-housing-context-v041-audit.json
          git commit -m "Build governed federal housing context v0.41"
          git push
