name: One-off UFB v0.39 planned registry

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-ufb-v039-plan-registry.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Append bounded UFB marker family as planned
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const regPath='property/data/marker-registry.json';
          const pack=JSON.parse(fs.readFileSync('property/data/nj-source-pack-v039.json','utf8'));
          const reg=JSON.parse(fs.readFileSync(regPath,'utf8'));
          if((pack.markers||[]).length!==179)throw new Error('Expected 179 v0.39 markers');
          reg.markers=reg.markers||[];
          const byId=new Map(reg.markers.map(m=>[String(m.id||''),m]));
          for(const src of pack.markers){
            const id=String(src.id||src.marker_id||'').trim();
            if(!id)throw new Error('UFB marker missing id');
            if(byId.has(id)){
              const row=byId.get(id);
              if(row.provider_status!=='planned')throw new Error('Existing UFB marker has unexpected state: '+id+' '+row.provider_status);
              continue;
            }
            const row={...src,id};
            delete row.marker_id;
            row.provider_status='planned';
            row.provider_note='Certified NJ DCA UFB 2025 source artifact is committed; production provider and authenticated canary are pending.';
            row.provider_contract='workbench-hydrate-v039-planned';
            reg.markers.push(row);byId.set(id,row);
          }
          const status=(reg.markers||[]).reduce((a,m)=>{const k=String(m.provider_status||'planned');a[k]=(a[k]||0)+1;return a;},{});
          if(reg.markers.length!==1000||status.live!==618||status.planned!==366||status.partial!==4||status.unavailable!==12)throw new Error('Unexpected v0.39 planned totals '+JSON.stringify({total:reg.markers.length,status}));
          const byTier={},byProfession={};let publicSource=0,proprietaryDerived=0;
          for(const m of reg.markers){
            const t=String(m.tier||'standard');byTier[t]=(byTier[t]||0)+1;
            for(const p of (m.professions||[]))byProfession[p]=(byProfession[p]||0)+1;
            if(m.origin==='public'&&!m.proprietary)publicSource++;
            if(m.proprietary||m.origin==='watchdog-derived')proprietaryDerived++;
          }
          reg.schema_version='1+provider-status+v039-planned';
          reg.generated_at=new Date().toISOString();
          reg.summary={...(reg.summary||{}),total:reg.markers.length,public_source:publicSource,proprietary_derived:proprietaryDerived,by_tier:byTier,by_profession:byProfession,percent_of_goal:Math.round(reg.markers.length/Number(reg.target_markers||1000)*1000)/10,provider_status:status};
          fs.writeFileSync(regPath,JSON.stringify(reg,null,1)+'\n');
          console.log(reg.summary);
          NODE
      - name: Commit planned registry
        run: |
          git config user.name "Watchdog Automation"
          git config user.email "actions@users.noreply.github.com"
          git add property/data/marker-registry.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "[v039-plan] Stage 179 UFB markers behind Pro+ entitlement"
          git pull --rebase origin main
          git push origin HEAD:main
