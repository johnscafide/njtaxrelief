name: One-off NJW-291 fix trigger
on:
  push:
    paths:
      - '.github/workflows/oneoff-njw291-fix-trigger.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix v0.31 matcher in batch workflow
        run: |
          node <<'NODE'
          const fs=require('fs');
          const p='.github/workflows/oneoff-njw291-planned-marker-batch.yml';
          let s=fs.readFileSync(p,'utf8');
          const before=`            '\"formula\": \"normalized(change(land_assessment) - change(improvement_assessment))\",',\n            '\"formula\": \"Latest consecutive published MOD-IV transition: normalize the land-share change minus improvement-share change across the full possible -200 to +200 percentage-point differential into 0-100; 50 is unchanged composition; no synthetic years.\",',`;
          const after=`            \"('assessment_component_shift','Assessment Component Shift','normalized(change(land_assessment) - change(improvement_assessment))','Flags changes in published assessment composition for review.'),\",\n            \"('assessment_component_shift','Assessment Component Shift','Latest consecutive published MOD-IV transition: normalize the land-share change minus improvement-share change across the full possible -200 to +200 percentage-point differential into 0-100; 50 is unchanged composition; no synthetic years.','Flags changes in published assessment composition for review.'),\",`;
          if(!s.includes(before))throw new Error('batch matcher source not found');
          s=s.replace(before,after);fs.writeFileSync(p,s);
          NODE
      - name: Refetch main and commit only if safe
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || { echo 'main moved; refusing overwrite'; exit 2; }
          git config user.name 'Watchdog Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add .github/workflows/oneoff-njw291-planned-marker-batch.yml
          git commit -m 'NJW-291 fix batch patch matcher'
          git push origin HEAD:main
