name: One-shot Home Intelligence source normalization

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-home-intelligence-normalize.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Normalize latest Home source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          python3 - <<'PY'
          from pathlib import Path

          path = Path('property/js/dashboard/home/index.js')
          text = path.read_text(encoding='utf-8')

          old_import = "import('../tools/' + name + '.js?v=' + HOME_MODULE_VERSION)"
          new_import = "import('../tools/' + name + '.js')"
          if old_import in text:
              text = text.replace(old_import, new_import)

          text = text.replace('<div><b>Agent Intel</b><span>Generated from this property\\u2019s records</span></div>',
                              '<div><b>Watchdog Analyst Intel</b><span>Generated from this property\\u2019s records</span></div>')
          text = text.replace(".replace('<b>Agent Intel</b>', '<b id=\"hm-mobile-intel-title\">Agent Intel</b>');",
                              ".replace('<b>Watchdog Analyst Intel</b>', '<b id=\"hm-mobile-intel-title\">Watchdog Analyst Intel</b>');")

          path.write_text(text, encoding='utf-8')
          Path('.github/workflows/one-shot-home-intelligence-normalize.yml').unlink()
          PY

          if git diff --quiet -- property/js/dashboard/home/index.js .github/workflows/one-shot-home-intelligence-normalize.yml; then
            echo 'No normalization changes required.'
            exit 0
          fi

          if grep -Fq ".js?v=" property/js/dashboard/home/index.js; then
            echo 'Stable-asset normalization failed: versioned Home module import remains.' >&2
            exit 1
          fi
          if grep -Fq '>Agent Intel<' property/js/dashboard/home/index.js; then
            echo 'Legacy Agent Intel visible label remains.' >&2
            exit 1
          fi

          git config user.name 'Watchdog Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add property/js/dashboard/home/index.js .github/workflows/one-shot-home-intelligence-normalize.yml
          git commit -m 'Normalize Property Home Intelligence assets and naming'

          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin main; then
              exit 0
            fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((attempt * 2))
            git fetch origin main
            git rebase origin/main || true
          done
          echo 'Could not safely push Home source normalization.' >&2
          exit 1
