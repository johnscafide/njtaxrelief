name: NJW-184 Agent digest route alignment

on:
  push:
    branches:
      - agent/njw-184-agent-digest-clean-route

permissions:
  contents: write

jobs:
  align:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/njw-184-agent-digest-clean-route
          fetch-depth: 0
      - name: Replace exactly one retired Agent Desk URL
        shell: python
        run: |
          from pathlib import Path
          p=Path('supabase/functions/agent-opportunity-digest/index.ts')
          s=p.read_text(encoding='utf-8')
          old='https://njpropertytaxrelief.com/property/agent-desk.html'
          new='https://njpropertytaxrelief.com/property/agent-desk'
          if s.count(old) != 1:
              raise SystemExit(f'Expected exactly one retired URL, found {s.count(old)}')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
      - name: Verify scope and self-remove
        run: |
          set -euo pipefail
          test "$(git diff --name-only)" = "supabase/functions/agent-opportunity-digest/index.ts"
          git diff --check
          rm .github/workflows/njw-184-agent-digest-url.yml
      - name: Commit exact source change
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/agent-opportunity-digest/index.ts .github/workflows/njw-184-agent-digest-url.yml
          git commit -m "Use clean Agent Desk URL in weekly digest"
          git push origin HEAD:agent/njw-184-agent-digest-clean-route
