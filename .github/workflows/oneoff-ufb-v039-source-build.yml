name: One-off UFB v0.39 source build

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-ufb-v039-source-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Download certified NJ DCA workbook
        run: |
          curl -fL --retry 4 --retry-all-errors \
            'https://nj.gov/dca/dlgs/programs/mc_budget_docs/UFB%20Database%20-%20FINAL.xlsm' \
            -o /tmp/ufb-v039.xlsm
          echo '79a59be4c4ab2669d60ebb8072aab5a5775df7025e66cb95a887e1c39ed8ccaa  /tmp/ufb-v039.xlsm' | sha256sum -c -
      - name: Build governed source artifacts
        run: python3 property/scripts/build_ufb_v039.py /tmp/ufb-v039.xlsm --repo-root .
      - name: Validate bounded release
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('property/data/ufb-v039/manifest.json').read_text())
          p=json.loads(Path('property/data/nj-source-pack-v039.json').read_text())
          a=json.loads(Path('property/data/ufb-v039/01.json').read_text())
          assert m['field_count']==179 and m['municipality_count']==564 and m['county_count']==21
          assert m['quality_flags']=={'no_ufb_available':12,'significant_data_missing':3}
          assert len(p['markers'])==179 and len({x['id'] if 'id' in x else x['marker_id'] for x in p['markers']})==179
          assert len(list(Path('property/data/ufb-v039').glob('[0-9][0-9].json')))==21
          ids=m['field_order']; vals=a['municipalities']['0101'][4]
          ix={x:i for i,x in enumerate(ids)}
          expected={
            'njplus.nj-dca-ufb-2025.rut_tax_collection_pct':0.9825,
            'njplus.nj-dca-ufb-2025.current_year_anticipated_revenue_total':14295569.48,
            'njplus.nj-dca-ufb-2025.total_personnel_cost':6341250.01,
            'njplus.nj-dca-ufb-2025.gross_debt_total':18675000,
            'njplus.nj-dca-ufb-2025.net_debt_total':16285000,
            'njplus.nj-dca-ufb-2025.debt_service_current_year_budget_payment':1246643.78,
            'njplus.nj-dca-ufb-2025.accumulated_absence_gross_days':2908.04,
            'njplus.nj-dca-ufb-2025.structural_total_imbalances':0,
          }
          for marker,value in expected.items():
            got=vals[ix[marker]]
            assert abs(float(got)-float(value)) <= 1e-6, (marker,got,value)
          print({'markers':179,'municipalities':564,'absecon_controls':len(expected)})
          PY
      - name: Commit source artifacts
        run: |
          git config user.name "Watchdog Automation"
          git config user.email "actions@users.noreply.github.com"
          git add property/data/ufb-v039 property/data/nj-source-pack-v039.json
          if git diff --cached --quiet; then
            echo "UFB v0.39 source artifacts already current"
            exit 0
          fi
          git commit -m "[v039-source] Add certified NJ DCA UFB 2025 artifacts"
          git pull --rebase origin main
          git push origin HEAD:main
