name: One-off zoning provider wiring

on:
  push:
    paths:
      - '.github/workflows/oneoff-zoning-provider-wire.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Wire DCA zoning provider safely
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('supabase/functions/workbench-hydrate/index.ts')
          s = p.read_text()

          import_anchor = "import { dcaPermitValue, DCA_PERMIT_PROVIDER_VERSION, MODIV_INTEL_PROVIDER_VERSION } from './dca-provider.ts';\n"
          import_line = "import { zoningDirectoryObservation, isZoningDirectoryMarker, DCA_ZONING_PROVIDER_VERSION } from './zoning-provider.ts';\n"
          if import_line not in s:
              if s.count(import_anchor) != 1:
                  raise SystemExit(f'Expected exactly one DCA provider import anchor, found {s.count(import_anchor)}')
              s = s.replace(import_anchor, import_anchor + import_line, 1)

          dca_anchor = "if(!fam){const pv:any=await dcaPermitValue(m,r);if(pv)fam={v:pv.v,kind:pv.kind||'authoritative_source',source:pv.source||('NJ DCA construction permits · '+DCA_PERMIT_PROVIDER_VERSION)}}"
          zoning_resolver = "if(!fam&&isZoningDirectoryMarker(m)){const zoning=await zoningDirectoryObservation(m,r);fam={v:zoning.value,status:zoning.status,reason:zoning.reason||null,kind:'authoritative_reference',source:zoning.source||('NJ DCA Municipal Zoning directory · '+DCA_ZONING_PROVIDER_VERSION)}}"
          if zoning_resolver not in s:
              if s.count(dca_anchor) != 1:
                  raise SystemExit(f'Expected exactly one DCA resolver anchor, found {s.count(dca_anchor)}')
              s = s.replace(dca_anchor, zoning_resolver + dca_anchor, 1)

          versions_old = "provider_versions:{spatial:NJDEP_PROVIDER_VERSION,dca_permits:DCA_PERMIT_PROVIDER_VERSION,modiv_intelligence:MODIV_INTEL_PROVIDER_VERSION,parcel_source:'njgin-parcels-composite-2026'}"
          versions_new = "provider_versions:{spatial:NJDEP_PROVIDER_VERSION,dca_permits:DCA_PERMIT_PROVIDER_VERSION,dca_zoning:DCA_ZONING_PROVIDER_VERSION,modiv_intelligence:MODIV_INTEL_PROVIDER_VERSION,parcel_source:'njgin-parcels-composite-2026'}"
          if versions_new not in s:
              if s.count(versions_old) != 1:
                  raise SystemExit(f'Expected exactly one provider_versions anchor, found {s.count(versions_old)}')
              s = s.replace(versions_old, versions_new, 1)

          p.write_text(s)
          PY
      - name: Commit exact patch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- supabase/functions/workbench-hydrate/index.ts; then
            echo 'No patch needed.'
            exit 0
          fi
          git config user.name 'Watchdog Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add supabase/functions/workbench-hydrate/index.ts
          git commit -m 'Wire governed DCA zoning directory provider'
          git push origin HEAD:main
