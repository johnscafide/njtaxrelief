name: One-off NJW-143 production overlay reconciliation

on:
  push:
    paths:
      - '.github/workflows/oneoff-njw143-production-overlay-reconcile.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    env:
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_URL: https://uvkvaxljhhngydvlrzom.supabase.co
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh production coverage overlay and canonical governance
        run: |
          set -euo pipefail
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          git config user.name "Watchdog release automation"
          git config user.email "actions@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            curl --fail --silent --show-error \
              "$SUPABASE_URL/rest/v1/data_center_provider_coverage?select=marker_id,value_status,provider_key,provider_kind,calculation_key,source_keys,source_fields,notes,bulk_capable&order=marker_id" \
              -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Accept: application/json" \
              > /tmp/provider-coverage.json
            node <<'NODE'
          const fs=require('fs');
          const overlayPath='property/data/db-governed-provider-overlay.json';
          const overlay=JSON.parse(fs.readFileSync(overlayPath,'utf8'));
          const rows=JSON.parse(fs.readFileSync('/tmp/provider-coverage.json','utf8'));
          if(!Array.isArray(rows)||rows.length<800) throw new Error(`Production coverage query returned only ${Array.isArray(rows)?rows.length:'non-array'} rows`);
          overlay.statuses=overlay.statuses||{};
          overlay.providers=overlay.providers||{};
          for(const row of rows){
            const id=String(row.marker_id||'').trim();
            const status=String(row.value_status||'').trim();
            if(!id||!['live','partial','planned','unavailable'].includes(status)) continue;
            overlay.statuses[id]=status;
            const prior=(overlay.providers[id]&&typeof overlay.providers[id]==='object')?overlay.providers[id]:{};
            const source=prior.source || (Array.isArray(row.source_keys)&&row.source_keys.length?row.source_keys.join(' · '):'Production Data Center provider coverage');
            overlay.providers[id]={
              ...prior,
              provider_key:row.provider_key||prior.provider_key||null,
              provider_kind:row.provider_kind||prior.provider_kind||null,
              calculation_key:row.calculation_key??prior.calculation_key??null,
              source,
              bulk_capable:typeof row.bulk_capable==='boolean'?row.bulk_capable:Boolean(prior.bulk_capable)
            };
          }
          overlay.captured_at=new Date().toISOString();
          fs.writeFileSync(overlayPath,JSON.stringify(overlay,null,2)+'\n');
          console.log(JSON.stringify({coverage_rows:rows.length,overlay_statuses:Object.keys(overlay.statuses).length,overlay_providers:Object.keys(overlay.providers).length},null,2));
          NODE
            node scripts/build-derived-governance.js
            node <<'NODE'
          const r=require('./property/data/marker-registry.json');
          const byId=new Map((r.markers||[]).map(m=>[String(m.id),m]));
          const targets=[
            'property.market_value','property.owner_name',
            'uniformity.cod_2018','uniformity.cod_2019','uniformity.cod_2020','uniformity.cod_2021',
            'njplus.nj-dca-municipal-housing-profile.housing_production',
            'njplus.nj-dca-neighborhood-trends.real_estate_tax_median',
            'njplus.nj-dca-pilot-forecast.pilot_agreement_count',
            'njplus.nj-dca-pilot-forecast.pilot_project_count',
            'njplus.nj-dca-pilot-forecast.pilot_project_assessment',
            'njplus.nj-dca-pilot-forecast.pilot_term_remaining',
            'njplus.nj-dca-pilot-forecast.pilot_expiration_year',
            'njplus.nj-dca-pilot-forecast.pilot_project_type'
          ];
          const bad=targets.filter(id=>byId.get(id)?.provider_status!=='live');
          if(bad.length) throw new Error('Production-certified targets did not reconcile live: '+bad.join(', '));
          const s=r.summary?.provider_status||{};
          if(Number(s.live||0)<941) throw new Error(`Expected at least 941 live markers, found ${s.live||0}`);
          if(Number(s.planned||0)>181) throw new Error(`Expected planned <=181, found ${s.planned||0}`);
          if(Number(s.partial||0)>3) throw new Error(`Expected partial <=3, found ${s.partial||0}`);
          if(Number(s.unavailable||0)>5) throw new Error(`Expected unavailable <=5 after production reconciliation, found ${s.unavailable||0}`);
          console.log(JSON.stringify({total:r.summary.total,provider_status:s,certified_targets:targets.length},null,2));
          NODE
            git rm -f --ignore-unmatch \
              .github/workflows/oneoff-njw143-post927-audit.yml \
              .github/workflows/oneoff-njw143-production-overlay-reconcile.yml
            git add property/data/db-governed-provider-overlay.json property/data/marker-registry.json property/data/derived-marker-governance.json
            if git diff --cached --quiet; then
              echo "Production overlay and canonical governance already reconciled."
              exit 0
            fi
            git commit -m "NJW-143 reconcile production-live canonical markers"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Concurrent main update detected; retrying against latest main."
            sleep $((attempt*2))
          done
          echo "Unable to reconcile production overlay after concurrent retries." >&2
          exit 1
