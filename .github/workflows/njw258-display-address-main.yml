name: NJW-258 searched address display verifier
# rerun after parcel fallback contract synchronization

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/njw258-display-address-main.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Prepare structural patcher
        shell: bash
        run: |
          cat > /tmp/njw258_display_address_patch.py <<'PY'
          from pathlib import Path
          import re

          path = Path('property/js/lookup.js')
          s = path.read_text()

          if 'function displayStreetAddress(typed, matched, assessor)' not in s:
              anchor = '  var PARCEL_ADDR_NOISE = {'
              if anchor not in s:
                  raise SystemExit('display helper insertion anchor not found')
              helper = """  function displayStreetAddress(typed, matched, assessor) {
            // Keep the address the visitor searched as the primary label. NJ's
            // assessor may use a different street alias for the same tax parcel.
            var source = String(matched || typed || assessor || '').trim();
            var street = source.split(',')[0].trim();
            return street || String(assessor || typed || '').trim();
          }

          function assessorAddressAlias(display, assessor) {
            var parcelAddress = String(assessor || '').trim();
            if (!parcelAddress || !display) return '';
            return normAddr(parcelAddress) === normAddr(display) ? '' : parcelAddress;
          }

          """
              lines = helper.splitlines()
              normalized = []
              for i, line in enumerate(lines):
                  if i == 0:
                      normalized.append(line)
                  elif line.startswith('        '):
                      normalized.append(line[8:])
                  else:
                      normalized.append(line)
              helper = '\n'.join(normalized) + '\n'
              s = s.replace(anchor, helper + anchor, 1)

          if 'var displayAddress = displayStreetAddress(typed, geo && geo.matched, p.PROP_LOC);' not in s:
              pattern = r"(    var propertyZip = propertyLocationZip\(typed, geo && geo\.matched\);\n)(    var status = resolveStatus\(p, dy\);)"
              replacement = (r"\1"
                  "    var displayAddress = displayStreetAddress(typed, geo && geo.matched, p.PROP_LOC);\n"
                  "    var assessorAddress = String(p.PROP_LOC || '').trim();\n"
                  "    var assessorAlias = assessorAddressAlias(displayAddress, assessorAddress);\n"
                  r"\2")
              s, n = re.subn(pattern, replacement, s, count=1)
              if n != 1:
                  raise SystemExit('render address variables anchor not found')

          old_current = "      address: p.PROP_LOC || typed, town: p.MUN_NAME || '', county: p.COUNTY || '', zip: propertyZip,"
          if old_current in s:
              s = s.replace(old_current,
                  "      address: displayAddress, assessorAddress: assessorAddress, assessorAlias: assessorAlias,\n"
                  "      town: p.MUN_NAME || '', county: p.COUNTY || '', zip: propertyZip,", 1)

          if 'NJ tax records list this parcel as ' not in s:
              old_head = ("      '<div class=\"plm-addr\">' + esc(current.address) + '<span>' + esc(current.town) +\n"
                  "        (current.county ? ', ' + esc(current.county) + ' County' : '') + (current.zip ? '  ' + esc(current.zip) : '') + '</span></div>' +")
              new_head = ("      '<div class=\"plm-addr\">' + esc(current.address) + '<span>' + esc(current.town) +\n"
                  "        (current.county ? ', ' + esc(current.county) + ' County' : '') + (current.zip ? '  ' + esc(current.zip) : '') + '</span>' +\n"
                  "        (current.assessorAlias\n"
                  "          ? '<span class=\"plm-assessor-alias\" style=\"font-size:12px;opacity:.72;margin-top:4px;\">NJ tax records list this parcel as ' + esc(current.assessorAlias) + '.</span>'\n"
                  "          : '') + '</div>' +")
              if old_head not in s:
                  raise SystemExit('headline address anchor not found')
              s = s.replace(old_head, new_head, 1)

          if 'address: p.PROP_LOC || typed, town:' in s:
              raise SystemExit('legacy assessor-first current address remains')

          path.write_text(s)

          Path('property/tests/property-display-address-contract.mjs').write_text("""import fs from 'node:fs';
          import assert from 'node:assert/strict';

          const src = fs.readFileSync(new URL('../js/lookup.js', import.meta.url), 'utf8');

          assert.match(src, /function displayStreetAddress\\(typed, matched, assessor\\)/, 'searched/geocoded address display helper must exist');
          assert.match(src, /var displayAddress = displayStreetAddress\\(typed, geo && geo\\.matched, p\\.PROP_LOC\\)/, 'render must derive the user-facing address from search evidence');
          assert.match(src, /address: displayAddress, assessorAddress: assessorAddress, assessorAlias: assessorAlias/, 'display and assessor addresses must be kept separately');
          assert.doesNotMatch(src, /address: p\\.PROP_LOC \\|\\| typed, town:/, 'assessor PROP_LOC must not replace the searched address');
          assert.match(src, /NJ tax records list this parcel as/, 'assessor alias must be disclosed as secondary context');
          assert.match(src, /normAddr\\(parcelAddress\\) === normAddr\\(display\\)/, 'equivalent spellings must not create a false alias note');

          console.log('property display address contract: ok');
          """)
          PY
      - name: Sync current main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Apply display patch
        run: python /tmp/njw258_display_address_patch.py
      - name: Syntax check
        run: node --check property/js/lookup.js
      - name: Lookup performance contract
        run: node property/tests/property-lookup-performance-contract.mjs
      - name: Parcel fallback contract
        run: node property/tests/property-parcel-fallback-contract.mjs
      - name: Address alias contract
        run: node property/tests/property-address-alias-contract.mjs
      - name: Mailing ZIP contract
        run: node property/tests/property-mailing-zip-contract.mjs
      - name: Display address contract
        run: node property/tests/property-display-address-contract.mjs
      - name: Diff check
        run: git diff --check
      - name: Reconcile concurrent main before write
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            git reset --hard origin/main
            python /tmp/njw258_display_address_patch.py
            node --check property/js/lookup.js
            node property/tests/property-lookup-performance-contract.mjs
            node property/tests/property-parcel-fallback-contract.mjs
            node property/tests/property-address-alias-contract.mjs
            node property/tests/property-mailing-zip-contract.mjs
            node property/tests/property-display-address-contract.mjs
            git diff --check
          fi
      - name: Commit verified product change and self-clean
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/njw258-display-address-main.yml
          git add property/js/lookup.js property/tests/property-display-address-contract.mjs .github/workflows/njw258-display-address-main.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "NJW-258 keep searched address primary in property report"
          git push origin HEAD:main
