name: NJW-287 PR Gate

on:
  push:
    branches:
      - chatgpt/njw-287-insight-links-final-20260829

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run vercel-build
