name: NJW-258 searched address production release

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/njw258-display-production-release.yml

permissions:
  contents: write

jobs:
  release-once:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Sync current main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Enable exactly one Git production deployment
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('vercel.json')
          s = p.read_text()
          old='"deploymentEnabled": false'
          if old not in s:
              raise SystemExit('deploymentEnabled is not paused; refusing release pulse')
          p.write_text(s.replace(old, '"deploymentEnabled": true', 1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vercel.json
          git commit -m "Temporarily enable one Git deployment for NJW-258 display address"
          git push origin HEAD:main
          sleep 22
      - name: Restore paused Git deployments and self-clean
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          python - <<'PY'
          from pathlib import Path
          p = Path('vercel.json')
          s = p.read_text()
          if '"deploymentEnabled": true' not in s:
              raise SystemExit('deployment pulse was not enabled; refusing silent restore')
          p.write_text(s.replace('"deploymentEnabled": true', '"deploymentEnabled": false', 1))
          PY
          rm .github/workflows/njw258-display-production-release.yml
          git add vercel.json .github/workflows/njw258-display-production-release.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Restore paused Git deployments after NJW-258 display address release"
          git push origin HEAD:main
