permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check browser JavaScript syntax
        run: |
          node --check property/js/anchor-application-2025.js
          node --check property/js/anchor-application-pdf-2025.js
          node --check property/js/anchor-application-vault.js
          node --check property/js/anchor-application-2025-guard.js
          node --check property/js/anchor-application-2025-enhancements.js
          node --check property/js/anchor-application-2025-growth.js
          node --check property/js/anchor-application-social-link.js
          node --check property/js/anchor-application-lifecycle.js
          node --check property/js/anchor-applications.js
          node --check property/js/anchor-applications-filing.js
      - name: Run privacy and routing contracts
        run: |
          node property/tests/anchor-application-2025-contract.mjs
          node property/tests/anchor-application-2025-enhancements-contract.mjs
          node property/tests/anchor-completion-growth-contract.mjs
          node property/tests/anchor-application-social-link-contract.mjs
          node property/tests/anchor-application-lifecycle-contract.mjs
