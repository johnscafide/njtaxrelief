name: Patch Workbench owner field
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[owner-field-done]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wire owner name into Data Workbench
        shell: python
        run: |
          from pathlib import Path
          p=Path('property/js/data-workbench.js')
          s=p.read_text()
          old="['property.pams_pin','PAMS PIN','pams_pin','pro','text'],['property.class'"
          new="['property.pams_pin','PAMS PIN','pams_pin','pro','text'],['property.owner_name','Owner name on record','owner_name','pro','text'],['property.class'"
          if old not in s:
              raise SystemExit('CORE insertion point not found')
          s=s.replace(old,new,1)
          old="async function loadSource(reset){if(S.loading)return;S.loading=true;if(reset){S.rows=[];S.nextOffset=0;S.total=0;S.selected.clear()}$('#dw-rows').innerHTML='<tr><td class=\"dw-empty\">Loading governed property rows…</td></tr>';try{if(S.source==='saved')await loadSaved();else if(S.source==='opportunity')await loadOpportunity();else await loadFarm(reset?0:(S.nextOffset||0),!reset);await hydrateMarkers(S.rows);apply();await loadCampaigns()}"
          new="async function loadSource(reset){if(S.loading)return;S.loading=true;if(reset){S.rows=[];S.nextOffset=0;S.total=0;S.selected.clear()}$('#dw-rows').innerHTML='<tr><td class=\"dw-empty\">Loading governed property rows…</td></tr>';try{if(S.source==='saved')await loadSaved();else if(S.source==='opportunity')await loadOpportunity();else await loadFarm(reset?0:(S.nextOffset||0),!reset);await hydrateMarkers(S.rows);await hydrateOwnerNames(S.rows);apply();await loadCampaigns()}"
          if old not in s:
              raise SystemExit('loadSource insertion point not found')
          s=s.replace(old,new,1)
          old="async function hydrateMarkers(rows){"
          helper="async function hydrateOwnerNames(rows){if(!S.columns.includes('property.owner_name'))return;const missing=(rows||[]).filter(r=>r.pams_pin&&!String(r.owner_name||'').trim()),pins=[...new Set(missing.map(r=>r.pams_pin).filter(Boolean))];if(!pins.length)return;for(let i=0;i<pins.length;i+=800){const r=await S.client.functions.invoke('workbench-baseline',{body:{pams_pins:pins.slice(i,i+800),source:'data_workbench_owner'}});if(r.error)continue;mergeRefresh({records:r.data?.records||[]})}}\nasync function hydrateMarkers(rows){"
          if old not in s:
              raise SystemExit('hydrateMarkers insertion point not found')
          s=s.replace(old,helper,1)
          old="async function loadMore(){if(S.source!=='farm'||S.nextOffset==null)return;const b=$('#dw-more'),old=b.innerHTML;b.disabled=true;b.innerHTML='<i class=\"fas fa-circle-notch fa-spin\"></i> Loading';try{await loadFarm(S.nextOffset,true);await hydrateMarkers(S.rows);apply()}"
          new="async function loadMore(){if(S.source!=='farm'||S.nextOffset==null)return;const b=$('#dw-more'),old=b.innerHTML;b.disabled=true;b.innerHTML='<i class=\"fas fa-circle-notch fa-spin\"></i> Loading';try{await loadFarm(S.nextOffset,true);await hydrateMarkers(S.rows);await hydrateOwnerNames(S.rows);apply()}"
          if old not in s:
              raise SystemExit('loadMore insertion point not found')
          s=s.replace(old,new,1)
          old="$$('[data-field]',host).forEach(x=>x.onchange=()=>{const id=x.dataset.field;if(x.checked&&!S.columns.includes(id))S.columns.push(id);if(!x.checked)S.columns=S.columns.filter(c=>c!==id);renderGrid()})"
          new="$$('[data-field]',host).forEach(x=>x.onchange=async()=>{const id=x.dataset.field;if(x.checked&&!S.columns.includes(id))S.columns.push(id);if(!x.checked)S.columns=S.columns.filter(c=>c!==id);if(x.checked&&id==='property.owner_name')await hydrateOwnerNames(S.rows);renderGrid()})"
          if old not in s:
              raise SystemExit('field toggle insertion point not found')
          s=s.replace(old,new,1)
          s=s.replace('/property/data/marker-registry.json?v=20260811f','/property/data/marker-registry.json')
          p.write_text(s)

          p=Path('property/js/data-workbench-field-library.js')
          s=p.read_text().replace('/property/data/marker-registry.json?v=20260811f','/property/data/marker-registry.json')
          p.write_text(s)

          p=Path('property/data-workbench.html')
          s=p.read_text()
          import re
          s=re.sub(r'(\.(?:css|js))\?v=[^\"\']+',r'\1',s)
          p.write_text(s)
      - name: Syntax check Workbench scripts
        run: |
          node --check property/js/data-workbench.js
          node --check property/js/data-workbench-field-library.js
      - name: Commit patch
        run: |
          git config user.name "Watchdog Automation"
          git config user.email "actions@users.noreply.github.com"
          git add property/data-workbench.html property/js/data-workbench.js property/js/data-workbench-field-library.js
          git commit -m "[owner-field-done] Populate Workbench owner name from public records"
          git push
