name: Munidex adapter probe

on:
  pull_request:
    paths:
      - '.github/workflows/munidex-adapter-probe.yml'
      - 'supabase/functions/transaction-municipal-evidence/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Inspect public Munidex tax and utility contracts without account data
        shell: python
        run: |
          import html.parser, re, urllib.parse, urllib.request

          UA='Mozilla/5.0 Watchdog-Munidex-contract/1.0'
          pages=[
            ('tax','https://tax.munidex.info/englewoodcliffs-nj-0216/'),
            ('utility','https://tax.munidex.info/hanovertwp-nj-1412-swr/'),
          ]
          class P(html.parser.HTMLParser):
            def __init__(self):
              super().__init__(); self.forms=[]; self.cur=None; self.scripts=[]
            def handle_starttag(self,tag,attrs):
              a=dict(attrs)
              if tag=='form':
                self.cur={'method':a.get('method','get').lower(),'action':a.get('action',''),'fields':[]}; self.forms.append(self.cur)
              elif tag in ('input','select','button') and self.cur is not None:
                name=a.get('name') or a.get('id')
                if name: self.cur['fields'].append(name)
              elif tag=='script' and a.get('src'): self.scripts.append(a['src'])
            def handle_endtag(self,tag):
              if tag=='form': self.cur=None
          def fetch(url,max_bytes=2_000_000):
            req=urllib.request.Request(url,headers={'User-Agent':UA,'Accept':'text/html,application/javascript,*/*;q=0.5'})
            with urllib.request.urlopen(req,timeout=20) as r: return r.read(max_bytes).decode('utf-8','replace')

          endpoint_patterns=[
            re.compile(r'''["']([^"']*(?:api|search|lookup|property|tax|util)[^"']*)["']''',re.I),
            re.compile(r'''(?:fetch|axios\.(?:get|post)|\.get|\.post)\s*\(\s*["']([^"']+)["']''',re.I),
          ]
          for kind,url in pages:
            text=fetch(url); p=P(); p.feed(text)
            print('PAGE',kind,'forms',p.forms[:12])
            print('PAGE',kind,'scripts',p.scripts[-20:])
            seen=set()
            for src in p.scripts[-12:]:
              full=urllib.parse.urljoin(url,src)
              try: js=fetch(full,4_000_000)
              except Exception as e:
                print('SCRIPT_FAIL',kind,urllib.parse.urlparse(full).path,type(e).__name__); continue
              hits=[]
              for pat in endpoint_patterns:
                for m in pat.finditer(js):
                  v=m.group(1)
                  if len(v)<240 and v not in seen:
                    seen.add(v); hits.append(v)
              if hits:
                print('SCRIPT',kind,urllib.parse.urlparse(full).path,'endpoint_candidates',hits[:80])
