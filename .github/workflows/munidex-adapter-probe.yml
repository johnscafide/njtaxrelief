name: Munidex adapter probe

on:
  pull_request:
    paths:
      - '.github/workflows/munidex-adapter-probe.yml'
      - 'supabase/functions/transaction-municipal-evidence/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Inspect public Munidex lookup contracts without account data
        shell: python
        run: |
          import html.parser, re, urllib.parse, urllib.request
          UA='Mozilla/5.0 Watchdog-Munidex-contract/1.1'
          pages=[
            ('tax','https://tax.munidex.info/englewoodcliffs-nj-0216/'),
            ('utility','https://tax.munidex.info/hanovertwp-nj-1412-swr/'),
          ]
          class P(html.parser.HTMLParser):
            def __init__(self):
              super().__init__(); self.forms=[]; self.cur=None; self.scripts=[]; self.inline=[]; self.in_script=False; self.buf=[]
            def handle_starttag(self,tag,attrs):
              a=dict(attrs)
              if tag=='form':
                self.cur={'method':a.get('method','get').lower(),'action':a.get('action',''),'fields':[]}; self.forms.append(self.cur)
              elif tag in ('input','select','button') and self.cur is not None:
                name=a.get('name') or a.get('id')
                if name: self.cur['fields'].append(name)
              elif tag=='script':
                if a.get('src'): self.scripts.append(a['src'])
                else: self.in_script=True; self.buf=[]
            def handle_data(self,data):
              if self.in_script: self.buf.append(data)
            def handle_endtag(self,tag):
              if tag=='form': self.cur=None
              elif tag=='script' and self.in_script:
                self.inline.append(''.join(self.buf)); self.in_script=False; self.buf=[]
          def fetch(url,max_bytes=4_000_000):
            req=urllib.request.Request(url,headers={'User-Agent':UA,'Accept':'text/html,application/javascript,*/*;q=0.5'})
            with urllib.request.urlopen(req,timeout=20) as r: return r.read(max_bytes).decode('utf-8','replace')

          interesting=re.compile(r'validation(?:address|block|lot|name|accnum)|window\.location|location\.href|ajax|fetch\(|\.get\(|\.post\(|search|lookup|detail|property',re.I)
          urls=re.compile(r'''["']([^"']{1,220})["']''')
          for kind,url in pages:
            text=fetch(url); p=P(); p.feed(text)
            print('PAGE',kind,'forms',p.forms[:12])
            print('PAGE',kind,'scripts',p.scripts[-20:])
            for idx,script in enumerate(p.inline):
              if not interesting.search(script): continue
              compact=' '.join(script.split())
              candidates=[]
              for value in urls.findall(script):
                if interesting.search(value) or value.startswith(('/', '?')):
                  candidates.append(value)
              print('INLINE',kind,idx,'len',len(script),'url_candidates',candidates[:100])
              for token in ('validationaddress','validationblock','validationaccnum'):
                pos=compact.lower().find(token)
                if pos>=0: print('INLINE_CONTEXT',kind,token,compact[max(0,pos-500):pos+1200])
