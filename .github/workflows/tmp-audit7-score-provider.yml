name: Temporary audit 7 score provider closure

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  patch-score-provider:
    if: ${{ github.event.pull_request.head.ref == 'watchdog/prelaunch-audit-78-2026-08-22' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Make ROBUST consume the certified district ratio
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          python - <<'PY'
          from pathlib import Path
          score = Path('property/js/watchdog-score-public.js')
          s = score.read_text()
          old = "    var official = latestOfficial(record, officialData);"
          new = "    var official = record.certifiedRatio || latestOfficial(record, officialData);"
          if new not in s:
              if s.count(old) != 1:
                  raise SystemExit(f'ROBUST official ratio insertion expected 1 match, found {s.count(old)}')
              s = s.replace(old, new, 1)
              score.write_text(s)

          test = Path('property/tests/prelaunch-audit-78-contract.mjs')
          t = test.read_text()
          if "const score = fs.readFileSync('property/js/watchdog-score-public.js'" not in t:
              t = t.replace("const s = fs.readFileSync('property/js/lookup.js', 'utf8');", "const s = fs.readFileSync('property/js/lookup.js', 'utf8');\nconst score = fs.readFileSync('property/js/watchdog-score-public.js', 'utf8');")
              t = t.replace("ok(s.includes(\"providerVersion: j.provider_version\"), 'Provider provenance must be retained.');", "ok(s.includes(\"providerVersion: j.provider_version\"), 'Provider provenance must be retained.');\nok(score.includes('record.certifiedRatio || latestOfficial(record, officialData)'), 'Canonical ROBUST score must consume the certified statewide district ratio before the legacy static table.');")
              t = t.replace("contract:'prelaunch-audit-7-8', checks:8", "contract:'prelaunch-audit-7-8', checks:9")
              test.write_text(t)
          PY
          rm -f .audit78-score-seed
          node --check property/js/lookup.js
          node --check property/js/watchdog-score-public.js
          node property/tests/prelaunch-audit-78-contract.mjs
          git diff --check
          if git diff --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'Watchdog Launch Audit'
          git config user.email 'actions@users.noreply.github.com'
          git add -A property/js/watchdog-score-public.js property/tests/prelaunch-audit-78-contract.mjs .audit78-score-seed 2>/dev/null || true
          git commit -am '[audit7-score] Use statewide certified ratio in ROBUST score' || git commit -m '[audit7-score] Use statewide certified ratio in ROBUST score'
          git push origin HEAD:${TARGET_BRANCH}
