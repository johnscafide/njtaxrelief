name: One-shot close Watchdog sprint initiative eight

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-close-sprint-eight.yml'

permissions:
  contents: write

jobs:
  close-log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconcile trust/freshness sprint evidence
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          python3 - <<'PY'
          from pathlib import Path
          p=Path('property/logs/2026-08-18/index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('6 initiatives complete · #3 model repair requires a fresh holdout · #8 next',
                      '7 initiatives complete · #3 model repair requires a fresh holdout · #9 next')
          old='<article class="item"><header><div class="num">8</div><h2>Trust, source freshness, explainability UX</h2><span class="state">QUEUED</span></header></article>'
          new='''<article class="item"><header><div class="num">8</div><h2>Trust, source freshness, explainability UX</h2><span class="state">COMPLETE · PRODUCTION</span></header><p>Watchdog now exposes source-health and explainability evidence with explicit semantics instead of generic freshness badges.</p><ul><li>The governed freshness artifact is now schema v3 and distinguishes <b>live endpoint health</b>, <b>materialized local coverage</b>, and <b>configured reference metadata</b>. A catalog/reference entry can no longer appear as a fake 0-of-1 coverage pass.</li><li>Live health checks explicitly state that a healthy endpoint does not mean every property has a matching record. Materialized datasets report actual configured record/file minimums. Reference-only entries are labeled configured rather than validated.</li><li>The public <a href="/property/trust/">Trust Center</a> now renders the current generated source evidence, checked time, health/coverage class, cadence, degraded rows and source links. Failure mode is fail-honest: it refuses to substitute a stale green status when the report cannot load.</li><li>The current governed report intentionally remains <b>degraded</b> because the Municipal Affordable Housing Status Report has no validated local artifact yet. Watchdog exposes that failed source rather than counting it as available evidence. The DCA source repair continues independently and does not block truthful presentation of every other source.</li><li>The source catalog family <code>watchdog-nj-source-v031</code> is now correctly represented as <b>configured_reference</b>, not as a passed materialized dataset with zero records.</li><li>Compact Property Home Analyst briefs now show confidence/evidence-coverage cues only when those governed percentages actually exist in the evidence card, plus a small Trust &amp; Sources path. No generic confidence badge is manufactured when metrics are absent.</li><li>A dedicated <code>trust-freshness-explainability-contract.mjs</code> protects validation-kind semantics, degraded-source honesty, stale-green failure behavior, conditional compact trust metrics and the no-<code>?v=</code> rule in Access Boundary CI.</li><li>All #8 customer-facing and CI-registration commits reached Vercel production <b>READY</b>.</li></ul><p><b>Follow-on source maintenance:</b> continue repairing the 2026 DCA affordable-housing workbook parser/output. Until its configured coverage passes, it remains visibly degraded and is not treated as usable property evidence.</p></article>'''
          if old not in s:
              raise SystemExit('Sprint #8 queued article not found; refusing blind rewrite')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          Path('.github/workflows/one-shot-close-sprint-eight.yml').unlink()
          PY
          git config user.name 'Watchdog Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add property/logs/2026-08-18/index.html .github/workflows/one-shot-close-sprint-eight.yml
          git commit -m 'Close Watchdog sprint initiative eight'
          git pull --rebase origin main
          git push origin main
