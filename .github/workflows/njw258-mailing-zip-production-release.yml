name: NJW-258 mailing ZIP production release
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/njw258-mailing-zip-production-release.yml
permissions:
  contents: write
jobs:
  release-once:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Sync current main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Enable exactly one Git production deployment
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('vercel.json')
          s=p.read_text()
          old='"deploymentEnabled": false'
          if old not in s: raise SystemExit('deploymentEnabled was not paused')
          p.write_text(s.replace(old,'"deploymentEnabled": true',1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vercel.json
          git commit -m 'Temporarily enable one Git deployment for NJW-258 mailing ZIP fix'
          git push origin HEAD:main
          sleep 25
      - name: Restore paused Git deployments
        run: |
          git fetch origin main
          git reset --hard origin/main
          python - <<'PY'
          from pathlib import Path
          p=Path('vercel.json')
          s=p.read_text()
          if '"deploymentEnabled": true' in s:
              s=s.replace('"deploymentEnabled": true','"deploymentEnabled": false',1)
          elif '"deploymentEnabled": false' not in s:
              raise SystemExit('unexpected deploymentEnabled state')
          p.write_text(s)
          PY
          rm -f .github/workflows/njw258-mailing-zip-production-release.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A vercel.json .github/workflows/njw258-mailing-zip-production-release.yml
          git commit -m 'Restore paused Git deployments after NJW-258 mailing ZIP release'
          git push origin HEAD:main
