name: Activate January 2022 historical COD

on:
  push:
    branches:
      - data-center-cod-2018-2021-upload-20260821
    paths:
      - property/data/cod/historical-cod-2018-2021.zlib.b64
      - property/data/cod/historical-cod-2018-2021.json
      - property/scripts/activate_historical_cod_2018_2021.py
      - .github/workflows/activate-historical-cod-2018-2021.yml
  pull_request:
    paths:
      - property/data/cod/historical-cod-2018-2021.zlib.b64
      - property/data/cod/historical-cod-2018-2021.json
      - property/scripts/activate_historical_cod_2018_2021.py
      - .github/workflows/activate-historical-cod-2018-2021.yml
      - supabase/functions/workbench-hydrate/index.ts
      - supabase/functions/provider-release-canary/index-v2.ts
      - property/data/cod/SOURCE-MANIFEST.md
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: activate-historical-cod-${{ github.ref }}
  cancel-in-progress: true

jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore byte-stable current uniformity model
        run: |
          git fetch origin main
          git checkout origin/main -- property/uniformity.json
      - name: Apply governed historical COD
        run: python property/scripts/activate_historical_cod_2018_2021.py
      - name: Validate historical source and runtime isolation
        run: |
          python - <<'PY'
          import json
          h=json.load(open('property/data/cod/historical-cod-2018-2021.json'))
          assert h['district_count']==564
          assert h['district_year_count']==2256
          assert h['districts']['0101']['series']=={'2018':12.81,'2019':12.89,'2020':11.46,'2021':12.51}
          print({'districts':h['district_count'],'district_years':h['district_year_count'],'absecon':h['districts']['0101']['series']})
          PY
          git diff --exit-code origin/main -- property/uniformity.json
          grep -F "codHistory:BASE+'/property/data/cod/historical-cod-2018-2021.json'" supabase/functions/workbench-hydrate/index.ts
          ! grep -F "historical_series" supabase/functions/workbench-hydrate/index.ts
          grep -F "uniformity_history_v2" supabase/functions/provider-release-canary/index-v2.ts
      - name: Commit generated activation
        if: github.event_name == 'push'
        run: |
          git config user.name "Watchdog Source Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -- property/data/cod/historical-cod-2018-2021.json property/uniformity.json property/data/cod/SOURCE-MANIFEST.md supabase/functions/workbench-hydrate/index.ts supabase/functions/provider-release-canary/index-v2.ts
          if git diff --cached --quiet; then
            echo "No generated activation changes"
          else
            git commit -m "[source-build] Isolate 2018-2021 COD runtime artifact"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
