name: NJW-303 patch radio selection

on:
  push:
    branches:
      - johnvscafide/njw-303-public-launch-v2
    paths:
      - .github/workflows/njw303-fix-radio.yml

permissions:
  contents: write

jobs:
  patch-once:
    if: github.event.head_commit.message != 'Fix NJW-303 radio appearance selection'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: johnvscafide/njw-303-public-launch-v2
          fetch-depth: 0
      - name: Sync exact branch head
        run: |
          git fetch origin main johnvscafide/njw-303-public-launch-v2
          git reset --hard origin/johnvscafide/njw-303-public-launch-v2
      - name: Patch radio selection by widget appearance state
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('property/js/anchor-application-pdf-2025.js')
          s=p.read_text()
          old="function setRadio(form,descriptor,option){if(!descriptor||!option)return;field(form,descriptor.field||descriptor,'radio').select(String(option));}"
          new="function setRadio(form,descriptor,option){if(!descriptor||!option)return;var group=field(form,descriptor.field||descriptor,'radio'),target=PDFLib.PDFName.of(String(option)),off=PDFLib.PDFName.of('Off'),widgets=group.acroField.getWidgets();group.acroField.setValue(target);widgets.forEach(function(widget){var on=widget.getOnValue();widget.setAppearanceState(on&&on.toString()===target.toString()?on:off);});}"
          if old not in s:
              raise SystemExit('expected setRadio implementation not found; refusing blind patch')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit fix and self-clean
        run: |
          rm .github/workflows/njw303-fix-radio.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add property/js/anchor-application-pdf-2025.js .github/workflows/njw303-fix-radio.yml
          git commit -m "Fix NJW-303 radio appearance selection"
          git push origin HEAD:johnvscafide/njw-303-public-launch-v2
