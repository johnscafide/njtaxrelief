name: One-shot Watchdog retention shell reconciliation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-retention-shell-reconcile.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconcile current shells on latest main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          python3 - <<'PY'
          from pathlib import Path

          app=Path('property/js/app-shell-2027.js')
          text=app.read_text(encoding='utf-8')
          marker='watchdog-today-nav.js'
          if marker not in text:
              text += '''\n;/* Compact retention cue for entitled Intelligence users. */\n(function(){\n  if(document.querySelector('script[src="/property/js/watchdog-today-nav.js"]'))return;\n  var s=document.createElement('script');\n  s.src='/property/js/watchdog-today-nav.js';\n  s.defer=true;\n  document.head.appendChild(s);\n})();\n'''
          app.write_text(text,encoding='utf-8')

          partial=Path('property/partials/sidemenu.html')
          p=partial.read_text(encoding='utf-8')
          p=p.replace('<span>Agent Intel</span>','<span>Watchdog Analyst</span>')
          partial.write_text(p,encoding='utf-8')

          daily=Path('property/intelligence/daily/index.html')
          d=daily.read_text(encoding='utf-8')
          d=d.replace('data-access-require="pro"','data-access-require="pro_plus"',1)
          daily.write_text(d,encoding='utf-8')

          Path('.github/workflows/one-shot-retention-shell-reconcile.yml').unlink()
          PY

          grep -Fq '/property/js/watchdog-today-nav.js' property/js/app-shell-2027.js
          if grep -Fq '>Agent Intel<' property/partials/sidemenu.html; then
            echo 'Legacy Agent Intel label remains in shared sidemenu.' >&2
            exit 1
          fi
          grep -Fq 'data-access-require="pro_plus"' property/intelligence/daily/index.html
          if grep -R -E '\.(js|css)\?v=' property/js/app-shell-2027.js property/partials/sidemenu.html property/intelligence/daily/index.html; then
            echo 'Version-query asset URL introduced.' >&2
            exit 1
          fi

          git config user.name 'Watchdog Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add property/js/app-shell-2027.js property/partials/sidemenu.html property/intelligence/daily/index.html .github/workflows/one-shot-retention-shell-reconcile.yml
          git commit -m 'Reconcile Today retention cue across Watchdog shells'
          git pull --rebase origin main
          git push origin main
