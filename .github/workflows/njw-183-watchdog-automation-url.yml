name: NJW-183 Watchdog automation URL alignment

on:
  push:
    branches:
      - agent/njw-183-watchdog-automation-clean-url

permissions:
  contents: write

jobs:
  align:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/njw-183-watchdog-automation-clean-url
          fetch-depth: 0
      - name: Replace exactly one retired Data Methodology URL
        shell: python
        run: |
          from pathlib import Path
          p=Path('supabase/functions/watchdog-automation/index.ts')
          s=p.read_text(encoding='utf-8')
          old='https://njpropertytaxrelief.com/property/data-methodology.html'
          new='https://njpropertytaxrelief.com/property/data-methodology'
          if s.count(old) != 1:
              raise SystemExit(f'Expected exactly one retired URL, found {s.count(old)}')
          p.write_text(s.replace(old,new,1), encoding='utf-8')
          if old in p.read_text(encoding='utf-8'):
              raise SystemExit('Retired URL remains')
      - name: Verify exact scope and self-remove
        run: |
          set -euo pipefail
          test "$(git diff --name-only)" = "supabase/functions/watchdog-automation/index.ts"
          git diff --check
          rm .github/workflows/njw-183-watchdog-automation-url.yml
      - name: Commit exact source change
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/watchdog-automation/index.ts .github/workflows/njw-183-watchdog-automation-url.yml
          git commit -m "Use clean Data Methodology URL in automation"
          git push origin HEAD:agent/njw-183-watchdog-automation-clean-url
