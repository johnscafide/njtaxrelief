name: NJW-258 property vs mailing ZIP fix
on:
  push:
    branches:
      - fix/njw-258-mailing-zip-identity
    paths:
      - .github/workflows/njw258-mailing-zip-fix.yml
permissions:
  contents: write
jobs:
  patch-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/njw-258-mailing-zip-identity
      - name: Patch property lookup identity semantics
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('property/js/lookup.js')
          s=p.read_text()
          def rep(old,new,label):
              global s
              if old not in s:
                  raise SystemExit(f'missing lookup patch anchor: {label}')
              s=s.replace(old,new,1)

          rep("""  var FIELDS = ['PAMS_PIN','COUNTY','MUN_NAME','PROP_LOC','PCLBLOCK','PCLLOT','PCLQCODE',
    'PROP_CLASS','BLDG_DESC','LAND_DESC','CALC_ACRE','YR_CONSTR','DWELL','COMM_DWELL',
    'LAND_VAL','IMPRVT_VAL','NET_VALUE','LAST_YR_TX','SALE_PRICE','DEED_DATE','DEED_BOOK','DEED_PAGE',
    'ZIP5','ST_ADDRESS','CITY_STATE','ADD_LOTS1'].join(',');""",
"""  // ZIP5, ST_ADDRESS and CITY_STATE on this statewide parcel layer are owner
  // MAILING fields, not property-location fields. They must never participate in
  // parcel identity, be presented as the searched property's ZIP, or be pulled
  // into the public browser payload.
  var FIELDS = ['PAMS_PIN','COUNTY','MUN_NAME','PROP_LOC','PCLBLOCK','PCLLOT','PCLQCODE',
    'PROP_CLASS','BLDG_DESC','LAND_DESC','CALC_ACRE','YR_CONSTR','DWELL','COMM_DWELL',
    'LAND_VAL','IMPRVT_VAL','NET_VALUE','LAST_YR_TX','SALE_PRICE','DEED_DATE','DEED_BOOK','DEED_PAGE',
    'ADD_LOTS1'].join(',');""",'FIELDS')

          rep("""  function parcelZip(value) {
    var m = String(value || '').match(/\\b(\\d{5})(?:-\\d{4})?\\b/);
    return m ? m[1] : '';
  }
""",
"""  function parcelZip(value) {
    var m = String(value || '').match(/\\b(\\d{5})(?:-\\d{4})?\\b/);
    return m ? m[1] : '';
  }

  function propertyLocationZip(typed, matched) {
    // The property ZIP comes from the address evidence, never the parcel
    // layer's owner-mailing ZIP fields.
    return parcelZip(matched) || parcelZip(typed);
  }
""",'propertyLocationZip')

          rep("""  function parcelCandidateMatches(feature, targets) {
    var a = feature && feature.attributes;
    if (!a) return false;
    var candidate = parcelAddressParts(a.PROP_LOC);
    if (!candidate) return false;
    var candidateZip = String(a.ZIP5 || '').trim();
    return targets.some(function (target) {
      if (target.house !== candidate.house) return false;
      if (target.zip && candidateZip && target.zip !== candidateZip) return false;
      if (target.key === candidate.key) return true;
      return !!(target.core && candidate.core && target.core === candidate.core);
    });
  }
""",
"""  function parcelCandidateMatches(feature, targets) {
    var a = feature && feature.attributes;
    if (!a) return false;
    var candidate = parcelAddressParts(a.PROP_LOC);
    if (!candidate) return false;
    return targets.some(function (target) {
      if (target.house !== candidate.house) return false;
      if (target.key === candidate.key) return true;
      return !!(target.core && candidate.core && target.core === candidate.core);
    });
  }
""",'parcelCandidateMatches')

          rep("""  function parcelAliasIdentityMatches(feature, targets) {
    var a = feature && feature.attributes;
    if (!a) return false;
    var candidate = parcelAddressParts(a.PROP_LOC);
    var candidateZip = String(a.ZIP5 || '').trim();
    if (!candidate || !candidate.house || !candidateZip) return false;
    return targets.some(function (target) {
      return !!(target.house && target.house === candidate.house && target.zip && target.zip === candidateZip);
    });
  }
""",
"""  function parcelAliasIdentityMatches(feature, targets) {
    var a = feature && feature.attributes;
    if (!a) return false;
    var candidate = parcelAddressParts(a.PROP_LOC);
    if (!candidate || !candidate.house) return false;
    // Alias recovery is already constrained by a high-confidence geocode,
    // block-scale geometry and unique PAMS identity. Do not compare ZIP5 here:
    // that field belongs to the owner's mailing address, not PROP_LOC.
    return targets.some(function (target) {
      return !!(target.house && target.house === candidate.house);
    });
  }
""",'parcelAliasIdentityMatches')

          s=s.replace('sharing the house number + ZIP. Any ambiguity still fails closed.',
                      'sharing the house number at that location. Any ambiguity still fails closed.')
          s=s.replace('land on one\n    // unqualified tax parcel, and that parcel must share house number + ZIP.',
                      'land on one\n    // unqualified tax parcel, and that parcel must share the searched house number.')
          s=s.replace('one unique unqualified parcel with the same house number + ZIP.',
                      'one unique parcel with the same house number at that location.')

          old="""  function parcelByAddressRecord(lat, lon, typed, matched) {
    var targets = parcelTargets(typed, matched);
    if (!targets.length) return Promise.resolve(null);
    var target = targets.find(function (x) { return x.zip; }) || targets[0];
    if (!target.house) return Promise.resolve(null);

    // This query asks the parcel layer by its own address attributes rather than
    // relying on the geocoder point. House number + ZIP keeps the candidate set
    // bounded; the normalized street-core matcher and distance check below do
    // the actual identity verification.
    var safeHouse = target.house.replace(/'/g, "''");
    var where = "PROP_LOC LIKE '" + safeHouse + " %'";
    if (target.zip) where += " AND ZIP5 = '" + target.zip.replace(/'/g, "''") + "'";
    var p = new URLSearchParams({
      where: where,
      outFields: FIELDS,
      returnGeometry: 'true', returnCentroid: 'true', outSR: '4326',
      resultRecordCount: '100', f: 'json'
    });

    return xfetch(NJ_PARCEL + '?' + p, 15000).then(function (r) { return r.json(); })
      .then(function (d) {
        if (d.error) throw new Error(d.error.message || 'parcel address');
        var matches = (d.features || []).filter(function (feature) {
          if (!parcelCandidateMatches(feature, targets)) return false;
          var dist = parcelDistanceMeters(feature, lat, lon);
          return dist == null || dist <= 600;
        });
        if (matches.length !== 1) return null;
        return matches[0];
      });
  }
"""
          new="""  function parcelByAddressRecord(lat, lon, typed, matched) {
    var targets = parcelTargets(typed, matched);
    if (!targets.length) return Promise.resolve(null);
    var target = targets[0];
    if (!target.house) return Promise.resolve(null);

    // Ask the parcel layer by PROP_LOC, but keep the query spatially local.
    // ZIP5 cannot be used here because NJ's statewide parcel layer defines it
    // as the OWNER MAILING ZIP, which can legitimately differ from the property.
    var meters = 600;
    var dLat = meters / 111320;
    var dLon = meters / (111320 * Math.cos(lat * Math.PI / 180));
    var env = {
      xmin: lon - dLon, ymin: lat - dLat, xmax: lon + dLon, ymax: lat + dLat,
      spatialReference: { wkid: 4326 }
    };
    var safeHouse = target.house.replace(/'/g, "''");
    var where = "PROP_LOC LIKE '" + safeHouse + " %'";
    var p = new URLSearchParams({
      where: where,
      geometry: JSON.stringify(env), geometryType: 'esriGeometryEnvelope',
      inSR: '4326', outSR: '4326', spatialRel: 'esriSpatialRelIntersects',
      outFields: FIELDS,
      returnGeometry: 'true', returnCentroid: 'true',
      resultRecordCount: '100', f: 'json'
    });

    return xfetch(NJ_PARCEL + '?' + p, 15000).then(function (r) { return r.json(); })
      .then(function (d) {
        if (d.error) throw new Error(d.error.message || 'parcel address');
        var matches = (d.features || []).filter(function (feature) {
          if (!parcelCandidateMatches(feature, targets)) return false;
          var dist = parcelDistanceMeters(feature, lat, lon);
          return dist == null || dist <= meters;
        });
        if (matches.length !== 1) return null;
        return matches[0];
      });
  }
"""
          rep(old,new,'parcelByAddressRecord')

          rep('function recordLookup(p, geo, rate, dy) {','function recordLookup(p, geo, rate, dy, propertyZip) {','recordLookup signature')
          rep("county: p.COUNTY || '', zip: p.ZIP5 || '', block: p.PCLBLOCK || '',",
              "county: p.COUNTY || '', zip: propertyZip || '', block: p.PCLBLOCK || '',",'recordLookup zip')

          rep("""    var acres = +p.CALC_ACRE || 0;
    var sqft = acres ? Math.round(acres * 43560) : 0;
    var mail = (p.ST_ADDRESS || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
    var loc = (p.PROP_LOC || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
    var absentee = !!(mail && loc && mail !== loc);
    var status = resolveStatus(p, dy);

    current = {
      address: p.PROP_LOC || typed, town: p.MUN_NAME || '', county: p.COUNTY || '', zip: p.ZIP5 || '',
""",
"""    var acres = +p.CALC_ACRE || 0;
    var sqft = acres ? Math.round(acres * 43560) : 0;
    var propertyZip = propertyLocationZip(typed, geo && geo.matched);
    var status = resolveStatus(p, dy);

    current = {
      address: p.PROP_LOC || typed, town: p.MUN_NAME || '', county: p.COUNTY || '', zip: propertyZip,
""",'render property zip')
          rep('recordLookup(p, geo, rate, dy);','recordLookup(p, geo, rate, dy, propertyZip);','recordLookup call')
          owner_line="            frow('Owner mailing', absentee ? [p.ST_ADDRESS, p.CITY_STATE].filter(Boolean).join(', ') : 'Same as property') +\n"
          if owner_line not in s:
              raise SystemExit('missing owner mailing line')
          s=s.replace(owner_line,'',1)

          rep("outFields: 'PAMS_PIN,PROP_LOC,MUN_NAME,COUNTY,ZIP5,PCLBLOCK,PCLLOT,NET_VALUE,LAST_YR_TX,' +",
              "outFields: 'PAMS_PIN,PROP_LOC,MUN_NAME,COUNTY,PCLBLOCK,PCLLOT,NET_VALUE,LAST_YR_TX,' +",'hood fields')
          rep("county: a.COUNTY || '', zip: a.ZIP5 || '',",
              "county: a.COUNTY || '', zip: '',",'hood zip')

          p.write_text(s)

          a=Path('property/js/nj-address-autocomplete.js')
          t=a.read_text()
          if "LAST_YR_TX,ZIP5,YR_CONSTR" not in t:
              raise SystemExit('missing autocomplete ZIP5 field anchor')
          t=t.replace("LAST_YR_TX,ZIP5,YR_CONSTR","LAST_YR_TX,YR_CONSTR",1)
          anchor="function streetNumber(v){var m=String(v||'').trim().match(/^(\\d+[A-Z-]?)/i);return m?m[1].toUpperCase():'';}"
          helper=anchor+"\n  function zipFromAddress(v){var m=String(v||'').match(/\\b(\\d{5})(?:-\\d{4})?\\b/);return m?m[1]:'';}"
          if anchor not in t:
              raise SystemExit('missing autocomplete helper anchor')
          t=t.replace(anchor,helper,1)
          old="pams_pin:a.PAMS_PIN||'',address:a.PROP_LOC||address,town:a.MUN_NAME||'',county:a.COUNTY||'',zip:a.ZIP5||'',"
          new="pams_pin:a.PAMS_PIN||'',address:a.PROP_LOC||address,town:a.MUN_NAME||'',county:a.COUNTY||'',zip:zipFromAddress(address),"
          if old not in t:
              raise SystemExit('missing autocomplete row zip anchor')
          t=t.replace(old,new,1)
          a.write_text(t)

          test=Path('property/tests/property-address-alias-contract.mjs')
          u=test.read_text()
          old="assert.match(lookup, /target\\.zip === candidateZip/, 'alias candidate must keep the same ZIP');"
          new="assert.doesNotMatch(lookup, /candidateZip = String\\(a\\.ZIP5/, 'owner mailing ZIP must never participate in parcel alias identity');"
          if old not in u:
              raise SystemExit('missing alias test ZIP assertion')
          u=u.replace(old,new,1)
          test.write_text(u)

          Path('property/tests/property-mailing-zip-contract.mjs').write_text("""import assert from 'node:assert/strict';
import { readFileSync } from 'node:fs';

const lookup = readFileSync(new URL('../js/lookup.js', import.meta.url), 'utf8');
const autocomplete = readFileSync(new URL('../js/nj-address-autocomplete.js', import.meta.url), 'utf8');

const fields = lookup.slice(lookup.indexOf('var FIELDS ='), lookup.indexOf('var CLASSES ='));
assert.doesNotMatch(fields, /ZIP5|ST_ADDRESS|CITY_STATE/, 'public property lookup must not request owner mailing fields');
assert.doesNotMatch(lookup, /candidateZip = String\\(a\\.ZIP5/, 'mailing ZIP cannot verify parcel identity');
assert.doesNotMatch(lookup, /ZIP5 = '/, 'assessor address fallback cannot filter by owner mailing ZIP');
assert.match(lookup, /function propertyLocationZip\\(typed, matched\\)/, 'property location ZIP should come from address evidence');
assert.match(lookup, /zip: propertyZip/, 'current property state should use address-derived ZIP');
assert.match(lookup, /function recordLookup\\(p, geo, rate, dy, propertyZip\\)/, 'ledger should receive property ZIP explicitly');
assert.match(lookup, /zip: propertyZip \\|\\| ''/, 'ledger must not persist parcel mailing ZIP as property ZIP');
assert.doesNotMatch(lookup, /Owner mailing/, 'public property panel should not expose owner mailing address');
assert.doesNotMatch(autocomplete, /PARCEL_FIELDS=.*ZIP5/, 'autocomplete parcel enrichment must not request mailing ZIP');
assert.match(autocomplete, /zip:zipFromAddress\\(address\\)/, 'autocomplete enrichment should derive ZIP from selected address text');
assert.doesNotMatch(autocomplete, /a\\.ZIP5/, 'autocomplete must not present parcel mailing ZIP as property ZIP');

// Live NJ regression captured 2026-09-02: the Paulsboro parcel is 15 Quincy St,
// but its owner mailing ZIP is 08027 while the searched property ZIP is 08066.
const searchedZip='08066', ownerMailingZip='08027';
assert.notEqual(searchedZip, ownerMailingZip);

console.log('property mailing zip contract: ok');
""")
          PY
      - name: Verify lookup contracts
        run: |
          node --check property/js/lookup.js
          node --check property/js/nj-address-autocomplete.js
          node property/tests/property-lookup-performance-contract.mjs
          node property/tests/property-parcel-fallback-contract.mjs
          node property/tests/property-address-alias-contract.mjs
          node property/tests/property-mailing-zip-contract.mjs
          git diff --check
      - name: Commit verified fix and remove workflow
        run: |
          rm .github/workflows/njw258-mailing-zip-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add property/js/lookup.js property/js/nj-address-autocomplete.js property/tests/property-address-alias-contract.mjs property/tests/property-mailing-zip-contract.mjs .github/workflows/njw258-mailing-zip-fix.yml
          git commit -m 'NJW-258 separate property location from owner mailing ZIP'
          git push origin HEAD:fix/njw-258-mailing-zip-identity
