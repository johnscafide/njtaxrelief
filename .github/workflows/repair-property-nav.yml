name: Repair property sticky nav
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate current property navigation contract
        shell: python
        run: |
          from pathlib import Path
          p = Path('property/index.html')
          s = p.read_text(encoding='utf-8')
          required = [
              'id="wd-nav"',
              'id="wd-menu-trigger"',
              "WatchdogPublicNav.open('main')",
              'id="wd-profile-trigger"',
              "WatchdogPublicNav.open('profile')",
              'id="wd-main-sheet"',
              'id="wd-profile-sheet"',
              '/property/dashboard',
              '/property/home',
              '/property/pro.html',
          ]
          missing = [x for x in required if x not in s]
          if missing:
              raise SystemExit('property navigation contract missing: ' + ', '.join(missing))
          legacy = [
              'ssearch-menu-trigger',
              'ssearch-profile-trigger',
              '<nav class="ssearch-nav">',
          ]
          present = [x for x in legacy if x in s]
          if present:
              raise SystemExit('obsolete sticky nav markup remains: ' + ', '.join(present))
          print('Property navigation contract is current and no legacy sticky-nav repair is required.')
