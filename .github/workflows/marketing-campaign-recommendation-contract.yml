name: Marketing Campaign Recommendation Contract
on:
  pull_request:
    paths:
      - 'supabase/migrations/*marketing_campaign_recommendation*.sql'
      - 'property/js/marketing-studio-discovery.js'
      - 'property/js/marketing-studio-campaign-recommendation.js'
      - 'property/css/marketing-studio-campaign-recommendation.css'
      - 'property/marketing-studio/design/index.html'
      - 'property/tests/marketing-campaign-recommendation-contract.mjs'
      - '.github/workflows/marketing-campaign-recommendation-contract.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/*marketing_campaign_recommendation*.sql'
      - 'property/js/marketing-studio-discovery.js'
      - 'property/js/marketing-studio-campaign-recommendation.js'
      - 'property/css/marketing-studio-campaign-recommendation.css'
      - 'property/marketing-studio/design/index.html'
      - 'property/tests/marketing-campaign-recommendation-contract.mjs'
      - '.github/workflows/marketing-campaign-recommendation-contract.yml'
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node property/tests/marketing-campaign-recommendation-contract.mjs
