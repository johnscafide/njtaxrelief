name: Neighborhood Trends source contract

on:
  push:
    branches:
      - agent/neighborhood-source-build-20260820
    paths:
      - property/scripts/audit_neighborhood_trends.py
      - .github/workflows/neighborhood-source-contract.yml

permissions:
  contents: write

jobs:
  inspect-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install workbook reader
        run: python -m pip install --disable-pip-version-check requests openpyxl
      - name: Inspect official 2026 DCA workbook
        run: python property/scripts/audit_neighborhood_trends.py --output property/data/neighborhood-trends-diagnostic.json
      - name: Commit source diagnostic
        run: |
          git config user.name "Watchdog Source Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -- property/data/neighborhood-trends-diagnostic.json
          if git diff --cached --quiet; then
            echo "No source diagnostic changes"
          else
            git commit -m "[source-build] Inspect 2026 DCA Neighborhood Trends workbook"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
