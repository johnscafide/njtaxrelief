name: Transaction municipal status workflow contract

on:
  pull_request:
    paths:
      - 'transaction/municipal-status.js'
      - 'transaction/shell.js'
      - 'property/tests/transaction-municipal-status-workflow-contract.mjs'
      - '.github/workflows/transaction-municipal-status-workflow-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node property/tests/transaction-municipal-status-workflow-contract.mjs
