name: DCA remaining source audits

on:
  push:
    branches:
      - agent/affordable-supplement-audit-20260826
    paths:
      - property/scripts/audit_affordable_housing_supplement.py
      - property/scripts/audit_walkability_source.py
      - property/scripts/audit_commute_mode_source.py
      - property/scripts/audit_fourth_round_affordable.py
      - property/scripts/build_fourth_round_affordable.py
      - property/scripts/build_fourth_round_appendix.py
      - .github/workflows/affordable-supplement-audit.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source readers
        run: python -m pip install --disable-pip-version-check requests openpyxl pdfplumber
      - name: Audit official 7-1-26 DCA affordable housing workbook
        run: python property/scripts/audit_affordable_housing_supplement.py --output property/data/affordable-housing-supplement-diagnostic.json
      - name: Audit official 2026 DCA Neighborhood Trends walkability semantics
        run: python property/scripts/audit_walkability_source.py --output property/data/walkability-source-diagnostic.json
      - name: Audit official 2026 DCA Neighborhood Trends commute fields
        run: python property/scripts/audit_commute_mode_source.py --output property/data/commute-mode-source-diagnostic.json
      - name: Audit official 2025-2035 DCA Fourth Round calculation workbook
        run: python property/scripts/audit_fourth_round_affordable.py --output property/data/fourth-round-affordable-diagnostic.json
      - name: Diagnose workbook cached-value coverage
        continue-on-error: true
        run: python property/scripts/build_fourth_round_affordable.py --output property/data/fourth-round-affordable.json
      - name: Build governed published Fourth Round snapshot
        id: fourth_round_appendix
        continue-on-error: true
        run: python property/scripts/build_fourth_round_appendix.py --output property/data/fourth-round-affordable-published.json
      - name: Commit diagnostics and governed snapshot
        run: |
          git config user.name "Watchdog Source Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -- property/data/affordable-housing-supplement-diagnostic.json property/data/walkability-source-diagnostic.json property/data/commute-mode-source-diagnostic.json property/data/fourth-round-affordable-diagnostic.json property/data/fourth-round-affordable.json property/data/fourth-round-affordable-published.json
          if git diff --cached --quiet; then
            echo "No source changes"
          else
            git commit -m "[source-audit] Refresh governed DCA source evidence"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
      - name: Enforce published Fourth Round gate
        if: steps.fourth_round_appendix.outcome != 'success'
        run: exit 1
