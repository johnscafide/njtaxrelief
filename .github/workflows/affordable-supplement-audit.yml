name: Affordable Housing supplemental source audit

on:
  push:
    branches:
      - agent/affordable-supplement-audit-20260826
    paths:
      - property/scripts/audit_affordable_housing_supplement.py
      - .github/workflows/affordable-supplement-audit.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install workbook reader
        run: python -m pip install --disable-pip-version-check requests openpyxl
      - name: Audit official 7-1-26 DCA workbook
        run: python property/scripts/audit_affordable_housing_supplement.py --output property/data/affordable-housing-supplement-diagnostic.json
      - name: Commit diagnostic
        run: |
          git config user.name "Watchdog Source Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -- property/data/affordable-housing-supplement-diagnostic.json
          if git diff --cached --quiet; then
            echo "No diagnostic changes"
          else
            git commit -m "[source-audit] Inspect 2026 DCA affordable housing supplement"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
