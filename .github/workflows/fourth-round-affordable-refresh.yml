name: Fourth Round affordable housing source refresh

on:
  push:
    branches:
      - agent/affordable-supplement-audit-20260826
    paths:
      - property/scripts/build_fourth_round_appendix.py
      - .github/workflows/fourth-round-affordable-refresh.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact source readers
        run: python -m pip install --disable-pip-version-check requests openpyxl pdfplumber
      - name: Build and validate DCA published Fourth Round snapshot
        run: python property/scripts/build_fourth_round_appendix.py --output property/data/fourth-round-affordable-published.json
      - name: Commit validated snapshot
        run: |
          git config user.name "Watchdog Source Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -- property/data/fourth-round-affordable-published.json
          if git diff --cached --quiet; then
            echo "No Fourth Round source changes"
          else
            git commit -m "[source-refresh] Update validated DCA Fourth Round obligations"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
