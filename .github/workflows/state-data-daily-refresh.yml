name: Watchdog state data daily refresh
on:
  workflow_dispatch:
  schedule:
    - cron: "23 9 * * *"
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check and refresh governed state sources
        run: python3 property/scripts/refresh_state_data.py --refresh --write-version || true
      - name: Publish changed governed artifacts and freshness report
        run: |
          if ! git diff --quiet; then
            git config user.name "watchdog-data-bot"
            git config user.email "actions@users.noreply.github.com"
            git add property/data property/*.json equalization-ratios.json tax-rates.json 2>/dev/null || true
            git commit -m "data: automated NJ state source refresh"
            git push
          fi
