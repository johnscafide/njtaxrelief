name: Access boundary audit

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'property/**'
      - 'supabase/**'
      - '.github/workflows/access-boundary-audit.yml'
  pull_request:
    paths:
      - 'api/**'
      - 'property/**'
      - 'supabase/**'
      - '.github/workflows/access-boundary-audit.yml'

jobs:
  static-boundary-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify protected-route and entitlement contracts
        run: node property/scripts/audit_access_boundaries.mjs
      - name: Verify full commercial entitlement ladder
        run: node property/tests/entitlement-tier-contract.mjs
      - name: Verify outcome-based plan ladder
        run: node property/tests/plan-outcomes-contract.mjs
      - name: Verify billing catalog and checkout consistency
        run: node property/tests/billing-catalog-contract.mjs
      - name: Verify Intelligence production promotion manifest
        run: node property/tests/intelligence-production-manifest-contract.mjs
      - name: Verify Supabase runtime rotation path
        run: node property/tests/supabase-runtime-contract.mjs
      - name: Verify product analytics privacy and access
        run: node property/tests/product-analytics-contract.mjs
      - name: Verify governed score-observation readers
        run: node property/tests/score-observations-schema-contract.mjs
      - name: Verify Property Home score history contract
        run: node property/tests/property-score-history-contract.mjs
      - name: Verify page-native Intelligence shell contracts
        run: node property/tests/page-native-intelligence-contract.mjs
      - name: Verify profession-aware Property Home Analyst Intel
        run: node property/tests/home-watchdog-analyst-intel-contract.mjs
      - name: Verify visible Watchdog Data Graph
        run: node property/tests/watchdog-data-graph-contract.mjs
      - name: Verify Daily Intelligence Today inbox
        run: node property/tests/intelligence-today-contract.mjs
      - name: Verify Intelligence SaaS loading and recovery UX
        run: node property/tests/intelligence-saas-polish-contract.mjs
      - name: Verify Data Workbench flood request boundary
        run: node property/tests/flood-request-boundary-contract.mjs
      - name: Verify compact Intelligence footprint
        run: node property/tests/intelligence-density-contract.mjs
      - name: Verify source freshness and explainability trust contract
        run: node property/tests/trust-freshness-explainability-contract.mjs
      - name: Verify Watchdog API URL safety
        run: node property/tests/api-url-safety-contract.mjs
      - name: Verify affordable housing parser integrity
        run: node property/tests/affordable-housing-parser-contract.mjs
      - name: Verify calibration holdout diversity guardrail
        run: node property/tests/calibration-diversity-contract.mjs
      - name: Verify calibration independence guard
        run: node property/tests/calibration-independence-contract.mjs
      - name: Verify model-vNext repair and promotion gate
        run: node property/tests/intelligence-model-vnext-repair-contract.mjs
      - name: Verify Closing v3 fresh holdout safety
        run: node property/tests/closing-v3-fresh-holdout-contract.mjs
      - name: Verify source-fact watcher safety and idempotency
        run: node property/tests/intelligence-source-fact-watch-contract.mjs
      - name: Verify Semantic Context derived-marker routing
        run: node property/tests/semantic-derived-routing-contract.mjs
      - name: Verify spatial evidence integrity
        run: node property/tests/spatial-evidence-integrity-contract.mjs
      - name: Verify source-fact candidate trigger fix
        run: node property/tests/material-change-candidate-trigger-contract.mjs
      - name: Verify Intelligence retention integration
        run: node property/tests/intelligence-retention-integration-contract.mjs
      - name: Verify billing, verification and measurement security contracts
        run: node property/tests/security-contracts.mjs
      - name: Verify compliance evidence contracts
        run: node property/tests/compliance-contracts.mjs
      - name: Verify SECURITY DEFINER permission contracts
        run: node property/tests/security-definer-contracts.mjs
      - name: Verify Watchdog Intelligence Voice contract
        run: node property/tests/watchdog-intelligence-voice-contract.mjs
      - name: Verify Marketing Studio creative and launch contracts
        run: node property/tests/marketing-creative-contracts.mjs
      - name: Verify Marketing Studio visual renderer
        run: |
          rm -rf /tmp/watchdog-render-test
          python3 property/scripts/render_marketing_creatives.py --input property/tests/fixtures/marketing-creative.json --output-dir /tmp/watchdog-render-test
          test -s /tmp/watchdog-render-test/seller-value-postcard-front.svg
          test -s /tmp/watchdog-render-test/seller-value-postcard-back.svg
          test -s /tmp/watchdog-render-test/manifest.json
          grep -q "Curious what your home" /tmp/watchdog-render-test/seller-value-postcard-front.svg
          grep -q "could be worth?" /tmp/watchdog-render-test/seller-value-postcard-front.svg
      - name: Verify Marketing Studio Opportunity Discovery contracts
        run: node property/tests/marketing-discovery-contracts.mjs
      - name: Verify v0.45 protected delivery and Agent Control contracts
        run: node property/tests/v045-control-plane.mjs
