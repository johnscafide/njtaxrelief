name: Patch uniformity volatility
on:
  push:
    branches: [agent/uniformity-volatility-20260820]
    paths:
      - '.github/workflows/patch-uniformity-volatility.yml'
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.event_name == 'push' || github.head_ref == 'agent/uniformity-volatility-20260820'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Patch runtime, canary, and formula contract
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('supabase/functions/workbench-hydrate/index.ts')
          s = p.read_text()
          old = "function uniformityValue(row:any,field:string){if(!row)return null;const f=String(field||''),m=f.match(/^cod_(\\d{4})$/);if(m)return row.series?.[m[1]]??null;if(f==='latest_year')return row.latest_year??null;if(f==='latest')return row.latest??null;return row[f]??null}"
          new = "function uniformityValue(row:any,field:string){if(!row)return null;const f=String(field||''),m=f.match(/^cod_(\\d{4})$/);if(m)return row.series?.[m[1]]??null;if(f==='volatility'){const vals=Object.values(row.series||{}).map(n).filter(x=>x!=null) as number[];if(!vals.length)return null;const mean=vals.reduce((a,b)=>a+b,0)/vals.length,variance=vals.reduce((sum,x)=>sum+(x-mean)**2,0)/vals.length;return Math.round(Math.sqrt(variance)*100)/100}if(f==='latest_year')return row.latest_year??null;if(f==='latest')return row.latest??null;return row[f]??null}"
          if s.count(old) != 1: raise SystemExit(f'uniformityValue anchor count={s.count(old)}')
          s = s.replace(old, new)
          old = "if(src==='nj-cod'){const row=root.uniformity?.districts?.[String(r.pams_pin||'').slice(0,4)];return{v:uniformityValue(row,field),kind:'authoritative_reference',source:'NJ Division of Taxation assessment uniformity'}}"
          new = "if(src==='nj-cod'){const row=root.uniformity?.districts?.[String(r.pams_pin||'').slice(0,4)],derived=field==='volatility';return{v:uniformityValue(row,field),kind:derived?'derived_governed':'authoritative_reference',source:derived?'Watchdog population standard deviation over NJ Division of Taxation segmented Class 2 COD series':'NJ Division of Taxation assessment uniformity'}}"
          if s.count(old) != 1: raise SystemExit(f'nj-cod family anchor count={s.count(old)}')
          p.write_text(s.replace(old, new))

          p = Path('supabase/functions/provider-release-canary/index-v2.ts')
          s = p.read_text()
          old = "uniformity_history_v1:{fn:'workbench-hydrate',body:{pams_pins:['0101_25.01_10'],marker_ids:['uniformity.cod_2022','uniformity.cod_2016']},expect_available:[{pin:'0101_25.01_10',marker_ids:['uniformity.cod_2022']}],expect_missing:[{pin:'0101_25.01_10',marker_ids:['uniformity.cod_2016'],status:'source_checked_no_value'}],expect_values:[{pin:'0101_25.01_10',values:{'uniformity.cod_2022':18.09}}],expect_provider_kinds:[{pin:'0101_25.01_10',kinds:{'uniformity.cod_2022':'authoritative_reference','uniformity.cod_2016':'authoritative_reference'}}],expect_sources:[{pin:'0101_25.01_10',sources:{'uniformity.cod_2022':'NJ Division of Taxation assessment uniformity','uniformity.cod_2016':'NJ Division of Taxation assessment uniformity'}}]}"
          new = "uniformity_history_v1:{fn:'workbench-hydrate',body:{pams_pins:['0101_25.01_10'],marker_ids:['uniformity.cod_2022','uniformity.volatility','uniformity.cod_2016']},expect_available:[{pin:'0101_25.01_10',marker_ids:['uniformity.cod_2022','uniformity.volatility']}],expect_missing:[{pin:'0101_25.01_10',marker_ids:['uniformity.cod_2016'],status:'source_checked_no_value'}],expect_values:[{pin:'0101_25.01_10',values:{'uniformity.cod_2022':18.09,'uniformity.volatility':1.06}}],expect_provider_kinds:[{pin:'0101_25.01_10',kinds:{'uniformity.cod_2022':'authoritative_reference','uniformity.volatility':'derived_governed','uniformity.cod_2016':'authoritative_reference'}}],expect_sources:[{pin:'0101_25.01_10',sources:{'uniformity.cod_2022':'NJ Division of Taxation assessment uniformity','uniformity.volatility':'Watchdog population standard deviation over NJ Division of Taxation segmented Class 2 COD series','uniformity.cod_2016':'NJ Division of Taxation assessment uniformity'}}]}"
          if s.count(old) != 1: raise SystemExit(f'canary scenario anchor count={s.count(old)}')
          p.write_text(s.replace(old, new))

          p = Path('property/data/derived-marker-formulas.json')
          s = p.read_text()
          old = '''    "uniformity.volatility": {
      "range": "Derived property-intelligence metric; interpretation follows the marker description",
      "formula": "Derived from the cited authoritative inputs for this marker. Uniformity volatility"
    },'''
          new = '''    "uniformity.volatility": {
      "range": "0+ coefficient-of-deviation points; higher means more year-to-year dispersion in the published residential COD series",
      "formula": "Population standard deviation of all available non-null annual segmented Class 2 COD values in the governed NJ Division of Taxation series, using JavaScript Number arithmetic and Math.round(sd * 100) / 100"
    },'''
          if s.count(old) != 1: raise SystemExit(f'formula disclosure anchor count={s.count(old)}')
          p.write_text(s.replace(old, new))

          Path('.github/workflows/patch-uniformity-volatility.yml').unlink()
          PY
      - name: Commit scoped patch
        run: |
          git config user.name "Watchdog Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -- supabase/functions/workbench-hydrate/index.ts supabase/functions/provider-release-canary/index-v2.ts property/data/derived-marker-formulas.json .github/workflows/patch-uniformity-volatility.yml
          git commit -m "Certify executable uniformity volatility semantics"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
