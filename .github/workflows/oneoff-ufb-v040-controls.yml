name: One-off UFB v040 canary controls

on:
  push:
    paths:
      - '.github/workflows/oneoff-ufb-v040-controls.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  controls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract independent Absecon controls
        run: |
          python <<'PY'
          import json
          m=json.load(open('property/data/ufb-v040/manifest.json'))
          d=json.load(open('property/data/ufb-v040/01.json'))
          rec=d['municipalities']['0101']
          wanted=[
            'njplus.nj-dca-ufb-longitudinal.rut_tax_collection_pct_history',
            'njplus.nj-dca-ufb-longitudinal.prior_year_realized_revenue_total_history',
            'njplus.nj-dca-ufb-longitudinal.current_year_anticipated_revenue_total_history',
            'njplus.nj-dca-ufb-longitudinal.current_year_general_budget_revenue_total_history',
            'njplus.nj-dca-ufb-longitudinal.current_year_appropriation_total_history',
            'njplus.nj-dca-ufb-longitudinal.current_year_general_budget_appropriation_public_safety_history',
            'njplus.nj-dca-ufb-longitudinal.total_personnel_cost_history',
          ]
          idx={f['marker_id']:f for f in m['fields']}
          out={}
          for mid in wanted:
            f=idx[mid]
            raw=rec[3][f['index']]
            out[mid]={
              'value':{str(y):v for y,v in raw},
              'source_field':f['source_field'],
              'base_marker_id':f['base_marker_id'],
            }
          payload={
            'pin':'0101_canary_1',
            'district':'0101',
            'municipality':rec[0],
            'county':rec[1],
            'source_quality_by_year':[{'year':q[0],'no_ufb_available':bool(q[1]),'significant_data_missing':bool(q[2])} for q in rec[2]],
            'expected':out,
          }
          open('ufb-v040-canary-controls.json','w').write(json.dumps(payload,indent=2))
          print(json.dumps(payload,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ufb-v040-canary-controls
          path: ufb-v040-canary-controls.json
          retention-days: 1
