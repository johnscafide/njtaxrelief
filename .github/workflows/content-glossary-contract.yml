name: Content glossary contract

on:
  pull_request:
    paths:
      - 'property/**/*.html'
      - 'property/js/**/*.js'
      - 'scripts/generate-content-glossary.mjs'
      - 'property/developer/content-glossary/**'
      - 'property/css/developer-content-glossary.css'
      - 'package.json'
  push:
    branches: [main]
    paths:
      - 'property/**/*.html'
      - 'property/js/**/*.js'
      - 'scripts/generate-content-glossary.mjs'
      - 'property/developer/content-glossary/**'
      - 'property/css/developer-content-glossary.css'
      - 'package.json'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate content glossary generator
        run: node scripts/generate-content-glossary.mjs --check-only
      - name: Generate deploy artifact
        run: npm run content-glossary:generate
      - name: Verify generated glossary exists and is non-empty
        run: node -e "const fs=require('fs');const p='property/developer/content-glossary/glossary.json';const d=JSON.parse(fs.readFileSync(p,'utf8'));if(!d.sourceFingerprint||d.entryCount<100||!Array.isArray(d.entries))process.exit(1);console.log('content glossary contract: ok',d.entryCount)"
