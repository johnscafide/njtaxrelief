name: One-off NJW-291 planned marker batch
on:
  push:
    paths:
      - '.github/workflows/oneoff-njw291-planned-marker-batch.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare governed marker batch
        run: |
          node scripts/njw291-planned-marker-batch.mjs
          python property/scripts/build_nj_proplus_source_pack_v031.py
      - name: Validate generated contracts
        run: |
          node --check scripts/njw291-planned-marker-batch.mjs
          python -m py_compile property/scripts/build_nj_proplus_source_pack_v031.py
          grep -q "assessment_component_shift" property/data/nj-proplus-source-pack-v031.json
          grep -q "chapter123_position" supabase/functions/workbench-derived/index.ts
          grep -q "uniformity.percentile" supabase/functions/workbench-hydrate/uniformity-percentile-provider.ts
      - name: Refetch main and commit only if safe
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || { echo 'main moved; refusing overwrite'; exit 2; }
          git config user.name 'Watchdog Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add supabase/functions/workbench-hydrate/index.ts supabase/functions/workbench-hydrate/uniformity-percentile-provider.ts supabase/functions/workbench-hydrate/production-njw291-uniformity-bootstrap.ts supabase/functions/workbench-derived/index.ts supabase/functions/provider-release-canary/planned-marker-batch-canary.ts supabase/functions/provider-release-canary/production-v042-bootstrap.ts supabase/migrations/20260828203000_prepare_njw291_planned_marker_batch.sql property/scripts/build_nj_proplus_source_pack_v031.py property/data/nj-proplus-source-pack-v031.json docs/property/njw-291-planned-marker-batch-certification-2026-08-28.md
          git diff --cached --quiet && { echo 'No changes to commit'; exit 0; }
          git commit -m 'NJW-291 prepare planned marker batch runtime'
          git push origin HEAD:main
