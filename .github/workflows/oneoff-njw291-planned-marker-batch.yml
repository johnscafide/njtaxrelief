name: One-off NJW-291 planned marker batch
on:
  push:
    paths:
      - '.github/workflows/oneoff-njw291-planned-marker-batch.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch governed source and runtime contracts
        run: |
          node <<'NODE'
          const fs=require('fs');
          function mustReplace(path,before,after,label){
            let s=fs.readFileSync(path,'utf8');
            const count=s.split(before).length-1;
            if(count!==1)throw new Error(`${label}: expected one target, got ${count}`);
            s=s.replace(before,after);fs.writeFileSync(path,s);
          }

          mustReplace(
            'supabase/functions/sr1a-subject-indexer/index.ts',
            'const sourceUrl = `https://njpropertytaxrelief.com/property/sales-${slug}.json`;',
            'const sourceUrl = `https://raw.githubusercontent.com/johnscafide/njtaxrelief/main/property/sales-${slug}.json`;',
            'SR1A subject artifact host'
          );

          mustReplace(
            'supabase/functions/workbench-hydrate/index.ts',
            "derived=field==='volatility';return{v:uniformityValue(row,field,historical,legacy),kind:derived?'derived_governed':'authoritative_reference',source:derived?'Watchdog population standard deviation over NJ Division of Taxation segmented Class 2 COD series':'NJ Division of Taxation assessment uniformity'",
            "derived=field==='volatility'||field==='percentile';const derivedSource=field==='volatility'?'Watchdog population standard deviation over NJ Division of Taxation segmented Class 2 COD series':'Watchdog statewide percentile of governed Assessment Uniformity Score over NJ Division of Taxation COD artifact';return{v:uniformityValue(row,field,historical,legacy),kind:derived?'derived_governed':'authoritative_reference',source:derived?derivedSource:'NJ Division of Taxation assessment uniformity'",
            'uniformity percentile provenance'
          );

          const derived='supabase/functions/workbench-derived/index.ts';
          let d=fs.readFileSync(derived,'utf8');
          const oldChapter="const needsChapter123 = operations.some((op) => ['revaluation_pressure','tax_reset_sensitivity','assessment_defensibility','appeal_evidence_strength','appeal_opportunity','chapter123_field'].includes(op));";
          const newChapter="const needsChapter123 = operations.some((op) => ['revaluation_pressure','tax_reset_sensitivity','assessment_defensibility','appeal_evidence_strength','appeal_opportunity','chapter123_field','chapter123_position'].includes(op));";
          const oldEvidence="const needsEvidenceReferences = operations.some((op) => ['sr1a_subject_square_feet','comparable_evidence_reliability','assessment_defensibility','appeal_evidence_strength','appeal_opportunity'].includes(op));";
          const newEvidence="const needsEvidenceReferences = operations.some((op) => ['sr1a_subject_square_feet','comparable_evidence_reliability','assessment_defensibility','appeal_evidence_strength','appeal_opportunity','chapter123_position'].includes(op));";
          if(!d.includes(oldChapter)||!d.includes(oldEvidence))throw new Error('derived dependency trigger target missing');
          d=d.replace(oldChapter,newChapter).replace(oldEvidence,newEvidence);

          const orderedEnd="else if (def.operation === 'ordered_history') { const landDep = String(cfg.land_dep || ''), improvementDep = String(cfg.improvement_dep || ''), totalDep = String(cfg.total_dep || ''); const trace = orderedAssessmentHistory(landDep ? value(landDep) : null, improvementDep ? value(improvementDep) : null, totalDep ? value(totalDep) : null); if (trace) { v = trace; auxMeta.set(id, { history_years: trace.map((row: any) => row.year), missing_years_synthesized: false, trace_contract: 'actual_source_years_only' }); } }";
          const shiftOp=`${orderedEnd}\n      else if (def.operation === 'assessment_component_shift') { const trace = orderedAssessmentHistory(value(cfg.land_dep), value(cfg.improvement_dep), null); if (trace) { let pair:any=null; for (let i=trace.length-1;i>0;i--) { const prev=trace[i-1],cur=trace[i],pl=num(prev.land),pi=num(prev.improvement),cl=num(cur.land),ci=num(cur.improvement); if (cur.year===prev.year+1&&pl!=null&&pi!=null&&cl!=null&&ci!=null&&pl>=0&&pi>=0&&cl>=0&&ci>=0&&(pl+pi)>0&&(cl+ci)>0) { pair={prev,cur,pl,pi,cl,ci}; break; } } if (pair) { const prevLand=pair.pl/(pair.pl+pair.pi)*100,prevImprovement=pair.pi/(pair.pl+pair.pi)*100,curLand=pair.cl/(pair.cl+pair.ci)*100,curImprovement=pair.ci/(pair.cl+pair.ci)*100,landDelta=curLand-prevLand,improvementDelta=curImprovement-prevImprovement,differential=landDelta-improvementDelta; v=round(clamp(50+differential/4),1); auxMeta.set(id,{from_year:pair.prev.year,to_year:pair.cur.year,previous_land_share_pct:round(prevLand,3),current_land_share_pct:round(curLand,3),previous_improvement_share_pct:round(prevImprovement,3),current_improvement_share_pct:round(curImprovement,3),land_share_delta_pp:round(landDelta,3),improvement_share_delta_pp:round(improvementDelta,3),component_share_differential_pp:round(differential,3),neutral_score:50,shift_direction:v>50?'toward_land':v<50?'toward_improvements':'unchanged',missing_years_synthesized:false,transition_contract:'latest consecutive published MOD-IV years with both components present'}); } } }`;
          if((d.split(orderedEnd).length-1)!==1)throw new Error('ordered_history insertion target missing or duplicated');
          d=d.replace(orderedEnd,shiftOp);

          const chapterField="else if (def.operation === 'chapter123_field') { const official = chapterDistricts[districtCode(pin)] || null, field = String(cfg.field || ''); if (official && ['ratio','lower','upper'].includes(field)) { const x = num(official[field]); if (x != null) { v = x; auxMeta.set(id, { chapter123_field: field, reference_source: 'NJ Division of Taxation 2026 Chapter 123 · ' + CHAPTER123_PROVIDER }); } } }";
          const chapterPos=`${chapterField}\n      else if (def.operation === 'chapter123_position') { const assessed=num(value(cfg.assessed_dep)),ppsf=num(value(cfg.ppsf_dep)),sqft=num(subjectSale?.sf),official=chapterDistricts[districtCode(pin)]||null,lower=num(official?.lower),common=num(official?.ratio),upper=num(official?.upper); if(assessed!=null&&assessed>0&&ppsf!=null&&ppsf>0&&sqft!=null&&sqft>0&&lower!=null&&common!=null&&upper!=null&&lower>0&&upper>0){ const anchor=ppsf*sqft,subjectRatio=assessed/anchor*100; v=subjectRatio<lower?'below_lower_bound':subjectRatio>upper?'above_upper_bound':'within_common_level_range'; auxMeta.set(id,{independent_value_anchor:Math.round(anchor),subject_ratio_pct:round(subjectRatio,2),chapter123_lower_pct:lower,chapter123_common_ratio_pct:common,chapter123_upper_pct:upper,position_contract:'screening position only; not appeal eligibility or legal advice',subject_provider:SR1A_SUBJECT_PROVIDER,reference_source:'NJ Division of Taxation 2026 Chapter 123 · '+CHAPTER123_PROVIDER}); } }`;
          if((d.split(chapterField).length-1)!==1)throw new Error('chapter123_field insertion target missing or duplicated');
          d=d.replace(chapterField,chapterPos);
          const oldBacked="['revaluation_pressure','tax_reset_sensitivity','assessment_defensibility','appeal_evidence_strength','appeal_opportunity','chapter123_field'].includes(operation)";
          const newBacked="['revaluation_pressure','tax_reset_sensitivity','assessment_defensibility','appeal_evidence_strength','appeal_opportunity','chapter123_field','chapter123_position'].includes(operation)";
          if((d.split(oldBacked).length-1)!==1)throw new Error('chapter-backed metadata target missing');
          d=d.replace(oldBacked,newBacked);
          fs.writeFileSync(derived,d);

          mustReplace(
            'property/scripts/build_nj_proplus_source_pack_v031.py',
            '"formula": "normalized(change(land_assessment) - change(improvement_assessment))",',
            '"formula": "Latest consecutive published MOD-IV transition: normalize the land-share change minus improvement-share change across the full possible -200 to +200 percentage-point differential into 0-100; 50 is unchanged composition; no synthetic years.",',
            'assessment component shift formula spec'
          );

          fs.writeFileSync('supabase/functions/workbench-hydrate/uniformity-percentile-provider.ts',`export const UNIFORMITY_PERCENTILE_PROVIDER_VERSION='watchdog-uniformity-percentile-v1';\nconst ID='uniformity.percentile';\nconst SOURCE='Watchdog statewide percentile of governed Assessment Uniformity Score over NJ Division of Taxation COD artifact';\nexport async function runWithUniformityPercentile(handler:Deno.ServeHandler,request:Request,info:Deno.ServeHandlerInfo){\n let body:any=null;try{body=await request.clone().json()}catch{return handler(request,info)}\n const ids=(Array.isArray(body?.marker_ids)?body.marker_ids:[]).map((x:any)=>String(x||''));if(!ids.includes(ID))return handler(request,info);\n const response=await handler(request,info);if(!response.ok)return response;let payload:any;try{payload=await response.clone().json()}catch{return response}\n for(const [pin,values] of Object.entries(payload?.markers||{})){const v=(values as any)?.[ID],m=payload?.meta?.[pin]?.[ID];if(v!==null&&v!==undefined&&m?.status==='available'){payload.meta[pin][ID]={...m,provider_kind:'derived_governed',source:SOURCE,provider_version:UNIFORMITY_PERCENTILE_PROVIDER_VERSION,formula:'Statewide percentile rank of the governed Assessment Uniformity Score as published in the canonical Watchdog uniformity artifact',percentile_scope:'New Jersey districts with a governed uniformity score'};}}\n payload.provider_versions||={};payload.provider_versions.uniformity_percentile=UNIFORMITY_PERCENTILE_PROVIDER_VERSION;const h=new Headers(response.headers);h.set('Content-Type','application/json; charset=utf-8');h.set('Cache-Control','private, no-store');return new Response(JSON.stringify(payload),{status:response.status,statusText:response.statusText,headers:h});\n}\n`);
          fs.writeFileSync('supabase/functions/workbench-hydrate/production-njw291-uniformity-bootstrap.ts',`import { runWithUniformityPercentile } from './uniformity-percentile-provider.ts';\nconst nativeServe=Deno.serve.bind(Deno);\nconst wrappedServe=((first:unknown,second?:unknown)=>{if(typeof first==='function'){const handler=first as Deno.ServeHandler;return nativeServe((request,info)=>runWithUniformityPercentile(handler,request,info));}if(typeof second==='function'){const handler=second as Deno.ServeHandler;return nativeServe(first as Deno.ServeOptions,(request,info)=>runWithUniformityPercentile(handler,request,info));}return nativeServe(first as Deno.ServeOptions);}) as typeof Deno.serve;\nObject.defineProperty(Deno,'serve',{configurable:true,writable:true,value:wrappedServe});\nawait import('https://raw.githubusercontent.com/johnscafide/njtaxrelief/3d14134bd599715a54c8eb275a24422b7089e596/supabase/functions/workbench-hydrate/production-ufb-v040-longitudinal-bootstrap.ts');\n`);

          fs.writeFileSync('supabase/functions/provider-release-canary/planned-marker-batch-canary.ts',`import { createClient } from 'npm:@supabase/supabase-js@2.95.0';\nconst URL=Deno.env.get('SUPABASE_URL')!,ANON=Deno.env.get('SUPABASE_ANON_KEY')!,SERVICE=Deno.env.get('SUPABASE_SERVICE_ROLE_KEY')!;\nconst admin=createClient(URL,SERVICE,{auth:{persistSession:false,autoRefreshToken:false}});\nconst SCENARIO='planned_marker_batch_v1',UNI='uniformity.percentile',CHAPTER='watchdog.chapter123_position',SHIFT='watchdog.njplus.assessment_component_shift',LAND='njplus.nj-dca-modiv-longitudinal.assessment_land_history',IMPROVEMENT='njplus.nj-dca-modiv-longitudinal.assessment_improvement_history',PPSF='sales.ppsf';\nconst UNI_PIN='0101_25.01_10',CHAPTER_PIN='0818_242_22',SHIFT_PINS=['0101_25.01_10','0818_242_22','0802_525_1','0802_528_27','0802_528_5'];\nfunction json(status:number,p:any){return new Response(JSON.stringify(p),{status,headers:{'Content-Type':'application/json; charset=utf-8','Cache-Control':'no-store, private'}})}\nasync function hash(v:string){const d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v));return Array.from(new Uint8Array(d)).map(b=>b.toString(16).padStart(2,'0')).join('')}\nasync function cleanup(id:string){await admin.from('watchdog_test_accounts').delete().eq('user_id',id);await admin.from('account_entitlements').delete().eq('user_id',id);await admin.from('profiles').delete().eq('id',id);await admin.auth.admin.deleteUser(id)}\nfunction n(v:any){const x=Number(v);return Number.isFinite(x)?x:null}\nfunction expectedShift(land:any,improvement:any){if(!land||!improvement||typeof land!=='object'||typeof improvement!=='object')return null;const years=[...new Set([...Object.keys(land),...Object.keys(improvement)].filter(y=>/^(19|20)\\d{2}$/.test(y)).map(Number))].sort((a,b)=>a-b);for(let i=years.length-1;i>0;i--){const py=years[i-1],cy=years[i];if(cy!==py+1)continue;const pl=n(land[String(py)]),pi=n(improvement[String(py)]),cl=n(land[String(cy)]),ci=n(improvement[String(cy)]);if(pl==null||pi==null||cl==null||ci==null||pl<0||pi<0||cl<0||ci<0||pl+pi<=0||cl+ci<=0)continue;const prevLand=pl/(pl+pi)*100,prevImp=pi/(pl+pi)*100,curLand=cl/(cl+ci)*100,curImp=ci/(cl+ci)*100,diff=(curLand-prevLand)-(curImp-prevImp);return{value:Math.round(Math.max(0,Math.min(100,50+diff/4))*10)/10,from_year:py,to_year:cy,diff};}return null}\nasync function post(path:string,body:any,access?:string){const headers:any={'Content-Type':'application/json'};if(access){headers.Authorization='Bearer '+access;headers.apikey=ANON;}const r=await fetch(URL+'/functions/v1/'+path,{method:'POST',headers,body:JSON.stringify(body)});let p:any={};try{p=await r.json()}catch{}return{ok:r.ok,status:r.status,p}}\nexport async function handlePlannedMarkerBatchCanary(req:Request){let body:any={};try{body=await req.json()}catch{return json(400,{error:'Invalid JSON'})}const token=String(body?.token||'').trim();if(String(body?.scenario||'')!==SCENARIO||!/^[A-Za-z0-9_-]{40,160}$/.test(token))return json(401,{error:'Invalid release canary request'});const now=new Date().toISOString();const {data:gate}=await admin.from('watchdog_test_bootstrap_tokens').update({used_at:now}).eq('token_hash',await hash(token)).is('used_at',null).gt('expires_at',now).contains('metadata',{purpose:'provider_release_canary',scenario:SCENARIO}).select('id,desired_email').maybeSingle();if(!gate)return json(401,{error:'Invalid or expired release canary token'});let userId='';try{const {data:link,error:linkError}=await admin.auth.admin.generateLink({type:'magiclink',email:String(gate.desired_email||'')});userId=String(link?.user?.id||'');const hashed=String(link?.properties?.hashed_token||'');if(linkError||!userId||!hashed)throw new Error('sandbox_link_generation_failed');const authClient=createClient(URL,ANON,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});const {data:v,error:ve}=await authClient.auth.verifyOtp({token_hash:hashed,type:'email'});const access=v?.session?.access_token||'';if(ve||!access)throw new Error('sandbox_session_verification_failed');const pr=await admin.from('profiles').upsert({id:userId,email:String(gate.desired_email||''),full_name:'Watchdog Planned Marker Canary',display_name:'Watchdog Planned Marker Canary',account_role:'developer',plan_tier:'standard',plan:'free',profile_complete:true,custom:{watchdog_test_account:true,no_real_spend:true,release_canary:true,scenario:SCENARIO}},{onConflict:'id'});if(pr.error)throw new Error('sandbox_profile_failed');const ta=await admin.from('watchdog_test_accounts').upsert({user_id:userId,label:'Planned Marker Batch Canary',last_bootstrap_at:now,metadata:{no_real_spend:true,scenario:SCENARIO}},{onConflict:'user_id'});if(ta.error)throw new Error('sandbox_account_failed');\n const start=Date.now(),allPins=[...new Set([UNI_PIN,CHAPTER_PIN,...SHIFT_PINS])];const hydrate=await post('workbench-hydrate',{pams_pins:allPins,marker_ids:[UNI,LAND,IMPROVEMENT,PPSF]},access);const derived=await post('workbench-derived',{pams_pins:allPins,marker_ids:[CHAPTER,SHIFT]},access);const chapter=await post('chapter123-provider',{districts:[CHAPTER_PIN.slice(0,4)]});const subject=await post('sr1a-subject-provider',{subjects:[{key:CHAPTER_PIN,pams_pin:CHAPTER_PIN,district:CHAPTER_PIN.slice(0,4),block:'242',lot:'22',qualifier:''}]});const uniformity=await fetch('https://njpropertytaxrelief.com/property/uniformity.json').then(r=>r.json());\n const mismatches:string[]=[];const expectedUni=uniformity?.districts?.[UNI_PIN.slice(0,4)]?.percentile,actualUni=hydrate.p?.markers?.[UNI_PIN]?.[UNI],uniMeta=hydrate.p?.meta?.[UNI_PIN]?.[UNI]||{};if(!hydrate.ok||Number(actualUni)!==Number(expectedUni)||uniMeta.provider_kind!=='derived_governed')mismatches.push('Uniformity Percentile value/provenance mismatch');\n let shiftControl:any=null;for(const pin of SHIFT_PINS){const exp=expectedShift(hydrate.p?.markers?.[pin]?.[LAND],hydrate.p?.markers?.[pin]?.[IMPROVEMENT]),actual=derived.p?.markers?.[pin]?.[SHIFT],meta=derived.p?.meta?.[pin]?.[SHIFT]||{};if(exp&&actual!==undefined&&meta.status==='available'){const row={pin,expected:exp.value,actual,kind:meta.provider_kind,from_year:exp.from_year,to_year:exp.to_year,diff:exp.diff};if(!shiftControl||Math.abs(exp.value-50)>Math.abs(shiftControl.expected-50))shiftControl=row;}}if(!shiftControl||Number(shiftControl.actual)!==Number(shiftControl.expected)||shiftControl.kind!=='derived_governed')mismatches.push('Assessment Component Shift exact calculation/provenance mismatch');\n const cOfficial=chapter.p?.districts?.[CHAPTER_PIN.slice(0,4)],cSubject=subject.p?.records?.[CHAPTER_PIN],ppsf=n(hydrate.p?.markers?.[CHAPTER_PIN]?.[PPSF]),record=(hydrate.p?.records||[]).find((x:any)=>String(x.pams_pin)===CHAPTER_PIN),assessed=n(record?.assessed_value),sf=n(cSubject?.sf),lower=n(cOfficial?.lower),upper=n(cOfficial?.upper);let expectedChapter:any=null,subjectRatio:any=null;if(ppsf&&sf&&assessed&&lower!=null&&upper!=null){subjectRatio=assessed/(ppsf*sf)*100;expectedChapter=subjectRatio<lower?'below_lower_bound':subjectRatio>upper?'above_upper_bound':'within_common_level_range';}const actualChapter=derived.p?.markers?.[CHAPTER_PIN]?.[CHAPTER],chapterMeta=derived.p?.meta?.[CHAPTER_PIN]?.[CHAPTER]||{};if(!derived.ok||!chapter.ok||!subject.ok||!expectedChapter||actualChapter!==expectedChapter||chapterMeta.provider_kind!=='derived_governed')mismatches.push('Chapter 123 Position exact source-screen/provenance mismatch');\n const ok=mismatches.length===0;const observations={uniformity:{pin:UNI_PIN,expected:expectedUni,actual:actualUni,kind:uniMeta.provider_kind||null},assessment_component_shift:shiftControl,chapter123:{pin:CHAPTER_PIN,expected:expectedChapter,actual:actualChapter,subject_ratio_pct:subjectRatio==null?null:Math.round(subjectRatio*100)/100,lower,upper,kind:chapterMeta.provider_kind||null,subject_status:subject.p?.meta?.[CHAPTER_PIN]?.status||null}};await admin.from('watchdog_test_auth_events').insert({token_id:gate.id,user_id:userId,event_type:'provider_release_canary',metadata:{scenario:SCENARIO,status_code:ok?200:502,duration_ms:Date.now()-start,assertion_ok:ok,mismatches,observations}});return json(ok?200:502,{ok,scenario:SCENARIO,assertion_ok:ok,mismatches,observations,duration_ms:Date.now()-start});}catch(e){return json(500,{ok:false,scenario:SCENARIO,error:String((e as Error)?.message||e)})}finally{if(userId)await cleanup(userId)}}\n`);
          fs.writeFileSync('supabase/functions/provider-release-canary/production-v042-bootstrap.ts',`import { handlePlannedMarkerBatchCanary } from './planned-marker-batch-canary.ts';\nconst nativeServe=Deno.serve.bind(Deno);\nconst wrappedServe=((first:unknown,second?:unknown)=>{const wrap=(handler:Deno.ServeHandler):Deno.ServeHandler=>async(req,info)=>{let scenario='';try{scenario=String((await req.clone().json())?.scenario||'')}catch{}if(scenario==='planned_marker_batch_v1')return handlePlannedMarkerBatchCanary(req);return handler(req,info);};if(typeof first==='function')return nativeServe(wrap(first as Deno.ServeHandler));if(typeof second==='function')return nativeServe(first as Deno.ServeOptions,wrap(second as Deno.ServeHandler));return nativeServe(first as Deno.ServeOptions);}) as typeof Deno.serve;\nObject.defineProperty(Deno,'serve',{configurable:true,writable:true,value:wrappedServe});\nawait import('https://raw.githubusercontent.com/johnscafide/njtaxrelief/3d14134bd599715a54c8eb275a24422b7089e596/supabase/functions/provider-release-canary/production-v041-bootstrap.ts');\n`);

          fs.writeFileSync('supabase/migrations/20260828201500_prepare_njw291_planned_marker_batch.sql',`-- NJW-291 candidate governance. Provider coverage remains unpromoted until production canary passes.\ninsert into public.derived_formula_registry(marker_id,engine_version,formula,dependencies,confidence,status,explanation,operation,config,updated_at) values\n('watchdog.chapter123_position','watchdog-derived-v22-chapter123-position','assessment / (municipal verified-sales PPSF * matched subject living space) * 100, positioned against the official 2026 Chapter 123 lower and upper bounds',array['property.assessed_value','sales.ppsf']::text[],'high','live','Public-record screening position within the official Chapter 123 corridor. Returns below_lower_bound, within_common_level_range, or above_upper_bound. It is not appeal eligibility, legal advice, an appraisal, or a value conclusion.','chapter123_position',jsonb_build_object('assessed_dep','property.assessed_value','ppsf_dep','sales.ppsf'),now()),\n('watchdog.njplus.assessment_component_shift','watchdog-derived-v22-assessment-component-shift','latest consecutive MOD-IV transition: 50 + ((change in land share pp - change in improvement share pp) / 4), clamped 0-100',array['njplus.nj-dca-modiv-longitudinal.assessment_land_history','njplus.nj-dca-modiv-longitudinal.assessment_improvement_history']::text[],'high','live','Directional assessment-composition index from actual consecutive published MOD-IV observations only. 50 means no composition shift; above 50 shifts toward land; below 50 shifts toward improvements. Missing years are never synthesized.','assessment_component_shift',jsonb_build_object('land_dep','njplus.nj-dca-modiv-longitudinal.assessment_land_history','improvement_dep','njplus.nj-dca-modiv-longitudinal.assessment_improvement_history','neutral_score',50,'normalization_min_differential_pp',-200,'normalization_max_differential_pp',200,'require_consecutive_years',true),now())\non conflict(marker_id) do update set engine_version=excluded.engine_version,formula=excluded.formula,dependencies=excluded.dependencies,confidence=excluded.confidence,status=excluded.status,explanation=excluded.explanation,operation=excluded.operation,config=excluded.config,updated_at=now();\n\ncreate or replace function public.dispatch_provider_release_canary(p_scenario text)\nreturns bigint language plpgsql set search_path to 'public','extensions' as $function$\ndeclare v_raw text:=encode(gen_random_bytes(48),'hex');v_email text:='watchdog-provider-canary-'||substr(v_raw,1,10)||'@example.com';v_request_id bigint;\nbegin\n if p_scenario not in ('zoning_v31','designation_stack_v15','csrr_v1','csrr_controls_v2','csrr_semantics_v3','geology_intersections_v1','model_bounds_v1','uniformity_history_v1','uniformity_history_v2','uniformity_history_v3','modiv_longitudinal_v1','modiv_longitudinal_partial_scan_v1','modiv_longitudinal_missing_year_v1','community_assets_access_v1','zoning_contact_status_v1','pilot_observed_v1','v036_sources_v1','modiv_record_change_v1','affordable_housing_v037','development_trends_v038','ufb_v039','ufb_longitudinal_v040','planned_marker_batch_v1') then raise exception 'Unsupported release canary scenario';end if;\n insert into public.watchdog_test_bootstrap_tokens(token_hash,desired_email,redirect_to,expires_at,metadata) values(encode(digest(v_raw,'sha256'),'hex'),v_email,'https://njpropertytaxrelief.com/property/dashboard',now()+interval '10 minutes',jsonb_build_object('purpose','provider_release_canary','scenario',p_scenario,'no_real_spend',true));\n select net.http_post(url:='https://uvkvaxljhhngydvlrzom.supabase.co/functions/v1/provider-release-canary',headers:=jsonb_build_object('Content-Type','application/json'),body:=jsonb_build_object('token',v_raw,'scenario',p_scenario),timeout_milliseconds:=30000) into v_request_id;return v_request_id;\nend;$function$;\n`);

          fs.mkdirSync('docs/property',{recursive:true});
          fs.writeFileSync('docs/property/njw-291-planned-marker-batch-certification-2026-08-28.md',`# NJW-291 planned marker batch certification\n\n## Uniformity Percentile\n\n**Marker:** \`uniformity.percentile\`\n\nThe canonical \`property/uniformity.json\` artifact already publishes a statewide percentile alongside the governed Assessment Uniformity Score. Runtime must expose that existing percentile and label it \`derived_governed\`; it must not relabel the percentile as a raw NJ Division of Taxation field. Absecon district 0101 is the positive control and currently publishes percentile **29**.\n\n## Chapter 123 Position\n\n**Marker:** \`watchdog.chapter123_position\`\n\nThis is a screening position only. It uses current assessed value divided by an independent public-sales anchor: municipal verified-sales median PPSF multiplied by the matched subject's SR-1A living-space record. The resulting assessment-to-anchor percentage is compared with the official 2026 Chapter 123 lower and upper bounds from \`chapter123-provider-v3\`. Output is exactly one of \`below_lower_bound\`, \`within_common_level_range\`, or \`above_upper_bound\`. No result is returned when the independent subject evidence or official corridor is unavailable. This is not appeal eligibility, legal advice, an appraisal, or a value conclusion.\n\nGloucester control \`0818_242_22\` has current assessed value 203,400; the governed municipal SR-1A PPSF is 217 and matched subject living space is 1,724 square feet, giving an independent anchor of 374,108 and an assessment-to-anchor ratio of about 54.37%. The official Washington Township 2026 corridor is 50.50% to 68.32%, so the expected category is \`within_common_level_range\`.\n\n## Assessment Component Shift\n\n**Marker:** \`watchdog.njplus.assessment_component_shift\`\n\nUse only the latest pair of **consecutive** published MOD-IV years for which both land and improvement assessments are present and nonnegative and their sum is positive. Compute each component as a share of land + improvement in each year. Then:\n\n\`differential_pp = change(land_share_pp) - change(improvement_share_pp)\`\n\nThe full mathematically possible differential is -200 to +200 percentage points, so normalize without an arbitrary weight:\n\n\`score = clamp(50 + differential_pp / 4, 0, 100)\`\n\nRound to one decimal. **50** means unchanged composition; above 50 is a shift toward land; below 50 is a shift toward improvements. Missing years are never synthesized and nonconsecutive observations are never treated as an annual transition.\n\n## Release gate\n\nProvider coverage stays unpromoted until the production canary independently reproduces all three values/contracts from their governed source inputs and verifies \`derived_governed\` provenance.\n`);
