name: One-off v0.38 Development Trends governance reconcile

on:
  push:
    paths:
      - '.github/workflows/oneoff-v038-governance-reconcile.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reconcile certified production state
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const read=p=>JSON.parse(fs.readFileSync(p,'utf8'));
          const write=(p,v)=>fs.writeFileSync(p,JSON.stringify(v,null,2)+'\n');
          const now=new Date().toISOString();
          const pack=read('property/data/nj-source-pack-v038.json');
          const markers=pack.markers||[];
          if(markers.length!==46)throw new Error('Expected 46 v0.38 markers, got '+markers.length);
          const SOURCE='NJ DCA Development Trends Viewer · as of 2025-08-21 · latest published annual data 2024 · nj-dca-development-trends-2025-08-21-v1';

          const overlay=read('property/data/db-governed-provider-overlay.json');
          overlay.captured_at=now; overlay.statuses=overlay.statuses||{}; overlay.providers=overlay.providers||{};
          for(const item of markers){
            const id=String(item.id||'');
            if(!id)throw new Error('v0.38 marker missing id');
            const kind=item.origin==='public'?'authoritative_reference':'derived_governed';
            overlay.statuses[id]='live';
            overlay.providers[id]={provider_key:'workbench-hydrate',provider_kind:kind,calculation_key:kind==='derived_governed'?String(item.calculation_key||'watchdog-dca-development-trends-window-v1'):null,source:SOURCE,bulk_capable:true};
          }
          write('property/data/db-governed-provider-overlay.json',overlay);

          const inventory=read('supabase/functions/PRODUCTION-INVENTORY.json');
          inventory.captured_at=now; inventory.functions=inventory.functions||{};
          inventory.functions['provider-release-canary']={...(inventory.functions['provider-release-canary']||{}),version:32,sha256:'2fe9dae27e0a2544cd49e26a5811846a40007154b8c5ec76980378c246846cab',verify_jwt:false,tracking:'source_snapshot'};
          inventory.functions['workbench-hydrate']={...(inventory.functions['workbench-hydrate']||{}),version:66,sha256:'0d6f3ba4d1ab8075401e6903885052deb10e3881bf0307dd664517f033f91f76',verify_jwt:true,tracking:'source_snapshot'};
          write('supabase/functions/PRODUCTION-INVENTORY.json',inventory);

          const source=read('property/data/source-registry.json'); source.datasets=source.datasets||[];
          const dca={id:'nj-dca-development-trends-annual-v038',label:'NJ DCA Development Trends Viewer annual municipality series',agency:'NJ Department of Community Affairs',source_url:'https://www.nj.gov/dca/codes/reporter/Development_Trend_Viewer.xlsb',cadence:'annual / source change monitored',live:true,join:'Exact 4-digit municipality code to governed 564-municipality annual source artifact',warning:'Viewer as of 2025-08-21; 2024 is the workbook-designated latest published annual data year. 2025 placeholder columns are not treated as published annual observations. Permit/development facts are not legal, zoning, code-compliance, construction-completion, appraisal, lending, insurance, eligibility, or transaction determinations.'};
          const si=source.datasets.findIndex(x=>x&&x.id===dca.id); if(si>=0)source.datasets[si]={...source.datasets[si],...dca}; else source.datasets.push(dca);
          write('property/data/source-registry.json',source);

          const registry=read('property/data/marker-registry.json');
          const byId=new Map((registry.markers||[]).map(m=>[String(m.id||''),m]));
          for(const item of markers){
            const id=String(item.id||''), row=byId.get(id); if(!row)throw new Error('Canonical v0.38 marker missing: '+id);
            row.provider_status='live';
            row.provider_note=item.origin==='public'
              ?'Authenticated production canary development_trends_v038 request 3848 certified the exact NJ DCA annual municipality source field/series. 2024 is the source-designated latest annual data year; no qualitative inference is added.'
              :'Authenticated production canary development_trends_v038 request 3848 certified deterministic arithmetic over the exact 2020–2024 NJ DCA annual series. The calculation is only a five-year sum or 2024-minus-2023 delta, not a momentum, risk, compliance, legal, appraisal, lending, insurance, eligibility, or transaction score.';
            row.provider_contract='workbench-hydrate-v66';
          }
          const counts=(registry.markers||[]).reduce((a,m)=>{const k=String(m.provider_status||'planned');a[k]=(a[k]||0)+1;return a;},{});
          const expected={live:618,partial:4,unavailable:12,planned:187};
          for(const [k,v] of Object.entries(expected))if(Number(counts[k]||0)!==v)throw new Error(`Unexpected ${k} count: ${counts[k]||0} != ${v}`);
          registry.summary=registry.summary||{}; registry.summary.provider_status=Object.fromEntries(Object.entries(counts).sort()); registry.generated_at=now;
          write('property/data/marker-registry.json',registry);
          console.log({updated:markers.length,counts});
          NODE
      - name: Rebuild derived governance
        run: node scripts/build-derived-governance.js
      - name: Validate reconciled counts
        run: |
          node - <<'NODE'
          const r=require('./property/data/marker-registry.json');
          const c=(r.markers||[]).reduce((a,m)=>{const k=String(m.provider_status||'planned');a[k]=(a[k]||0)+1;return a;},{});
          if(c.live!==618||c.partial!==4||c.unavailable!==12||c.planned!==187)throw new Error('Provider counts drift: '+JSON.stringify(c));
          const g=require('./property/data/derived-marker-governance.json');
          if(g.summary?.untriaged!==0)throw new Error('Derived governance has untriaged markers');
          const ids=new Set((r.markers||[]).map(x=>x.id));
          if(ids.size!==821)throw new Error('Expected 821 unique markers, got '+ids.size);
          console.log({marker_total:ids.size,provider_status:c,derived_governance:g.summary});
          NODE
      - name: Commit reconciliation
        run: |
          git config user.name "Watchdog Automation"
          git config user.email "actions@users.noreply.github.com"
          git add property/data/db-governed-provider-overlay.json property/data/source-registry.json property/data/marker-registry.json property/data/derived-marker-governance.json supabase/functions/PRODUCTION-INVENTORY.json
          if git diff --cached --quiet; then
            echo "Governance already current"
            exit 0
          fi
          git commit -m "[v038-governance] Reconcile certified Development Trends state"
          git pull --rebase origin main
          git push origin HEAD:main
