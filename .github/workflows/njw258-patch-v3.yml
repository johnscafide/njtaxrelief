name: NJW-258 deterministic lookup patch

on:
  push:
    branches:
      - fix/njw-258-fast-property-lookup

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[njw258-patched]') && !contains(github.event.head_commit.message, '[njw258-diag]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/njw-258-fast-property-lookup
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Relax escaped-copy matcher
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/njw258_patch.py')
          s = p.read_text()
          old = "r\"      '<div class=\\\"plm-sec\\\">' \\+ gate\\('tradeup',\\n        'Compare tax across 168 towns',\\n        'Pick where you are looking and see that town’s real effective rate, measured from its own parcels, against what you pay now\\.',\\n        buildTradeUp\\(\\)\\) \\+ '</div>' \\+\""
          new = "r\"      '<div class=\\\"plm-sec\\\">' \\+ gate\\('tradeup',.*?buildTradeUp\\(\\)\\) \\+ '</div>' \\+\""
          if old not in s:
              raise SystemExit('trade-up matcher source not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Apply performance refactor or capture mismatch
        shell: bash
        run: |
          set +e
          python3 .github/scripts/njw258_patch.py > /tmp/njw258.out 2>&1
          status=$?
          cat /tmp/njw258.out
          if [ "$status" -ne 0 ]; then
            cp /tmp/njw258.out .github/njw258-patch-diagnostic.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/njw258-patch-diagnostic.txt
            git commit -m "NJW-258 capture patch mismatch [njw258-diag]"
            git push origin HEAD:fix/njw-258-fast-property-lookup
            exit 0
          fi
          node --check property/js/lookup.js
          node property/tests/property-lookup-performance-contract.mjs
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add property/js/lookup.js property/tests/property-lookup-performance-contract.mjs
          git diff --cached --check
          git commit -m "NJW-258 make property lookup non-blocking [njw258-patched]"
          git push origin HEAD:fix/njw-258-fast-property-lookup
