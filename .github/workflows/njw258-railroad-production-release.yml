name: NJW-258 Railroad alias production release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release-once:
    if: github.event.head_commit.message == 'NJW-258 stage Railroad alias release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Sync current main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Enable exactly one Git production deployment
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('vercel.json')
          d=json.loads(p.read_text())
          d.setdefault('git', {})['deploymentEnabled']=True
          p.write_text(json.dumps(d, indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vercel.json
          git commit -m 'Temporarily enable one Git deployment for NJW-258 Railroad alias'
          git push origin HEAD:main
          sleep 8
      - name: Restore paused Git deployments
        run: |
          git fetch origin main
          git reset --hard origin/main
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('vercel.json')
          d=json.loads(p.read_text())
          d.setdefault('git', {})['deploymentEnabled']=False
          p.write_text(json.dumps(d, indent=2)+'\n')
          PY
          rm -f .github/workflows/njw258-railroad-production-release.yml
          git add -A
          git commit -m 'Restore paused Git deployments after NJW-258 Railroad alias release'
          git push origin HEAD:main
