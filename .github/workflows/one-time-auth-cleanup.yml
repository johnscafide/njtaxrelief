name: One-time legacy auth cleanup

on:
  push:
    paths:
      - '.github/workflows/one-time-auth-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply auth cleanup codemod
        run: node property/scripts/one-time-auth-cleanup.mjs

      - name: Verify onboarding contract
        run: node property/tests/onboarding-contract.mjs

      - name: Verify legacy auth is gone
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q "Email me a sign in link" property/js/lookup.js
          ! grep -q "window.plMagicLink" property/js/lookup.js
          ! grep -q "window.plOAuth" property/js/lookup.js
          ! grep -q "GOOGLE_CLIENT_ID" property/js/lookup.js
          ! grep -q "initOneTap" property/js/lookup.js
          ! grep -q "accounts.google.com/gsi/client" property/index.html
          grep -q "window.plSignInPrompt = openCanonicalSignIn" property/js/lookup.js

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Watchdog Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No cleanup changes to commit."
            exit 0
          fi
          git commit -m "Remove legacy property lookup auth paths"
          git pull --rebase origin main
          git push origin HEAD:main
