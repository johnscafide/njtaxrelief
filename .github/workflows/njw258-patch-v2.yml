name: NJW-258 property lookup patch runner

on:
  push:
    branches:
      - fix/njw-258-fast-property-lookup

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/njw-258-fast-property-lookup
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply the one-time source transformation
        shell: bash
        run: |
          if grep -q "var lookupSeq = 0, activeLookupKey" property/js/lookup.js; then
            echo "NJW-258 lookup patch is already applied."
            exit 0
          fi
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/njw-258-fast-property-patch.yml').read_text()
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n      - name: Verify lookup JavaScript"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          body = source[start:end]
          body = '\n'.join(line[10:] if line.startswith('          ') else line for line in body.splitlines()) + '\n'
          Path('/tmp/njw258_patch.py').write_text(body)
          PY
          python3 /tmp/njw258_patch.py
      - name: Verify lookup JavaScript and regression contract
        run: |
          node --check property/js/lookup.js
          node property/tests/property-lookup-performance-contract.mjs
          git diff --check
      - name: Commit patched lookup when changed
        shell: bash
        run: |
          if git diff --quiet -- property/js/lookup.js property/tests/property-lookup-performance-contract.mjs; then
            echo "No source changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add property/js/lookup.js property/tests/property-lookup-performance-contract.mjs
          git diff --cached --check
          git commit -m "NJW-258 make property lookup non-blocking [njw258-patched]"
          git push origin HEAD:fix/njw-258-fast-property-lookup
