name: Historical COD source contract

on:
  push:
    branches:
      - data-center-cod-history-2016-2021-20260821
    paths:
      - property/scripts/build_historical_cod_2016_2017.py
      - property/data/cod/HISTORICAL-SOURCE-MANIFEST.md
      - .github/workflows/historical-cod-source-contract.yml
  pull_request:
    paths:
      - property/scripts/build_historical_cod_2016_2017.py
      - property/data/cod/HISTORICAL-SOURCE-MANIFEST.md
      - .github/workflows/historical-cod-source-contract.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: historical-cod-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify-2016-2017:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF source reader
        run: python -m pip install --disable-pip-version-check requests pdfplumber
      - name: Build complete 564-district identity map
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          counties={
            '01':'ATLANTIC','02':'BERGEN','03':'BURLINGTON','04':'CAMDEN','05':'CAPE MAY','06':'CUMBERLAND','07':'ESSEX',
            '08':'GLOUCESTER','09':'HUDSON','10':'HUNTERDON','11':'MERCER','12':'MIDDLESEX','13':'MONMOUTH','14':'MORRIS',
            '15':'OCEAN','16':'PASSAIC','17':'SALEM','18':'SOMERSET','19':'SUSSEX','20':'UNION','21':'WARREN'
          }
          tax=json.load(open('tax-data.json'))
          assert len(tax)==564, len(tax)
          districts={}
          for code,row in tax.items():
            assert len(code)==4 and code[:2] in counties, code
            districts[code]={'name':row['name'],'county':counties[code[:2]]}
          out=Path('.tmp/historical-cod-identity.json')
          out.parent.mkdir(exist_ok=True)
          out.write_text(json.dumps({'districts':districts},sort_keys=True),encoding='utf-8')
          print({'districts':len(districts)})
          PY
      - name: Parse official county deviation PDFs
        run: >-
          python property/scripts/build_historical_cod_2016_2017.py
          --uniformity .tmp/historical-cod-identity.json
          --output property/data/cod/historical-cod-2016-2017.json
          --diagnostic property/data/cod/historical-cod-2016-2017-diagnostic.json
      - name: Verify exact statewide identity contract
        run: |
          python - <<'PY'
          import json
          data=json.load(open('property/data/cod/historical-cod-2016-2017.json'))
          diag=json.load(open('property/data/cod/historical-cod-2016-2017-diagnostic.json'))
          assert data['metric']=='segmented_class_2_cod'
          assert data['years']==[2016,2017]
          assert data['district_count']==564
          assert len(data['districts'])==564
          assert diag['status']=='pass'
          assert diag['expected_district_years']==1128
          assert diag['matched_district_years']==1128
          assert not diag['unmatched']
          assert not diag['duplicates']
          assert not diag['missing_current_district_years']
          assert {x['municipality'] for x in diag['legacy_only']}=={'PINE VALLEY BORO'}
          absecon=data['districts']['0101']['series']
          assert absecon['2016']==14.02, absecon
          assert absecon['2017']==14.45, absecon
          print({'districts':len(data['districts']),'absecon':absecon,'legacy_only':len(diag['legacy_only'])})
          PY
      - name: Commit governed historical artifact
        if: always() && github.event_name == 'push'
        run: |
          git config user.name "Watchdog Source Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -- property/data/cod/historical-cod-2016-2017.json property/data/cod/historical-cod-2016-2017-diagnostic.json || true
          if git diff --cached --quiet; then
            echo "No historical COD artifact changes"
          else
            git commit -m "[source-build] Certify 2016-2017 segmented Class 2 COD"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
