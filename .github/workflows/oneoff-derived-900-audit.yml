name: One-off derived 900 audit

on:
  push:
    paths:
      - '.github/workflows/oneoff-derived-900-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build derived readiness audit
        run: |
          node <<'NODE'
          const fs = require('fs');
          const registry = JSON.parse(fs.readFileSync('property/data/marker-registry.json','utf8'));
          const governance = JSON.parse(fs.readFileSync('property/data/derived-marker-governance.json','utf8'));
          const markerMap = new Map(registry.markers.map(m => [m.id, m]));
          const govMap = new Map((governance.markers || []).map(m => [m.marker_id, m]));
          const derived = registry.markers.filter(m => m.origin === 'watchdog-derived' || m.proprietary === true);
          const blocked = derived.filter(m => m.provider_status !== 'live');
          const rows = blocked.map(m => {
            const g = govMap.get(m.id) || {};
            const deps = Array.isArray(m.dependencies) ? m.dependencies : (Array.isArray(g.dependencies) ? g.dependencies : []);
            const depRows = deps.map(id => {
              const d = markerMap.get(id);
              return { id, exists: !!d, status: d?.provider_status || null, source_id: d?.source_id || null };
            });
            const allLive = depRows.length > 0 && depRows.every(d => d.exists && d.status === 'live');
            const liveOrPartial = depRows.length > 0 && depRows.every(d => d.exists && ['live','partial'].includes(d.status));
            return {
              id: m.id,
              label: m.label,
              source_id: m.source_id,
              category: m.category,
              scope: m.scope,
              formula: m.formula || g.formula || null,
              dependencies: deps,
              dependency_statuses: depRows,
              all_dependencies_live: allLive,
              all_dependencies_live_or_partial: liveOrPartial,
              governance_status: g.governance_status || null,
              reason: g.reason || null,
              provider_status: m.provider_status
            };
          });
          const bySource = {};
          for (const row of rows) {
            const key = row.source_id || 'unknown';
            bySource[key] ||= { total:0, with_dependencies:0, all_live:0, all_live_or_partial:0, formula_only:0 };
            bySource[key].total++;
            if (row.dependencies.length) bySource[key].with_dependencies++;
            if (row.all_dependencies_live) bySource[key].all_live++;
            if (row.all_dependencies_live_or_partial) bySource[key].all_live_or_partial++;
            if (!row.dependencies.length && row.formula) bySource[key].formula_only++;
          }
          const report = {
            generated_at: new Date().toISOString(),
            registry_summary: registry.summary,
            derived_total: derived.length,
            blocked_derived: rows.length,
            all_dependencies_live: rows.filter(r => r.all_dependencies_live),
            all_dependencies_live_or_partial: rows.filter(r => r.all_dependencies_live_or_partial && !r.all_dependencies_live),
            formula_only: rows.filter(r => !r.dependencies.length && r.formula),
            no_formula_or_dependencies: rows.filter(r => !r.dependencies.length && !r.formula),
            by_source: bySource,
            all_blocked: rows
          };
          fs.writeFileSync('derived-900-audit.json', JSON.stringify(report, null, 2));
          console.log(JSON.stringify({
            registry_summary: report.registry_summary,
            derived_total: report.derived_total,
            blocked_derived: report.blocked_derived,
            all_dependencies_live: report.all_dependencies_live.length,
            all_dependencies_live_or_partial: report.all_dependencies_live_or_partial.length,
            formula_only: report.formula_only.length,
            no_formula_or_dependencies: report.no_formula_or_dependencies.length,
            by_source: report.by_source
          }, null, 2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: derived-900-audit
          path: derived-900-audit.json
          retention-days: 1
      - name: Download certified NJ DCA UFB workbook
        run: |
          curl -L --fail --retry 3 --retry-delay 2 -o /tmp/ufb.xlsm 'https://nj.gov/dca/dlgs/programs/mc_budget_docs/UFB%20Database%20-%20FINAL.xlsm'
          echo '79a59be4c4ab2669d60ebb8072aab5a5775df7025e66cb95a887e1c39ed8ccaa  /tmp/ufb.xlsm' | sha256sum -c -
      - name: Audit 2015-2025 UFB field continuity
        run: |
          python <<'PY'
          import importlib.util, json, re, zipfile
          spec=importlib.util.spec_from_file_location('ufb','property/scripts/build_ufb_v039.py')
          ufb=importlib.util.module_from_spec(spec); spec.loader.exec_module(ufb)
          selected=list(range(13,18))+list(range(19,67))+list(range(68,140))+list(range(189,197))+list(range(315,354))+list(range(397,399))+list(range(402,407))
          with zipfile.ZipFile('/tmp/ufb.xlsm') as z:
            shared=ufb.read_shared(z); targets=ufb.sheet_targets(z)
            names=list(targets)
            annual={}
            for name,target in targets.items():
              m=re.match(r'^(20(?:1[5-9]|2[0-5]))(?: Summary)?$',name.strip())
              if m: annual[int(m.group(1))]=(name,ufb.read_sheet(z,target,shared))
          if 2025 not in annual:
            raise SystemExit(f'2025 annual sheet not found. sheets={names}')
          def headers(rows):
            group_by_col={}; grp=None
            for c in range(1,417):
              if rows.get(4,{}).get(c) not in (None,''): grp=rows[4][c]
              group_by_col[c]=grp
            return {c:(group_by_col[c],rows.get(5,{}).get(c)) for c in selected}
          base_headers=headers(annual[2025][1])
          current_codes=[]
          for rn,vals in annual[2025][1].items():
            code=vals.get(1)
            if isinstance(code,str) and re.fullmatch(r'\d{4}',code): current_codes.append(code)
          if len(current_codes)!=564: raise SystemExit(f'expected 564 current codes, got {len(current_codes)}')
          year_info={}
          year_codes={}
          header_maps={}
          for year,(name,rows) in sorted(annual.items()):
            codes={}
            for rn,vals in rows.items():
              code=vals.get(1)
              if isinstance(code,str) and re.fullmatch(r'\d{4}',code): codes[code]=rn
            year_codes[year]=codes; header_maps[year]=headers(rows)
            year_info[year]={'sheet':name,'municipality_rows':len(codes),'current_2025_codes_present':sum(c in codes for c in current_codes)}
          fields=[]
          for c in selected:
            base=base_headers[c]
            matching=[y for y in sorted(annual) if header_maps[y].get(c)==base]
            coverage_by_year={}
            for y,(name,rows) in sorted(annual.items()):
              if y not in matching: continue
              codes=year_codes[y]
              coverage_by_year[str(y)]=sum(c0 in codes and ufb.clean(rows[codes[c0]].get(c)) is not None for c0 in current_codes)
            fields.append({
              'column':c,
              'source_group':base[0],
              'source_heading':base[1],
              'matching_years':matching,
              'matching_year_count':len(matching),
              'all_2015_2025_heading_match':matching==list(range(2015,2026)),
              'coverage_current_municipalities_by_year':coverage_by_year,
              'years_with_any_current_coverage':sum(v>0 for v in coverage_by_year.values())
            })
          report={
            'workbook_sha256':ufb.EXPECTED_SHA256,
            'annual_sheets':year_info,
            'annual_years':sorted(annual),
            'selected_field_count':len(selected),
            'all_year_heading_match_count':sum(f['all_2015_2025_heading_match'] for f in fields),
            'at_least_8_year_heading_match_count':sum(f['matching_year_count']>=8 for f in fields),
            'at_least_5_year_heading_match_count':sum(f['matching_year_count']>=5 for f in fields),
            'fields':fields
          }
          open('ufb-longitudinal-audit.json','w').write(json.dumps(report,indent=2))
          print(json.dumps({k:v for k,v in report.items() if k!='fields'},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ufb-longitudinal-audit
          path: ufb-longitudinal-audit.json
          retention-days: 1
