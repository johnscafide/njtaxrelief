name: HLS live municipal evidence contract

on:
  pull_request:
    paths:
      - '.github/workflows/hls-live-contract.yml'
      - 'supabase/functions/transaction-hls-evidence/**'
      - 'supabase/functions/transaction-evidence-sweep/production-state-evidence-bootstrap.ts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Guard implementation semantics
        run: |
          set -euo pipefail
          fn=supabase/functions/transaction-hls-evidence/index.ts
          grep -q 'GetAccountDetails' "$fn"
          grep -q 'PendingTaxsale' "$fn"
          grep -q 'OpenTownLien' "$fn"
          grep -q 'municipal_lien_certificate:false' "$fn"
          grep -q 'transaction-hls-evidence' supabase/functions/transaction-evidence-sweep/production-state-evidence-bootstrap.ts
      - name: Probe public HLS read contract without logging account values
        shell: python
        run: |
          import json,urllib.parse,urllib.request
          base='https://apps.hlssystems.com/JerseyCity/PropertyTaxInquiry'
          ua='Mozilla/5.0 Watchdog-HLS-contract/1.0'
          def get(url):
            req=urllib.request.Request(url,headers={'User-Agent':ua,'Accept':'application/json,*/*'})
            with urllib.request.urlopen(req,timeout=20) as r:return json.load(r)
          search=get(base+'/GetAccounts?page=1&searchType=PropertyLocation&searchField='+urllib.parse.quote('MAIN'))
          rows=search.get('accounts') or []
          assert rows and 'AccountNumber' in rows[0] and 'PropertyLocation' in rows[0]
          acct=str(rows[0]['AccountNumber'])
          details=get(base+'/GetAccountDetails?accountNumber='+urllib.parse.quote(acct)+'&interestThruDate='+urllib.parse.quote('Tue Sep 15 2026'))
          assert details.get('validAccountNumber') is True
          a=details.get('accountInquiryVM') or {}
          required={'AccountNumber','Block','Lot','PropertyLocation','OwnerName','Principal','Interest','TotalDue','DelinquentStatus','PendingTaxsale','OpenTownLien','LienCount'}
          assert required.issubset(a.keys()), sorted(required-set(a.keys()))
          print('HLS contract OK; search keys=',sorted(rows[0].keys()),'detail field count=',len(a.keys()))
