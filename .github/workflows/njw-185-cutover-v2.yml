name: NJW-185 guarded public route cutover v2

on:
  push:
    branches:
      - agent/njw-185-public-routes

permissions:
  contents: write

jobs:
  cutover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/njw-185-public-routes
          fetch-depth: 0
      - name: Move routes and normalize classified consumers
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          routes=['exempt-pilot','fairness','public-report','report','town-compare']
          url_map={f'/property/{r}.html':f'/property/{r}' for r in routes}
          root_deferred={
            'UPLOAD-FIRST.txt','fairness.css','fairness.html','insights.html','sidemenu.html',
            'town-compare.html','town-intelligence.js','index (2).js','versions.json'
          }
          approved_root={'scripts/generate_town_pages.py','sitemap.xml','verify-release.mjs'}
          def grep_files(pattern):
              p=subprocess.run(['git','grep','-I','-l','-F','--',pattern],text=True,capture_output=True)
              if p.returncode not in (0,1): raise SystemExit(p.stderr)
              return [x for x in p.stdout.splitlines() if x]
          def excluded(path):
              return (
                path=='vercel.json'
                or path=='property/data/versions.json'
                or path.startswith('property/property/')
                or path.startswith('property/towns/')
                or path.startswith('towns/')
                or path.startswith('supabase/functions/')
                or path.startswith('.github/workflows/njw-185-')
                or path in root_deferred
              )
          def allowed(path):
              return (path.startswith('property/') and not excluded(path)) or path in approved_root

          for r in routes:
              src=Path(f'property/{r}.html'); dst=Path(f'property/{r}/index.html')
              if not src.is_file(): raise SystemExit(f'Missing source {src}')
              if dst.exists(): raise SystemExit(f'Target exists {dst}')

          consumers=set()
          for old in url_map:
              for path in grep_files(old):
                  if excluded(path): continue
                  if not allowed(path): raise SystemExit(f'UNCLASSIFIED ACTIVE REFERENCE: {path} contains {old}')
                  consumers.add(path)
          print(f'Normalizing {len(consumers)} live/support files')
          for path in sorted(consumers):
              print('  '+path)
              p=Path(path); s=p.read_text(encoding='utf-8'); u=s
              for old,new in url_map.items(): u=u.replace(old,new)
              if u!=s: p.write_text(u,encoding='utf-8')

          for r in routes:
              Path(f'property/{r}').mkdir(parents=True,exist_ok=True)
              subprocess.run(['git','mv',f'property/{r}.html',f'property/{r}/index.html'],check=True)

          vr=Path('verify-release.mjs'); s=vr.read_text(encoding='utf-8'); u=s
          for r in routes:
              u=u.replace(f"'property/{r}.html'",f"'property/{r}/index.html'")
              u=u.replace(f'"property/{r}.html"',f'"property/{r}/index.html"')
          if u!=s: vr.write_text(u,encoding='utf-8')

          vp=Path('vercel.json'); v=vp.read_text(encoding='utf-8')
          if any(f'/property/{r}/index.html' in v for r in routes): raise SystemExit('NJW-185 routes already exist in Vercel')
          legacy=''.join(f'    {{"source":"/property/{r}.html","destination":"/property/{r}","permanent":true}},\n' for r in routes)
          direct=''.join(f'    {{"source":"/property/{r}/index.html","destination":"/property/{r}","permanent":true}},\n' for r in routes)
          rewrites=''.join(f'    {{"source":"/property/{r}","destination":"/property/{r}/index.html"}},\n' for r in routes)
          cache=''.join(f'    {{"source":"/property/{r}","headers":[{{"key":"Cache-Control","value":"public, max-age=0, s-maxage=300, stale-while-revalidate=3600"}}]}},\n' for r in routes)
          anchors=[
            ('    {"source":"/property/workbench.html","destination":"/property/workbench","permanent":true},\n',legacy),
            ('    {"source":"/property/workbench/index.html","destination":"/property/workbench","permanent":true},\n',direct),
            ('    {"source":"/property/workbench","destination":"/property/workbench/index.html"},\n',rewrites),
            ('    {"source":"/property/workbench","headers":[{"key":"Cache-Control","value":"public, max-age=0, s-maxage=300, stale-while-revalidate=3600"}]},\n',cache),
          ]
          for anchor,addition in anchors:
              if v.count(anchor)!=1: raise SystemExit(f'Vercel anchor count {v.count(anchor)} for {anchor.strip()}')
              v=v.replace(anchor,anchor+addition,1)
          vp.write_text(v,encoding='utf-8')

          for old in url_map:
              for path in grep_files(old):
                  if excluded(path) or path=='vercel.json': continue
                  raise SystemExit(f'UNEXPECTED ACTIVE LEGACY REFERENCE: {path} contains {old}')
          for r in routes:
              if Path(f'property/{r}.html').exists() or not Path(f'property/{r}/index.html').is_file():
                  raise SystemExit(f'Physical move failed for {r}')
          print('NJW185_CUTOVER_PASS')
      - name: Verify targeted route contracts
        run: |
          set -euo pipefail
          git diff --check
          for r in exempt-pilot fairness public-report report town-compare; do
            test -s "property/$r/index.html"
            test ! -e "property/$r.html"
            grep -q "\"source\":\"/property/$r\",\"destination\":\"/property/$r/index.html\"" vercel.json
          done
          grep -q "property/fairness/index.html" verify-release.mjs
          grep -q "property/town-compare/index.html" verify-release.mjs
          ! git diff --name-only | grep -E '^(property/towns/|towns/|property/property/|supabase/functions/)'
          echo 'Changed files:'
          git diff --name-only
      - name: Commit application changes only
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add property scripts/generate_town_pages.py sitemap.xml verify-release.mjs vercel.json
          git commit -m "Migrate remaining public property routes"
          git push origin HEAD:agent/njw-185-public-routes
