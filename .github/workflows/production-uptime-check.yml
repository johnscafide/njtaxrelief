name: Production uptime check

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/production-uptime-check.yml'
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: read

concurrency:
  group: production-uptime-check
  cancel-in-progress: true

jobs:
  public-web-health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check public Watchdog routes
        shell: bash
        run: |
          set -euo pipefail
          check() {
            local url="$1"
            local expected="$2"
            local body
            body="$(mktemp)"
            echo "Checking ${url}"
            curl --fail --location --silent --show-error \
              --connect-timeout 10 --max-time 25 \
              --retry 2 --retry-delay 2 --retry-all-errors \
              -H 'User-Agent: Watchdog-Uptime-GitHub-Actions/1.0' \
              "$url" -o "$body"
            if ! grep -qi "$expected" "$body"; then
              echo "Expected marker not found for ${url}: ${expected}"
              head -c 500 "$body" || true
              exit 1
            fi
            echo "OK ${url}"
          }

          check 'https://njpropertytaxrelief.com/' 'NJ Property Tax'
          check 'https://njpropertytaxrelief.com/property/' 'Watchdog'

      - name: Record monitoring boundary
        if: always()
        run: |
          echo 'This monitor checks public HTTP availability and expected page markers only.'
          echo 'It does not authenticate, inspect customer records, or test billing.'
          echo 'A failed workflow should trigger incident triage before any status claim is made.'
