name: One-time Account profile render loop fix

on:
  push:
    paths:
      - '.github/workflows/one-time-account-profile-loop-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Stop Account profile observer from observing its own render
        run: |
          node <<'NODE'
          const fs = require('fs');
          const p = 'property/js/account-profile.js';
          let s = fs.readFileSync(p, 'utf8');
          const before = "    observer = new MutationObserver(function () { window.setTimeout(mount,0); });";
          const after = "    observer = new MutationObserver(function () {\n      if (!document.getElementById('ac-profile-editor')) window.setTimeout(mount,0);\n    });";
          if (!s.includes(before)) throw new Error('Expected unguarded Account profile observer not found');
          s = s.replace(before, after);
          fs.writeFileSync(p, s);

          const testPath = 'property/tests/account-profile-contract.mjs';
          let t = fs.readFileSync(testPath, 'utf8');
          if (!t.includes("ac-profile-editor')) window.setTimeout(mount,0)")) {
            t += "\nif (!controller.includes(\"if (!document.getElementById('ac-profile-editor')) window.setTimeout(mount,0);\")) fail('Account profile observer must ignore mutations caused by the mounted editor itself');\n";
            fs.writeFileSync(testPath, t);
          }
          NODE
      - name: Verify Account profile controller
        run: |
          node --check property/js/account-profile.js
          node property/tests/account-profile-contract.mjs
      - name: Commit fix and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Watchdog Automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/one-time-account-profile-loop-fix.yml
          git add property/js/account-profile.js property/tests/account-profile-contract.mjs
          git commit -m "Stop Account profile render loop"
          git pull --rebase origin main
          git push origin HEAD:main
