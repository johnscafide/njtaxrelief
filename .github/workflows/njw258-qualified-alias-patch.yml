name: NJW-258 qualified alias patch

on:
  push:
    branches:
      - fix/njw-258-qualified-alias
    paths:
      - .github/workflows/njw258-qualified-alias-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/njw-258-qualified-alias
          fetch-depth: 0

      - name: Patch qualified parcel alias recovery
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          lookup_path = Path('property/js/lookup.js')
          s = lookup_path.read_text()

          old = """  function parcelAliasCandidateMatches(feature, targets) {
    var a = feature && feature.attributes;
    if (!a || String(a.PCLQCODE || '').trim()) return false;
    var candidate = parcelAddressParts(a.PROP_LOC);
    var candidateZip = String(a.ZIP5 || '').trim();
    if (!candidate || !candidate.house || !candidateZip) return false;
    return targets.some(function (target) {
      return !!(target.house && target.house === candidate.house && target.zip && target.zip === candidateZip);
    });
  }
"""
          new = """  function parcelAliasIdentityMatches(feature, targets) {
    var a = feature && feature.attributes;
    if (!a) return false;
    var candidate = parcelAddressParts(a.PROP_LOC);
    var candidateZip = String(a.ZIP5 || '').trim();
    if (!candidate || !candidate.house || !candidateZip) return false;
    return targets.some(function (target) {
      return !!(target.house && target.house === candidate.house && target.zip && target.zip === candidateZip);
    });
  }

  function parcelAliasCandidateMatches(feature, targets) {
    var a = feature && feature.attributes;
    if (!a || String(a.PCLQCODE || '').trim()) return false;
    return parcelAliasIdentityMatches(feature, targets);
  }
"""
          if old not in s:
              raise SystemExit('alias candidate block not found')
          s = s.replace(old, new, 1)

          old = """        var matches = (d.features || []).filter(function (feature) {
          return parcelAliasCandidateMatches(feature, targets);
        });
        if (matches.length !== 1) return null;
        var dist = parcelDistanceMeters(matches[0], lat, lon);
"""
          new = """        var matches = (d.features || []).filter(function (feature) {
          return parcelAliasIdentityMatches(feature, targets);
        });
        // A qualifier is not itself ambiguity. Some ordinary NJ single-family
        // parcels carry a qualifier (for example lot 3.01). What matters is
        // whether this bounded address search resolves to one unique tax parcel.
        // Condos/multi-parcel addresses still produce multiple PAMS_PIN values
        // here and therefore continue to fail closed.
        var seenPins = Object.create(null);
        matches = matches.filter(function (feature) {
          var a = feature && feature.attributes || {};
          var key = String(a.PAMS_PIN || '').trim() || [
            a.PROP_LOC || '', a.PCLBLOCK || '', a.PCLLOT || '', a.PCLQCODE || ''
          ].join('|');
          if (seenPins[key]) return false;
          seenPins[key] = true;
          return true;
        });
        if (matches.length !== 1) return null;
        var dist = parcelDistanceMeters(matches[0], lat, lon);
"""
          if old not in s:
              raise SystemExit('nearby alias match block not found')
          s = s.replace(old, new, 1)

          old = """      if (!exact) {
        return parcelNearbyAliasCandidate(geoMeta.lat, geoMeta.lon, targets).then(function (nearAlias) {
          if (!nearAlias) return null;
          var a = nearAlias.attributes || {};
          console.info('[watchdog] nearby assessor alias confirmed from high-confidence NJ geocode', {
            searched: targets[0] && targets[0].key,
            parcel: a.PROP_LOC || '', pin: a.PAMS_PIN || ''
          });
          return nearAlias;
        });
      }
"""
          new = """      // Even when the NJ point intersects a parcel, a qualified assessor
      // alias must still go through the bounded uniqueness check rather than be
      // accepted from an arbitrary resultRecordCount=1 feature.
      return parcelNearbyAliasCandidate(geoMeta.lat, geoMeta.lon, targets).then(function (nearAlias) {
        if (!nearAlias) return null;
        var a = nearAlias.attributes || {};
        console.info('[watchdog] nearby assessor alias confirmed from high-confidence NJ geocode', {
          searched: targets[0] && targets[0].key,
          parcel: a.PROP_LOC || '', pin: a.PAMS_PIN || '', qualifier: a.PCLQCODE || ''
        });
        return nearAlias;
      });
"""
          if old not in s:
              raise SystemExit('manual alias condition block not found')
          s = s.replace(old, new, 1)
          lookup_path.write_text(s)

          test_path = Path('property/tests/property-address-alias-contract.mjs')
          t = test_path.read_text()
          t = t.replace(
              "assert.match(lookup, /function parcelAliasCandidateMatches/, 'lookup should have a strict alias candidate gate');\n",
              "assert.match(lookup, /function parcelAliasIdentityMatches/, 'lookup should separate address identity from qualifier ambiguity');\nassert.match(lookup, /function parcelAliasCandidateMatches/, 'lookup should keep a strict direct alias candidate gate');\n"
          )
          t = t.replace(
              "assert.match(lookup, /String\\(a\\.PCLQCODE \\|\\| ''\\)\\.trim\\(\\)/, 'qualified parcels must fail closed in alias mode');\n",
              "assert.match(lookup, /String\\(a\\.PCLQCODE \\|\\| ''\\)\\.trim\\(\\)/, 'direct alias acceptance must still reject qualifiers until bounded uniqueness is established');\n"
          )
          t = t.replace(
              "assert.match(lookup, /if \\(!exact\\) \\{[\\s\\S]*parcelNearbyAliasCandidate\\(geoMeta\\.lat, geoMeta\\.lon, targets\\)/, 'manual high-confidence NJ lookup should recover a unique nearby assessor alias when the point misses the polygon');\n",
              "assert.match(lookup, /return parcelNearbyAliasCandidate\\(geoMeta\\.lat, geoMeta\\.lon, targets\\)/, 'manual high-confidence NJ lookup should always use bounded uniqueness for unresolved assessor aliases');\nassert.match(lookup, /return parcelAliasIdentityMatches\\(feature, targets\\)/, 'bounded alias search should include qualified parcels in the identity candidate set');\nassert.match(lookup, /var seenPins = Object\\.create\\(null\\)/, 'bounded alias search should deduplicate by parcel identity before deciding uniqueness');\nassert.match(lookup, /String\\(a\\.PAMS_PIN \\|\\| ''\\)\\.trim\\(\\)/, 'bounded alias uniqueness should prefer statewide parcel ID');\n"
          )
          test_path.write_text(t)
          PY

      - name: Verify lookup contracts
        run: |
          node --check property/js/lookup.js
          node property/tests/property-lookup-performance-contract.mjs
          node property/tests/property-parcel-fallback-contract.mjs
          node property/tests/property-address-alias-contract.mjs
          git diff --check

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/njw258-qualified-alias-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add property/js/lookup.js property/tests/property-address-alias-contract.mjs .github/workflows/njw258-qualified-alias-patch.yml
          git commit -m "NJW-258 allow unique qualified assessor alias parcels"
          git push origin HEAD:fix/njw-258-qualified-alias
