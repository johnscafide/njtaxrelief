name: Zero-cost compliance readiness

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'property/trust/**'
      - 'property/privacy/**'
      - 'property/terms/**'
      - 'property/docs/compliance/**'
      - 'property/tests/public-accessibility-baseline.mjs'
      - 'property/tests/seven-readiness-contracts.mjs'
      - 'property/scripts/tls_readiness_check.mjs'
      - 'vercel.json'
      - '.github/workflows/zero-cost-compliance-readiness.yml'

permissions:
  contents: read

jobs:
  readiness-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify seven-track readiness artifacts and claim boundaries
        run: node property/tests/seven-readiness-contracts.mjs

  public-accessibility-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Playwright and axe-core
        run: |
          npm install --no-save playwright@1.55.0 @axe-core/playwright@4.10.2
          npx playwright install --with-deps chromium
      - name: Start local static release candidate
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/watchdog-a11y-server.log 2>&1 &
          for i in {1..20}; do
            curl --fail --silent http://127.0.0.1:4173/property/trust/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/watchdog-a11y-server.log
          exit 1
      - name: Generate automated accessibility baseline
        continue-on-error: true
        env:
          PUBLIC_A11Y_BASE_URL: http://127.0.0.1:4173
          ACCESSIBILITY_EVIDENCE_DIR: accessibility-evidence
        run: node property/tests/public-accessibility-baseline.mjs
      - name: Upload accessibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-accessibility-baseline
          path: accessibility-evidence
          if-no-files-found: warn
          retention-days: 30

  production-tls-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Capture production TLS and HTTPS evidence
        continue-on-error: true
        env:
          TLS_HOSTS: njpropertytaxrelief.com,www.njpropertytaxrelief.com
          TLS_EVIDENCE_FILE: tls-readiness-evidence.json
        run: node property/scripts/tls_readiness_check.mjs
      - name: Upload TLS evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tls-readiness-evidence
          path: tls-readiness-evidence.json
          if-no-files-found: warn
          retention-days: 30
