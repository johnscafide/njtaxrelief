name: One-off NJW-143 current planned audit
on:
  push:
    paths:
      - '.github/workflows/oneoff-njw143-current-planned-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Print canonical planned markers
        run: |
          node <<'NODE'
          const r=require('./property/data/marker-registry.json');
          const rows=(r.markers||[]).filter(m=>String(m.provider_status||'planned')==='planned').map(m=>({id:m.id,label:m.label||null,origin:m.origin||null,source_id:m.source_id||null,field:m.field||null,dependencies:m.dependencies||[],formula:m.formula||null,provider_note:m.provider_note||null,description:m.description||null}));
          console.log('PLANNED_COUNT='+rows.length);
          console.log(JSON.stringify(rows,null,2));
          NODE
