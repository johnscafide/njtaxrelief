name: Walk-to-work source audit

on:
  push:
    branches:
      - agent/affordable-supplement-audit-20260826
    paths:
      - property/scripts/audit_walkability_source.py
      - .github/workflows/walk-to-work-source-audit.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests openpyxl
      - name: Inspect exact DCA municipality mobility headers
        run: python property/scripts/audit_walkability_source.py --output property/data/walkability-source-diagnostic.json
      - name: Commit diagnostic
        run: |
          git config user.name "Watchdog Source Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -- property/data/walkability-source-diagnostic.json
          if ! git diff --cached --quiet; then
            git commit -m "[source-audit] Pin walk-to-work header contract"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
