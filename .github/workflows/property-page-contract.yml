name: Property page contract

on:
  push:
    branches: [main]
    paths:
      - 'api/watchdog-property-page.js'
      - 'api/watchdog-property-report.js'
      - 'api/watchdog-property-alerts.js'
      - 'supabase/functions/property-alert-sender/index.ts'
      - 'supabase/migrations/20260928235000_property_alerts.sql'
      - 'supabase/migrations/20260929000000_property_alerts_page_flag.sql'
      - 'property/tests/property-alerts-contract.mjs'
      - 'package.json'
      - 'supabase/migrations/20260928234000_property_page_sales_reports.sql'
      - 'middleware.js'
      - 'property/js/lookup.js'
      - 'property/index.html'
      - 'property/scripts/sync_parcel_composite.py'
      - 'supabase/migrations/20260928230000_public_property_page.sql'
      - 'supabase/migrations/20260928231000_parcel_mailing_zip_privacy.sql'
      - 'supabase/migrations/20260928233000_slow_mailing_zip_purge.sql'
      - 'property/tests/property-page-contract.mjs'
      - 'property/tests/parcel-mailing-zip-privacy-contract.mjs'
      - '.github/workflows/property-page-contract.yml'
  pull_request:
    paths:
      - 'api/watchdog-property-page.js'
      - 'api/watchdog-property-report.js'
      - 'api/watchdog-property-alerts.js'
      - 'supabase/functions/property-alert-sender/index.ts'
      - 'supabase/migrations/20260928235000_property_alerts.sql'
      - 'supabase/migrations/20260929000000_property_alerts_page_flag.sql'
      - 'property/tests/property-alerts-contract.mjs'
      - 'package.json'
      - 'supabase/migrations/20260928234000_property_page_sales_reports.sql'
      - 'middleware.js'
      - 'property/js/lookup.js'
      - 'property/index.html'
      - 'property/scripts/sync_parcel_composite.py'
      - 'supabase/migrations/20260928230000_public_property_page.sql'
      - 'supabase/migrations/20260928231000_parcel_mailing_zip_privacy.sql'
      - 'supabase/migrations/20260928233000_slow_mailing_zip_purge.sql'
      - 'property/tests/property-page-contract.mjs'
      - 'property/tests/parcel-mailing-zip-privacy-contract.mjs'
      - '.github/workflows/property-page-contract.yml'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install runtime dependencies
        run: npm install --omit=dev --ignore-scripts --no-audit --no-fund --no-package-lock
      - name: Verify property page contract
        run: node property/tests/property-page-contract.mjs
      - name: Verify property alerts contract
        run: node property/tests/property-alerts-contract.mjs
      - name: Verify parcel mailing ZIP privacy contract
        run: node property/tests/parcel-mailing-zip-privacy-contract.mjs
      - name: Verify property mailing ZIP contract
        run: node property/tests/property-mailing-zip-contract.mjs
