name: Watchdog design tokens

on:
  pull_request:
    paths:
      - 'property/css/**'
      - 'property/scripts/check_design_tokens.py'
      - 'property/scripts/check_agent_control_mobile_tokens.py'
      - '.github/workflows/watchdog-design-tokens.yml'
  push:
    branches: [main]
    paths:
      - 'property/css/**'
      - 'property/scripts/check_design_tokens.py'
      - 'property/scripts/check_agent_control_mobile_tokens.py'
      - '.github/workflows/watchdog-design-tokens.yml'

permissions:
  contents: read

jobs:
  token-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enforce canonical Watchdog design tokens
        run: python property/scripts/check_design_tokens.py
      - name: Guard Agent Control mobile token contract
        run: python property/scripts/check_agent_control_mobile_tokens.py
