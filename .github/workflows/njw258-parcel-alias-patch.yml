name: NJW-258 parcel address alias patch

on:
  push:
    branches:
      - fix/njw-258-parcel-address-alias

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/njw-258-parcel-address-alias
          fetch-depth: 0
      - name: Apply parcel alias fix
        run: python .github/scripts/njw258_parcel_alias_patch.py
      - name: Verify lookup contracts
        run: |
          node --check property/js/lookup.js
          node --check property/js/nj-address-autocomplete.js
          node property/tests/property-lookup-performance-contract.mjs
          node property/tests/property-parcel-fallback-contract.mjs
          node property/tests/property-address-alias-contract.mjs
          git diff --check
      - name: Commit verified fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'NJW-258 resolve verified parcel street aliases safely'
          git push origin HEAD:fix/njw-258-parcel-address-alias
