name: Phase 5 derived marker governance
on:
  push:
    branches: [phase5-complete-ci-fix-20260814, main]
    paths:
      - 'property/data/marker-registry.json'
      - 'property/data/derived-marker-formulas.json'
      - 'property/data/db-governed-status.json'
      - 'property/data/db-governed-provider-overlay.json'
      - 'supabase/functions/workbench-derived/**'
      - 'supabase/migrations/**'
      - 'scripts/build-derived-governance.js'
      - '.github/workflows/phase5-derived-governance.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  govern:
    if: "!contains(github.event.head_commit.message || '', '[phase5-governance]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build complete derived-marker governance
        run: node scripts/build-derived-governance.js
      - name: Verify zero untriaged derived markers and registry parity
        run: |
          node - <<'NODE'
          const g=require('./property/data/derived-marker-governance.json');
          const r=require('./property/data/marker-registry.json');
          if(g.summary.untriaged!==0)throw new Error('Untriaged derived markers remain: '+g.summary.untriaged);
          if(g.summary.total_derived!==g.summary.live+g.summary.blocked+g.summary.retired)throw new Error('Governance totals do not reconcile');
          if(!g.governance_status_snapshot)throw new Error('Database-first governance status snapshot is missing');
          if(!g.governance_status_overlay)throw new Error('Latest provider-status overlay is missing');
          const rows=Array.isArray(r.markers)?r.markers:[];
          const seen=new Set();
          const duplicates=[];
          const byId=new Map();
          for(const row of rows){
            const id=String(row&&row.id||'');
            if(!id)throw new Error('Canonical marker without id');
            if(seen.has(id))duplicates.push(id);
            seen.add(id);
            byId.set(id,row);
          }
          if(duplicates.length)throw new Error('Duplicate canonical marker ids: '+[...new Set(duplicates)].sort().join(', '));
          const drift=[];
          for(const item of g.markers||[]){
            const expected=item.provider_status_override || (item.governance_status==='live'?'live':null);
            if(!expected)continue;
            const row=byId.get(item.marker_id);
            if(!row)drift.push(item.marker_id+':missing');
            else if(String(row.provider_status||'')!==expected)drift.push(item.marker_id+':'+String(row.provider_status||'unset')+'!='+expected);
          }
          if(drift.length)throw new Error('Canonical marker registry diverges from governed derived state: '+drift.slice(0,30).join(', ')+(drift.length>30?' … +'+(drift.length-30):''));
          const summary=r.summary&&r.summary.provider_status||{};
          const counted=rows.reduce((acc,row)=>{const key=String(row.provider_status||'planned');acc[key]=(acc[key]||0)+1;return acc;},{});
          for(const key of ['live','partial','planned','unavailable'])if(Number(summary[key]||0)!==Number(counted[key]||0))throw new Error('Registry provider_status summary drift for '+key+': summary='+Number(summary[key]||0)+' actual='+Number(counted[key]||0));
          console.log(g.summary, counted);
          NODE
      - name: Commit governance artifact when changed
        run: |
          if git diff --quiet -- property/data/marker-registry.json property/data/derived-marker-governance.json; then
            echo 'Governance is already current.'
            exit 0
          fi
          git config user.name "Watchdog Automation"
          git config user.email "actions@users.noreply.github.com"
          git add property/data/marker-registry.json property/data/derived-marker-governance.json
          git commit -m "[phase5-governance] Reconcile all derived marker states"
          git push
