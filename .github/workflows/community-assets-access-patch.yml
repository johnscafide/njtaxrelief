name: Stage Community Assets Access Provider

on:
  push:
    branches:
      - data-center-community-assets-access-20260822
    paths:
      - .github/workflows/community-assets-access-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data-center-community-assets-access-20260822
          fetch-depth: 0
      - name: Patch audited spatial provider and canary
        run: |
          python - <<'PY'
          from pathlib import Path

          env_path = Path('supabase/functions/workbench-hydrate/environment-provider.ts')
          s = env_path.read_text(encoding='utf-8')

          def one(old, new, label):
              global s
              if s.count(old) != 1:
                  raise SystemExit(f'{label}: expected exactly one anchor, found {s.count(old)}')
              s = s.replace(old, new, 1)

          one("type Spec={base:string,layer:string,distance?:number,mode?:'hit'|'count'|'value'|'fema'};",
              "type Spec={base:string,layer:string,distance?:number,where?:string,mode?:'hit'|'count'|'value'|'fema'};",
              'Spec type')

          anchor = "const NJDOT_TRANSIT_VILLAGES='https://services.arcgis.com/HggmsDF7UJsNN1FK/ArcGIS/rest/services/TransitVillageBuffersV6/FeatureServer';"
          additions = anchor + "\n" + "\n".join([
              "const DCA_COMMUNITY_TRANSIT='https://services.arcgis.com/Aur8tCo478N3VovT/arcgis/rest/services/NJ_Passenger_Rail_Stations/FeatureServer';",
              "const DCA_COMMUNITY_BUS='https://services.arcgis.com/Aur8tCo478N3VovT/arcgis/rest/services/Bus_Terminals_2021/FeatureServer';",
              "const DCA_COMMUNITY_HOSPITAL='https://services2.arcgis.com/XVOqAjTOJ5P6ngMu/arcgis/rest/services/Hospitals/FeatureServer';",
              "const DCA_COMMUNITY_COLLEGE='https://services.arcgis.com/Aur8tCo478N3VovT/arcgis/rest/services/Colleges_And_Universities/FeatureServer';",
              "const DCA_COMMUNITY_OPEN_SPACE='https://services1.arcgis.com/QWdNfRs7lkPq4g4Q/arcgis/rest/services/Open_Space/FeatureServer';",
              "const DCA_COMMUNITY_LIBRARY='https://services.arcgis.com/Aur8tCo478N3VovT/arcgis/rest/services/Libraries_2023/FeatureServer';",
              "const COMMUNITY_ASSET_ACCESS_METERS=1609.344;"
          ])
          one(anchor, additions, 'community asset constants')

          pre_anchor = " 'njplus.nj-dca-community-assets.transit_village_status':{base:NJDOT_TRANSIT_VILLAGES,layer:'0',mode:'hit'}"
          pre_new = pre_anchor + ",\n" + "\n".join([
              " 'njplus.nj-dca-community-assets.transit_station_access':{base:DCA_COMMUNITY_TRANSIT,layer:'0',distance:COMMUNITY_ASSET_ACCESS_METERS,mode:'hit'},",
              " 'njplus.nj-dca-community-assets.bus_terminal_access':{base:DCA_COMMUNITY_BUS,layer:'9',distance:COMMUNITY_ASSET_ACCESS_METERS,mode:'hit'},",
              " 'njplus.nj-dca-community-assets.hospital_access':{base:DCA_COMMUNITY_HOSPITAL,layer:'1',distance:COMMUNITY_ASSET_ACCESS_METERS,mode:'hit'},",
              " 'njplus.nj-dca-community-assets.college_access':{base:DCA_COMMUNITY_COLLEGE,layer:'2',distance:COMMUNITY_ASSET_ACCESS_METERS,mode:'hit'},",
              " 'njplus.nj-dca-community-assets.park_access':{base:DCA_COMMUNITY_OPEN_SPACE,layer:'66',distance:COMMUNITY_ASSET_ACCESS_METERS,where:\"PRIMARY_USE='23' AND ACCESS_TYPE='Public Access'\",mode:'hit'},",
              " 'njplus.nj-dca-community-assets.library_access':{base:DCA_COMMUNITY_LIBRARY,layer:'11',distance:COMMUNITY_ASSET_ACCESS_METERS,mode:'hit'}"
          ])
          one(pre_anchor, pre_new, 'PRE mappings')

          one("const ck=[spec.base,spec.layer,lat.toFixed(5),lon.toFixed(5),spec.distance||0].join('|')",
              "const ck=[spec.base,spec.layer,lat.toFixed(5),lon.toFixed(5),spec.distance||0,spec.where||'1=1'].join('|')",
              'cache key')
          one("const q=new URLSearchParams({f:'json',where:'1=1',geometry:lon+','+lat",
              "const q=new URLSearchParams({f:'json',where:spec.where||'1=1',geometry:lon+','+lat",
              'where clause')
          one("export const NJDEP_PROVIDER_VERSION='spatial-preflight-v10-csrr-exact-controls';",
              "export const NJDEP_PROVIDER_VERSION='spatial-preflight-v11-dca-community-access';",
              'provider version')
          env_path.write_text(s, encoding='utf-8')

          idx_path = Path('supabase/functions/workbench-hydrate/index.ts')
          idx = idx_path.read_text(encoding='utf-8')
          old = "if(id==='njplus.nj-dca-community-assets.urban_enterprise_zone_status'||id==='njplus.nj-dca-community-assets.redevelopment_area_status')return 'NJDEP Government GIS';return 'NJDEP public GIS'"
          new = "if(id==='njplus.nj-dca-community-assets.urban_enterprise_zone_status'||id==='njplus.nj-dca-community-assets.redevelopment_area_status')return 'NJDEP Government GIS';if(id.startsWith('njplus.nj-dca-community-assets.'))return 'NJ DCA Community Asset Map 2.0';return 'NJDEP public GIS'"
          if idx.count(old) != 1:
              raise SystemExit(f'spatialSource: expected exactly one anchor, found {idx.count(old)}')
          idx = idx.replace(old, new, 1)
          idx_path.write_text(idx, encoding='utf-8')

          canary_path = Path('supabase/functions/provider-release-canary/index-v2.ts')
          c = canary_path.read_text(encoding='utf-8')
          marker_ids = [
              'njplus.nj-dca-community-assets.transit_station_access',
              'njplus.nj-dca-community-assets.bus_terminal_access',
              'njplus.nj-dca-community-assets.hospital_access',
              'njplus.nj-dca-community-assets.college_access',
              'njplus.nj-dca-community-assets.park_access',
              'njplus.nj-dca-community-assets.library_access',
          ]
          ids = ','.join(repr(x) for x in marker_ids)
          vals = ','.join(repr(x)+':true' for x in marker_ids)
          kinds = ','.join(repr(x)+":'authoritative_spatial_reference'" for x in marker_ids)
          source = "NJ DCA Community Asset Map 2.0 · spatial-preflight-v11-dca-community-access"
          sources = ','.join(repr(x)+':'+repr(source) for x in marker_ids)
          scenario = "  community_assets_access_v1:{fn:'workbench-hydrate',body:{pams_pins:['0102_139_15'],marker_ids:["+ids+"]},expect_available:[{pin:'0102_139_15',marker_ids:["+ids+"]}],expect_values:[{pin:'0102_139_15',values:{"+vals+"}}],expect_provider_kinds:[{pin:'0102_139_15',kinds:{"+kinds+"}}],expect_sources:[{pin:'0102_139_15',sources:{"+sources+"}}]},\n"
          anchor = "const SCENARIOS:Record<string,Scenario>={\n"
          if c.count(anchor) != 1:
              raise SystemExit(f'canary scenarios: expected exactly one anchor, found {c.count(anchor)}')
          if 'community_assets_access_v1' in c:
              raise SystemExit('canary scenario already exists; refusing duplicate')
          c = c.replace(anchor, anchor + scenario, 1)
          canary_path.write_text(c, encoding='utf-8')

          print('Community Assets access provider and canary staged successfully')
          PY
      - name: Validate staged contract
        run: |
          grep -q "spatial-preflight-v11-dca-community-access" supabase/functions/workbench-hydrate/environment-provider.ts
          grep -q "PRIMARY_USE='23' AND ACCESS_TYPE='Public Access'" supabase/functions/workbench-hydrate/environment-provider.ts
          grep -q "community_assets_access_v1" supabase/functions/provider-release-canary/index-v2.ts
          grep -q "NJ DCA Community Asset Map 2.0" supabase/functions/workbench-hydrate/index.ts
      - name: Commit staged runtime changes
        run: |
          git config user.name "Watchdog Data Center Automation"
          git config user.email "actions@users.noreply.github.com"
          git add supabase/functions/workbench-hydrate/environment-provider.ts supabase/functions/workbench-hydrate/index.ts supabase/functions/provider-release-canary/index-v2.ts
          git commit -m "Wire DCA Community Asset access markers"
          git push origin HEAD:data-center-community-assets-access-20260822