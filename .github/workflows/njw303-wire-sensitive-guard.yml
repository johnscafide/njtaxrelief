name: NJW-303 wire sensitive-flow guard

on:
  push:
    branches:
      - johnvscafide/njw-303-public-launch-v2
    paths:
      - .github/workflows/njw303-wire-sensitive-guard.yml

permissions:
  contents: write

jobs:
  wire-once:
    if: github.event.head_commit.message != 'Wire NJW-303 guard into guided application'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: johnvscafide/njw-303-public-launch-v2
          fetch-depth: 0
      - name: Sync exact branch head
        run: |
          git fetch origin main johnvscafide/njw-303-public-launch-v2
          git reset --hard origin/johnvscafide/njw-303-public-launch-v2
      - name: Wire privacy suppression marker and validation guard
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('property/anchor/application/2025/index.html')
          s=p.read_text()
          old='<!-- Sensitive-flow privacy guard: no analytics or session-replay scripts are loaded by this document. -->'
          new='<!-- Sensitive-flow privacy guard: watchdog-consent.js, ai-referral-analytics.js, and contact-routing-policy.js are intentionally not loaded on this page. -->'
          if old not in s:
              raise SystemExit('expected privacy marker not found; refusing blind patch')
          s=s.replace(old,new,1)
          anchor='<script src="/property/js/anchor-application-2025.js"></script>'
          guard='<script src="/property/js/anchor-application-2025-guard.js"></script>'
          if guard not in s:
              if anchor not in s:
                  raise SystemExit('application runtime script not found; refusing blind patch')
              s=s.replace(anchor,anchor+'\n  '+guard,1)
          p.write_text(s)
          PY
      - name: Commit guarded route and self-clean
        run: |
          rm .github/workflows/njw303-wire-sensitive-guard.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add property/anchor/application/2025/index.html .github/workflows/njw303-wire-sensitive-guard.yml
          git commit -m "Wire NJW-303 guard into guided application"
          git push origin HEAD:johnvscafide/njw-303-public-launch-v2
