name: Referral reward contract

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/stripe-webhook/**'
      - 'supabase/migrations/*referral*'
      - 'property/js/pro-checkout-guard.js'
      - 'property/tests/referral-reward-contract.mjs'
      - '.github/workflows/referral-reward-contract.yml'
  pull_request:
    paths:
      - 'supabase/functions/stripe-webhook/**'
      - 'supabase/migrations/*referral*'
      - 'property/js/pro-checkout-guard.js'
      - 'property/tests/referral-reward-contract.mjs'
      - '.github/workflows/referral-reward-contract.yml'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify referral reward contract
        run: node property/tests/referral-reward-contract.mjs
