name: NJ address autocomplete contract

on:
  push:
    branches: [main]
    paths:
      - 'property/js/nj-address-autocomplete.js'
      - 'property/tests/nj-address-autocomplete-contract.mjs'
      - '.github/workflows/nj-address-autocomplete-contract.yml'
  pull_request:
    paths:
      - 'property/js/nj-address-autocomplete.js'
      - 'property/tests/nj-address-autocomplete-contract.mjs'
      - '.github/workflows/nj-address-autocomplete-contract.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify Watchdog NJ address intelligence autocomplete
        run: node property/tests/nj-address-autocomplete-contract.mjs
