name: One-shot validate municipal affordable housing v3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-affordable-housing-v3-validate.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Parse and validate current DCA workbook on latest main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          python3 -m pip install --disable-pip-version-check --quiet pandas openpyxl
          python3 - <<'PY'
          import json, pathlib, urllib.request
          registry=json.loads(pathlib.Path('property/data/source-registry.json').read_text())
          item=next(x for x in registry['datasets'] if x['id']=='affordable-housing-status')
          req=urllib.request.Request(item['source_url'],headers={'User-Agent':'Watchdog-data-validator/3.0','Accept':'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,*/*;q=0.5'})
          with urllib.request.urlopen(req,timeout=90) as r:
              payload=r.read()
              content_type=r.headers.get('content-type','')
          if len(payload)<1000 or not payload.startswith(b'PK'):
              raise SystemExit(f'Not a valid XLSX payload: bytes={len(payload)} content_type={content_type!r}')
          pathlib.Path('/tmp/affordable-housing.xlsx').write_bytes(payload)
          pathlib.Path('/tmp/download-meta.json').write_text(json.dumps({'source_url':item['source_url'],'bytes':len(payload),'content_type':content_type},indent=2)+'\n')
          PY

          set +e
          python3 property/scripts/parse_affordable_housing.py /tmp/affordable-housing.xlsx property/data/affordable-housing.json > /tmp/parser.log 2>&1
          parser_code=$?
          set -e

          python3 - <<PY
          import json, pathlib
          diagnostic=json.loads(pathlib.Path('/tmp/download-meta.json').read_text())
          diagnostic['parser_exit_code']=$parser_code
          diagnostic['parser_log']=pathlib.Path('/tmp/parser.log').read_text(errors='replace')[:12000]
          output=pathlib.Path('property/data/affordable-housing.json')
          if output.exists():
              data=json.loads(output.read_text())
              diagnostic.update({
                  'schema_version':data.get('schema_version'),
                  'source_contract':data.get('source_contract'),
                  'municipalities_matched':len(data.get('districts',{})),
                  'project_sheet':data.get('project_sheet'),
                  'trust_sheet':data.get('trust_sheet'),
                  'match_methods':data.get('match_methods',{}),
                  'unmatched_count':len(data.get('municipalities_unmatched_name',[])),
                  'ambiguous_count':len(data.get('municipalities_ambiguous_name',[])),
                  'trust_balance_conflicts':data.get('trust_balance_conflicts',0),
              })
          pathlib.Path('property/data/affordable-housing-diagnostic.json').write_text(json.dumps(diagnostic,indent=2)+'\n')
          PY

          if [ "$parser_code" -ne 0 ]; then
            cat /tmp/parser.log
            exit "$parser_code"
          fi

          python3 - <<'PY'
          import json, pathlib
          data=json.loads(pathlib.Path('property/data/affordable-housing.json').read_text())
          count=len(data.get('districts',{}))
          ambiguous=len(data.get('municipalities_ambiguous_name',[]))
          conflicts=int(data.get('trust_balance_conflicts',0) or 0)
          if data.get('schema_version') != 3:
              raise SystemExit(f'Expected schema v3, got {data.get("schema_version")}')
          if count < 50:
              raise SystemExit(f'Affordable housing municipal coverage too low: {count} < 50')
          if conflicts:
              raise SystemExit(f'Unresolved trust-balance conflicts: {conflicts}')
          print(f'Validated affordable housing: {count} municipalities; ambiguous source identities={ambiguous}; trust conflicts={conflicts}')
          PY

          python3 property/scripts/refresh_state_data.py
          python3 - <<'PY'
          import json, pathlib
          report=json.loads(pathlib.Path('property/data/data-freshness.json').read_text())
          row=next(x for x in report['datasets'] if x['id']=='affordable-housing-status')
          if row.get('status')!='passed':
              raise SystemExit(f'Freshness row did not pass: {row}')
          diagnostic=json.loads(pathlib.Path('property/data/affordable-housing-diagnostic.json').read_text())
          diagnostic['freshness_status']=row.get('status')
          diagnostic['freshness_generated_at']=report.get('generated_at')
          diagnostic['final_status']='passed'
          pathlib.Path('property/data/affordable-housing-diagnostic.json').write_text(json.dumps(diagnostic,indent=2)+'\n')
          pathlib.Path('.github/workflows/one-shot-affordable-housing-v3-validate.yml').unlink()
          PY

          git config user.name 'Watchdog Data Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add property/data/affordable-housing.json property/data/affordable-housing-diagnostic.json property/data/data-freshness.json .github/workflows/one-shot-affordable-housing-v3-validate.yml
          git commit -m 'Validate governed municipal affordable housing v3'
          git pull --rebase origin main
          git push origin main
