name: One-shot affordable housing source repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-affordable-housing-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve, inspect and parse current NJ DCA workbook
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          python3 -m pip install --disable-pip-version-check --quiet pandas openpyxl

          set +e
          python3 - <<'PY'
          import html, json, pathlib, re, urllib.parse, urllib.request
          from openpyxl import load_workbook

          diagnostic={'stage':'download','errors':[]}
          registry_path=pathlib.Path('property/data/source-registry.json')
          registry=json.loads(registry_path.read_text())
          item=next(x for x in registry['datasets'] if x['id']=='affordable-housing-status')
          candidates=[]
          if item.get('source_url'):
              candidates.append(('registry_source_url',item['source_url']))

          try:
              req=urllib.request.Request(item['source_page'],headers={'User-Agent':'Watchdog-data-diagnostic/2.0'})
              with urllib.request.urlopen(req,timeout=45) as r:
                  page=r.read().decode('utf-8',errors='replace')
              links=[]
              for raw in re.findall(r'href=["\']([^"\']+)["\']',page,re.I):
                  href=html.unescape(raw)
                  absolute=urllib.parse.urljoin(item['source_page'],href)
                  low=absolute.lower()
                  if low.endswith('.xlsx') and ('municipal' in low or 'affordable' in low or 'status' in low):
                      links.append(absolute)
              for link in links:
                  if link not in [u for _,u in candidates]:
                      candidates.append(('source_page_xlsx',link))
              diagnostic['source_page_links_found']=links
          except Exception as error:
              diagnostic['errors'].append({'candidate':'source_page','error':f'{type(error).__name__}: {error}'})

          payload=None
          resolved=None
          for source_kind,url in candidates:
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Watchdog-data-repair/2.0','Accept':'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,*/*;q=0.5'})
                  with urllib.request.urlopen(req,timeout=90) as r:
                      candidate=r.read()
                      content_type=r.headers.get('content-type','')
                  if len(candidate)<1000 or not candidate.startswith(b'PK'):
                      raise RuntimeError(f'not an XLSX payload: bytes={len(candidate)} content_type={content_type!r}')
                  payload=candidate
                  resolved={'kind':source_kind,'url':url,'bytes':len(candidate),'content_type':content_type}
                  break
              except Exception as error:
                  diagnostic['errors'].append({'candidate':url,'error':f'{type(error).__name__}: {error}'})

          if payload is None:
              diagnostic['stage']='download_failed'
              pathlib.Path('property/data/affordable-housing-diagnostic.json').write_text(json.dumps(diagnostic,indent=2)+'\n')
              raise SystemExit(20)

          workbook=pathlib.Path('/tmp/affordable-housing.xlsx')
          workbook.write_bytes(payload)
          wb=load_workbook(workbook,read_only=True,data_only=True)
          diagnostic.update({'stage':'downloaded','resolved':resolved,'sheets':[]})
          for sheet_name in wb.sheetnames:
              ws=wb[sheet_name]
              rows=[]
              for row in ws.iter_rows(min_row=1,max_row=min(40,ws.max_row),values_only=True):
                  rows.append([None if v is None else str(v)[:300] for v in row[:50]])
              diagnostic['sheets'].append({'name':sheet_name,'max_row':ws.max_row,'max_column':ws.max_column,'sample_rows':rows})
          pathlib.Path('property/data/affordable-housing-diagnostic.json').write_text(json.dumps(diagnostic,indent=2)+'\n')

          # Keep the governed registry aligned with the actually validated workbook URL.
          if resolved['url'] != item.get('source_url'):
              item['source_url']=resolved['url']
              registry_path.write_text(json.dumps(registry,indent=2)+'\n')
          PY
          resolve_code=$?
          set -e

          parser_code=99
          coverage_code=99
          refresh_code=99
          if [ "$resolve_code" -eq 0 ]; then
            set +e
            python3 property/scripts/parse_affordable_housing.py /tmp/affordable-housing.xlsx property/data/affordable-housing.json > /tmp/affordable-parser.log 2>&1
            parser_code=$?
            set -e

            python3 - <<'PY'
          import json, pathlib
          p=pathlib.Path('property/data/affordable-housing-diagnostic.json')
          data=json.loads(p.read_text())
          log=pathlib.Path('/tmp/affordable-parser.log').read_text(errors='replace')[:16000] if pathlib.Path('/tmp/affordable-parser.log').exists() else ''
          data['parser_log']=log
          output=pathlib.Path('property/data/affordable-housing.json')
          if output.exists():
              parsed=json.loads(output.read_text())
              data['parsed_districts']=len(parsed.get('districts',{}))
              data['sheet_detected']=parsed.get('sheet_detected')
              data['header_row_detected_at']=parsed.get('header_row_detected_at')
              data['match_methods']=parsed.get('match_methods',{})
              data['unmatched_count']=len(parsed.get('municipalities_unmatched_name',[]))
              data['ambiguous_count']=len(parsed.get('municipalities_ambiguous_name',[]))
          p.write_text(json.dumps(data,indent=2)+'\n')
          PY

            if [ "$parser_code" -eq 0 ]; then
              set +e
              python3 - <<'PY'
          import json, pathlib
          data=json.loads(pathlib.Path('property/data/affordable-housing.json').read_text())
          count=len(data.get('districts',{}))
          ambiguous=len(data.get('municipalities_ambiguous_name',[]))
          print(f'Affordable housing governed coverage: {count} municipalities; ambiguous={ambiguous}')
          if count < 50:
              raise SystemExit(f'Affordable housing coverage too low: {count} < 50')
          PY
              coverage_code=$?
              set -e
            fi

            if [ "$coverage_code" -eq 0 ]; then
              set +e
              python3 property/scripts/refresh_state_data.py
              refresh_code=$?
              set -e
            fi
          fi

          python3 - <<PY
          import json, pathlib
          p=pathlib.Path('property/data/affordable-housing-diagnostic.json')
          data=json.loads(p.read_text()) if p.exists() else {'stage':'diagnostic_missing'}
          data['resolve_exit_code']=$resolve_code
          data['parser_exit_code']=$parser_code
          data['coverage_exit_code']=$coverage_code
          data['freshness_exit_code']=$refresh_code
          data['final_status']='passed' if ($resolve_code==0 and $parser_code==0 and $coverage_code==0 and $refresh_code==0) else 'degraded'
          p.write_text(json.dumps(data,indent=2)+'\n')
          PY

          python3 - <<'PY'
          from pathlib import Path
          Path('.github/workflows/one-shot-affordable-housing-repair.yml').unlink()
          PY

          git config user.name 'Watchdog Data Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add property/data/affordable-housing-diagnostic.json property/data/source-registry.json .github/workflows/one-shot-affordable-housing-repair.yml
          if [ -f property/data/affordable-housing.json ]; then git add property/data/affordable-housing.json; fi
          if [ -f property/data/data-freshness.json ]; then git add property/data/data-freshness.json; fi
          git commit -m 'Capture current DCA affordable housing source repair'
          git pull --rebase origin main
          git push origin main
          echo "resolve=$resolve_code parser=$parser_code coverage=$coverage_code freshness=$refresh_code"
          exit 0
