name: One-shot affordable housing source repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-affordable-housing-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Parse current NJ DCA workbook and regenerate freshness evidence
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          python3 -m pip install --disable-pip-version-check --quiet pandas openpyxl
          python3 - <<'PY'
          import json, pathlib, urllib.request
          registry=json.loads(pathlib.Path('property/data/source-registry.json').read_text())
          item=next(x for x in registry['datasets'] if x['id']=='affordable-housing-status')
          req=urllib.request.Request(item['source_url'],headers={'User-Agent':'Watchdog-data-repair/1.0'})
          with urllib.request.urlopen(req,timeout=90) as r:
              pathlib.Path('/tmp/affordable-housing.xlsx').write_bytes(r.read())
          PY
          python3 property/scripts/parse_affordable_housing.py /tmp/affordable-housing.xlsx property/data/affordable-housing.json
          python3 - <<'PY'
          import json, pathlib
          p=pathlib.Path('property/data/affordable-housing.json')
          data=json.loads(p.read_text())
          count=len(data.get('districts',{}))
          if count < 50:
              raise SystemExit(f'Affordable housing coverage too low: {count} < 50')
          print(f'Affordable housing governed coverage: {count} municipalities')
          PY
          set +e
          python3 property/scripts/refresh_state_data.py
          refresh_code=$?
          set -e
          python3 - <<'PY'
          from pathlib import Path
          Path('.github/workflows/one-shot-affordable-housing-repair.yml').unlink()
          PY
          git config user.name 'Watchdog Data Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add property/data/affordable-housing.json property/data/data-freshness.json .github/workflows/one-shot-affordable-housing-repair.yml
          git commit -m 'Restore affordable housing governed source coverage'
          git pull --rebase origin main
          git push origin main
          echo "Freshness refresh exit code after repair: $refresh_code"
          exit "$refresh_code"
