name: NJW-181 self-cleanup

on:
  push:
    branches:
      - agent/njw-181-public-nav-cleanup-v2

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/njw-181-public-nav-cleanup-v2
          fetch-depth: 0
      - name: Remove only obsolete sticky navigation block
        shell: python
        run: |
          from pathlib import Path
          p = Path('property/index.html')
          lines = p.read_text(encoding='utf-8').splitlines(keepends=True)
          starts = [i for i, line in enumerate(lines) if '<nav class="ssearch-nav">' in line]
          if len(starts) != 1:
              raise SystemExit(f'Expected exactly one ssearch-nav start, found {len(starts)}')
          start = starts[0]
          end = next((i for i in range(start + 1, len(lines)) if '</nav>' in lines[i]), None)
          if end is None:
              raise SystemExit('Could not find closing nav tag')
          block = ''.join(lines[start:end + 1])
          required = [
              '/property/dashboard',
              '/property/home',
              '/property/dashboard#saved',
              '/property/pro',
              'My Properties',
              'Watchlist',
              'Saved',
              'Pro Hub'
          ]
          missing = [x for x in required if x not in block]
          if missing:
              raise SystemExit('Unexpected ssearch-nav contents: missing ' + ', '.join(missing))
          if end - start + 1 != 6:
              raise SystemExit(f'Expected six-line obsolete nav block, found {end-start+1} lines')
          del lines[start:end + 1]
          p.write_text(''.join(lines), encoding='utf-8')
      - name: Verify scope and remove temporary workflow
        run: |
          set -euo pipefail
          test "$(git diff --name-only)" = "property/index.html"
          ! grep -q '<nav class="ssearch-nav">' property/index.html
          rm .github/workflows/njw-181-self-cleanup.yml
          git diff --check
      - name: Commit clean one-file result
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add property/index.html .github/workflows/njw-181-self-cleanup.yml
          git commit -m "Remove obsolete sticky navigation block"
          git push origin HEAD:agent/njw-181-public-nav-cleanup-v2
