name: One-off UFB longitudinal normalized audit

on:
  push:
    paths:
      - '.github/workflows/oneoff-ufb-longitudinal-normalized-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download certified workbook
        run: |
          curl -L --fail --retry 3 --retry-delay 2 -o /tmp/ufb.xlsm 'https://nj.gov/dca/dlgs/programs/mc_budget_docs/UFB%20Database%20-%20FINAL.xlsm'
          echo '79a59be4c4ab2669d60ebb8072aab5a5775df7025e66cb95a887e1c39ed8ccaa  /tmp/ufb.xlsm' | sha256sum -c -
      - name: Normalize only calendar-year tokens and compare schema
        run: |
          python <<'PY'
          import importlib.util,json,re,zipfile
          spec=importlib.util.spec_from_file_location('ufb','property/scripts/build_ufb_v039.py')
          ufb=importlib.util.module_from_spec(spec); spec.loader.exec_module(ufb)
          selected=list(range(13,18))+list(range(19,67))+list(range(68,140))+list(range(189,197))+list(range(315,354))+list(range(397,399))+list(range(402,407))
          def norm(v):
            if v is None:return None
            s=str(v)
            s=re.sub(r'\b20(?:1[4-9]|2[0-6])\b','YEAR',s)
            s=re.sub(r'\s+',' ',s).strip()
            return s
          with zipfile.ZipFile('/tmp/ufb.xlsm') as z:
            shared=ufb.read_shared(z); targets=ufb.sheet_targets(z); annual={}
            for name,target in targets.items():
              m=re.match(r'^(20(?:1[5-9]|2[0-5]))(?: Summary)?$',name.strip())
              if m: annual[int(m.group(1))]=(name,ufb.read_sheet(z,target,shared))
          def headers(rows):
            group_by_col={}; grp=None
            for c in range(1,417):
              if rows.get(4,{}).get(c) not in (None,''): grp=rows[4][c]
              group_by_col[c]=grp
            return {c:(group_by_col[c],rows.get(5,{}).get(c)) for c in selected}
          hm={y:headers(rows) for y,(name,rows) in annual.items()}
          base=hm[2025]
          current_codes=[]
          for rn,vals in annual[2025][1].items():
            code=vals.get(1)
            if isinstance(code,str) and re.fullmatch(r'\d{4}',code):current_codes.append(code)
          year_codes={}
          for y,(name,rows) in annual.items():
            year_codes[y]={vals.get(1):rn for rn,vals in rows.items() if isinstance(vals.get(1),str) and re.fullmatch(r'\d{4}',vals.get(1))}
          fields=[]
          for c in selected:
            fp=(norm(base[c][0]),norm(base[c][1]))
            matching=[y for y in sorted(annual) if (norm(hm[y][c][0]),norm(hm[y][c][1]))==fp]
            coverage={}
            for y in matching:
              rows=annual[y][1]; codes=year_codes[y]
              coverage[str(y)]=sum(code in codes and ufb.clean(rows[codes[code]].get(c)) is not None for code in current_codes)
            variants={str(y):{'group':hm[y][c][0],'heading':hm[y][c][1]} for y in sorted(annual) if y not in matching}
            fields.append({'column':c,'normalized_group':fp[0],'normalized_heading':fp[1],'matching_years':matching,'matching_year_count':len(matching),'all_11':len(matching)==11,'coverage':coverage,'nonmatching_variants':variants})
          report={'workbook_sha256':ufb.EXPECTED_SHA256,'years':sorted(annual),'fields':fields,'all_11_count':sum(x['all_11'] for x in fields),'at_least_10_count':sum(x['matching_year_count']>=10 for x in fields),'at_least_8_count':sum(x['matching_year_count']>=8 for x in fields),'at_least_5_count':sum(x['matching_year_count']>=5 for x in fields),'less_than_8':[x for x in fields if x['matching_year_count']<8]}
          open('ufb-normalized-longitudinal-audit.json','w').write(json.dumps(report,indent=2))
          print(json.dumps({k:v for k,v in report.items() if k not in ('fields','less_than_8')},indent=2))
          print('less_than_8_count',len(report['less_than_8']))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ufb-normalized-longitudinal-audit
          path: ufb-normalized-longitudinal-audit.json
          retention-days: 1
