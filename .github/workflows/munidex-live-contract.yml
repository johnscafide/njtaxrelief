name: Munidex live contract probe

on:
  pull_request:
    paths:
      - '.github/workflows/munidex-live-contract.yml'
      - 'supabase/functions/transaction-municipal-evidence/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Extract Munidex public request contract without account values
        shell: python
        run: |
          import html.parser,re,urllib.request
          UA='Mozilla/5.0 Watchdog-Munidex-contract/2.0'
          urls=['https://tax.munidex.info/englewoodcliffs-nj-0216/','https://tax.munidex.info/hanovertwp-nj-1412-swr/']
          class Scripts(html.parser.HTMLParser):
            def __init__(self): super().__init__(); self.in_script=False; self.buf=[]; self.inline=[]
            def handle_starttag(self,tag,attrs):
              if tag=='script' and not dict(attrs).get('src'): self.in_script=True; self.buf=[]
            def handle_data(self,data):
              if self.in_script:self.buf.append(data)
            def handle_endtag(self,tag):
              if tag=='script' and self.in_script:self.inline.append(''.join(self.buf));self.in_script=False
          for url in urls:
            req=urllib.request.Request(url,headers={'User-Agent':UA,'Accept':'text/html,*/*'})
            with urllib.request.urlopen(req,timeout=20) as r:text=r.read(3000000).decode('utf-8','replace')
            p=Scripts();p.feed(text);script='\n'.join(p.inline);compact=' '.join(script.split())
            patterns=['XMLHttpRequest','\.open\(','validationaddress','validationblock','validationaccnum','viewdetails','window.location','responseText']
            print('PORTAL',url)
            for pattern in patterns:
              for m in list(re.finditer(pattern,compact,re.I))[:8]:
                snippet=compact[max(0,m.start()-700):m.start()+1600]
                # redact quoted values likely to be account/name data while retaining JS structure and route literals
                snippet=re.sub(r'([A-Za-z0-9]{10,})',lambda x:'<TOKEN>' if x.group(1).isdigit() else x.group(1),snippet)
                print('CTX',pattern,snippet)
