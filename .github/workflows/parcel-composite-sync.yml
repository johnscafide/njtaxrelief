name: Statewide parcel sync

# Copies the NJ Office of GIS Parcels and MOD-IV Composite into
# property_lookups so town comparisons cover the whole state.
# Runs monthly (3rd of the month) as a full statewide refresh so new sales and
# assessment changes flow in (paused for now, see the schedule below); can also
# be run by hand for one county.
on:
  schedule:
    # PAUSED (2026-10-02): the monthly full pass, cron '17 7 3 * *'. On Oct 1
    # the parcel point backfill (#565) used up the database's daily disk budget
    # on Micro compute and the API was down for hours. The next monthly pass
    # would rewrite the ~1.78M parcels that still have no point, then start a
    # full score pass the same day. Put the line back once the backfill is
    # finished (run by hand, paced) and the database is healthy.
    # Every 6 hours: keep scoring until every property has a Watchdog Score,
    # then only start a new full pass when the last one is 25 days old.
    - cron: '41 */6 * * *'
  workflow_dispatch:
    inputs:
      what:
        description: 'parcels = state parcel sync, scores = Watchdog Score precompute, both = sync then scores'
        type: choice
        options: [parcels, scores, both]
        required: false
        default: parcels
      county:
        description: 'One county (e.g. HUDSON). Leave blank for the whole state.'
        required: false
        default: ''
      max_pages:
        description: 'Stop after this many pages of 1,000 (0 = no limit)'
        required: false
        default: '0'
      rps:
        description: 'Parcels: pages of 1,000 per second at most (lower paces database writes; 0.2 = one page every 5 s)'
        required: false
        default: '3'
      dry_run:
        description: 'Read from the state service only; write nothing'
        type: boolean
        required: false
        default: false
      resume:
        description: 'Continue the latest unfinished run for this scope'
        type: boolean
        required: false
        default: true
      refresh_days:
        description: 'Scores: start a new full pass when the last one is older than this many days (0 = start one now)'
        required: false
        default: '25'
  pull_request:
    paths:
      - 'property/scripts/sync_parcel_composite.py'
      - 'property/scripts/precompute_scores.py'
      - 'property/scripts/db_brake.py'
      - 'supabase/migrations/20260928200000_statewide_parcel_sync.sql'
      - 'supabase/migrations/20260930132000_sync_parcel_batch_skip_unchanged.sql'
      - 'supabase/migrations/20261001230000_parcel_coordinates.sql'
      - '.github/workflows/parcel-composite-sync.yml'

concurrency:
  # One loader at a time; PR self-tests never wait behind a long sync.
  group: parcel-composite-sync-${{ github.event_name == 'pull_request' && github.ref || 'loader' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  self-test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests
      - name: Loader self-test (no network writes)
        run: python property/scripts/sync_parcel_composite.py --self-test
      - name: Shared database brake self-test
        run: python property/scripts/db_brake.py
      - name: Score precompute self-test (retry, brake and stop rules, no network)
        run: |
          python -m py_compile property/scripts/precompute_scores.py
          python property/scripts/precompute_scores.py --self-test
      - name: Migration keeps owner data out and writes service-only
        run: |
          python - <<'PY'
          sql = open('supabase/migrations/20260928200000_statewide_parcel_sync.sql').read()
          assert 'owner_name' not in sql.lower() and 'st_address' not in sql.lower(), 'no owner columns'
          assert 'grant execute on function public.sync_parcel_batch(jsonb) to service_role;' in sql
          assert 'revoke all on function public.sync_parcel_batch(jsonb) from public, anon, authenticated;' in sql
          assert 'lookup_count = ' not in sql, 'sync never overwrites lookup_count'
          assert 'history = ' not in sql and 'effective_rate = ' not in sql
          print('migration contract ok')
          PY
      - name: Current sync_parcel_batch skips unchanged parcels
        run: |
          python - <<'PY'
          import glob, re
          # The newest migration that defines sync_parcel_batch is the one in production.
          path = [f for f in sorted(glob.glob('supabase/migrations/*.sql'))
                  if 'create or replace function public.sync_parcel_batch(p_rows jsonb)' in open(f).read().lower()][-1]
          print('checking', path)
          sql = open(path).read()
          low = sql.lower()
          fn = low[low.index('create or replace function public.sync_parcel_batch(p_rows jsonb)'):]
          body = fn[:fn.index('$$;')]
          assert 'owner_name' not in low and 'st_address' not in low, 'no owner columns'
          assert not re.search(r'\bzip\b', body), 'sync_parcel_batch neither accepts nor writes the mailing ZIP'
          assert 'security definer' in body and 'set search_path = public, pg_temp' in body
          assert 'revoke all on function public.sync_parcel_batch(jsonb) from public, anon, authenticated;' in sql
          assert 'grant execute on function public.sync_parcel_batch(jsonb) to service_role;' in sql
          assert 'grant execute on function public.sync_parcel_batch(jsonb) to anon' not in low and 'to authenticated' not in low
          assert 'lookup_count = ' not in sql, 'sync never overwrites lookup_count'
          assert 'history = ' not in sql and 'effective_rate = ' not in sql
          assert not re.search(r'^\s*update public\.property_lookups', low, re.M), 'no bulk UPDATE'
          upsert = body[body.index('on conflict (pams_pin) do update set'):body.index('returning 1')]
          guard = upsert[upsert.index('source_synced_at = now()'):]
          assert re.search(r'\bwhere\b', guard), 'ON CONFLICT DO UPDATE has a WHERE guard'
          assert re.search(r'\)\s*is distinct from\s*\(', guard), 'rewrites only when a synced column would change'
          assert 'source_synced_at is null' in guard
          assert re.search(r"source_synced_at < now\(\) - interval '20 days'", guard), 'monthly refresh of source_synced_at'
          for col in ('address', 'town', 'county', 'block', 'lot', 'qualifier', 'prop_class', 'year_built', 'acres',
                      'dwelling_units', 'building_desc', 'land_value', 'improvement_value', 'assessed_value',
                      'last_year_tax', 'last_sale_price', 'last_sale_year', 'last_sale_date', 'sales_code', 'lat', 'lon'):
              assert f'p.{col},' in guard or f'p.{col}\n' in guard, f'guard compares {col}'
          print('skip-unchanged migration contract ok')
          PY

  sync:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests
      - run: python property/scripts/sync_parcel_composite.py --self-test
      - name: Sync parcels
        # Only the monthly schedule or a manual parcels/both run. On other
        # schedules inputs.what is null, and null == '' is true in GitHub
        # expressions: that made every 6-hourly run a full statewide rewrite
        # and took the database down on 2026-09-30.
        if: (github.event_name == 'schedule' && github.event.schedule == '17 7 3 * *') || (github.event_name == 'workflow_dispatch' && (inputs.what == 'parcels' || inputs.what == 'both'))
        env:
          SUPABASE_URL: https://uvkvaxljhhngydvlrzom.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          COUNTY: ${{ inputs.county }}
          MAX_PAGES: ${{ inputs.max_pages }}
          DRY_RUN: ${{ inputs.dry_run }}
          RESUME: ${{ inputs.resume }}
          RPS: ${{ inputs.rps || '3' }}
        run: |
          set -euo pipefail
          if ! [[ "${RPS}" =~ ^[0-9]+([.][0-9]+)?$ ]]; then
            echo "::error::rps must be a number (got '${RPS}')"
            exit 1
          fi
          args=(--rps "${RPS}" --max-pages "${MAX_PAGES:-0}" --summary parcel-sync-summary.json)
          if [ -n "${COUNTY}" ]; then args+=(--county "${COUNTY}"); fi
          if [ "${DRY_RUN}" = "true" ]; then args+=(--dry-run); fi
          if [ "${RESUME}" = "true" ]; then args+=(--resume); fi
          python property/scripts/sync_parcel_composite.py "${args[@]}"
      - name: Precompute Watchdog Scores
        if: github.event_name == 'schedule' || inputs.what == 'scores' || inputs.what == 'both'
        env:
          SUPABASE_URL: https://uvkvaxljhhngydvlrzom.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SCORE_PRECOMPUTE_TOKEN: ${{ secrets.SCORE_PRECOMPUTE_TOKEN }}
          MAX_PAGES: ${{ inputs.max_pages }}
          # Right after the monthly parcel sync every fact may have changed, so a
          # new full pass starts (an unfinished pass is always resumed first).
          # Other schedules: 25 days. Manual runs: the refresh_days input (25 when blank).
          REFRESH_DAYS: ${{ github.event_name == 'schedule' && (github.event.schedule == '17 7 3 * *' && '0' || '25') || (inputs.refresh_days || '25') }}
        run: |
          set -euo pipefail
          if ! [[ "${REFRESH_DAYS}" =~ ^[0-9]+([.][0-9]+)?$ ]]; then
            echo "::error::refresh_days must be a number of days (got '${REFRESH_DAYS}')"
            exit 1
          fi
          args=(--max-pages "${MAX_PAGES:-0}" --refresh-days "${REFRESH_DAYS}" --max-minutes 330 --summary score-precompute-summary.json)
          python property/scripts/precompute_scores.py "${args[@]}"
      - name: Run summary
        if: always()
        run: |
          if [ -f parcel-sync-summary.json ]; then
            { echo '### Statewide parcel sync'; echo '```json'; cat parcel-sync-summary.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f score-precompute-summary.json ]; then
            { echo '### Watchdog Score precompute'; echo '```json'; cat score-precompute-summary.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
