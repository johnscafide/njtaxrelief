name: Transaction free evidence contract

on:
  pull_request:
    paths:
      - '.github/workflows/transaction-free-evidence-contract.yml'
      - '.github/workflows/nj-provider-census.yml'
      - 'transaction/evidence-addons.js'
      - 'transaction/shell.js'
      - 'transaction/refinements.js'
      - 'transaction/refinements.css'
      - 'property/data/transaction-conditional-sources.json'
      - 'supabase/functions/transaction-energy-evidence/**'
      - 'supabase/functions/transaction-municipal-requirements/**'
      - 'supabase/functions/transaction-state-evidence/**'
      - 'supabase/functions/transaction-evidence-sweep/production-state-evidence-bootstrap.ts'
      - 'supabase/migrations/20260915214500_transaction_municipal_requirements.sql'
      - 'supabase/migrations/20260915220500_transaction_municipal_requirement_curated_overrides.sql'
      - 'property/scripts/extract_transaction_municipal_requirements*.py'
      - 'property/scripts/publish_transaction_municipal_requirements.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile statewide requirement scripts
        run: |
          python -m py_compile \
            property/scripts/extract_transaction_municipal_requirements.py \
            property/scripts/extract_transaction_municipal_requirements_parallel.py \
            property/scripts/publish_transaction_municipal_requirements.py
          node --check transaction/refinements.js
          node --check transaction/shell.js
      - name: Guard source semantics and privacy boundaries
        run: |
          set -euo pipefail
          energy=supabase/functions/transaction-energy-evidence/index.ts
          req=supabase/functions/transaction-municipal-requirements/index.ts
          state=supabase/functions/transaction-state-evidence/index.ts
          bootstrap=supabase/functions/transaction-evidence-sweep/production-state-evidence-bootstrap.ts
          migration=supabase/migrations/20260915214500_transaction_municipal_requirements.sql
          curated_migration=supabase/migrations/20260915220500_transaction_municipal_requirement_curated_overrides.sql
          addon=transaction/evidence-addons.js
          refine=transaction/refinements.js
          catalog=property/data/transaction-conditional-sources.json
          grep -q 'payoff_balance_state:"customer_or_provider_authorization_required"' "$energy"
          grep -q 'account_balance_state:"customer_authorization_required"' "$energy"
          grep -q 'final_bill_clearance:false' "$energy"
          grep -q 'public sources are not complete enough to prove that no solar system exists' "$energy"
          grep -q 'never_infer_not_required:true' "$req"
          grep -q 'not_required_inferred:false' "$req"
          grep -q 'preserveExisting' "$req"
          grep -q 'Older hand-verified municipal evidence predates requirement_state' "$req"
          grep -q 'promotion_suppressed:preserveExisting' "$req"
          grep -q 'deed_date_format:"MMDDYY"' "$state"
          grep -q 'deed_date_parser_version:3' "$state"
          grep -q 'function modivDeedDate' "$state"
          grep -q 'transaction-energy-evidence' "$bootstrap"
          grep -q 'transaction-municipal-requirements' "$bootstrap"
          grep -q 'transaction-cite-evidence' "$bootstrap"
          grep -q 'revoke all on table public.transaction_municipal_requirements from anon, authenticated' "$migration"
          grep -q 'curated_override boolean not null default false' "$curated_migration"
          grep -q 'curated_override=eq.true' property/scripts/publish_transaction_municipal_requirements.py
          grep -q 'len(municipalities) != 564 or len(rows) != 1128' property/scripts/publish_transaction_municipal_requirements.py
          grep -q "item_key==='solar'" "$addon"
          grep -q "electric_utility" "$addon"
          grep -q 'transaction/evidence-addons.js' transaction/shell.js
          grep -q 'transaction/refinements.js' transaction/shell.js
          grep -q 'replace(/\\u2014/g' "$refine"
          grep -q 'tx-closing-source-pack' "$refine"
          grep -q 'njdep_flood_disclosure' "$catalog"
          grep -q 'njdep_private_well_testing_act' "$catalog"
          grep -q 'epa_lead_sale_disclosure' "$catalog"
          grep -q 'nj_treasury_realty_transfer_git' "$catalog"
      - name: Probe NJDEP electric and solar public-layer contracts
        shell: python
        run: |
          import json, urllib.request
          UA='Watchdog-free-evidence-contract/1.0 (+https://www.watchdogindex.com/)'
          def get(url):
            req=urllib.request.Request(url,headers={'User-Agent':UA,'Accept':'application/json'})
            with urllib.request.urlopen(req,timeout=25) as r:
              assert r.status==200
              return json.loads(r.read(2_000_000).decode('utf-8'))
          electric=get('https://mapsdep.nj.gov/arcgis/rest/services/Features/Utilities/MapServer/10?f=json')
          solar=get('https://mapsdep.nj.gov/arcgis/rest/services/Features/Utilities/MapServer/22?f=json')
          efields={x.get('name') for x in electric.get('fields',[])}
          sfields={x.get('name') for x in solar.get('fields',[])}
          assert 'NAME' in efields, efields
          required={'PROJECTNUM','ACCT_NUM','COMPNAME','INSTALLADD','YEAR','SYSTEMSIZE','THIRDPARTY','EDC'}
          assert required <= sfields, sorted(required-sfields)
          print('NJDEP public layer contracts OK', 'electric_fields',len(efields),'solar_fields',len(sfields))
      - name: Guard statewide requirements workflow
        run: |
          set -euo pipefail
          wf=.github/workflows/nj-provider-census.yml
          grep -q 'Build 564-municipality CO and fire requirement registry' "$wf"
          grep -q 'Publish municipal CO and fire requirements' "$wf"
          grep -q -- '--workers 14' "$wf"
