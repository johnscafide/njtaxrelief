name: One-time profile save confirmation fix

on:
  push:
    paths:
      - '.github/workflows/one-time-profile-save-message-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Keep success message after fresh profile render
        run: |
          node <<'NODE'
          const fs=require('fs');
          const p='property/js/account-profile.js';
          let s=fs.readFileSync(p,'utf8');
          const before="      await loadProfile(true);\n      if (note) note.textContent = 'Saved. Watchdog Intelligence has refreshed your approved context.';";
          const after="      await loadProfile(true);\n      var freshNote = document.getElementById('acp-note');\n      if (freshNote) freshNote.textContent = 'Saved. Watchdog Intelligence has refreshed your approved context.';";
          if(!s.includes(before)) throw new Error('Expected save confirmation block not found');
          s=s.replace(before,after);
          fs.writeFileSync(p,s);
          NODE
      - name: Verify profile controller
        run: |
          node --check property/js/account-profile.js
          node property/tests/account-profile-contract.mjs
      - name: Commit and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Watchdog Automation"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/one-time-profile-save-message-fix.yml
          git add property/js/account-profile.js
          git commit -m "Keep Account profile save confirmation visible"
          git pull --rebase origin main
          git push origin HEAD:main
