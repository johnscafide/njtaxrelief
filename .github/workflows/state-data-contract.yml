name: NJ state data contract
on:
  push:
    branches: [main]
    paths:
      - 'property/uniformity.json'
      - 'property/scripts/validate_uniformity_names.py'
      - 'property/scripts/refresh_state_data.py'
      - 'property/data/source-registry.json'
      - '.github/workflows/state-data-refresh.yml'
      - '.github/workflows/state-data-contract.yml'
  pull_request:
    paths:
      - 'property/uniformity.json'
      - 'property/scripts/validate_uniformity_names.py'
      - 'property/scripts/refresh_state_data.py'
      - 'property/data/source-registry.json'
      - '.github/workflows/state-data-refresh.yml'
      - '.github/workflows/state-data-contract.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile refresh scripts
        run: python3 -m py_compile property/scripts/refresh_state_data.py property/scripts/validate_uniformity_names.py
      - name: Validate statewide uniformity contract
        run: python3 property/scripts/validate_uniformity_names.py
