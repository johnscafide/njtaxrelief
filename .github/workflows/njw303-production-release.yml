name: NJW-303 production release

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/njw303-production-release.yml

permissions:
  contents: write

jobs:
  release-once:
    if: github.event.head_commit.message == 'NJW-303: start production release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync current main
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

      - name: Enable exactly one Git production deployment
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('vercel.json')
          s = p.read_text()
          old = '"deploymentEnabled": false'
          if old not in s:
              raise SystemExit('deploymentEnabled is not paused; refusing release pulse')
          p.write_text(s.replace(old, '"deploymentEnabled": true', 1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vercel.json
          git commit -m "Temporarily enable one Git deployment for NJW-303"
          git push origin HEAD:main
          sleep 25

      - name: Restore paused Git deployments and self-clean
        if: always()
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          python - <<'PY'
          from pathlib import Path
          p = Path('vercel.json')
          s = p.read_text()
          if '"deploymentEnabled": true' in s:
              p.write_text(s.replace('"deploymentEnabled": true', '"deploymentEnabled": false', 1))
          elif '"deploymentEnabled": false' not in s:
              raise SystemExit('deploymentEnabled setting is missing; refusing unsafe restore')
          PY
          rm -f .github/workflows/njw303-production-release.yml
          git add vercel.json .github/workflows/njw303-production-release.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Restore paused Git deployments after NJW-303 release"
          git push origin HEAD:main
