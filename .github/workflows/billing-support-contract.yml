name: Billing support contract

on:
  push:
    branches: [main]
    paths:
      - 'property/docs/billing-support-runbook.md'
      - 'scripts/verify_billing_support_runbook_contract.js'
      - '.github/workflows/billing-support-contract.yml'
  pull_request:
    paths:
      - 'property/docs/billing-support-runbook.md'
      - 'scripts/verify_billing_support_runbook_contract.js'
      - '.github/workflows/billing-support-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify current Stripe low-touch billing support contract
        run: node scripts/verify_billing_support_runbook_contract.js
