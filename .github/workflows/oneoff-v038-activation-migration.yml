name: One-off v0.38 Development Trends activation migration

on:
  push:
    paths:
      - '.github/workflows/oneoff-v038-activation-migration.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate migration
        run: python scripts/generate-v038-activation-migration.py
      - name: Commit generated migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/20260827223000_activate_development_trends_v038.sql
          if git diff --cached --quiet; then
            echo "Migration already current"
            exit 0
          fi
          git commit -m "Activate DCA Development Trends v0.38 provider coverage"
          git pull --rebase origin main
          git push origin HEAD:main
