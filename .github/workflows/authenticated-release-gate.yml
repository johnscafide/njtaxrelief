name: Authenticated release gate

on:
  workflow_dispatch:

jobs:
  plan-and-rls-boundary:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Standard, Pro, Pro+ and developer authorization
        env:
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
          WATCHDOG_TEST_STANDARD_EMAIL: ${{ secrets.WATCHDOG_TEST_STANDARD_EMAIL }}
          WATCHDOG_TEST_STANDARD_PASSWORD: ${{ secrets.WATCHDOG_TEST_STANDARD_PASSWORD }}
          WATCHDOG_TEST_PRO_EMAIL: ${{ secrets.WATCHDOG_TEST_PRO_EMAIL }}
          WATCHDOG_TEST_PRO_PASSWORD: ${{ secrets.WATCHDOG_TEST_PRO_PASSWORD }}
          WATCHDOG_TEST_PRO_PLUS_EMAIL: ${{ secrets.WATCHDOG_TEST_PRO_PLUS_EMAIL }}
          WATCHDOG_TEST_PRO_PLUS_PASSWORD: ${{ secrets.WATCHDOG_TEST_PRO_PLUS_PASSWORD }}
          WATCHDOG_TEST_DEVELOPER_EMAIL: ${{ secrets.WATCHDOG_TEST_DEVELOPER_EMAIL }}
          WATCHDOG_TEST_DEVELOPER_PASSWORD: ${{ secrets.WATCHDOG_TEST_DEVELOPER_PASSWORD }}
        run: node property/tests/authenticated-release-gate.mjs
