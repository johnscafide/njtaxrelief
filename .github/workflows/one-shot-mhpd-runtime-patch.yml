name: One-shot wire exact municipal housing runtime

on:
  push:
    branches: [agent/mhpd-neighborhood-exact-20260820]
    paths:
      - '.github/workflows/one-shot-mhpd-runtime-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify source control and patch provider/canary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          artifact=json.loads(Path('property/data/neighborhood-trends.json').read_text())
          control=artifact['municipalities']['0101']
          expected={
            'housing_stock':3702.0,
            'owner_occupied_share':79.35,
            'renter_occupied_share':20.65,
            'vacancy_rate':4.51,
            'median_gross_rent':1807.0,
            'median_home_value':286300.0,
            'housing_cost_burden_share':40.57,
            'household_growth':27.48,
          }
          got={k:control.get(k) for k in expected}
          if got != expected:
              raise SystemExit(f'Absecon source control changed: expected={expected} got={got}')

          provider=Path('supabase/functions/workbench-hydrate/dca-provider.ts')
          text=provider.read_text()
          anchor="""const NEIGHBORHOOD_DERIVED_FIELDS=new Set([\n  'population_change','housing_unit_change','rental_cost_change','home_value_change','employment_density','neighborhood_trend_year'\n]);\n"""
          addition=anchor+"""const MUNICIPAL_HOUSING_PROFILE_FIELDS=new Set([\n  'housing_stock','owner_occupied_share','renter_occupied_share','vacancy_rate',\n  'median_gross_rent','median_home_value','housing_cost_burden_share','household_growth'\n]);\nconst MUNICIPAL_HOUSING_PROFILE_DERIVED_FIELDS=new Set([\n  'owner_occupied_share','renter_occupied_share','vacancy_rate','household_growth'\n]);\n"""
          if 'MUNICIPAL_HOUSING_PROFILE_FIELDS' not in text:
              if anchor not in text: raise SystemExit('provider field anchor missing')
              text=text.replace(anchor,addition,1)

          fn_anchor="""function neighborhoodTrendValue(root:any,row:any,field:string){\n  if(!NEIGHBORHOOD_FIELDS.has(field))return null;\n  const tc=treasury(row),rec=root?.neighborhoodTrends?.municipalities?.[tc];\n  const kind=NEIGHBORHOOD_DERIVED_FIELDS.has(field)?'derived_governed':'authoritative_reference';\n  if(!/^\\d{4}$/.test(tc)||!rec)return {v:null,checked:true,kind,source:'NJ DCA 2026 Neighborhood Trends Database'};\n  return {v:rec?.[field]??null,checked:true,kind,source:'NJ DCA 2026 Neighborhood Trends Database · '+MUNICIPAL_HOUSING_PROVIDER_VERSION};\n}\n"""
          fn_add=fn_anchor+"""\nfunction municipalHousingProfileValue(root:any,row:any,field:string){\n  if(!MUNICIPAL_HOUSING_PROFILE_FIELDS.has(field))return null;\n  const tc=treasury(row),rec=root?.neighborhoodTrends?.municipalities?.[tc];\n  const kind=MUNICIPAL_HOUSING_PROFILE_DERIVED_FIELDS.has(field)?'derived_governed':'authoritative_reference';\n  const source='NJ DCA 2026 Neighborhood Trends Database · exact municipal housing compatibility · '+MUNICIPAL_HOUSING_PROVIDER_VERSION;\n  if(!/^\\d{4}$/.test(tc)||!rec)return {v:null,checked:true,kind,source};\n  return {v:rec?.[field]??null,checked:true,kind,source};\n}\n"""
          if 'function municipalHousingProfileValue' not in text:
              if fn_anchor not in text: raise SystemExit('provider function anchor missing')
              text=text.replace(fn_anchor,fn_add,1)

          route_old="if(src==='nj-division-taxation'||src==='nj-abstract-pilot'||src==='nj-tax-abstract'||src==='nj-dca-affordable-housing'||src==='nj-dca-neighborhood-trends'){"
          route_new="if(src==='nj-division-taxation'||src==='nj-abstract-pilot'||src==='nj-tax-abstract'||src==='nj-dca-affordable-housing'||src==='nj-dca-neighborhood-trends'||src==='nj-dca-municipal-housing-profile'){"
          if route_new not in text:
              if route_old not in text: raise SystemExit('provider routing family anchor missing')
              text=text.replace(route_old,route_new,1)
          branch_old="    if(src==='nj-dca-affordable-housing')return affordableHousingValue(root,row,field);\n    return neighborhoodTrendValue(root,row,field);"
          branch_new="    if(src==='nj-dca-affordable-housing')return affordableHousingValue(root,row,field);\n    if(src==='nj-dca-municipal-housing-profile')return municipalHousingProfileValue(root,row,field);\n    return neighborhoodTrendValue(root,row,field);"
          if branch_new not in text:
              if branch_old not in text: raise SystemExit('provider routing branch anchor missing')
              text=text.replace(branch_old,branch_new,1)
          provider.write_text(text)

          canary=Path('supabase/functions/provider-release-canary/index-v2.ts')
          c=canary.read_text()
          scenario="""  municipal_housing_profile_v1:{fn:'workbench-hydrate',body:{pams_pins:['0101_25.01_10'],marker_ids:['njplus.nj-dca-municipal-housing-profile.housing_stock','njplus.nj-dca-municipal-housing-profile.owner_occupied_share','njplus.nj-dca-municipal-housing-profile.renter_occupied_share','njplus.nj-dca-municipal-housing-profile.vacancy_rate','njplus.nj-dca-municipal-housing-profile.median_gross_rent','njplus.nj-dca-municipal-housing-profile.median_home_value','njplus.nj-dca-municipal-housing-profile.housing_cost_burden_share','njplus.nj-dca-municipal-housing-profile.household_growth']},expect_available:[{pin:'0101_25.01_10',marker_ids:['njplus.nj-dca-municipal-housing-profile.housing_stock','njplus.nj-dca-municipal-housing-profile.owner_occupied_share','njplus.nj-dca-municipal-housing-profile.renter_occupied_share','njplus.nj-dca-municipal-housing-profile.vacancy_rate','njplus.nj-dca-municipal-housing-profile.median_gross_rent','njplus.nj-dca-municipal-housing-profile.median_home_value','njplus.nj-dca-municipal-housing-profile.housing_cost_burden_share','njplus.nj-dca-municipal-housing-profile.household_growth']}],expect_values:[{pin:'0101_25.01_10',values:{'njplus.nj-dca-municipal-housing-profile.housing_stock':3702,'njplus.nj-dca-municipal-housing-profile.owner_occupied_share':79.35,'njplus.nj-dca-municipal-housing-profile.renter_occupied_share':20.65,'njplus.nj-dca-municipal-housing-profile.vacancy_rate':4.51,'njplus.nj-dca-municipal-housing-profile.median_gross_rent':1807,'njplus.nj-dca-municipal-housing-profile.median_home_value':286300,'njplus.nj-dca-municipal-housing-profile.housing_cost_burden_share':40.57,'njplus.nj-dca-municipal-housing-profile.household_growth':27.48}}],expect_provider_kinds:[{pin:'0101_25.01_10',kinds:{'njplus.nj-dca-municipal-housing-profile.housing_stock':'authoritative_reference','njplus.nj-dca-municipal-housing-profile.owner_occupied_share':'derived_governed','njplus.nj-dca-municipal-housing-profile.renter_occupied_share':'derived_governed','njplus.nj-dca-municipal-housing-profile.vacancy_rate':'derived_governed','njplus.nj-dca-municipal-housing-profile.median_gross_rent':'authoritative_reference','njplus.nj-dca-municipal-housing-profile.median_home_value':'authoritative_reference','njplus.nj-dca-municipal-housing-profile.housing_cost_burden_share':'authoritative_reference','njplus.nj-dca-municipal-housing-profile.household_growth':'derived_governed'}}]},\n"""
          if 'municipal_housing_profile_v1:' not in c:
              marker="  neighborhood_trends_v1:"
              pos=c.find(marker)
              if pos < 0: raise SystemExit('canary scenario anchor missing')
              c=c[:pos]+scenario+c[pos:]
          canary.write_text(c)
          PY
      - name: Remove one-shot workflow and commit runtime contract
        run: |
          rm .github/workflows/one-shot-mhpd-runtime-patch.yml
          git config user.name 'Watchdog Data Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -- supabase/functions/workbench-hydrate/dca-provider.ts supabase/functions/provider-release-canary/index-v2.ts .github/workflows/one-shot-mhpd-runtime-patch.yml
          git commit -m 'Wire exact municipal housing runtime and canary'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
