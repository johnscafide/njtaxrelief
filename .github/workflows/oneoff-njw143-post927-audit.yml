name: One-off NJW-143 post-927 marker audit

on:
  push:
    paths:
      - '.github/workflows/oneoff-njw143-post927-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit canonical non-live markers
        run: |
          node <<'NODE'
          const fs=require('fs');
          const registry=JSON.parse(fs.readFileSync('property/data/marker-registry.json','utf8'));
          let governance={markers:[]};
          try{governance=JSON.parse(fs.readFileSync('property/data/derived-marker-governance.json','utf8'));}catch{}
          const byId=new Map((registry.markers||[]).map(m=>[String(m.id),m]));
          const govMap=new Map((governance.markers||[]).map(m=>[String(m.marker_id),m]));
          const nonLive=(registry.markers||[]).filter(m=>String(m.provider_status||'planned')!=='live');
          const rows=nonLive.map(m=>{
            const g=govMap.get(String(m.id))||{};
            const deps=Array.isArray(m.dependencies)?m.dependencies:(Array.isArray(g.dependencies)?g.dependencies:[]);
            const depStates=deps.map(id=>({id,status:byId.get(String(id))?.provider_status||null,exists:byId.has(String(id))}));
            const formula=m.formula||g.formula||null;
            return {
              id:m.id,label:m.label,provider_status:m.provider_status||'planned',origin:m.origin||null,proprietary:Boolean(m.proprietary),
              source_id:m.source_id||null,category:m.category||null,scope:m.scope||null,tier:m.tier||null,professions:m.professions||[],
              formula,dependencies:deps,dependency_statuses:depStates,
              all_dependencies_live:deps.length>0&&depStates.every(d=>d.exists&&d.status==='live'),
              all_dependencies_live_or_partial:deps.length>0&&depStates.every(d=>d.exists&&['live','partial'].includes(d.status)),
              governance_status:g.governance_status||null,governance_reason:g.reason||null,
              status_reason:m.status_reason||null,provider_note:m.provider_note||null
            };
          });
          const group=(key)=>{
            const out={};for(const r of rows){const k=String(r[key]??'unknown');out[k]=(out[k]||0)+1;}return Object.fromEntries(Object.entries(out).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0])));
          };
          const formulaShape={};
          for(const r of rows){
            let shape='none';const f=String(r.formula||'').toLowerCase();
            if(f){
              if(/weighted|weight\s*\(/.test(f)) shape='weighted_underdefined_candidate';
              else if(/normaliz|score\s*\(/.test(f)) shape='normalization_or_score_candidate';
              else if(/ratio|\//.test(f)) shape='ratio_or_division_candidate';
              else if(/count|sum|difference|delta|history|alias|copy|current_year|year/.test(f)) shape='deterministic_candidate';
              else shape='other_formula';
            }
            formulaShape[shape]=(formulaShape[shape]||0)+1;
            r.formula_shape=shape;
          }
          const report={
            generated_at:new Date().toISOString(),registry_summary:registry.summary,total_non_live:rows.length,
            by_status:group('provider_status'),by_source:group('source_id'),by_category:group('category'),by_origin:group('origin'),formula_shape:formulaShape,
            all_dependencies_live:rows.filter(r=>r.all_dependencies_live),
            all_dependencies_live_or_partial_only:rows.filter(r=>r.all_dependencies_live_or_partial&&!r.all_dependencies_live),
            deterministic_formula_candidates:rows.filter(r=>['ratio_or_division_candidate','deterministic_candidate'].includes(r.formula_shape)),
            public_source_non_live:rows.filter(r=>r.origin==='public'&&!r.proprietary),
            derived_non_live:rows.filter(r=>r.origin==='watchdog-derived'||r.proprietary),
            rows
          };
          fs.writeFileSync('post927-audit.json',JSON.stringify(report,null,2));
          console.log(JSON.stringify({
            registry_summary:report.registry_summary,total_non_live:report.total_non_live,by_status:report.by_status,
            by_source:report.by_source,by_category:report.by_category,by_origin:report.by_origin,formula_shape:report.formula_shape,
            all_dependencies_live:report.all_dependencies_live.length,
            all_dependencies_live_or_partial_only:report.all_dependencies_live_or_partial_only.length,
            deterministic_formula_candidates:report.deterministic_formula_candidates.length,
            public_source_non_live:report.public_source_non_live.length,derived_non_live:report.derived_non_live.length
          },null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: post927-audit
          path: post927-audit.json
          retention-days: 1
