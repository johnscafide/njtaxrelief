name: NJW-185 route audit

on:
  push:
    branches:
      - agent/njw-185-public-routes

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit URL and physical path consumers
        shell: python
        run: |
          from pathlib import Path
          import re, subprocess
          routes=['exempt-pilot','fairness','public-report','report','town-compare']
          for r in routes:
              old=f'/property/{r}.html'
              p=subprocess.run(['git','grep','-I','-n','-F','--',old],text=True,capture_output=True)
              if p.returncode not in (0,1): raise SystemExit(p.stderr)
              rows=p.stdout.splitlines()
              print(f'URL|{r}|lines={len(rows)}')
              for line in rows:
                  path=line.split(':',1)[0]
                  if not (path.startswith('property/towns/') or path.startswith('towns/') or path.startswith('property/property/') or path in {'property/data/versions.json','versions.json'}):
                      print('  '+line)
          print('PHYSICAL_BEGIN')
          patterns={r:re.compile(r'(?<!/)property/'+re.escape(r)+r'\.html') for r in routes}
          for p in Path('.').rglob('*'):
              if not p.is_file(): continue
              rel=p.as_posix().removeprefix('./')
              if rel.startswith(('.git/','property/towns/','towns/','property/property/')): continue
              try: text=p.read_text(encoding='utf-8')
              except (UnicodeDecodeError,OSError): continue
              for r,rx in patterns.items():
                  for m in rx.finditer(text): print(f'PHYSICAL|{r}|{rel}|{text.count(chr(10),0,m.start())+1}')
          print('NJW185_ROUTE_AUDIT_END')
