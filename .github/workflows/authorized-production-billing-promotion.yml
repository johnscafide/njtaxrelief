name: Authorized production billing promotion

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/authorized-production-billing-promotion.yml

permissions:
  contents: read

jobs:
  promote:
    name: production-billing-promotion-authorized
    if: contains(github.event.head_commit.message, '[prod-billing-authorized]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    env:
      PRODUCTION_SUPABASE_REF: uvkvaxljhhngydvlrzom
      ACCEPTED_BILLING_SHA: 84c9e0a0a7d1801c580d436c056903eca178937d
      SUPABASE_ACCESS_TOKEN: ${{ secrets.NJW42_SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Checkout exact accepted billing release
        uses: actions/checkout@v4
        with:
          ref: ${{ env.ACCEPTED_BILLING_SHA }}

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Enforce production promotion boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$PRODUCTION_SUPABASE_REF" = "uvkvaxljhhngydvlrzom"
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          test "$(git rev-parse HEAD)" = "$ACCEPTED_BILLING_SHA"
          grep -q "price_1U5qPZAgYeNIcesFuC2gKGTz" supabase/functions/create-checkout-session/index.ts
          grep -q "claimWebhookEvent" supabase/functions/stripe-webhook/index.ts
          grep -q "isMissingMarketingPaymentsLedger" supabase/functions/stripe-webhook/index.ts
          echo "Exact accepted billing SHA and production boundary verified."

      - name: Deploy accepted billing function set to production
        shell: bash
        run: |
          set -euo pipefail
          supabase functions deploy billing-price-catalog --project-ref "$PRODUCTION_SUPABASE_REF" --no-verify-jwt
          supabase functions deploy create-checkout-session --project-ref "$PRODUCTION_SUPABASE_REF"
          supabase functions deploy create-portal-session --project-ref "$PRODUCTION_SUPABASE_REF"
          supabase functions deploy stripe-webhook --project-ref "$PRODUCTION_SUPABASE_REF" --no-verify-jwt

      - name: Verify exact production price catalog
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE="$(curl --fail --silent --show-error "https://${PRODUCTION_SUPABASE_REF}.supabase.co/functions/v1/billing-price-catalog")"
          printf '%s' "$RESPONSE" | jq -e '.plans.agent.monthly.amount_cents == 5900' >/dev/null
          printf '%s' "$RESPONSE" | jq -e '.plans.agent.yearly.amount_cents == 59000' >/dev/null
          printf '%s' "$RESPONSE" | jq -e '.plans.pro.monthly.amount_cents == 12900' >/dev/null
          printf '%s' "$RESPONSE" | jq -e '.plans.pro.yearly.amount_cents == 129000' >/dev/null
          printf '%s' "$RESPONSE" | jq -e '.plans.pro_plus.monthly.amount_cents == 39900' >/dev/null
          printf '%s' "$RESPONSE" | jq -e '.plans.pro_plus.yearly.amount_cents == 399000' >/dev/null
          echo "Production billing catalog exact-price contract passed."
