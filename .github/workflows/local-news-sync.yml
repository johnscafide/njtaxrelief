name: Local news sync
# Pulls each enabled local reporter's recent stories (property/data/local-sources.json)
# into public.local_news_items so the home feed reads them from the database.
# A full backfill (days=365) across every source takes several minutes.
on:
  workflow_dispatch:
    inputs:
      days:
        description: "How many days back to fetch (365 for a backfill)"
        required: false
        default: "3"
      dry_run:
        description: "Fetch and print only, write nothing"
        type: boolean
        default: false
      prune:
        description: "Also remove stories in the window that no longer qualify (after a rule change)"
        type: boolean
        default: false
      only:
        description: "Comma-separated source ids to sync (blank = all)"
        required: false
        default: ""
  schedule:
    - cron: "11 * * * *"
permissions:
  contents: read
concurrency:
  group: local-news-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Sync local reporters' stories
        env:
          SUPABASE_URL: https://uvkvaxljhhngydvlrzom.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          DAYS: ${{ inputs.days || '3' }}
          DRY_RUN: ${{ inputs.dry_run }}
          PRUNE: ${{ inputs.prune }}
          ONLY: ${{ inputs.only }}
        run: |
          set -euo pipefail
          if ! [[ "${DAYS}" =~ ^[0-9]{1,3}$ ]]; then
            echo "::error::days must be a whole number (got '${DAYS}')"
            exit 1
          fi
          args=(--days "${DAYS}")
          if [ "${DRY_RUN}" = "true" ]; then args+=(--dry-run); fi
          if [ "${PRUNE}" = "true" ]; then args+=(--prune); fi
          if [ -n "${ONLY:-}" ]; then
            if ! [[ "${ONLY}" =~ ^[a-z0-9,-]+$ ]]; then
              echo "::error::only must be source ids separated by commas (got '${ONLY}')"
              exit 1
            fi
            args+=(--only "${ONLY}")
          fi
          node property/scripts/sync_local_news.mjs "${args[@]}"
