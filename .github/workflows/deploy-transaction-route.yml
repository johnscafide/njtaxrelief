name: Deploy Transaction route fix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-transaction-route.yml

permissions:
  contents: read

env:
  VERCEL_ORG_ID: team_NLnARgwzVf4nYuSMQ3jif2ld
  VERCEL_PROJECT_ID: prj_WjkoYFzi04JigQOvvgWiXuC1lC8Q

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Publish current main to Vercel production
        env:
          DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
          DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${DEPLOY_HOOK_URL:-}" ]; then
            curl --fail --silent --show-error -X POST "$DEPLOY_HOOK_URL" >/tmp/vercel-deploy.json
            echo "Triggered protected Vercel deploy hook."
            exit 0
          fi
          if [ -n "${DEPLOY_HOOK:-}" ] && printf '%s' "$DEPLOY_HOOK" | grep -q '^https://'; then
            curl --fail --silent --show-error -X POST "$DEPLOY_HOOK" >/tmp/vercel-deploy.json
            echo "Triggered protected Vercel deploy hook."
            exit 0
          fi
          if [ -n "${VERCEL_TOKEN:-}" ]; then
            npm install --global vercel@latest >/dev/null 2>&1
            vercel pull --yes --environment=production --token="$VERCEL_TOKEN" >/dev/null
            vercel build --prod --token="$VERCEL_TOKEN"
            vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
            exit 0
          fi
          echo "No protected Vercel deploy hook/token is available to GitHub Actions." >&2
          exit 2
