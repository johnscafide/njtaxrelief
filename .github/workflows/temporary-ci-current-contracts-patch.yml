name: Temporary current-contract CI patch

on:
  push:
    branches:
      - fix/ci-current-contracts-20260913
    paths:
      - .github/workflows/temporary-ci-current-contracts-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ci-current-contracts-20260913
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Align stale CI contracts with current product behavior
        shell: python
        run: |
          from pathlib import Path

          brand = Path('property/scripts/audit_brand_consistency.py')
          text = brand.read_text(encoding='utf-8')
          old = '    "Change Intelligence",\n'
          new = '    "Property Pulse",\n'
          if old not in text:
              raise SystemExit('Expected stale Change Intelligence canonical-nav contract not found')
          brand.write_text(text.replace(old, new, 1), encoding='utf-8')

          entitlement = Path('property/tests/entitlement-tier-contract.mjs')
          text = entitlement.read_text(encoding='utf-8')
          old = "const dataCenter = read('property/data-center/index.html');\n"
          new = old + "const dataCenterRuntime = read('property/js/data-center-runtime-v2.js');\n"
          if old not in text:
              raise SystemExit('Expected Data Center test fixture line not found')
          text = text.replace(old, new, 1)

          old_line = next((line for line in text.splitlines(keepends=True) if 'Data Center must remain Pro+-or-higher.' in line), None)
          if old_line is None:
              raise SystemExit('Expected stale Data Center page-level Pro+ assertion not found')
          new = (
              "assert(!/data-access-require=/.test(dataCenter) && !dataCenter.includes('/property/js/access-guard.js'), 'Data Center catalog/overview must remain public.');\n"
              "assert(dataCenterRuntime.includes(\"required_plan: 'pro_plus'\") && dataCenterRuntime.includes(\"from('saved_properties')\") && dataCenterRuntime.includes(\"from('saved_data_center_views')\") && dataCenterRuntime.includes(\"from('data_center_delivery_jobs')\"), 'Data Center account-owned workspace actions must remain Pro+-or-higher.');\n"
          )
          text = text.replace(old_line, new, 1)
          text = text.replace('  checks: 18\n', '  checks: 20\n', 1)
          entitlement.write_text(text, encoding='utf-8')
      - name: Verify repaired contracts
        run: |
          python property/scripts/audit_brand_consistency.py --report /tmp/brand-consistency-report.md --strict
          node property/tests/entitlement-tier-contract.mjs
          node property/scripts/audit_access_boundaries.mjs >/tmp/access-boundaries.json
      - name: Commit contract repairs and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temporary-ci-current-contracts-patch.yml
          git add property/scripts/audit_brand_consistency.py property/tests/entitlement-tier-contract.mjs
          git commit -m "Align CI contracts with current Watchdog product"
          git push origin HEAD:fix/ci-current-contracts-20260913
