name: Temporary audit 7-8 remediation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch-audit-78:
    if: ${{ github.event.pull_request.head.ref == 'watchdog/prelaunch-audit-78-2026-08-22' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply statewide Chapter 123 and evidence-only appreciation fixes
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          if git log -1 --pretty=%B | grep -q '\[audit78-applied\]'; then
            echo 'Audit 7-8 remediation already applied.'
            exit 0
          fi
          python - <<'PY'
          from pathlib import Path

          p = Path('property/js/lookup.js')
          s = p.read_text()

          def once(old, new, label):
              global s
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {n}')
              s = s.replace(old, new, 1)

          once(
              "  var DEFAULT_APPRECIATION = 0.05;   // only used when sales cannot tell us\n  var liveRatioCache = {};",
              "  // No assumed appreciation rate. If verified sales cannot measure a trend,\n  // Watchdog applies no time-growth adjustment and labels the evidence gap.\n  var liveRatioCache = {};",
              'remove default appreciation constant'
          )
          once(
              "    if (np >= 2) { appr = d / np; apprMeasured = true; }\n    else { appr = DEFAULT_APPRECIATION; }",
              "    if (np >= 2) { appr = d / np; apprMeasured = true; }\n    else { appr = 0; }",
              'ratio rows sparse fallback'
          )
          once(
              "      appr = DEFAULT_APPRECIATION; apprMeasured = false;",
              "      appr = 0; apprMeasured = false;",
              'thin negative fallback'
          )
          once(
              "  var officialRatios = null;\n  var revaluationTable = null;",
              "  var officialRatios = null;\n  var chapter123DistrictCache = Object.create(null);\n  var revaluationTable = null;",
              'chapter123 cache'
          )
          marker = "  // Look up the published ratio for this town, newest year available.\n  function officialRatio(town, county) {"
          insert = """  // Primary statutory ratio source: the deployed statewide Chapter 123 provider.\n  // It parses and validates the official 2026 NJ Treasury certification for all\n  // 564 taxing districts, keyed by the first four digits of PAMS_PIN.\n  function certifiedChapter123Ratio(record) {\n    var code = districtCode(record);\n    if (!code) return Promise.resolve(null);\n    if (chapter123DistrictCache[code]) return Promise.resolve(chapter123DistrictCache[code]);\n    var url = LEDGER_URL.replace(/\\/+$/, '') + '/functions/v1/chapter123-provider?district=' + encodeURIComponent(code);\n    return xfetch(url, 9000)\n      .then(function (r) { return r.ok ? r.json() : null; })\n      .then(function (j) {\n        var row = j && j.data;\n        var pct = row && +row.ratio;\n        if (!pct || pct <= 0 || pct > 200) return null;\n        var out = {\n          ratio: pct / 100,\n          lower: row.lower != null ? +row.lower / 100 : null,\n          upper: row.upper != null ? Math.min(+row.upper / 100, 1) : null,\n          year: +(j.tax_year || 2026), source: 'official',\n          district: code, municipality: row.municipality || '', county: row.county || '',\n          providerVersion: j.provider_version || 'chapter123-provider',\n          sourceId: j.source_id || 'nj-division-taxation-ch123-2026',\n          sourceUrl: j.source_url || ''\n        };\n        chapter123DistrictCache[code] = out;\n        return out;\n      })\n      .catch(function () { return null; });\n  }\n\n""" + marker
          once(marker, insert, 'certified provider insertion')
          once(
              "    var localD = localDrift(comps, thisYear, R.ratio);\n    var drift = (apprHint != null) ? apprHint\n              : (localD != null && Math.abs(localD) > 0.015) ? localD\n              : DEFAULT_APPRECIATION;",
              "    var localD = localDrift(comps, thisYear, R.ratio);\n    var localTrendMeasured = localD != null && Math.abs(localD) > 0.015;\n    var drift = (apprHint != null) ? apprHint\n              : localTrendMeasured ? localD\n              : 0;\n    var appreciationSource = (apprHint != null) ? 'verified-sr1a-trend'\n                           : localTrendMeasured ? 'nearby-recorded-sales'\n                           : 'none';",
              'valuation appreciation precedence'
          )
          once(
              "      appreciation: (R.appreciation != null ? R.appreciation : drift),\n      apprMeasured: !!R.apprMeasured, medSaleAge: R.medSaleAge || null,",
              "      appreciation: (R.appreciation != null && R.apprMeasured ? R.appreciation : drift),\n      appreciationSource: (R.appreciation != null && R.apprMeasured) ? 'live-ratio-sales' : appreciationSource,\n      apprMeasured: !!R.apprMeasured || appreciationSource !== 'none', medSaleAge: R.medSaleAge || null,",
              'valuation appreciation provenance'
          )
          once(
              "    var appr = (v && v.appreciation != null) ? v.appreciation : 0.05;",
              "    var appr = (v && v.appreciation != null) ? v.appreciation : 0;",
              'appeal sale carry fallback'
          )
          once(
              "        label: 'State-verified sale of ' + money(verifiedSale) + ' in ' + verifiedSaleYear +\n     ', carried forward ' + yrs + ' years at ' + (appr * 100).toFixed(1) + '% a year' });",
              "        label: 'State-verified sale of ' + money(verifiedSale) + ' in ' + verifiedSaleYear +\n          (Math.abs(appr) > 0.0001\n            ? ', carried forward ' + yrs + ' years at the measured ' + (appr * 100).toFixed(1) + '% annual trend'\n            : ', with no appreciation adjustment because no defensible market trend was available') });",
              'appeal evidence label'
          )
          once(
              "    var official = officialRatio(current.town, current.county);",
              "    var official = current.certifiedRatio || officialRatio(current.town, current.county);",
              'appeal certified ratio precedence'
          )
          once(
              "        '<div><b>Sale price appreciation applied</b>: ' +\n          (val && val.appreciation != null\n            ? (val.appreciation * 100).toFixed(2) + '%/yr ' + (val.apprMeasured ? '(measured from this town)' : '(DEFAULT, town too sparse to measure)') +\n              ', median sale age ' + (val.medSaleAge != null ? val.medSaleAge.toFixed(2) + ' yrs' : '?')\n            : 'n/a') + '</div>' +",
              "        '<div><b>Sale price appreciation applied</b>: ' +\n          (val && val.appreciation != null\n            ? (val.appreciation * 100).toFixed(2) + '%/yr (' + esc(val.appreciationSource || 'none') + ')' +\n              (val.appreciationSource === 'none' ? ' — no trend adjustment because evidence was insufficient' : '') +\n              ', median sale age ' + (val.medSaleAge != null ? val.medSaleAge.toFixed(2) + ' yrs' : '?')\n            : 'n/a') + '</div>' +",
              'diagnostic appreciation wording'
          )
          once(
              "    var offR = officialRatio(current.town, current.county);",
              "    var staticOffR = officialRatio(current.town, current.county);",
              'render static fallback rename'
          )
          once(
              "      gatherComps(geo.lat, geo.lon, current.town),\n      verifiedComps(p, subject),\n      subjectFromSR1A(p)\n    ]).then(function (res) {\n      var comps = res[0] || [], verified = res[1] || [], own = res[2];",
              "      gatherComps(geo.lat, geo.lon, current.town),\n      verifiedComps(p, subject),\n      subjectFromSR1A(p),\n      certifiedChapter123Ratio(p)\n    ]).then(function (res) {\n      var comps = res[0] || [], verified = res[1] || [], own = res[2], certified = res[3] || null;\n      current.certifiedRatio = certified;\n      var offR = certified || staticOffR;",
              'render provider fetch'
          )
          once(
              "      ratio: R.ratio, ratioLower: R.lower, ratioUpper: R.upper,\n      ratioYear: R.year, ratioSource: R.source,",
              "      ratio: R.ratio, ratioLower: R.lower, ratioUpper: R.upper,\n      ratioYear: R.year, ratioSource: R.source, ratioDistrict: R.district || null,\n      ratioProviderVersion: R.providerVersion || null, ratioSourceId: R.sourceId || null,",
              'valuation provider provenance'
          )

          if 'DEFAULT_APPRECIATION' in s:
              raise SystemExit('stale DEFAULT_APPRECIATION remains')
          if "?district=' + encodeURIComponent(code)" not in s:
              raise SystemExit('statewide district provider wiring missing')
          if "current.certifiedRatio = certified" not in s:
              raise SystemExit('certified ratio is not persisted on current lookup')
          p.write_text(s)
          PY

          cat > property/tests/prelaunch-audit-78-contract.mjs <<'JS'
          #!/usr/bin/env node
          import fs from 'node:fs';
          const s = fs.readFileSync('property/js/lookup.js', 'utf8');
          const failures = [];
          const ok = (x, m) => { if (!x) failures.push(m); };
          ok(s.includes("'/functions/v1/chapter123-provider?district=' + encodeURIComponent(code)"), 'Lookup must use statewide Chapter 123 provider by district code.');
          ok(s.includes('current.certifiedRatio = certified'), 'Lookup must retain certified district ratio for statutory appeal screen.');
          ok(s.includes('current.certifiedRatio || officialRatio'), 'Appeal screen must prefer statewide certified ratio over legacy static lookup.');
          ok(s.includes("providerVersion: j.provider_version"), 'Provider provenance must be retained.');
          ok(!s.includes('DEFAULT_APPRECIATION'), 'No hardcoded default appreciation constant may remain.');
          ok(!s.includes(': 0.05;\n    var thisYear'), 'Appeal sale carry must not default to 5 percent.');
          ok(s.includes("appreciationSource = (apprHint != null) ? 'verified-sr1a-trend'"), 'Appreciation must expose measured-source provenance.');
          ok(s.includes("appreciationSource === 'none' ? ' — no trend adjustment because evidence was insufficient'"), 'Diagnostics must disclose no-evidence neutral fallback.');
          if (failures.length) { console.error(JSON.stringify({passed:false, failures}, null, 2)); process.exit(1); }
          console.log(JSON.stringify({passed:true, contract:'prelaunch-audit-7-8', checks:8}, null, 2));
          JS

          node --check property/js/lookup.js
          node property/tests/prelaunch-audit-78-contract.mjs
          git diff --check
          git config user.name 'Watchdog Launch Audit'
          git config user.email 'actions@users.noreply.github.com'
          git add property/js/lookup.js property/tests/prelaunch-audit-78-contract.mjs
          git commit -m '[audit78-applied] Wire statewide Chapter 123 and remove assumed appreciation'
          git push origin HEAD:${TARGET_BRANCH}
