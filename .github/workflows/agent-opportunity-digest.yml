name: Agent Opportunity weekly digest

on:
  # Hourly scheduling is intentionally paused until the required repository
  # secrets are configured and a manual dispatch succeeds. Keeping the broken
  # cron active creates 24 false failures per day and hides meaningful CI noise.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate digest configuration
        env:
          DIGEST_URL: ${{ secrets.SUPABASE_AGENT_DIGEST_URL }}
          DIGEST_SECRET: ${{ secrets.AGENT_DIGEST_CRON_SECRET }}
        run: |
          if [ -z "$DIGEST_URL" ] || [ -z "$DIGEST_SECRET" ]; then
            echo "Agent digest is not configured: add SUPABASE_AGENT_DIGEST_URL and AGENT_DIGEST_CRON_SECRET before re-enabling the schedule."
            exit 1
          fi
      - name: Request due digests
        env:
          DIGEST_URL: ${{ secrets.SUPABASE_AGENT_DIGEST_URL }}
          DIGEST_SECRET: ${{ secrets.AGENT_DIGEST_CRON_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-all-errors \
            -X POST "$DIGEST_URL" \
            -H "x-watchdog-cron-secret: $DIGEST_SECRET" \
            -H "content-type: application/json" \
            --data '{}'
