name: Agent Opportunity weekly digest

on:
  schedule:
    # Edge Function checks each user's weekday, local hour and last-send time.
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request due digests
        env:
          DIGEST_URL: ${{ secrets.SUPABASE_AGENT_DIGEST_URL }}
          DIGEST_SECRET: ${{ secrets.AGENT_DIGEST_CRON_SECRET }}
        run: |
          test -n "$DIGEST_URL" && test -n "$DIGEST_SECRET"
          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-all-errors \
            -X POST "$DIGEST_URL" \
            -H "x-watchdog-cron-secret: $DIGEST_SECRET" \
            -H "content-type: application/json" \
            --data '{}'
