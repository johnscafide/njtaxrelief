name: NJW-258 lookup resolution v2

on:
  push:
    branches:
      - fix/njw-258-lookup-resolution-v2

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply bounded lookup stabilization patch
        run: python .github/scripts/njw258_lookup_resolution_v2.py
      - name: Verify JavaScript syntax
        run: |
          node --check property/js/lookup.js
          node --check api/watchdog-index-page-contact-safe.js
      - name: Verify lookup contracts
        run: |
          node property/tests/property-lookup-performance-contract.mjs
          node property/tests/property-parcel-fallback-contract.mjs
          node property/tests/property-public-runtime-integrity-contract.mjs
      - name: Verify diff integrity
        run: git diff --check
      - name: Commit intended source changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add property/js/lookup.js property/index.html property/css/lookup/01-search-hero.css api/watchdog-index-page-contact-safe.js vercel.json property/tests/property-parcel-fallback-contract.mjs property/tests/property-public-runtime-integrity-contract.mjs
          git commit -m "NJW-258 harden property identity and public lookup runtime"
          git push origin HEAD:fix/njw-258-lookup-resolution-v2
