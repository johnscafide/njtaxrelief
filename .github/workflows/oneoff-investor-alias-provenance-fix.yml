name: One-off Investor alias provenance fix
on:
  push:
    paths:
      - '.github/workflows/oneoff-investor-alias-provenance-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch derived-to-derived source alias metadata
        run: |
          node <<'NODE'
          const fs=require('fs');
          const path='supabase/functions/workbench-derived/index.ts';
          let lines=fs.readFileSync(path,'utf8').split('\n');
          let availableCount=0, missingCount=0;
          lines=lines.map(line=>{
            if(line.includes("const depMeta: any = rawMeta[dep] || {};") && line.includes("auxMeta.set(id")){
              availableCount++;
              return line.replace("const depMeta: any = rawMeta[dep] || {};", "const depMeta: any = defMap.has(dep) ? { provider_kind: 'derived_governed', source: 'Watchdog governed formula registry · ' + ENGINE_VERSION, observed_at: now, checked_at: null } : (rawMeta[dep] || {});");
            }
            if(line.includes("sourceAlias = operation === 'source_alias'") && line.includes("aliasDep = String(def.config?.dep || '')") && line.includes("rawMeta[aliasDep]")){
              missingCount++;
              return line.replace("aliasMeta: any = aliasDep ? (rawMeta[aliasDep] || {}) : {}", "aliasMeta: any = aliasDep ? (defMap.has(aliasDep) ? { provider_kind: 'derived_governed', source: 'Watchdog governed formula registry · ' + ENGINE_VERSION } : (rawMeta[aliasDep] || {})) : {}");
            }
            return line;
          });
          if(availableCount!==1)throw new Error('Expected one available source_alias metadata line, got '+availableCount);
          if(missingCount!==1)throw new Error('Expected one missing source_alias metadata line, got '+missingCount);
          const out=lines.join('\n');
          if(!out.includes("defMap.has(dep) ? { provider_kind: 'derived_governed'"))throw new Error('available-path provenance patch missing');
          if(!out.includes("defMap.has(aliasDep) ? { provider_kind: 'derived_governed'"))throw new Error('missing-path provenance patch missing');
          fs.writeFileSync(path,out);
          NODE
      - name: Refetch main and commit only if safe
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || { echo 'main moved; refusing overwrite'; exit 2; }
          git config user.name 'Watchdog Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add supabase/functions/workbench-derived/index.ts
          git commit -m 'NJW-144 preserve derived alias provenance'
          git push origin HEAD:main
