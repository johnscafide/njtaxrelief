name: One-off Investor alias provenance fix
on:
  push:
    paths:
      - '.github/workflows/oneoff-investor-alias-provenance-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch derived-to-derived source alias metadata
        run: |
          node <<'NODE'
          const fs=require('fs');
          const path='supabase/functions/workbench-derived/index.ts';
          let s=fs.readFileSync(path,'utf8');
          const available=/const depMeta: any = rawMeta\[dep\] \|\| \{\};/;
          const missing=/const aliasMeta: any = aliasDep \?[^\n]+/;
          const m1=s.match(available),m2=s.match(missing);
          if(!m1)throw new Error('available-path source_alias metadata target not found');
          if(!m2||!m2[0].includes('rawMeta[aliasDep]'))throw new Error('missing-path source_alias metadata target not found');
          s=s.replace(available,"const depMeta: any = defMap.has(dep) ? { provider_kind: 'derived_governed', source: 'Watchdog governed formula registry · ' + ENGINE_VERSION, observed_at: now, checked_at: null } : (rawMeta[dep] || {});");
          s=s.replace(missing,"const aliasMeta: any = aliasDep ? (defMap.has(aliasDep) ? { provider_kind: 'derived_governed', source: 'Watchdog governed formula registry · ' + ENGINE_VERSION } : (rawMeta[aliasDep] || {})) : {};");
          if(!s.includes("defMap.has(dep) ? { provider_kind: 'derived_governed'"))throw new Error('available-path provenance patch missing');
          if(!s.includes("defMap.has(aliasDep) ? { provider_kind: 'derived_governed'"))throw new Error('missing-path provenance patch missing');
          fs.writeFileSync(path,s);
          NODE
      - name: Refetch main and commit only if safe
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || { echo 'main moved; refusing overwrite'; exit 2; }
          git config user.name 'Watchdog Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add supabase/functions/workbench-derived/index.ts
          git commit -m 'NJW-144 preserve derived alias provenance'
          git push origin HEAD:main
