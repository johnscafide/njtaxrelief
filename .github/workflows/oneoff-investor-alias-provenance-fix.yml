name: One-off Investor Screen inventory cleanup
on:
  push:
    paths:
      - '.github/workflows/oneoff-investor-alias-provenance-fix.yml'
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Start from current main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Reconcile production fingerprints and remove this workflow
        run: |
          node <<'NODE'
          const fs=require('fs');
          const path='supabase/functions/PRODUCTION-INVENTORY.json';
          const inv=JSON.parse(fs.readFileSync(path,'utf8'));
          inv.captured_at=new Date().toISOString();
          inv.functions=inv.functions||{};
          inv.functions['provider-release-canary']={...(inv.functions['provider-release-canary']||{}),version:39,sha256:'354ac1a562a3159ee631ad6cbd6e71a2fc31fbe3e2b84de4f724bdfe472e4ac6',verify_jwt:false,tracking:'source_snapshot'};
          inv.functions['workbench-derived']={...(inv.functions['workbench-derived']||{}),version:32,sha256:'699622473aa01470fd99bfa54188c4fccaa49bfea7db0629ed6e28da8ae961eb',verify_jwt:false,tracking:'source_snapshot'};
          fs.writeFileSync(path,JSON.stringify(inv,null,2)+'\n');
          fs.rmSync('.github/workflows/oneoff-investor-alias-provenance-fix.yml');
          NODE
      - name: Refetch main and commit only if safe
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || { echo 'main moved during inventory reconciliation; refusing overwrite'; exit 2; }
          git config user.name 'Watchdog Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add supabase/functions/PRODUCTION-INVENTORY.json .github/workflows/oneoff-investor-alias-provenance-fix.yml
          git commit -m 'NJW-144 record Investor Screen production release'
          git push origin HEAD:main
