name: NJW-202 apply property landing review

on:
  push:
    branches:
      - agent/njw-202-property-landing-review
    paths:
      - scripts/njw_202_patch_property_landing_v5.py
      - .github/workflows/njw-202-property-landing-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/njw-202-property-landing-review
          fetch-depth: 0
      - name: Apply durable deadline fallback
        run: python scripts/njw_202_patch_property_landing_v5.py
      - name: Verify expected landing changes
        run: |
          grep -q '<b>564</b><span>Municipalities</span>' property/index.html
          grep -q 'Where does this property tax data come from?' property/index.html
          grep -q 'class="lp-proof-strip"' property/index.html
          grep -q "we'll show you what it's worth in dollars" property/index.html
          grep -q '<b id="ins-days">Apr 1</b><span>General appeal deadline</span>' property/index.html
          ! grep -q 'south-jersey-weekend-events-august-15-16-2026.html' property/index.html
      - name: Commit patched source
        run: |
          if git diff --quiet; then
            echo "No source changes required"
            exit 0
          fi
          git config user.name "Watchdog Build"
          git config user.email "actions@users.noreply.github.com"
          git add property/index.html
          git commit -m "NJW-202 make appeal fallback durable"
          git push origin HEAD:agent/njw-202-property-landing-review
