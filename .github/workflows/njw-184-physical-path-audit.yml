name: NJW-184 physical path audit

on:
  push:
    branches:
      - agent/njw-184-zero-relative-routes

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find non-URL flat physical path references
        shell: python
        run: |
          from pathlib import Path
          import re
          routes=['agent-desk','data-center','data-workbench','developer-data','diagnostics','farm-builder','farm-map','market-list','marketing-plan','report-builder','report-studio','scan','tools','updates','verification-diagnostics','workbench']
          patterns={r:re.compile(r'(?<!/)property/'+re.escape(r)+r'\.html') for r in routes}
          skip_prefixes=('.git/','property/property/','property/towns/','towns/')
          hits=[]
          for p in Path('.').rglob('*'):
              if not p.is_file(): continue
              rel=p.as_posix().removeprefix('./')
              if rel.startswith(skip_prefixes): continue
              try: text=p.read_text(encoding='utf-8')
              except (UnicodeDecodeError,OSError): continue
              for r,rx in patterns.items():
                  for m in rx.finditer(text):
                      line=text.count('\n',0,m.start())+1
                      hits.append((r,rel,line))
          for r,path,line in sorted(hits): print(f'PHYSICAL|{r}|{path}|{line}')
          print(f'NJW184_PHYSICAL_HITS={len(hits)}')
          print(f'NJW184_PHYSICAL_FILES={len(set(path for _,path,_ in hits))}')
