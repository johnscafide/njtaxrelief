name: Transaction MOD-IV evidence

on:
  push:
    branches: [main]
    paths:
      - property/scripts/build_transaction_modiv_snapshot.py
      - supabase/migrations/20260915182500_transaction_live_evidence_warehouse.sql
      - .github/workflows/transaction-modiv-evidence.yml
  schedule:
    - cron: '37 10 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: transaction-modiv-evidence
  cancel-in-progress: false

jobs:
  build-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source client
        run: python -m pip install --disable-pip-version-check requests
      - name: Compile builder
        run: python -m py_compile property/scripts/build_transaction_modiv_snapshot.py
      - name: Build, validate and publish current transaction evidence
        env:
          SUPABASE_URL: https://uvkvaxljhhngydvlrzom.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: >-
          python property/scripts/build_transaction_modiv_snapshot.py
          --publish
          --release-id treasury-modiv-2026-transaction-v1
          --diagnostic "$RUNNER_TEMP/transaction-modiv-build-summary.json"
      - name: Upload build diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transaction-modiv-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/transaction-modiv-build-summary.json
          retention-days: 30
          if-no-files-found: warn
