name: Data Center v036 catalog

on:
  push:
    branches: [main]
    paths:
      - property/data/nj-source-pack-v036.json
      - property/scripts/apply_source_pack_v036.py
      - .github/workflows/data-center-v036-catalog.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply governed v036 catalog extension
        run: python property/scripts/apply_source_pack_v036.py
      - name: Commit Data Center catalog
        run: |
          git config user.name "Watchdog Data Center Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -- property/data/marker-registry.json
          if git diff --cached --quiet; then
            echo "No Data Center catalog changes"
          else
            git commit -m "[data-center] Apply governed v036 marker catalog"
            git push origin HEAD:main
          fi
