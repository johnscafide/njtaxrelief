name: One-off NJW-291 release bookkeeping
on:
  push:
    paths:
      - '.github/workflows/oneoff-njw291-release-bookkeeping.yml'
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Record production status and fingerprints
        run: |
          node <<'NODE'
          const fs=require('fs');
          const now=new Date().toISOString();
          const overlayPath='property/data/db-governed-provider-overlay.json';
          const overlay=JSON.parse(fs.readFileSync(overlayPath,'utf8'));
          overlay.captured_at=now;
          overlay.statuses=overlay.statuses||{};
          for(const id of ['uniformity.percentile','watchdog.chapter123_position','watchdog.njplus.assessment_component_shift'])overlay.statuses[id]='live';
          fs.writeFileSync(overlayPath,JSON.stringify(overlay,null,2)+'\n');

          const invPath='supabase/functions/PRODUCTION-INVENTORY.json';
          const inv=JSON.parse(fs.readFileSync(invPath,'utf8'));
          inv.captured_at=now;
          inv.functions=inv.functions||{};
          Object.assign(inv.functions,{
            'sr1a-subject-indexer':{version:9,sha256:'507eea3392b045c994d5dca82cfb38ba22d61bca7ee3701104f2b8668d272277',verify_jwt:false,tracking:'source_snapshot'},
            'workbench-hydrate':{version:74,sha256:'30b73e271e66faf19f3f9d35960f99b500b9cd038c4c75897c7bcaca26da7a4a',verify_jwt:true,tracking:'source_snapshot'},
            'workbench-derived':{version:34,sha256:'94a1363b92b59c2aa3c35afb69afa19344ac3e5b48bf1bb9bdf05dcbbdf63ad4',verify_jwt:false,tracking:'source_snapshot'},
            'provider-release-canary':{version:41,sha256:'fcfdda5266d1498690f4dc64a8feea67808893c6cd24fdd7753a2104828ec025',verify_jwt:false,tracking:'source_snapshot'}
          });
          fs.writeFileSync(invPath,JSON.stringify(inv,null,2)+'\n');
          NODE
      - name: Rebuild canonical derived governance
        run: node scripts/build-derived-governance.js
      - name: Verify release bookkeeping
        run: |
          node <<'NODE'
          const r=require('./property/data/marker-registry.json');
          const g=require('./property/data/derived-marker-governance.json');
          const inv=require('./supabase/functions/PRODUCTION-INVENTORY.json');
          const byId=new Map((r.markers||[]).map(x=>[x.id,x]));
          const target=['uniformity.percentile','watchdog.chapter123_position','watchdog.njplus.assessment_component_shift'];
          for(const id of target){if(byId.get(id)?.provider_status!=='live')throw new Error(id+' registry status is not live');}
          const governed=new Set(g.governed_live_ids||[]);
          for(const id of target){if(!governed.has(id))throw new Error(id+' is absent from governed_live_ids');}
          const expected={
            'sr1a-subject-indexer':[9,'507eea3392b045c994d5dca82cfb38ba22d61bca7ee3701104f2b8668d272277'],
            'workbench-hydrate':[74,'30b73e271e66faf19f3f9d35960f99b500b9cd038c4c75897c7bcaca26da7a4a'],
            'workbench-derived':[34,'94a1363b92b59c2aa3c35afb69afa19344ac3e5b48bf1bb9bdf05dcbbdf63ad4'],
            'provider-release-canary':[41,'fcfdda5266d1498690f4dc64a8feea67808893c6cd24fdd7753a2104828ec025']
          };
          for(const [name,[version,sha]] of Object.entries(expected)){const row=inv.functions?.[name];if(Number(row?.version)!==version||row?.sha256!==sha)throw new Error(name+' inventory mismatch');}
          console.log({provider_status:r.summary?.provider_status,governance:g.summary});
          NODE
      - name: Refetch main and commit only if safe
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" || { echo 'main moved; refusing overwrite'; exit 2; }
          git config user.name 'Watchdog Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add property/data/db-governed-provider-overlay.json property/data/marker-registry.json property/data/derived-marker-governance.json supabase/functions/PRODUCTION-INVENTORY.json
          git diff --cached --quiet && { echo 'No changes to commit'; exit 0; }
          git commit -m '[phase5-governance] NJW-291 record production release'
          git push origin HEAD:main
