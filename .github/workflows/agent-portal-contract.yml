name: Agent portal contract

on:
  push:
    branches: [main]
    paths:
      - 'property/agent/index.html'
      - 'property/tests/agent-portal-contract.mjs'
      - 'supabase/migrations/*agent_portal*'
      - '.github/workflows/agent-portal-contract.yml'
  pull_request:
    paths:
      - 'property/agent/index.html'
      - 'property/tests/agent-portal-contract.mjs'
      - 'supabase/migrations/*agent_portal*'
      - '.github/workflows/agent-portal-contract.yml'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify agent portal contract
        run: node property/tests/agent-portal-contract.mjs
