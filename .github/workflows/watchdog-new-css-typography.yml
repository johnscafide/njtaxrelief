name: Watchdog new CSS typography

on:
  pull_request:
    paths:
      - 'property/css/**/*.css'
      - '.github/workflows/watchdog-new-css-typography.yml'
  push:
    branches: [main]
    paths:
      - 'property/css/**/*.css'
      - '.github/workflows/watchdog-new-css-typography.yml'

permissions:
  contents: read

jobs:
  added-css-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Reject new raw microtype and retired UI font
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
            base="origin/${{ github.base_ref }}"
          else
            before="${{ github.event.before }}"
            if [[ "$before" == "0000000000000000000000000000000000000000" ]]; then
              base="HEAD^"
            else
              base="$before"
            fi
          fi

          git diff --unified=0 "$base" "${{ github.sha }}" -- 'property/css/**/*.css' \
            | python3 -c '
import re, sys

bad = []
path = None
for raw in sys.stdin:
    line = raw.rstrip("\n")
    if line.startswith("+++ b/"):
        path = line[6:]
        continue
    if not line.startswith("+") or line.startswith("+++"):
        continue
    added = line[1:]
    for match in re.finditer(r"font-size\s*:\s*([0-9]+(?:\.[0-9]+)?)px", added, re.I):
        if float(match.group(1)) < 12:
            bad.append(f"{path}: added font-size below 12px: {match.group(0)}")
    if re.search(r"font\s*:[^;]*(?:^|\s)([0-9]+(?:\.[0-9]+)?)px(?:/|\s)", added, re.I):
        size = float(re.search(r"font\s*:[^;]*(?:^|\s)([0-9]+(?:\.[0-9]+)?)px(?:/|\s)", added, re.I).group(1))
        if size < 12:
            bad.append(f"{path}: added font shorthand below 12px: {added.strip()}")
    if "Source Sans 3" in added:
        bad.append(f"{path}: added retired UI font Source Sans 3")

if bad:
    print("Watchdog new-CSS typography contract failed:")
    for item in bad:
        print(f" - {item}")
    sys.exit(1)
print("Watchdog new-CSS typography contract passed: no new sub-12px text or Source Sans 3 additions.")
'
