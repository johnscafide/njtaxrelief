name: Watchdog new CSS typography

on:
  pull_request:
    paths:
      - 'property/css/**/*.css'
      - '.github/workflows/watchdog-new-css-typography.yml'
  push:
    branches: [main]
    paths:
      - 'property/css/**/*.css'
      - '.github/workflows/watchdog-new-css-typography.yml'

permissions:
  contents: read

jobs:
  added-css-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Reject new raw microtype and retired UI font
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            git fetch --no-tags --depth=1 origin "$GITHUB_BASE_REF"
            base="origin/$GITHUB_BASE_REF"
          else
            base="${{ github.event.before }}"
            if [[ -z "$base" || "$base" == "0000000000000000000000000000000000000000" ]]; then
              base="HEAD^"
            fi
          fi

          git diff --unified=0 "$base" "$GITHUB_SHA" -- 'property/css/**/*.css' > /tmp/watchdog-css.diff
          grep '^+' /tmp/watchdog-css.diff | grep -v '^+++' > /tmp/watchdog-css-added.txt || true

          failed=0
          micro='([0-9](\.[0-9]+)?|1[01](\.[0-9]+)?)px'
          if grep -Ein "font-size[[:space:]]*:[[:space:]]*$micro" /tmp/watchdog-css-added.txt; then
            echo 'New CSS must not add font-size values below the 12px readability floor.'
            failed=1
          fi
          if grep -Ein "font[[:space:]]*:[^;]*[[:space:]]$micro([/[:space:]]|$)" /tmp/watchdog-css-added.txt; then
            echo 'New CSS must not add font shorthand values below the 12px readability floor.'
            failed=1
          fi
          if grep -Fin 'Source Sans 3' /tmp/watchdog-css-added.txt; then
            echo 'New CSS must use the canonical Watchdog UI font token, not Source Sans 3.'
            failed=1
          fi

          if [[ "$failed" -ne 0 ]]; then
            exit 1
          fi
          echo 'Watchdog new-CSS typography contract passed: no new sub-12px text or Source Sans 3 additions.'
