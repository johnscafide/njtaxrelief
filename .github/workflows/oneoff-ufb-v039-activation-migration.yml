name: One-off UFB v0.39 activation migration
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-ufb-v039-activation-migration.yml'
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Generate certified activation migration
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const pack=JSON.parse(fs.readFileSync('property/data/nj-source-pack-v039.json','utf8'));
          const markers=pack.markers||[];
          if(markers.length!==179)throw new Error(`Expected 179 UFB markers, got ${markers.length}`);
          const q=v=>`'${String(v??'').replace(/'/g,"''")}'`;
          const ids=new Set();
          const rows=markers.map(m=>{
            const id=String(m.id||m.marker_id||'');
            if(!id.startsWith('njplus.nj-dca-ufb-2025.'))throw new Error(`Unexpected marker id ${id}`);
            if(ids.has(id))throw new Error(`Duplicate marker ${id}`);ids.add(id);
            const sf=String(m.source_field||'');if(!sf)throw new Error(`Missing source_field ${id}`);
            return `  (${q(id)},array['municipality']::text[],'workbench-hydrate','live',array['nj-dca-user-friendly-budget','nj-dca-ufb-2025-2025-10-23-v1']::text[],now(),${q('Authenticated production canary ufb_v039 request 4120 certified exact 2025 Summary value/provenance/quality semantics. NJ DCA states UFB submissions are self-reported and unaudited.')},'authoritative_reference',array[${q(sf)}]::text[],null,21600,'refresh_on_demand',true)`;
          });
          const sql=`-- NJW-143: certify the bounded NJ DCA User Friendly Budget v0.39 batch.\n-- Production canary ufb_v039 request 4120: HTTP 200, assertion_ok=true, mismatches=[].\n-- All 179 markers are exact 2025 Summary source fields; no Watchdog qualitative score or legal/fiscal determination is created here.\n\ninsert into public.dca_source_registry\n  (source_id,source_status,source_url,source_vintage,geography_scope,join_strategy,refresh_cadence,authoritative,last_checked_at,notes)\nvalues\n  ('nj-dca-user-friendly-budget','live','https://nj.gov/dca/dlgs/programs/mc_budget_docs/UFB%20Database%20-%20FINAL.xlsm',\n   '2025 User Friendly Budget Database; source release nj-dca-ufb-2025-2025-10-23-v1; SHA-256 79a59be4c4ab2669d60ebb8072aab5a5775df7025e66cb95a887e1c39ed8ccaa',\n   'municipality','4-digit municipality code -> governed 564-municipality 2025 Summary artifact','annual / source change monitored',true,now(),\n   'Official NJ DCA compilation of municipal User Friendly Budget submissions. DCA states the data are self-reported by municipalities and have not been independently audited or verified. Missing submissions and blank/obvious-error cells may have no data. v0.39 exposes exact source fields only.')\non conflict (source_id) do update set\n  source_status=excluded.source_status,source_url=excluded.source_url,source_vintage=excluded.source_vintage,\n  geography_scope=excluded.geography_scope,join_strategy=excluded.join_strategy,refresh_cadence=excluded.refresh_cadence,\n  authoritative=excluded.authoritative,last_checked_at=excluded.last_checked_at,notes=excluded.notes;\n\ninsert into public.data_center_provider_coverage\n  (marker_id,scopes,provider_key,value_status,source_keys,last_verified_at,notes,provider_kind,source_fields,calculation_key,freshness_seconds,cache_policy,bulk_capable)\nvalues\n${rows.join(',\n')}\non conflict (marker_id) do update set\n  scopes=excluded.scopes,provider_key=excluded.provider_key,value_status=excluded.value_status,source_keys=excluded.source_keys,\n  last_verified_at=excluded.last_verified_at,notes=excluded.notes,provider_kind=excluded.provider_kind,source_fields=excluded.source_fields,\n  calculation_key=excluded.calculation_key,freshness_seconds=excluded.freshness_seconds,cache_policy=excluded.cache_policy,bulk_capable=excluded.bulk_capable;\n`;
          fs.writeFileSync('supabase/migrations/20260828145000_activate_ufb_v039.sql',sql);
          console.log({markers:markers.length,bytes:Buffer.byteLength(sql)});
          NODE
      - name: Commit migration
        run: |
          git config user.name "Watchdog Automation"
          git config user.email "actions@users.noreply.github.com"
          git add supabase/migrations/20260828145000_activate_ufb_v039.sql
          git commit -m "[v039] Add certified UFB provider activation migration"
          git push
