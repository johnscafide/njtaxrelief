name: One-shot close Watchdog sprint initiative seven

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-close-sprint-seven.yml'

permissions:
  contents: write

jobs:
  close-log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconcile latest developer sprint log
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          python3 - <<'PY'
          from pathlib import Path
          p=Path('property/logs/2026-08-18/index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('5 initiatives complete · #3 independent review complete but calibration gates failed · #7 active',
                      '6 initiatives complete · #3 model repair requires a fresh holdout · #8 next')
          s=s.replace('ACTIVE · DAILY INTELLIGENCE RESILIENCE LIVE','COMPLETE · PRODUCTION',1)
          old='<p><b>Remaining #7 work:</b> continue the same performance/loading/empty/error-state audit across Property Home Analyst/Data Graph, Data Workbench and other Intelligence entry surfaces before marking the initiative complete.</p>'
          new='''<ul><li>A shared compact-density layer now keeps supporting-page Intelligence decision-first: one primary recommendation, up to three evidence-backed reasons and one next action, with deeper reasoning behind progressive disclosure. Dedicated Intelligence, Daily Intelligence, Data Center and Scanner workspaces stay immersive because the user explicitly entered an Intelligence task.</li><li>Property Home now uses stable unversioned lazy-module imports with no <code>?v=</code> query parameters, and the legacy fallback/mobile naming has been normalized from Agent Intel to <b>Watchdog Analyst Intel</b>. CI protects both rules.</li><li>Data Workbench now blocks missing, nonnumeric, zero and out-of-New-Jersey FEMA coordinates before any network request, deduplicates identical in-flight flood requests, and retains server-side privacy-safe diagnostics that never log coordinate values, addresses, query strings, auth data or user IDs.</li><li>Production Vercel logs previously showed 261 <code>/api/flood-zone</code> 4xx responses over two hours. After the request-boundary deployment, the first verified 10-minute production window contained <b>zero 4xx requests</b>. The diagnostic remains in place to identify any future non-Workbench caller without exposing property coordinates.</li><li>The flood boundary, compact Intelligence footprint, Home stable-asset rule and current Analyst naming are registered in Access Boundary CI. The latest customer-facing head reached Vercel production successfully.</li></ul><p><b>#7 closure:</b> the primary Intelligence entry surfaces now have explicit loading/recovery behavior and an intentional density hierarchy. Future hourly sweeps should treat new regressions as maintenance rather than reopening this initiative unless the product contract materially changes.</p>'''
          if old in s:
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          Path('.github/workflows/one-shot-close-sprint-seven.yml').unlink()
          PY
          git config user.name 'Watchdog Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add property/logs/2026-08-18/index.html .github/workflows/one-shot-close-sprint-seven.yml
          git commit -m 'Close Watchdog sprint initiative seven'
          git pull --rebase origin main
          git push origin main
