name: NJW-185 Report share inventory refresh

on:
  push:
    branches:
      - agent/njw-185-report-share-clean-route

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/njw-185-report-share-clean-route
          fetch-depth: 0
      - name: Update exactly one deployed fingerprint row
        shell: python
        run: |
          from pathlib import Path
          p=Path('supabase/functions/PRODUCTION-INVENTORY.json')
          s=p.read_text(encoding='utf-8')
          old='    "report-share": {"version": 12, "sha256": "45f86fd7e4e781275a54b8fe768443f1d95a26a2cd7ecedfa3bbf418b897e152", "verify_jwt": false, "tracking": "source_snapshot"},'
          new='    "report-share": {"version": 13, "sha256": "b7bc4f9b345c4fb5486e333b7fa4726be3e524ac2039670ccbd44fea9b249118", "verify_jwt": false, "tracking": "source_snapshot"},'
          if s.count(old)!=1:
              raise SystemExit(f'Expected one old report-share row, found {s.count(old)}')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
      - name: Commit inventory file only
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only)" = "supabase/functions/PRODUCTION-INVENTORY.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/PRODUCTION-INVENTORY.json
          git commit -m "Refresh Report share production fingerprint"
          git push origin HEAD:agent/njw-185-report-share-clean-route
