name: One-off UFB v0.39 governance reconciliation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-ufb-v039-governance.yml'
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Rebase onto current main before snapshot edits
        run: git pull --rebase origin main
      - name: Reconcile UFB production state
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const read=p=>JSON.parse(fs.readFileSync(p,'utf8'));
          const write=(p,v,space=2)=>fs.writeFileSync(p,JSON.stringify(v,null,space)+'\n');
          const now=new Date().toISOString();
          const source='NJ DCA User Friendly Budget Database · 2025 Summary · self-reported/unaudited municipal submissions · nj-dca-ufb-2025-2025-10-23-v1';
          const pack=read('property/data/nj-source-pack-v039.json');
          const ids=(pack.markers||[]).map(m=>String(m.id||m.marker_id||''));
          if(ids.length!==179||new Set(ids).size!==179||ids.some(id=>!id.startsWith('njplus.nj-dca-ufb-2025.')))throw new Error('Unexpected UFB v0.39 marker set');

          const overlay=read('property/data/db-governed-provider-overlay.json');
          overlay.captured_at=now;overlay.statuses=overlay.statuses||{};overlay.providers=overlay.providers||{};
          for(const id of ids){
            overlay.statuses[id]='live';
            overlay.providers[id]={provider_key:'workbench-hydrate',provider_kind:'authoritative_reference',calculation_key:null,source,bulk_capable:true};
          }
          write('property/data/db-governed-provider-overlay.json',overlay);

          const sources=read('property/data/source-registry.json');
          const entry={id:'nj-dca-user-friendly-budget',label:'NJ DCA User Friendly Budget Database 2025',agency:'NJ Department of Community Affairs',source_url:'https://nj.gov/dca/dlgs/programs/mc_budget_docs/UFB%20Database%20-%20FINAL.xlsm',cadence:'annual / source change monitored',live:true,join:'Exact 4-digit municipality code to governed 564-municipality 2025 Summary artifact',warning:'Official NJ DCA compilation of municipal User Friendly Budget submissions. DCA states the data are self-reported by municipalities and have not been independently audited or verified. Missing submissions and blank/obvious-error cells may have no data. Watchdog v0.39 exposes exact source fields only and does not convert them into a legal, fiscal-health, credit, lending, appraisal, insurance, or eligibility determination.'};
          const six=sources.sources||[];const ix=six.findIndex(x=>x.id===entry.id);if(ix>=0)six[ix]=entry;else six.push(entry);sources.sources=six;write('property/data/source-registry.json',sources);

          const inv=read('supabase/functions/PRODUCTION-INVENTORY.json');
          inv.captured_at=now;inv.functions=inv.functions||{};
          inv.functions['workbench-hydrate']={...(inv.functions['workbench-hydrate']||{}),version:67,sha256:'46f2cbd18f262354665f5ee1c37e74b045a679b4f21a298d981a3b81c785d54f',verify_jwt:true,tracking:'source_snapshot'};
          inv.functions['provider-release-canary']={...(inv.functions['provider-release-canary']||{}),version:33,sha256:'3e118a37eefaef460f369b68147cb068d73a293a38d37d85a69e2d05953a4f4e',verify_jwt:false,tracking:'source_snapshot'};
          write('supabase/functions/PRODUCTION-INVENTORY.json',inv);
          NODE
      - name: Rebuild canonical governance
        run: node scripts/build-derived-governance.js
      - name: Stamp certified UFB contract and verify totals
        run: |
          node - <<'NODE'
          const fs=require('fs');const p='property/data/marker-registry.json';const r=JSON.parse(fs.readFileSync(p,'utf8'));const pack=JSON.parse(fs.readFileSync('property/data/nj-source-pack-v039.json','utf8'));
          const ids=new Set((pack.markers||[]).map(m=>String(m.id||m.marker_id||'')));
          for(const m of r.markers||[]){if(ids.has(m.id)){m.provider_status='live';m.provider_note='Authenticated production canary ufb_v039 request 4120 certified exact 2025 Summary value, provenance, workbook hash and DCA source-quality semantics. DCA states UFB submissions are self-reported and unaudited; missing source cells remain missing rather than synthetic zero.';m.provider_contract='workbench-hydrate-v67';}}
          r.schema_version='1+provider-status+v039';
          const countBy=(arr,key)=>{const out={};for(const x of arr){const vals=Array.isArray(x[key])?x[key]:[x[key]||'unknown'];for(const v of vals)out[v]=(out[v]||0)+1}return out};
          const a=r.markers||[];r.summary={total:a.length,public_source:a.filter(m=>!(m.origin==='watchdog-derived'||m.proprietary===true)).length,proprietary_derived:a.filter(m=>m.origin==='watchdog-derived'||m.proprietary===true).length,by_tier:countBy(a,'tier'),by_profession:countBy(a,'professions'),percent_of_goal:Number((a.length/Number(r.target_markers||1000)*100).toFixed(1)),provider_status:countBy(a,'provider_status'),retired_phase5:r.summary?.retired_phase5||0};
          if(a.length!==1000)throw new Error('Expected 1000 canonical markers, got '+a.length);
          if([...ids].some(id=>!a.some(m=>m.id===id&&m.provider_status==='live')))throw new Error('Not all UFB markers are live');
          const c=r.summary.provider_status;if(c.live!==797||c.planned!==187||c.partial!==4||c.unavailable!==12)throw new Error('Unexpected provider totals '+JSON.stringify(c));
          if(r.summary.public_source!==690||r.summary.proprietary_derived!==310||r.summary.percent_of_goal!==100)throw new Error('Unexpected canonical summary '+JSON.stringify(r.summary));
          fs.writeFileSync(p,JSON.stringify(r,null,1)+'\n');console.log(r.summary);
          NODE
      - name: Commit certified snapshots
        run: |
          git config user.name "Watchdog Automation"
          git config user.email "actions@users.noreply.github.com"
          git add property/data/db-governed-provider-overlay.json property/data/marker-registry.json property/data/derived-marker-governance.json property/data/source-registry.json supabase/functions/PRODUCTION-INVENTORY.json
          git commit -m "[v039-governance] Certify 179 NJ DCA UFB markers"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            git rebase --abort || true
            sleep 2
          done
          exit 1
