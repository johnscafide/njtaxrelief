name: One-shot Watchdog source trust evidence refresh

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-refresh-trust-evidence.yml'

permissions:
  contents: write

jobs:
  refresh-trust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refresh source-health evidence on latest main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          set +e
          python3 property/scripts/refresh_state_data.py
          refresh_code=$?
          set -e
          python3 - <<'PY'
          from pathlib import Path
          Path('.github/workflows/one-shot-refresh-trust-evidence.yml').unlink()
          PY
          git config user.name 'Watchdog Trust Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add property/data/data-freshness.json .github/workflows/one-shot-refresh-trust-evidence.yml
          if git diff --cached --quiet; then
            exit "$refresh_code"
          fi
          git commit -m 'Refresh governed source health evidence'
          git pull --rebase origin main
          git push origin main
          echo "Source-health refresh exit code: $refresh_code"
          exit 0
