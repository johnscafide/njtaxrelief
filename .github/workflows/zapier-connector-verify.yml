name: Zapier Connector v1.1 Verify

on:
  push:
    paths:
      - 'integrations/zapier/**'
      - '.github/workflows/zapier-connector-verify.yml'
  pull_request:
    paths:
      - 'integrations/zapier/**'
      - '.github/workflows/zapier-connector-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/zapier
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: integrations/zapier/package.json
      - name: Install pinned connector dependencies
        run: npm install --no-audit --no-fund
      - name: Run connector tests
        run: npm test
      - name: Run Zapier Platform validation
        run: npm run validate
