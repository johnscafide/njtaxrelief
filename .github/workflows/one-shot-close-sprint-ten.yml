name: One-shot close Watchdog sprint initiative ten

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-close-sprint-ten.yml'

permissions:
  contents: write

jobs:
  close-log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Close integration sprint and seed permanent improvement queue
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          python3 - <<'PY'
          import re
          from pathlib import Path
          p=Path('property/logs/2026-08-18/index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'<section class="progress"><b>.*?</b></section>', '<section class="progress"><b>9 production initiatives complete · #3 model repair requires a fresh holdout · permanent hourly improvement loop active</b></section>', s, count=1)
          pattern=r'<article class="item"><header><div class="num">10</div><h2>Integration audit and retention-focused launch improvements</h2><span class="state">.*?</span></header>.*?</article>'
          replacement='''<article class="item"><header><div class="num">10</div><h2>Integration audit and retention-focused launch improvements</h2><span class="state">COMPLETE · PRODUCTION</span></header><p>Watchdog now has a compact return-to-work path that brings entitled users back to governed Daily Intelligence without adding another large AI panel to supporting pages.</p><ul><li>A shared <b>Today</b> navigation cue is available to Pro+, Teams and Developer only. It appears beside the property/watchlist path across Dashboard, Property Home and the modern secondary-page shell.</li><li>The cue computes an owner-visible open-item count from governed <code>intelligence_daily_digests</code> and append-only <code>intelligence_today_events</code>. Reviewed items leave the count, active snoozes stay deferred, expired snoozes return and reopened items become open again.</li><li>The badge uses bounded reads and refreshes when the user returns to the tab/window, making Watchdog feel alive without adding polling-heavy page chrome or a giant recommendation card.</li><li>The Daily Intelligence route now explicitly requires <b>Pro+</b>, matching the runtime behavior that already limited Today triage to Pro+/Teams/Developer.</li><li>Dashboard now loads the privacy-minimized product analytics collector directly. Choosing Today records only <code>surface=navigation</code>, <code>action=open_today</code> and coarse <code>status=open_items|caught_up</code>. Property IDs, digest IDs and model IDs used to compute the badge do not enter product analytics.</li><li>The modern secondary app shell and Property Home load the same Today cue, while the shared compatibility navigation no longer shows the obsolete <b>Agent Intel</b> label; it uses <b>Watchdog Analyst</b> naming.</li><li>A deterministic retention contract verifies untouched/reviewed/snoozed/reopened badge semantics, cross-shell loading, Pro+ gating, privacy-safe return analytics, bounded governed reads and the no-<code>?v=</code> rule. It is registered in Access Boundary CI.</li><li>The exact #10 CI-registration head reached Vercel production <b>READY</b>.</li></ul><p><b>#10 closure:</b> the first 10-initiative sprint is complete for every executable initiative. Initiative #3 remains intentionally open because repaired models require new immutable versions and a fresh independently labeled holdout before promotion; that safety gate is not bypassed.</p></article>'''
          if not re.search(pattern,s,flags=re.S):
              raise SystemExit('Sprint #10 article not found; refusing blind rewrite')
          s=re.sub(pattern,replacement,s,count=1,flags=re.S)
          queue='''<section class="item"><header><div class="num">∞</div><h2>Permanent hourly improvement queue</h2><span class="state">ACTIVE · HOURLY</span></header><p>The autonomous sprint now continues indefinitely. Each run should take the highest-value executable item below, verify current production first, and add new follow-ons only when a concrete product gap is discovered.</p><ul><li><b>Model vNext + fresh holdouts:</b> repair Closing Review and Property Change Priority discrimination under immutable new model versions; generate representative new holdouts and wait for independent labels before promotion.</li><li><b>Degraded-source remediation:</b> restore and validate the current NJ DCA affordable-housing governed artifact; keep the Trust Center degraded until coverage actually passes.</li><li><b>Intelligence usefulness loop:</b> once sufficient aggregate traffic exists, use the developer Intelligence funnel to improve question quality, reasoning-inspection rate, next-action usefulness and return behavior without creating property-level analytics profiles.</li><li><b>Today retention tuning:</b> improve ranking, snooze timing, caught-up states and return cues based on governed outcomes and aggregate behavior, keeping the UI compact.</li><li><b>Professional intent depth:</b> keep improving profession + job-to-be-done reasoning, especially buyer representation, listing farming, investor underwriting, legal/tax review, lending and appraisal workflows.</li><li><b>Source and provider health:</b> continuously audit live services, materialized datasets, semantic coverage, failed providers and stale evidence; never convert missing sources into inferred facts.</li><li><b>Performance / accessibility / mobile:</b> continue browser, error-state, keyboard, focus, reduced-motion, reflow, loading and API-noise sweeps across customer surfaces.</li><li><b>Cross-product integration:</b> keep Watchlist, Analyst, Today, Data Graph, Workbench, Agent Control, reports and actions feeling like one context-preserving system rather than separate tools.</li><li><b>BoldTrail / CRM ingestion:</b> remain ready for a governed server-side adapter once owner-provided API documentation and credentials are available. Do not scrape or invent proprietary listing status in the meantime.</li><li><b>Commercial learning:</b> improve onboarding, activation, upgrade intent, retention and plan-value communication from aggregate product evidence while leaving real-money billing/legal/insurance owner gates separate.</li></ul></section>'''
          anchor='<section class="skip">'
          if 'Permanent hourly improvement queue' not in s and anchor in s:
              s=s.replace(anchor,queue+anchor,1)
          p.write_text(s,encoding='utf-8')
          Path('.github/workflows/one-shot-close-sprint-ten.yml').unlink()
          PY
          git config user.name 'Watchdog Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add property/logs/2026-08-18/index.html .github/workflows/one-shot-close-sprint-ten.yml
          git commit -m 'Close Watchdog sprint initiative ten and seed hourly queue'
          git pull --rebase origin main
          git push origin main
