<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master NJ Tax Heat Map | The Tax Watchdog</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        /* TIGHTENED INTERFACE CSS */
        #map-container { height: 750px; border-radius: 12px; overflow: hidden; border: 2px solid var(--navy); position: relative; margin-top: 20px; }
        #map { height: 100%; background: #f8fafc; }
        
        .map-card { 
            position: absolute; top: 20px; right: 20px; z-index: 1000; 
            width: 300px; background: white; padding: 25px; border-radius: 8px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.2); border-top: 5px solid var(--gold); 
        }

        .legend {
            background: white; padding: 12px; line-height: 18px; color: #333;
            border-radius: 5px; box-shadow: 0 0 15px rgba(0,0,0,0.1);
        }
        .legend i { width: 18px; height: 18px; float: left; margin-right: 8px; opacity: 0.8; }

        /* Status Colors */
        .status-critical { color: #800026; font-weight: 800; }
        .status-high { color: #bd0026; font-weight: 800; }
        .status-mod { color: #e31a1c; font-weight: 800; }
    </style>
</head>
<body>

<nav id="main-nav"></nav>

<div class="hero" style="background: var(--navy-dark); padding: 50px 20px; border-bottom: 5px solid var(--gold);">
    <div class="hero-inner">
        <h1>New Jersey <span>Master Tax Map</span></h1>
        <p>Interactive visualization of all 564 municipalities. Data sourced from the 2025 TEV and 2026 Ratables.</p>
    </div>
</div>

<section class="section">
    <div class="section-inner">
        <div id="map-container">
            <div class="map-card" id="map-info">
                <h2 id="muni-name" style="margin-bottom:10px; color:var(--navy);">Explore NJ</h2>
                <div id="muni-data">Hover over any municipality to see 2026 Effective Tax Rates and Equalization Ratios.</div>
            </div>
            <div id="map"></div>
        </div>
    </div>
</section>

<footer id="main-footer"></footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script src="scripts.js"></script>

<script>
    // COLOR SCALING FOR 564 TOWNS
    function getHeatColor(r) {
        if (!r || r === 0) return '#cbd5e1';
        // Precise 2026 Thresholds
        return r > 3.7 ? '#800026' : // Critical (Top 5% of NJ)
               r > 3.2 ? '#bd0026' : // High
               r > 2.6 ? '#e31a1c' : // Moderate
               r > 2.0 ? '#fc4e2a' : // Low-Moderate
                         '#fed976';  // Target/Low
    }

    // UPDATED HOVER FOR DETAILED INSIGHTS
    function onHover(e) {
        const layer = e.target;
        layer.setStyle({ weight: 3, color: '#d4af37', fillOpacity: 0.9 });
        
        const code = layer.feature.properties.MUN_CODE || layer.feature.properties.SSN;
        const info = masterTaxData[code];
        const dataDiv = document.getElementById('muni-data');

        if (info) {
            document.getElementById('muni-name').innerText = info.name;
            dataDiv.innerHTML = `
                <div class="data-row"><strong>Effective Rate:</strong> <span>${info.effectiveRate}%</span></div>
                <div class="data-row"><strong>State Ratio:</strong> <span>${info.ratio}%</span></div>
                <div class="data-row"><strong>Appeal Status:</strong> <span class="status-${info.status.toLowerCase()}">${info.status}</span></div>
                <hr style="margin:10px 0; border:0; border-top:1px solid #eee;">
                <p style="font-size:11px; color:#666;">*Effective rate is calculated as (Nominal Rate × Ratio).</p>
                <a href="appeal-quiz.html" class="btn-primary" style="display:block; text-align:center; margin-top:15px; font-size:12px;">Check My Property</a>
            `;
        }
    }
    
    const map = L.map('map').setView([40.05, -74.4], 8);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png').addTo(map);

    let masterTaxData = {};
    let geojson;

    // HEATMAP COLOR LOGIC
    function getHeatColor(r) {
        if (!r || r === 0) return '#cbd5e1';
        return r > 3.5 ? '#800026' : r > 3.0 ? '#bd0026' : r > 2.5 ? '#e31a1c' : r > 2.0 ? '#fc4e2a' : '#fed976';
    }

    // 1. FETCH THE DATA PAGE FIRST
    async function initMap() {
        try {
            const dataResponse = await fetch('tax-data.json'); // This points to your data file
            masterTaxData = await dataResponse.json();
            loadBoundaries();
        } catch (err) {
            console.error("Data Load Error:", err);
            document.getElementById('muni-data').innerText = "Error loading tax data file.";
        }
    }

    // 2. LOAD GEOJSON AND APPLY DATA
    function loadBoundaries() {
        // Points to your uploaded NJ Boundary GeoJSON
        fetch('Municipal_Boundaries_of_NJ.geojson')
            .then(res => res.json())
            .then(data => {
                geojson = L.geoJson(data, {
                    style: style,
                    onEachFeature: (f, l) => { l.on({ mouseover: onHover, mouseout: offHover }); }
                }).addTo(map);
            });
    }

    function style(feature) {
        const code = feature.properties.MUN_CODE || feature.properties.SSN;
        const info = masterTaxData[code];
        const rate = info ? info.effectiveRate : 0;
        return {
            fillColor: getHeatColor(rate),
            weight: 1, opacity: 1, color: 'white', fillOpacity: 0.7
        };
    }

    function onHover(e) {
        const layer = e.target;
        layer.setStyle({ weight: 3, color: '#d4af37', fillOpacity: 0.9 });
        
        const code = layer.feature.properties.MUN_CODE || layer.feature.properties.SSN;
        const info = masterTaxData[code];
        const name = layer.feature.properties.MUN_LABEL || layer.feature.properties.MUN;
        
        const panel = document.getElementById('muni-name');
        const dataDiv = document.getElementById('muni-data');

        if (info) {
            panel.innerText = info.name;
            dataDiv.innerHTML = `
                <div style="margin-bottom:10px;"><strong>Effective Rate:</strong> ${info.effectiveRate}%</div>
                <div style="margin-bottom:10px;"><strong>Equalization Ratio:</strong> ${info.ratio}%</div>
                <div style="margin-bottom:15px;"><strong>Outlook:</strong> <span class="status-${info.status.toLowerCase()}">${info.status}</span></div>
                <a href="appeal-quiz.html" class="btn-primary" style="display:block; text-align:center; font-size:12px;">Run Appeal Analysis</a>
            `;
        } else {
            panel.innerText = name;
            dataDiv.innerHTML = "Assessment data pending for this district.";
        }
    }

    function offHover(e) { geojson.resetStyle(e.target); }

    initMap();
</script>
    
</body>
</html>
