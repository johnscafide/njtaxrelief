<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Master NJ Tax Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map { height: 600px; width: 100%; background: #aacbff; border: 2px solid #333; }
        .info-box { padding: 10px; background: white; border: 1px solid #ccc; }
    </style>
</head>
<body>

    <div id="map"></div>
    <div id="status" style="padding:10px; font-family:sans-serif; background:#eee;">Initializing...</div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // Use DOMContentLoaded to ensure the 'map' div exists before running
        document.addEventListener('DOMContentLoaded', function() {
            const status = document.getElementById('status');
            
            // 1. Setup Map
            const map = L.map('map').setView([40.05, -74.4], 8);
            
            // 2. Add Base Tiles
            L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png').addTo(map);

            async function loadData() {
                try {
                    status.innerText = "Fetching files...";
                    
                    // Fetch both files
                    const [taxRes, geoRes] = await Promise.all([
                        fetch('tax-data.json'),
                        fetch('Municipal_Boundaries_of_NJ.json')
                    ]);

                    if (!taxRes.ok || !geoRes.ok) {
                        throw new Error(`File Load Failed: Tax(${taxRes.status}) Geo(${geoRes.status})`);
                    }

                    const masterTaxData = await taxRes.json();
                    const geoData = await geoRes.json();
                    
                    status.innerText = "Files loaded. Rendering NJ...";

                    L.geoJson(geoData, {
                        style: function(feature) {
                            const code = feature.properties.MUN_CODE || feature.properties.SSN;
                            const info = masterTaxData[code];
                            const rate = info ? info.effectiveRate : 0;
                            return {
                                fillColor: rate > 3.0 ? '#800026' : '#fed976',
                                weight: 1, color: 'white', fillOpacity: 0.7
                            };
                        }
                    }).addTo(map);

                    status.innerText = "Map Active - All towns rendered.";

                } catch (err) {
                    console.error(err);
                    status.innerHTML = `<b style="color:red;">Error: ${err.message}</b><br>
                    <i>Tip: If you are seeing "Failed to fetch", you must use a local server (like Live Server in VS Code) or upload to your website.</i>`;
                }
            }

            loadData();
        });
    </script>
</body>
</html>
