<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NJ Tax Heat Map | The Tax Watchdog</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map-container { height: 750px; border-radius: 12px; overflow: hidden; border: 2px solid var(--navy); position: relative; margin-top: 20px; }
        #map { height: 100%; background: #f8fafc; }
        .map-card { 
            position: absolute; top: 20px; right: 20px; z-index: 1000; 
            width: 300px; background: white; padding: 25px; border-radius: 8px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.2); border-top: 5px solid var(--gold); 
        }
        .status-critical { color: #800026; font-weight: bold; }
    </style>
</head>
<body>

<nav id="main-nav"></nav>

<div class="hero" style="background: var(--navy-dark); padding: 50px 20px; border-bottom: 5px solid var(--gold);">
    <div class="hero-inner">
        <h1>New Jersey <span>Master Tax Map</span></h1>
        <p>Interactive visualization of all 564 municipalities. Sourced from 2025 TEV & 2026 Ratables.</p>
    </div>
</div>

<section class="section">
    <div class="section-inner">
        <div id="map-container">
            <div class="map-card" id="map-info">
                <h2 id="muni-name" style="margin-bottom:10px; color:var(--navy);">Explore NJ</h2>
                <div id="muni-data">Hover over any municipality to see 2026 effective tax rates.</div>
            </div>
            <div id="map"></div>
        </div>
    </div>
</section>

<footer id="main-footer"></footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script src="scripts.js"></script>

<script>
    const map = L.map('map').setView([40.05, -74.4], 8);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png').addTo(map);

    let masterTaxData = {};
    let geojson;

    function getHeatColor(r) {
        if (!r || r === 0) return '#cbd5e1';
        return r > 3.5 ? '#800026' : r > 3.0 ? '#bd0026' : r > 2.5 ? '#e31a1c' : r > 2.2 ? '#fc4e2a' : '#fed976';
    }

    async function initMap() {
        try {
            // Load your data file
            const dataResponse = await fetch('tax-data.json');
            masterTaxData = await dataResponse.json();
            
            // USE A SIMPLIFIED CLOUD-HOSTED NJ BOUNDARY FILE (FASTEST)
            const boundaryUrl = "https://raw.githubusercontent.com/codeforamerica/click_that_hood/master/public/data/new-jersey.geojson";
            
            fetch(boundaryUrl)
                .then(res => res.json())
                .then(data => {
                    geojson = L.geoJson(data, {
                        style: style,
                        onEachFeature: (f, l) => { l.on({ mouseover: onHover, mouseout: offHover }); }
                    }).addTo(map);
                });
        } catch (err) {
            console.error("Initialization Error:", err);
        }
    }

    function style(feature) {
        // This CDN file uses feature.properties.name (Proper Case)
        // We will match it by making it UPPERCASE to match your tax-data keys
        const name = (feature.properties.name || "").toUpperCase()
                        .replace(" TOWNSHIP", "")
                        .replace(" TWP", "")
                        .trim();
        
        // Find match in our 500+ town list
        let rate = 0;
        for (let code in masterTaxData) {
            if (masterTaxData[code].name.includes(name)) {
                rate = masterTaxData[code].effectiveRate;
                break;
            }
        }

        return {
            fillColor: getHeatColor(rate),
            weight: 1, opacity: 1, color: 'white', fillOpacity: 0.7
        };
    }

    function onHover(e) {
        const layer = e.target;
        layer.setStyle({ weight: 3, color: '#d4af37', fillOpacity: 0.9 });
        
        const rawName = (layer.feature.properties.name || "").toUpperCase()
                        .replace(" TOWNSHIP", "")
                        .replace(" TWP", "")
                        .trim();

        let info = null;
        for (let code in masterTaxData) {
            if (masterTaxData[code].name.includes(rawName)) {
                info = masterTaxData[code];
                break;
            }
        }
        
        if (info) {
            document.getElementById('muni-name').innerText = info.name;
            document.getElementById('muni-data').innerHTML = `
                <div style="margin-bottom:8px;"><strong>Effective Rate:</strong> ${info.effectiveRate}%</div>
                <div style="margin-bottom:8px;"><strong>Equalization Ratio:</strong> ${info.ratio}%</div>
                <div><strong>Outlook:</strong> <span class="status-${info.status.toLowerCase()}">${info.status}</span></div>
            `;
        }
    }

    function offHover(e) { geojson.resetStyle(e.target); }

    initMap();
</script>
</body>
</html>
