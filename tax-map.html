<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>South Jersey Heat Map | NJ Property Tax Relief</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { background-color: #f8fafc; }
        #map-container {
            height: 750px;
            margin: 20px auto;
            border-radius: 15px;
            overflow: hidden;
            border: 3px solid var(--navy);
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            position: relative;
        }
        #map { height: 100%; width: 100%; z-index: 1; }

        /* Floating Stats Panel */
        .info-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 1000;
            width: 300px;
            background: white;
            padding: 25px;
            border-radius: 12px;
            border-left: 6px solid var(--gold);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        .info-panel h2 { color: var(--navy); margin-bottom: 5px; font-size: 20px; }
        .info-panel h4 { color: var(--text-muted); margin-bottom: 15px; font-size: 12px; text-transform: uppercase; }

        .stat-line { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #f1f5f9; font-size: 14px; }
        .stat-line strong { color: var(--navy); }

        .legend {
            background: white;
            padding: 15px;
            border-radius: 8px;
            line-height: 20px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
            font-size: 12px;
        }
        .legend i { width: 18px; height: 18px; float: left; margin-right: 8px; opacity: 0.8; border-radius: 2px; }
    </style>
</head>
<body>

<nav id="main-nav"></nav>

<div class="hero" style="background: var(--navy-dark); padding: 50px 20px; border-bottom: 5px solid var(--gold);">
    <div class="hero-inner">
        <h1>South Jersey <span>Tax Heat Map</span></h1>
        <p>Interactive visualization of effective tax rates. Darker shades represent higher tax intensity relative to property value.</p>
    </div>
</div>

<section class="section">
    <div class="section-inner">
        
        <div id="map-container">
            <div class="info-panel" id="stat-panel">
                <div id="panel-init">
                    <h2>Select a Town</h2>
                    <p style="font-size: 13px;">Hover over any municipality in Camden, Gloucester, or Burlington to see the real-time tax outlook.</p>
                </div>
            </div>
            <div id="map"></div>
        </div>

    </div>
</section>

<footer id="main-footer"></footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<script>
    const map = L.map('map').setView([39.85, -74.95], 10);

    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
        attribution: '©OpenStreetMap ©CartoDB'
    }).addTo(map);

    // REAL 2025/2026 EFFECTIVE TAX RATE DATA
    const sjTaxData = {
        "WINSLOW": { rate: 3.48, status: "High", county: "Camden", reval: 2022 },
        "CHERRY HILL": { rate: 2.74, status: "Moderate", county: "Camden", reval: 2023 },
        "GLOUCESTER TWP": { rate: 3.89, status: "Critical", county: "Camden", reval: 2021 },
        "WASHINGTON": { rate: 3.12, status: "Moderate", county: "Gloucester", reval: 2021 },
        "MEDFORD": { rate: 2.38, status: "Low", county: "Burlington", reval: 2024 },
        "VOORHEES": { rate: 3.05, status: "Moderate", county: "Camden", reval: 2023 },
        "EVESHAM": { rate: 2.65, status: "Low", county: "Burlington", reval: 2024 },
        "SICKLERVILLE": { rate: 3.45, status: "High", county: "Camden", reval: 2022 },
        "MOUNT LAUREL": { rate: 2.45, status: "Low", county: "Burlington", reval: 2024 }
    };

    // HEATMAP COLOR SCALE
    function getHeatColor(r) {
        return r > 3.5  ? '#800026' : // Dark Red (Critical)
               r > 3.0  ? '#BD0026' : // Red (High)
               r > 2.5  ? '#E31A1C' : // Orange-Red (Moderate)
               r > 2.0  ? '#FC4E2A' : // Orange (Fair)
                          '#FED976';  // Yellow (Low)
    }

    function style(feature) {
        const name = feature.properties.MUN_NAME.toUpperCase();
        const data = sjTaxData[name] || { rate: 0 };
        return {
            fillColor: getHeatColor(data.rate),
            weight: 1.5,
            opacity: 1,
            color: 'white',
            dashArray: '2',
            fillOpacity: 0.8
        };
    }

    function onHover(e) {
        const layer = e.target;
        layer.setStyle({ weight: 4, color: '#d4af37', dashArray: '', fillOpacity: 0.9 });
        
        const name = layer.feature.properties.MUN_NAME.toUpperCase();
        const data = sjTaxData[name];
        const panel = document.getElementById('stat-panel');

        if (data) {
            panel.innerHTML = `
                <h2>${layer.feature.properties.MUN_NAME}</h2>
                <h4>${data.county} County</h4>
                <div class="stat-line"><strong>Effective Rate:</strong> <span>${data.rate}%</span></div>
                <div class="stat-line"><strong>Appeal Outlook:</strong> <span style="color:${getHeatColor(data.rate)}; font-weight:800;">${data.status}</span></div>
                <div class="stat-line"><strong>Last Reval:</strong> <span>${data.reval}</span></div>
                <a href="appeal-quiz.html" class="btn-primary" style="display:block; text-align:center; margin-top:20px; font-size:12px;">Run Appeal Analysis</a>
            `;
        }
    }

    function offHover(e) { geojson.resetStyle(e.target); }

    // FETCH OFFICIAL NJ MUNICIPAL BOUNDARIES
    const boundaryUrl = "https://opendata.arcgis.com/datasets/5f4570abc6174ff6951da66099cf9957_115.geojson";

    let geojson;
    $.getJSON(boundaryUrl, function(data) {
        // Filter only Camden(007), Gloucester(015), and Burlington(005)
        const filtered = {
            ...data,
            features: data.features.filter(f => ["005", "007", "015"].includes(f.properties.COUNTY_PUI))
        };
        
        geojson = L.geoJson(filtered, {
            style: style,
            onEachFeature: function(feature, layer) {
                layer.on({ mouseover: onHover, mouseout: offHover });
            }
        }).addTo(map);
    });

    // ADD LEGEND
    const legend = L.control({position: 'bottomleft'});
    legend.onAdd = function (map) {
        const div = L.DomUtil.create('div', 'legend'),
              grades = [0, 2.0, 2.5, 3.0, 3.5];
        div.innerHTML += '<strong>Effective Rate %</strong><br>';
        for (var i = 0; i < grades.length; i++) {
            div.innerHTML += '<i style="background:' + getHeatColor(grades[i] + 0.1) + '"></i> ' +
                grades[i] + (grades[i + 1] ? '&ndash;' + grades[i + 1] + '<br>' : '+');
        }
        return div;
    };
    legend.addTo(map);
</script>

    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script src="scripts.js"></script>

</body>
</html>
