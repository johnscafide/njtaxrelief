<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NJ Tax Heat Map | South Jersey Expert Guide</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map-container {
            height: 700px;
            margin: 20px auto;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid var(--navy);
            position: relative;
        }
        #map { height: 100%; background: #f1f5f9; }
        
        .map-card {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 1000;
            width: 280px;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            border-top: 4px solid var(--gold);
        }

        .legend {
            background: white;
            padding: 10px;
            line-height: 18px;
            color: #555;
            border-radius: 5px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
        }
        .legend i { width: 16px; height: 16px; float: left; margin-right: 8px; opacity: 0.8; }
    </style>
</head>
<body>

<nav id="main-nav"></nav>

<div class="hero" style="background: var(--navy-dark); padding: 40px 20px;">
    <div class="hero-inner">
        <h1>South Jersey <span>Tax Heat Map</span></h1>
        <p>A visual breakdown of 2026 effective tax rates for Camden, Gloucester, and Burlington counties.</p>
    </div>
</div>

<section class="section">
    <div class="section-inner">
        <div id="map-container">
            <div class="map-card" id="map-info">
                <h3 id="muni-name">Select a Town</h3>
                <div id="muni-data">Hover over the map to see local data.</div>
            </div>
            <div id="map"></div>
        </div>
    </div>
</section>

<footer id="main-footer"></footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    const map = L.map('map').setView([39.85, -74.9], 10);

    // Using a clean, professional base map
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png').addTo(map);

    // 2026 Tax Data (Add more towns as needed)
    const stats = {
        "WINSLOW": { rate: 3.48, outlook: "High", county: "Camden" },
        "SICKLERVILLE": { rate: 3.45, outlook: "High", county: "Camden" },
        "CHERRY HILL": { rate: 2.74, outlook: "Moderate", county: "Camden" },
        "GLOUCESTER TWP": { rate: 3.89, outlook: "Critical", county: "Camden" },
        "VOORHEES": { rate: 3.05, outlook: "Moderate", county: "Camden" },
        "MEDFORD": { rate: 2.38, outlook: "Low", county: "Burlington" },
        "EVESHAM": { rate: 2.65, outlook: "Low", county: "Burlington" },
        "MOUNT LAUREL": { rate: 2.45, outlook: "Low", county: "Burlington" },
        "WASHINGTON": { rate: 3.12, outlook: "Moderate", county: "Gloucester" }
    };

    function getHeatColor(r) {
        return r > 3.5  ? '#800026' :
               r > 3.0  ? '#bd0026' :
               r > 2.5  ? '#e31a1c' :
               r > 2.0  ? '#fc4e2a' :
                          '#fed976';
    }

    function style(feature) {
        // NJ GeoJSON usually stores name in 'MUN' or 'MUN_NAME'
        const name = (feature.properties.MUN_NAME || feature.properties.MUN || "").toUpperCase();
        const rate = stats[name] ? stats[name].rate : 0;
        return {
            fillColor: rate > 0 ? getHeatColor(rate) : '#cbd5e1',
            weight: 1,
            opacity: 1,
            color: 'white',
            fillOpacity: 0.8
        };
    }

    function onHover(e) {
        const layer = e.target;
        layer.setStyle({ weight: 3, color: '#d4af37', fillOpacity: 0.9 });
        
        const name = (layer.feature.properties.MUN_NAME || layer.feature.properties.MUN || "").toUpperCase();
        const data = stats[name];
        
        if (data) {
            document.getElementById('muni-name').innerText = name;
            document.getElementById('muni-data').innerHTML = `
                <p><strong>Effective Rate:</strong> ${data.rate}%</p>
                <p><strong>Outlook:</strong> <span class="quiz-badge">${data.outlook}</span></p>
                <a href="appeal-quiz.html" class="btn-primary" style="display:block; margin-top:10px; font-size:12px; text-align:center;">Run Analysis</a>
            `;
        }
    }

    function offHover(e) { geojson.resetStyle(e.target); }

    // FETCHING THE DATA
    // We use a curated NJ boundaries file to ensure high performance
    let geojson;
    fetch('https://raw.githubusercontent.com/codeforamerica/click_that_hood/master/public/data/new-jersey.geojson')
        .then(res => res.json())
        .then(data => {
            geojson = L.geoJson(data, {
                style: style,
                onEachFeature: (f, l) => { l.on({ mouseover: onHover, mouseout: offHover }); }
            }).addTo(map);
        });
</script>

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script src="scripts.js"></script>

</body>
</html>
