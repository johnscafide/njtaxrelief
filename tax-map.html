<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master NJ Tax Heat Map | The Tax Watchdog</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.11.0/proj4.js"></script>
    <style>
        #map-container { height: 750px; border-radius: 12px; overflow: hidden; border: 2px solid var(--navy); position: relative; margin-top: 20px; }
        #map { height: 100%; background: #f8fafc; }
        .map-card { 
            position: absolute; top: 20px; right: 20px; z-index: 1000; 
            width: 300px; background: white; padding: 25px; border-radius: 8px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.2); border-top: 5px solid var(--gold); 
        }
    </style>
</head>
<body>

<nav id="main-nav"></nav>

<div class="hero" style="background: var(--navy-dark); padding: 50px 20px; border-bottom: 5px solid var(--gold);">
    <div class="hero-inner">
        <h1>New Jersey <span>Master Tax Map</span></h1>
        <p>Visualizing 2026 Effective Tax Rates & Ratios across all 564 municipalities.</p>
    </div>
</div>

<section class="section">
    <div class="section-inner">
        <div id="map-container">
            <div class="map-card" id="map-info">
                <h2 id="muni-name" style="margin-bottom:10px; color:var(--navy);">Explore NJ</h2>
                <div id="muni-data">Hover over any municipality to see 2026 data.</div>
            </div>
            <div id="map"></div>
        </div>
    </div>
</section>

<footer id="main-footer"></footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script src="scripts.js"></script>

<script>
    // Define the projection conversion (3857 to 4326)
    const firstProjection = "+proj=merc +a=6378137 +b=6378137 +lat_ts=0.0 +lon_0=0.0 +x_0=0.0 +y_0=0 +k=1.0 +units=m +nadgrids=@null +wktext +no_defs";
    const secondProjection = "+proj=longlat +datum=WGS84 +no_defs";

    const map = L.map('map').setView([40.05, -74.4], 8);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png').addTo(map);

    let masterTaxData = {};
    let geojson;

    function getHeatColor(r) {
        if (!r || r === 0) return '#cbd5e1';
        return r > 3.5 ? '#800026' : r > 3.0 ? '#bd0026' : r > 2.5 ? '#e31a1c' : r > 2.0 ? '#fc4e2a' : '#fed976';
    }

    async function initMap() {
        try {
            const dataResponse = await fetch('tax-data.json');
            masterTaxData = await dataResponse.json();
            loadBoundaries();
        } catch (err) {
            console.error("Data Load Error:", err);
        }
    }

    function loadBoundaries() {
        fetch('Municipal_Boundaries_of_NJ.geojson')
            .then(res => res.json())
            .then(data => {
                // Check if data needs coordinate conversion
                if (data.features[0].geometry.coordinates[0][0][0] > 180) {
                    console.log("Detected EPSG:3857 - Converting to Lat/Long...");
                    data.features.forEach(feature => {
                        if (feature.geometry.type === "Polygon") {
                            feature.geometry.coordinates = feature.geometry.coordinates.map(ring => 
                                ring.map(coord => proj4(firstProjection, secondProjection, coord))
                            );
                        } else if (feature.geometry.type === "MultiPolygon") {
                            feature.geometry.coordinates = feature.geometry.coordinates.map(polygon => 
                                polygon.map(ring => 
                                    ring.map(coord => proj4(firstProjection, secondProjection, coord))
                                )
                            );
                        }
                    });
                }

                geojson = L.geoJson(data, {
                    style: style,
                    onEachFeature: (f, l) => { l.on({ mouseover: onHover, mouseout: offHover }); }
                }).addTo(map);
            });
    }

    function style(feature) {
        const code = feature.properties.MUN_CODE || feature.properties.SSN;
        const info = masterTaxData[code];
        const rate = info ? info.effectiveRate : 0;
        return {
            fillColor: getHeatColor(rate),
            weight: 1, opacity: 1, color: 'white', fillOpacity: 0.7
        };
    }

    function onHover(e) {
        const layer = e.target;
        layer.setStyle({ weight: 3, color: '#d4af37', fillOpacity: 0.9 });
        const code = layer.feature.properties.MUN_CODE || layer.feature.properties.SSN;
        const info = masterTaxData[code];
        const name = layer.feature.properties.MUN_LABEL || layer.feature.properties.MUN;
        
        if (info) {
            document.getElementById('muni-name').innerText = info.name;
            document.getElementById('muni-data').innerHTML = `
                <div><strong>Effective Rate:</strong> ${info.effectiveRate}%</div>
                <div><strong>Equalization Ratio:</strong> ${info.ratio}%</div>
                <div><strong>Outlook:</strong> ${info.status}</div>
            `;
        } else {
            document.getElementById('muni-name').innerText = name;
            document.getElementById('muni-data').innerHTML = "Data pending for this district.";
        }
    }

    function offHover(e) { geojson.resetStyle(e.target); }

    initMap();
</script>
</body>
</html>
