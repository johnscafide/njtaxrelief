<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NJ Tax Heat Map | The Tax Watchdog</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map-container { height: 750px; border-radius: 12px; overflow: hidden; border: 2px solid var(--navy); position: relative; margin-top: 20px; }
        #map { height: 100%; background: #f8fafc; }
        .map-card { 
            position: absolute; top: 20px; right: 20px; z-index: 1000; 
            width: 300px; background: white; padding: 25px; border-radius: 8px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.2); border-top: 5px solid var(--gold); 
        }
        .status-critical { color: #800026; font-weight: bold; }
        .status-high { color: #bd0026; font-weight: bold; }
    </style>
</head>
<body>

<nav id="main-nav"></nav>

<div class="hero" style="background: var(--navy-dark); padding: 50px 20px; border-bottom: 5px solid var(--gold);">
    <div class="hero-inner">
        <h1>New Jersey <span>Master Tax Map</span></h1>
        <p>Interactive visualization of effective tax rates across all 564 municipalities.</p>
    </div>
</div>

<section class="section">
    <div class="section-inner">
        <div id="map-container">
            <div class="map-card" id="map-info">
                <h2 id="muni-name" style="margin-bottom:10px; color:var(--navy);">Explore NJ</h2>
                <div id="muni-data">Hover over any municipality to see 2026 data.</div>
            </div>
            <div id="map"></div>
        </div>
    </div>
</section>

<footer id="main-footer"></footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script src="scripts.js"></script>

<script>
    const map = L.map('map').setView([40.05, -74.4], 8);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png').addTo(map);

    let masterTaxData = {};
    let geojson;

    function getHeatColor(r) {
        if (!r || r === 0) return '#cbd5e1';
        return r > 3.5 ? '#800026' : r > 3.0 ? '#bd0026' : r > 2.5 ? '#e31a1c' : r > 2.0 ? '#fc4e2a' : '#fed976';
    }

    async function initMap() {
        try {
            // Load your data file
            const dataResponse = await fetch('tax-data.json');
            masterTaxData = await dataResponse.json();
            
            // Load your specific Municipal Boundaries JSON
            const geoResponse = await fetch('Municipal_Boundaries_of_NJ.json');
            const geoData = await geoResponse.json();

            geojson = L.geoJson(geoData, {
                style: style,
                onEachFeature: (f, l) => { l.on({ mouseover: onHover, mouseout: offHover }); }
            }).addTo(map);
        } catch (err) {
            console.error("Map Load Error:", err);
            document.getElementById('muni-data').innerText = "Error loading map files. Check console.";
        }
    }

    function style(feature) {
        // Match using the MUN_CODE property found in your file
        const code = feature.properties.MUN_CODE;
        const info = masterTaxData[code];
        const rate = info ? info.effectiveRate : 0;
        
        return {
            fillColor: getHeatColor(rate),
            weight: 1,
            opacity: 1,
            color: 'white',
            fillOpacity: 0.7
        };
    }

    function onHover(e) {
        const layer = e.target;
        layer.setStyle({ weight: 3, color: '#d4af37', fillOpacity: 0.9 });
        
        const code = layer.feature.properties.MUN_CODE;
        const info = masterTaxData[code];
        const name = layer.feature.properties.MUN_LABEL;
        
        if (info) {
            document.getElementById('muni-name').innerText = info.name;
            document.getElementById('muni-data').innerHTML = `
                <div style="margin-bottom:8px;"><strong>Effective Rate:</strong> ${info.effectiveRate}%</div>
                <div style="margin-bottom:8px;"><strong>Equalization Ratio:</strong> ${info.ratio}%</div>
                <div><strong>Outlook:</strong> <span class="status-${info.status.toLowerCase()}">${info.status}</span></div>
                <a href="appeal-quiz.html" class="btn-primary" style="display:block; text-align:center; margin-top:15px; font-size:12px;">Run Analysis</a>
            `;
        } else {
            document.getElementById('muni-name').innerText = name;
            document.getElementById('muni-data').innerHTML = "Assessment data pending for this district.";
        }
    }

    function offHover(e) { geojson.resetStyle(e.target); }

    initMap();
</script>

<script>
    // 1. Initialize Map centered on New Jersey
    const map = L.map('map').setView([40.05, -74.4], 8);
    
    // 2. Add Base Tiles (Using CartoDB for clean look)
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; Carto'
    }).addTo(map);

    let masterTaxData = {};

    async function initMap() {
        console.log("Starting Map Initialization...");
        try {
            // Load Tax Data
            const taxRes = await fetch('tax-data.json');
            if (!taxRes.ok) throw new Error("Could not find tax-data.json");
            masterTaxData = await taxRes.json();
            console.log("Tax Data Loaded Successfully");

            // Load Boundaries
            const geoRes = await fetch('Municipal_Boundaries_of_NJ.json');
            if (!geoRes.ok) throw new Error("Could not find Municipal_Boundaries_of_NJ.json");
            const geoData = await geoRes.json();
            console.log("Boundary Data Loaded Successfully");

            L.geoJson(geoData, {
                style: function(feature) {
                    const code = feature.properties.MUN_CODE || feature.properties.SSN;
                    const info = masterTaxData[code];
                    const rate = info ? info.effectiveRate : 0;
                    return {
                        fillColor: rate > 3.5 ? '#800026' : rate > 3.0 ? '#bd0026' : rate > 2.5 ? '#e31a1c' : rate > 2.0 ? '#fc4e2a' : '#fed976',
                        weight: 1, opacity: 1, color: 'white', fillOpacity: 0.7
                    };
                },
                onEachFeature: function(feature, layer) {
                    layer.on({
                        mouseover: (e) => {
                            const code = feature.properties.MUN_CODE;
                            const info = masterTaxData[code];
                            document.getElementById('muni-name').innerText = info ? info.name : feature.properties.MUN_LABEL;
                            document.getElementById('muni-data').innerHTML = info ? 
                                `Rate: ${info.effectiveRate}%<br>Ratio: ${info.ratio}%` : "No data found.";
                        }
                    });
                }
            }).addTo(map);

            console.log("Map Layers Added!");

        } catch (err) {
            console.error("FATAL ERROR:", err.message);
            document.getElementById('muni-data').innerHTML = `<b style="color:red;">Error: ${err.message}</b><br>Make sure you are running this on a local server or uploaded to your hosting.`;
        }
    }

    initMap();
</script>
    
</body>
</html>
