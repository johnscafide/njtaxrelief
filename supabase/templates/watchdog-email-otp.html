<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Your Watchdog sign-in code</title>
</head>
<body style="margin:0;padding:0;background:#f4f6f5;font-family:Arial,sans-serif;color:#172234;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background:#f4f6f5;padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width:480px;background:#ffffff;border-radius:20px;padding:34px;">
          <tr>
            <td>
              <div style="font-size:13px;font-weight:700;letter-spacing:.08em;color:#087f82;text-transform:uppercase;margin-bottom:14px;">Watchdog</div>
              <h1 style="margin:0 0 12px;font-size:26px;line-height:1.15;color:#10294b;">Your sign-in code</h1>
              <p style="margin:0 0 22px;font-size:15px;line-height:1.55;color:#60717b;">Enter this six-digit code on the Watchdog sign-in screen:</p>
              <div style="font-size:34px;line-height:1;font-weight:800;letter-spacing:.18em;color:#10294b;margin:0 0 24px;">{{ .Token }}</div>
              <p style="margin:0;font-size:12px;line-height:1.55;color:#7a898f;">If you did not request this code, you can ignore this email. Never share a Watchdog sign-in code with anyone.</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
