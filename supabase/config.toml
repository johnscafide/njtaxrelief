# These customer self-service functions validate the bearer token with
# Supabase Auth inside the function. Gateway verification remains disabled so
# missing/expired auth produces deterministic fail-closed 401 responses rather
# than opaque gateway errors.
[functions.submit-support-request]
verify_jwt = false

[functions.export-my-data]
verify_jwt = false

# Public status intentionally exposes only sanitized aggregate service state.
# It never returns incident titles, routes, request IDs, metadata, or billing state.
[functions.public-platform-status]
verify_jwt = false

# The Appeal Prospect Scanner performs its own Auth + Pro+ entitlement check
# before reading fixed Watchdog public-source assets and returning a governed
# ranked result. There is no anonymous/client-side fallback computation.
[functions.appeal-prospect-scan]
verify_jwt = false

